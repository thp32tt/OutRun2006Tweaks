<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OutRun B/C1 영문 참조 첨부</title>
<style>
body{font:13px system-ui,-apple-system,sans-serif;width:340px;margin:0;padding:16px;color:#202124;background:#fff}
h1{font-size:16px;margin:0 0 12px}
label{font-weight:600;display:block;margin:8px 0}
select,button{font:inherit;padding:9px;border-radius:7px}
select{width:100%;border:1px solid #bbb}
button{border:1px solid #555;background:#fff;cursor:pointer}
button.primary{background:#1b5e20;color:white;border-color:#1b5e20}
button:disabled{opacity:.5;cursor:wait}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#meta{color:#555;margin-top:8px;font-size:12px;line-height:1.5}
#status{margin-top:12px;padding:9px;background:#f5f5f5;border-radius:6px;white-space:pre-wrap;line-height:1.45}
small{display:block;margin-top:12px;color:#555}
</style>
</head>
<body>
<h1>OutRun 영문 참조 이미지</h1>
<label for="ref">원본 글자 PNG</label>
<select id="ref" aria-label="영문 이미지 선택"></select>
<div id="meta"></div>
<div class="actions">
<button id="attach" class="primary">현재 ChatGPT에 첨부 시도</button>
<button id="copy">PNG 복사 (Ctrl+V 대안)</button>
<button id="prompt">프롬프트 복사</button>
</div>
<div id="status" role="status" aria-live="polite">원본 선택 후 ChatGPT 대화창을 열어 주세요.</div>
<small>파일 SHA-256 검증 후 첨부를 시도합니다. 이 도구는 메시지를 보내거나 API를 호출하지 않습니다. 첨부 썸네일을 확인한 뒤 직접 전송하세요.</small>
<script src="popup.js"></script>
</body>
</html>
