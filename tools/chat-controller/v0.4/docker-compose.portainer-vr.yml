services:
  outrun-chat-controller-vr:
    build:
      context: .
      dockerfile: Dockerfile.portainer
    container_name: outrun-chat-controller-vr
    restart: unless-stopped
    init: true
    shm_size: "768m"
    mem_limit: 5g
    mem_reservation: 2g
    cpus: 1.5
    environment:
      TZ: Asia/Seoul
      CONTROLLER_MODE: "conversion"
      AUTO_SEND: "${AUTO_SEND:-false}"
      QUEUE_MODE: "true"
      QUEUE_CHECK_SECONDS: "15"
      QUEUE_STABLE_SECONDS: "30"
      QUEUE_RESULT_GRACE_SECONDS: "180"
      GITHUB_POLL_SECONDS: "60"
      GITHUB_TASK_COMMIT_SCAN_PAGES: "3"
      GITHUB_ACTIONS_DISCOVERY_PER_PAGE: "100"
      GITHUB_TASK_COMMIT_CACHE_SECONDS: "15"
      GITHUB_TRANSIENT_RETRY_DELAYS: "2,5,10,20"
      GITHUB_TRANSIENT_COOLDOWN_SECONDS: "60"
      GITHUB_ACTIONS_CACHE_SECONDS: "60"
      GITHUB_BOUND_RUN_POLL_SECONDS: "30"
      WAIT_ACTIONS_STALE_SECONDS: "75"
      WAIT_ACTIONS_NO_RUN_TIMEOUT_SECONDS: "600"
      WAIT_ACTIONS_MAX_SECONDS: "1800"
      QUEUE_ERROR_RESTART_THRESHOLD: "3"
      WATCHDOG_ERROR_RESTART_THRESHOLD: "3"
      PROCESS_HEARTBEAT_FATAL_SECONDS: "180"
      MEMORY_IDLE_RESTART_PERCENT: "80"
      MEMORY_FATAL_RESTART_PERCENT: "92"
      QUEUE_NEXT_TASK_DELAY_SECONDS: "15"
      MAX_TASK_ATTEMPTS: "3"
      CONVERSATION_ROLLOVER_ENABLED: "true"
      MAX_CHAT_ROLLOVERS_PER_TASK: "2"
      GITHUB_REPO: "thp32tt/OutRun2006Tweaks"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      SCHEDULE_MINUTES: "10,30,50"
      CHAT_SLOTS: "2"
      CHAT_DAY_ROLLOVER_HOUR: "2"
      CHATGPT_BASE_URL: "https://chatgpt.com/"
      CHATGPT_PROJECT_URL: "${VR_PROJECT_URL:-}"
      EXPECTED_PROJECT_ID: "g-p-6ab9a64fc428819198c7f39765d764bf"
      REQUIRE_PROJECT_URL: "true"
      PREFERRED_THINKING_LEVEL: "High"
      STRICT_THINKING_LEVEL: "true"
      FRESH_CHAT_EACH_RUN: "false"
      CHAT_REUSE_MAX_TASKS: "4"
      CHAT_REUSE_MAX_AGE_MINUTES: "90"
      PREVIOUS_TASK_UI_SETTLE_SECONDS: "45"
      RETRY_BUTTON_COOLDOWN_SECONDS: "45"
      GENERIC_RETRY_ROLLOVER_CLICKS: "2"
      GENERIC_RETRY_COOLDOWN_SECONDS: "300"
      GITHUB_TOOLING_RETRY_COOLDOWN_SECONDS: "300"
      VNC_PASSWORD: "${VNC_PASSWORD:-change-me}"
      STATUS_PORT: "8787"
      NOVNC_PUBLIC_URL: "http://192.168.0.48:6080/vnc.html"
      WATCHDOG_ENABLED: "${WATCHDOG_ENABLED:-true}"
      WATCHDOG_STALL_MINUTES: "25"
      WATCHDOG_BUSY_STALL_MINUTES: "30"
      WATCHDOG_CHECK_SECONDS: "30"
      WATCHDOG_MAX_RESUMES_PER_RUN: "1"
      WATCHDOG_FORCE_STOP_STALLED: "false"
      RATE_LIMIT_BACKOFF_SECONDS: "90,180,300,600"
      MIN_SEND_GAP_SECONDS: "45"
      SAME_TASK_CONTROL_GAP_SECONDS: "15"
      PREMATURE_STOP_ROLLOVER_THRESHOLD: "3"
      CONVERSION_PREMATURE_STOP_ROLLOVER_THRESHOLD: "2"
      CONVERSION_PIPELINE_SCHEMA_VERSION: "2"
      PRODUCER_CONTINUATION_COOLDOWN_SECONDS: "15"
      SLOT_DEDUP_SECONDS: "45"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ports:
      - "6080:6080"
      - "8787:8787"
    volumes:
      - outrun_chat_vr_data:/data
      - outrun_chat_vr_logs:/logs

volumes:
  outrun_chat_vr_data:
    name: outrun_chat_vr_data
  outrun_chat_vr_logs:
    name: outrun_chat_vr_logs

