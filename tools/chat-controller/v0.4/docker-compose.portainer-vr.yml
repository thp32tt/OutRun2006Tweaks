services:
  outrun-chat-controller-vr:
    build:
      context: .
      dockerfile: Dockerfile.portainer-vr
    container_name: outrun-chat-controller-vr
    restart: unless-stopped
    init: true
    shm_size: "768m"
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 1.5
    environment:
      TZ: Asia/Seoul
      CONTROLLER_MODE: "conversion"
      AUTO_SEND: "false"
      QUEUE_MODE: "true"
      CONVERSION_PARALLEL: "true"
      VR_FEATURE_DEVELOPMENT_ENABLED: "false"
      # Operator 2026-11-10: Ferrari A/C automatic modeling stopped by user request; preserve workspace/artifacts.
      VR_CONTINUOUS_30M_ENABLED: "false"
      VR_SCHEDULED_DISPATCH_ENABLED: "false"
      VR_CONTINUOUS_INTERVAL_SECONDS: "3600"
      VR_FEATURE_PROMOTION_MODE: "ai"
      VR_FEATURE_POLL_SECONDS: "60"
      VR_FEATURE_C6_REMINDER_SECONDS: "300"
      CONVERSION_ACTIVE_LIMIT: "2"
      CONVERSION_DX11_ENABLED: "false"
      # Ferrari cockpit modeling stopped (A and C); do not dispatch without explicit user re-enable.
      CAR_MODEL_AUTODEV_ENABLED: "false"
      CAR_MODEL_GITHUB_REPO: "thp32tt/imsi1"
      CAR_MODEL_TARGET_BRANCH: "main"
      CAR_MODEL_SCHEDULE_MINUTES: "0,30"
      CAR_MODEL_C_AUTODEV_ENABLED: "false"
      CAR_MODEL_C_SCHEDULE_MINUTES: "15,45"
      CAR_MODEL_CONTINUE_MIN_SECONDS: "1800"
      CAR_MODEL_RESPONSE_STABLE_SECONDS: "30"
      CAR_MODEL_HARD_NEW_CHAT_SECONDS: "3600"
      DXVK_FROZEN: "true"
      CONVERSION_DXVK_ENABLED: "false"
      # C is reserved for Ferrari cockpit modeling, never legacy DX9Ex or Model2.
      CONVERSION_DX9EX_ENABLED: "false"
      DX9EX_REVIEW_ONLY: "true"
      UW2_WEB_PORT_ENABLED: "false"
      # Model2 VR C belongs to its OWN ChatGPT project, never OutRun's.
      MODEL2_AUTODEV_ENABLED: "false"
      MODEL2_GITHUB_REPO: "thp32tt/Model2VR-tools"
      MODEL2_TARGET_BRANCH: "main"
      # Create a dedicated ChatGPT Project; put its actual home in this stack
      # environment as MODEL2_PROJECT_URL, e.g. chatgpt.com/g/g-p-.../project.
      # Empty or same ID as OutRun => C SEND BLOCKED (no unsafe fallback).
      MODEL2_PROJECT_URL: "${MODEL2_PROJECT_URL:-}"
      MODEL2_SCHEDULE_MINUTES: "0,30"
      MODEL2_CONTINUE_MIN_SECONDS: "1800"
      MODEL2_RESPONSE_STABLE_SECONDS: "30"
      # Force brand-new Model2 chat/task session at 60m even when UI says busy.
      MODEL2_HARD_NEW_CHAT_SECONDS: "3600"
      CONVERSION_ONLY_SLOT: ""
      QUEUE_CHECK_SECONDS: "15"
      # GUI Chrome/noVNC stays enabled; only failed tabs are replaced.
      TAB_HEALTH_CHECK_SECONDS: "30"
      TAB_HEALTH_PROBE_TIMEOUT_SECONDS: "6"
      TAB_HEALTH_FAILURE_THRESHOLD: "3"
      TAB_RECOVERY_COOLDOWN_SECONDS: "60"
      QUEUE_STABLE_SECONDS: "30"
      QUEUE_RESULT_GRACE_SECONDS: "600"
      GITHUB_POLL_SECONDS: "60"
      GITHUB_TASK_COMMIT_CACHE_SECONDS: "60"
      GITHUB_ACTIONS_CACHE_SECONDS: "60"
      GITHUB_BOUND_RUN_POLL_SECONDS: "15"
      WAIT_ACTIONS_STALE_SECONDS: "75"
      WAIT_ACTIONS_NO_RUN_TIMEOUT_SECONDS: "600"
      QUEUE_NEXT_TASK_DELAY_SECONDS: "0"
      MAX_TASK_ATTEMPTS: "3"
      CONVERSATION_ROLLOVER_ENABLED: "true"
      CONVERSATION_ROLLOVER_MIN_SECONDS: "3600"
      VR_FORCE_ROLLOVER_SECONDS: "3600"
      VR_UNCONDITIONAL_RESUME_SECONDS: "3600"
      VR_CHECKPOINT_ENABLED: "true"
      VR_CHECKPOINT_PERIOD_MINUTES: "15"
      DEVELOPMENT_TARGET_PERCENT: "70"
      VR_CHECKPOINT_BRANCH: "chat-controller-downloads"
      MAX_CHAT_ROLLOVERS_PER_TASK: "0"
      CHAT_ROTATE_COMPLETED_TASKS: "5"
      TASK_EVENT_MODEL: "v2"
      PRODUCTION_COUNTER_MODE: "lane"
      GITHUB_REPO: "thp32tt/OutRun2006Tweaks"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # Legacy DX11 dispatch remains disabled; geometry A at :00/:30 and C at :15/:45.
      SCHEDULE_MINUTES: "30"
      # Model2 disabled. Keep historical Model2 settings for a future explicit opt-in only.
      # DX11/DX9Ex/DXVK remain disabled; geometry A/C use separate per-slot state and chats.
      CHAT_SLOTS: "3"
      # Recover a frozen scheduler independently of the HTTP /status healthcheck.
      VR_RUNTIME_WATCHDOG_CHECK_SECONDS: "30"
      VR_RUNTIME_WATCHDOG_STALE_SECONDS: "720"
      VR_RUNTIME_WATCHDOG_STARTUP_GRACE_SECONDS: "300"
      RECYCLE_ENABLED: "true"
      RECYCLE_INTERVAL_MINUTES: "180"
      RECYCLE_MEMORY_PERCENT: "70"
      RECYCLE_CHECK_SECONDS: "30"
      RECYCLE_MIN_IDLE_SECONDS: "300"
      RECYCLE_MIN_NEXT_SLOT_SECONDS: "120"
      PROFILE_CACHE_PRUNE_ON_START: "true"
      CHAT_DAY_ROLLOVER_HOUR: "2"
      CHATGPT_BASE_URL: "https://chatgpt.com/"
      CHATGPT_PROJECT_URL: "${VR_PROJECT_URL:-}"
      EXPECTED_PROJECT_ID: "g-p-6ab9a64fc428819198c7f39765d764bf"
      REQUIRE_PROJECT_URL: "true"
      PREFERRED_THINKING_LEVEL: "High"
      STRICT_THINKING_LEVEL: "true"  # mandatory except explicit 60m hard-recovery path
      FRESH_CHAT_EACH_RUN: "false"
      RETRY_BUTTON_COOLDOWN_SECONDS: "45"
      VNC_PASSWORD: "${VNC_PASSWORD:-change-me}"
      STATUS_PORT: "8787"
      NOVNC_PUBLIC_URL: "http://192.168.0.48:6080/vnc.html"
      WATCHDOG_ENABLED: "${WATCHDOG_ENABLED:-true}"
      WATCHDOG_STALL_MINUTES: "25"
      WATCHDOG_BUSY_STALL_MINUTES: "30"
      WATCHDOG_CHECK_SECONDS: "30"
      WATCHDOG_MAX_RESUMES_PER_RUN: "1"
      WATCHDOG_FORCE_STOP_STALLED: "false"
      RATE_LIMIT_BACKOFF_SECONDS: "90,180,300,600"
      MIN_SEND_GAP_SECONDS: "5"
      SLOT_DEDUP_SECONDS: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ports:
      - "6080:6080"
      - "8787:8787"
    volumes:
      - outrun_chat_vr_data:/data
      - outrun_chat_vr_logs:/logs


volumes:
  outrun_chat_vr_data:
    name: outrun_chat_vr_data
  outrun_chat_vr_logs:
    name: outrun_chat_vr_logs
