services:
  localization-controller-v2:
    container_name: outrun-localization-controller-v2
    build:
      context: ../v2
      dockerfile: Dockerfile
    environment:
      CONTROLLER_MODE: localization
      LOCALIZATION_PIPELINE: A_B_THEN_C_BARRIER
      LOCALIZATION_QUEUE: localization/graphics/asset_queue_v2.csv
      LOCALIZATION_CONFIG: localization/controller_roles.json
    volumes:
      - localization_controller_v2_state:/app/state
    networks:
      - localization_controller_v2_net

volumes:
  localization_controller_v2_state:

networks:
  localization_controller_v2_net:
