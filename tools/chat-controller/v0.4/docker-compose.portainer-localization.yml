services:
  outrun-chat-controller-localization:
    build:
      context: .
      dockerfile: Dockerfile.portainer
    container_name: outrun-chat-controller-localization
    restart: unless-stopped
    init: true
    shm_size: "768m"
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 1.5
    environment:
      TZ: Asia/Seoul
      CONTROLLER_MODE: "localization"
      AUTO_SEND: "${AUTO_SEND:-false}"
      QUEUE_MODE: "true"
      QUEUE_CHECK_SECONDS: "15"
      QUEUE_STABLE_SECONDS: "30"
      QUEUE_RESULT_GRACE_SECONDS: "900"
      GITHUB_POLL_SECONDS: "180"
      QUEUE_NEXT_TASK_DELAY_SECONDS: "180"
      MAX_TASK_ATTEMPTS: "3"
      CONVERSATION_ROLLOVER_ENABLED: "true"
      MAX_CHAT_ROLLOVERS_PER_TASK: "5"
      GITHUB_REPO: "thp32tt/OutRun2006Tweaks"
      SCHEDULE_MINUTES: "0,20,40"
      CHAT_SLOTS: "3"
      CHAT_DAY_ROLLOVER_HOUR: "2"
      CHATGPT_BASE_URL: "https://chatgpt.com/"
      CHATGPT_PROJECT_URL: "${LOCALIZATION_PROJECT_URL:-}"
      REQUIRE_PROJECT_URL: "true"
      PREFERRED_THINKING_LEVEL: "High"
      STRICT_THINKING_LEVEL: "true"
      FRESH_CHAT_EACH_RUN: "false"
      RETRY_BUTTON_COOLDOWN_SECONDS: "300"
      VNC_PASSWORD: "${VNC_PASSWORD:-change-me}"
      STATUS_PORT: "8787"
      WATCHDOG_ENABLED: "${WATCHDOG_ENABLED:-true}"
      WATCHDOG_STALL_MINUTES: "15"
      WATCHDOG_BUSY_STALL_MINUTES: "20"
      WATCHDOG_CHECK_SECONDS: "30"
      WATCHDOG_MAX_RESUMES_PER_RUN: "1"
      WATCHDOG_FORCE_STOP_STALLED: "false"
      RATE_LIMIT_BACKOFF_SECONDS: "300,600,1200,2400"
      MIN_SEND_GAP_SECONDS: "180"
      SLOT_DEDUP_SECONDS: "300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ports:
      - "6081:6080"
      - "8788:8787"
    volumes:
      - outrun_chat_localization_data:/data
      - outrun_chat_localization_logs:/logs

volumes:
  outrun_chat_localization_data:
    name: outrun_chat_localization_data
  outrun_chat_localization_logs:
    name: outrun_chat_localization_logs
