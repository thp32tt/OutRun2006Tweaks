# v0.4 compatibility wrapper: builds the v0.5 localization controller.
# Localization only. VR controller uses a separate compose stack/state volume.
services:
  outrun-chat-controller-localization:
    build:
      context: ../v0.5
      dockerfile: Dockerfile.portainer
    container_name: outrun-chat-controller-localization
    restart: unless-stopped
    init: true
    shm_size: "768m"
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 1.5
    environment:
      TZ: Asia/Seoul
      CONTROLLER_MODE: localization
      CONTROLLER_SCHEMA_VERSION: "50"
      LOCALIZATION_PIPELINE: "A_B_THEN_C_BARRIER"
      LOCALIZATION_QUEUE: "localization/graphics/asset_queue_v2.csv"
      LOCALIZATION_CONFIG: "localization/controller_roles.json"
      LOCALIZATION_CONTRACT: "docs/automation/LOCALIZATION_CONTROLLER_V2.md"
      LEGACY_QUEUE_READONLY: "localization/graphics/asset_queue.csv"
      AUTO_SEND: "${AUTO_SEND:-true}"
      GITHUB_REPO: thp32tt/OutRun2006Tweaks
      GITHUB_BRANCH: korean-localization-clean
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      CHATGPT_PROJECT_URL: "${LOCALIZATION_PROJECT_URL:-}"
      REQUIRE_PROJECT_URL: "true"
      PREFERRED_THINKING_LEVEL: High
      TICK_SECONDS: "15"
      SEND_GAP_SECONDS: "30"
      SAME_CHAT_CONTINUATION_GAP_SECONDS: "20"
      TURN_IDLE_GRACE_SECONDS: "8"
      QA_BATCH_SIZE: "4"
      QA_BARRIER_REQUIRED: "true"
      NO_WORK_RETRY_SECONDS: "600"
      CHAT_REUSE_MAX_JOBS: "4"
      CHAT_REUSE_MAX_AGE_MINUTES: "90"
      RATE_LIMIT_BACKOFF_SECONDS: "90,180,300,600"
      STATUS_PORT: "8787"
      VNC_PASSWORD: "${VNC_PASSWORD:-change-me}"
    ports:
      - "6081:6080"
      - "8788:8787"
    volumes:
      - outrun_chat_localization_v2_data:/data
      - outrun_chat_localization_v2_logs:/logs

volumes:
  outrun_chat_localization_v2_data:
    name: outrun_chat_localization_v2_data
  outrun_chat_localization_v2_logs:
    name: outrun_chat_localization_v2_logs
