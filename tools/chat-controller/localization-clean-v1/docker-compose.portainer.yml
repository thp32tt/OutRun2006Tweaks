services:
  outrun-chat-localization-clean-v1:
    build:
      context: .
      dockerfile: Dockerfile.portainer
    container_name: outrun-chat-localization-clean-v1
    restart: unless-stopped
    init: true
    shm_size: "768m"
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 1.5
    environment:
      TZ: Asia/Seoul
      GITHUB_REPO: "thp32tt/OutRun2006Tweaks"
      TARGET_BRANCH: "korean-localization-20260928-clean-v1"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      LOCALIZATION_PROJECT_URL: "${LOCALIZATION_PROJECT_URL:-}"
      AUTO_SEND: "${AUTO_SEND:-false}"
      POLL_SECONDS: "15"
      GITHUB_POLL_SECONDS: "60"
      STABLE_SECONDS: "30"
      NUDGE_SECONDS: "180"
      RECOVERY_SECONDS: "1200"
      MAX_NUDGES: "4"
      VNC_PASSWORD: "${VNC_PASSWORD:-change-me}"
      STATUS_PORT: "8787"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ports:
      - "6081:6080"
      - "8788:8787"
    volumes:
      - outrun_chat_localization_clean_v1_data:/data
      - outrun_chat_localization_clean_v1_logs:/logs

volumes:
  outrun_chat_localization_clean_v1_data:
    name: outrun_chat_localization_clean_v1_data
  outrun_chat_localization_clean_v1_logs:
    name: outrun_chat_localization_clean_v1_logs
