# GitHub-first, existing-Portainer-Docker execution mode (2026-11-03).
# Same stack/service/container name and persistent volumes as the legacy browser controller.
# The old Dockerfile, entrypoint.sh, A/B/C1 browser code and source volumes remain untouched.
services:
  outrun-chat-controller-localization-recovery:
    build:
      context: .
      dockerfile: Dockerfile.gitops
    pull_policy: build
    container_name: outrun-chat-controller-localization-recovery
    restart: unless-stopped
    init: true
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    environment:
      TZ: Asia/Seoul
      OUTRUN_GITOPS_HOME: /data/gitops
      OUTRUN_GITOPS_POLL_SECONDS: "${OUTRUN_GITOPS_POLL_SECONDS:-3600}"
      # Optional: fine-grained GitHub PAT, restricted to OutRun2006Tweaks Contents:read/write.
      # Without token the worker performs read-only QA and preserves local result receipts.
      OUTRUN_GITHUB_TOKEN: "${OUTRUN_GITHUB_TOKEN:-}"
    volumes:
      - outrun_chat_localization_recovery_data:/data
      - outrun_chat_localization_recovery_logs:/logs
    stop_grace_period: 30s

volumes:
  # NEVER delete or recreate: old browser session, manifests and N100 controller evidence live here.
  outrun_chat_localization_recovery_data:
    name: outrun_chat_localization_recovery_data
  outrun_chat_localization_recovery_logs:
    name: outrun_chat_localization_recovery_logs
