services:
  outrun-chat-controller-localization-recovery:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: outrun-chat-controller-localization-recovery
    restart: "no" # v2 PAUSED: no auto-restart on host boot or Docker daemon restart
    init: true
    shm_size: "1g"
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 2.0
    environment:
      TZ: Asia/Seoul
      CONTROLLER_MODE: "localization"
      AUTO_SEND: "false" # HARD PAUSE: never enable without a new verified release
      OUTRUN_KR_V2_PHASE: "PAUSED"
      OUTRUN_KR_V2_NO_SEND: "true" # startup interlock, not a production permission
      OUTRUN_KR_V2_AUTO_GENERATE: "false"
      OUTRUN_KR_V2_AUTO_COMPOSE: "false"
      OUTRUN_KR_V2_AUTO_DEPLOY: "false"
      # v2 has NO scheduled sends, including C. All stages need independent evidence.
      SCHEDULE_MINUTES: "" # empty = no scheduled slots; controller supports empty list
      CHAT_SLOTS: "3"
      OUTRUN_A_SINGLE_SMOKE_TASK_ID: ""
      OUTRUN_A_TILE_BATCH_QUEUE: "false" # Legacy A-only queue is retained, not used.
      OUTRUN_AB_BATCH_QUEUE: "false"
      OUTRUN_AB_TEXT_ROI_QUEUE: "false" # old one-phrase queue not a v2 batch-sheet runner
      # Fresh v2 manifest + CLEAN/DDS/runtime gates are NOT implemented: no sends.
      OUTRUN_AB_BATCH_SIZE: "5"
      OUTRUN_AB_LIBRARY_FOLDER: "아웃런 한글화 신규" # Existing project Library; no separate folder.
      OUTRUN_AB_PROJECT_LIBRARY_NAME: "아웃런 한글화 신규"
      OUTRUN_AB_PROJECT_NAME: "아웃런 한글화 신규"
      OUTRUN_A_PROJECT_NAME: "아웃런 한글화 신규"
      CHAT_DAY_ROLLOVER_HOUR: "2"
      CHATGPT_BASE_URL: "https://chatgpt.com/"
      CHATGPT_PROJECT_URL: "${LOCALIZATION_PROJECT_URL:-}"
      # Project name is required and verified per fresh A/B chat; optional direct URL.
      REQUIRE_PROJECT_URL: "false"
      PREFERRED_THINKING_LEVEL: "High"
      STRICT_THINKING_LEVEL: "false"
      FRESH_CHAT_EACH_RUN: "true"
      CHAT_RECYCLE_RUNS: "0" # Fresh chat at each accepted new A/B launch; hold if previous unverified.
      RETRY_BUTTON_COOLDOWN_SECONDS: "60"
      VNC_PASSWORD: "${VNC_PASSWORD:-change-me}"
      STATUS_PORT: "8787"
      # Legacy scheduled-send watchdog stays disabled.
      WATCHDOG_ENABLED: "false"
      # Independent Chrome tab recovery; no prompt resend or new task IDs.
      TAB_HEALTH_CHECK_SECONDS: "30"
      TAB_HEALTH_PROBE_TIMEOUT_SECONDS: "6"
      TAB_HEALTH_FAILURE_THRESHOLD: "3"
      TAB_ERROR_FAILURE_THRESHOLD: "2"
      TAB_RECOVERY_COOLDOWN_SECONDS: "60"
      # Full container/browser recycle; credentials and Git checkpoints kept.
      CHROME_RECYCLE_ENABLED: "true"
      CHROME_RECYCLE_INTERVAL_MINUTES: "120"
      CHROME_RECYCLE_BUSY_GRACE_MINUTES: "30"
      CHROME_RECYCLE_BUSY_PROBE_SECONDS: "8"
      WATCHDOG_STALL_MINUTES: "15"
      WATCHDOG_BUSY_STALL_MINUTES: "20"
      WATCHDOG_CHECK_SECONDS: "30"
      WATCHDOG_MAX_RESUMES_PER_RUN: "1"
      WATCHDOG_FORCE_STOP_STALLED: "false"
      RATE_LIMIT_BACKOFF_SECONDS: "120,300,600,1200"
      MIN_SEND_GAP_SECONDS: "60"
      SLOT_DEDUP_SECONDS: "180"
    ports:
      - "6082:6080"
      - "8788:8787"
    volumes:
      - outrun_chat_localization_recovery_data:/data
      # Read original 986 tiles from inputs/A/HD_EN_TILES_20261014 for both roles.
      # Overlay ONLY /data/imagegen; browser profile, state and logs stay on named volumes.
      # Docker daemon host path must exist; do not silently create an empty bind directory.
      - type: bind
        source: /home/chatgpt-runner2/work/image-src
        target: /data/imagegen
        bind:
          create_host_path: false
      - outrun_chat_localization_recovery_logs:/logs


  # HISTORICAL optional offline C fallback, disabled in default Stack.
  # C is the third tab of the existing A/B controller; no extra service starts.
  # Binds source image-src read-only; never deploys localized DDS or approves QA.
  # This service only starts when the user manually redeploys the Portainer Git stack.
  outrun-c-salvage-offline:
    profiles: ["retired-c-salvage-do-not-run"]
    build:
      context: ./c_salvage
      dockerfile: Dockerfile
    image: outrun-kor-c-salvage:20261015
    pull_policy: build
    container_name: outrun-c-salvage-offline
    restart: "no" # retired C must never automatically repeat
    init: true
    cpus: 0.5
    mem_limit: 512m
    read_only: true
    network_mode: "none"
    user: "1002:1002"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: /home/chatgpt-runner2/work/image-src
        target: /data/image-src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/chatgpt-runner2/work/c-salvage-production
        target: /data/c-salvage
        bind:
          create_host_path: false
    # Prevent accidental execution of outdated CLEAN/DDS/loop role under manual profile.
    entrypoint: ["/bin/sh", "-c", "echo OUTRUN_V2_RETIRED_C_SALVAGE_DISABLED >&2; exit 64"]
    command:
      - --input-root
      - /data/image-src
      - --output-root
      - /data/c-salvage
      - --repo-root
      - /opt/c-salvage
      - --plate-jobs-dir
      - /data/c-salvage/plate_jobs
      - --recipes-dir
      - /data/c-salvage/recipes
      - --bundle-root
      - /data/c-salvage/bundles
      - --masks-dir
      - /data/c-salvage/masks
      - --max-per-cycle
      - "10"
      - --interval-seconds
      - "1800"
      # --loop RETIRED: C is only the native unmodified HD crop worker.

volumes:
  outrun_chat_localization_recovery_data:
    name: outrun_chat_localization_recovery_data
  outrun_chat_localization_recovery_logs:
    name: outrun_chat_localization_recovery_logs