# Existing Portainer Docker acts ONLY as GitHub Actions dispatcher/status monitor.
# All heavy Korean localization processing runs directly on GitHub-hosted CPU;
# the GitHub workflow does not start Docker. Existing named volumes are preserved.
services:
  outrun-chat-controller-localization-recovery:
    build:
      context: .
      dockerfile: Dockerfile.gitops
    pull_policy: build
    container_name: outrun-chat-controller-localization-recovery
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 96m
    mem_reservation: 32m
    cpus: 0.10
    pids_limit: 24
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m
    environment:
      TZ: Asia/Seoul
      OUTRUN_GITOPS_HOME: /data/gitops
      OUTRUN_GITOPS_POLL_SECONDS: "${OUTRUN_GITOPS_POLL_SECONDS:-900}"
      OUTRUN_CLEANPLATE_REPAIR_ENABLED: "${OUTRUN_CLEANPLATE_REPAIR_ENABLED:-1}"
      # Optional fine-grained GitHub Actions:Read and write PAT.
      # Without it the Docker only observes; GitHub cron/push still runs QA.
      OUTRUN_GITHUB_ACTIONS_TOKEN: "${OUTRUN_GITHUB_ACTIONS_TOKEN:-}"
    volumes:
      - outrun_chat_localization_recovery_data:/data
      - outrun_chat_localization_recovery_logs:/logs
    stop_grace_period: 20s


  # A/B/C1 chat worker is a default service, because Portainer Git stacks may
  # omit Compose profiles even when a stack variable is present. Browser work
  # still fails closed until VNC password, GitHub token and ChatGPT login exist.
  # Actual DDS and HD QA compute remain on GitHub-hosted runners.
  outrun-chat-qa-rework:
    build:
      context: .
      dockerfile: Dockerfile.chat-rework
    pull_policy: build
    container_name: outrun-chat-qa-rework
    restart: unless-stopped
    init: true
    # Visible VNC Chromium needs headroom for ChatGPT rendering and image upload.
    # A single visible Chromium/CDP context only. Override these in Portainer
    # if the host has less free RAM; avoid a second Chrome profile/container.
    # Live cgroup evidence (2026-11-19): 2 GiB caused 35k+ memory.max
    # events, ~0.76 GiB swap use, while a 1-CPU quota accumulated heavy
    # throttling. Give Chromium modest headroom without consuming the whole N100.
    cpus: 2.00
    mem_limit: ${OUTRUN_REWORK_MEM_LIMIT:-3072m}
    pids_limit: 384
    shm_size: ${OUTRUN_REWORK_SHM_SIZE:-512m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: Asia/Seoul
      OUTRUN_REWORK_HOME: /data/hd-rework
      OUTRUN_REWORK_BROWSER_PROFILE_DIR: /browser-profile
      OUTRUN_REWORK_POLL_SECONDS: "${OUTRUN_REWORK_POLL_SECONDS:-600}"
      # Same C1 browser/profile, one full DDS per existing poll; no new Chrome.
      OUTRUN_ATLAS_VISUAL_QA_ENABLED: "${OUTRUN_ATLAS_VISUAL_QA_ENABLED:-1}"
      # Optional Actions:read token for the compact PNG artifact; Contents token is fallback.
      OUTRUN_GITHUB_ACTIONS_TOKEN: "${OUTRUN_GITHUB_ACTIONS_TOKEN:-}"
      # Reuse-only QA queue remains immutable. Connect the independent,
      # SHA-proved ImageGen fallback queue (8 staged, 7 previously AB_SENT).
      # New generation is permitted only if there is no previous send receipt.
      OUTRUN_REWORK_QUEUE_NAME: "${OUTRUN_REWORK_QUEUE_NAME:-hd_imagegen_fallback}"
      OUTRUN_REWORK_REUSE_ONLY: "${OUTRUN_REWORK_REUSE_ONLY:-0}"
      OUTRUN_GITHUB_CONTENTS_TOKEN: "${OUTRUN_GITHUB_CONTENTS_TOKEN:-}"
      OUTRUN_REWORK_VNC_PASSWORD: "${OUTRUN_REWORK_VNC_PASSWORD:-}"
      CHATGPT_PROJECT_URL: "${CHATGPT_PROJECT_URL:-https://chatgpt.com/}"
    volumes:
      - outrun_chat_localization_recovery_data:/data
      - outrun_chat_localization_recovery_logs:/logs
      - outrun_chat_browser_profile_clean_v2:/browser-profile
    ports:
      - "${OUTRUN_REWORK_VNC_BIND:-6084}:6080"
    healthcheck:
      # VNC alone can stay green after Chromium dies. Check both the visible
      # desktop endpoint and Chromium's loopback-only CDP endpoint.
      test: ["CMD", "python", "-c", "import json,urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/vnc.html',timeout=4).read(16); v=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json/version',timeout=4)); assert v.get('webSocketDebuggerUrl')"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s

volumes:
  outrun_chat_localization_recovery_data:
    name: outrun_chat_localization_recovery_data
  outrun_chat_localization_recovery_logs:
    name: outrun_chat_localization_recovery_logs
  outrun_chat_browser_profile_clean_v2:
    name: outrun_chat_browser_profile_clean_v2
