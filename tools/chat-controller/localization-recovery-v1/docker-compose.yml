services:
  outrun-chat-controller-localization-recovery:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: outrun-chat-controller-localization-recovery
    restart: "no" # v2 PAUSED: no auto-restart on host boot or Docker daemon restart
    init: true
    shm_size: "1g"
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 2.0
    environment:
      TZ: Asia/Seoul
      CONTROLLER_MODE: "localization"
      AUTO_SEND: "false" # HARD PAUSE: never enable without a new verified release
      OUTRUN_KR_V2_PHASE: "PAUSED"
      OUTRUN_KR_V2_NO_SEND: "true" # startup interlock, not a production permission
      OUTRUN_KR_V2_AUTO_GENERATE: "false"
      OUTRUN_KR_V2_AUTO_COMPOSE: "false"
      OUTRUN_KR_V2_AUTO_DEPLOY: "false"
      # No browser scheduled sends; independent C is only native English source extraction.
      SCHEDULE_MINUTES: "" # empty = no scheduled slots; controller supports empty list
      CHAT_SLOTS: "2" # A/B browser remain paused; native OCR C is the service below, not a third browser tab
      OUTRUN_A_SINGLE_SMOKE_TASK_ID: ""
      OUTRUN_A_TILE_BATCH_QUEUE: "false" # Legacy A-only queue is retained, not used.
      OUTRUN_AB_BATCH_QUEUE: "false"
      OUTRUN_AB_TEXT_ROI_QUEUE: "false" # old one-phrase queue not a v2 batch-sheet runner
      # Fresh v2 manifest + CLEAN/DDS/runtime gates are NOT implemented: no sends.
      OUTRUN_AB_BATCH_SIZE: "5"
      OUTRUN_AB_LIBRARY_FOLDER: "아웃런 한글화 신규" # Existing project Library; no separate folder.
      OUTRUN_AB_PROJECT_LIBRARY_NAME: "아웃런 한글화 신규"
      OUTRUN_AB_PROJECT_NAME: "아웃런 한글화 신규"
      OUTRUN_A_PROJECT_NAME: "아웃런 한글화 신규"
      CHAT_DAY_ROLLOVER_HOUR: "2"
      CHATGPT_BASE_URL: "https://chatgpt.com/"
      CHATGPT_PROJECT_URL: "${LOCALIZATION_PROJECT_URL:-}"
      # Project name is required and verified per fresh A/B chat; optional direct URL.
      REQUIRE_PROJECT_URL: "false"
      PREFERRED_THINKING_LEVEL: "High"
      STRICT_THINKING_LEVEL: "false"
      FRESH_CHAT_EACH_RUN: "true"
      CHAT_RECYCLE_RUNS: "0" # Fresh chat at each accepted new A/B launch; hold if previous unverified.
      RETRY_BUTTON_COOLDOWN_SECONDS: "60"
      VNC_PASSWORD: "${VNC_PASSWORD:-change-me}"
      STATUS_PORT: "8787"
      # Legacy scheduled-send watchdog stays disabled.
      WATCHDOG_ENABLED: "false"
      # Independent Chrome tab recovery; no prompt resend or new task IDs.
      TAB_HEALTH_CHECK_SECONDS: "30"
      TAB_HEALTH_PROBE_TIMEOUT_SECONDS: "6"
      TAB_HEALTH_FAILURE_THRESHOLD: "3"
      TAB_ERROR_FAILURE_THRESHOLD: "2"
      TAB_RECOVERY_COOLDOWN_SECONDS: "60"
      # Full container/browser recycle; credentials and Git checkpoints kept.
      CHROME_RECYCLE_ENABLED: "true"
      CHROME_RECYCLE_INTERVAL_MINUTES: "120"
      CHROME_RECYCLE_BUSY_GRACE_MINUTES: "30"
      CHROME_RECYCLE_BUSY_PROBE_SECONDS: "8"
      WATCHDOG_STALL_MINUTES: "15"
      WATCHDOG_BUSY_STALL_MINUTES: "20"
      WATCHDOG_CHECK_SECONDS: "30"
      WATCHDOG_MAX_RESUMES_PER_RUN: "1"
      WATCHDOG_FORCE_STOP_STALLED: "false"
      RATE_LIMIT_BACKOFF_SECONDS: "120,300,600,1200"
      MIN_SEND_GAP_SECONDS: "60"
      SLOT_DEDUP_SECONDS: "180"
    ports:
      - "6082:6080"
      - "8788:8787"
    volumes:
      - outrun_chat_localization_recovery_data:/data
      # Read original 986 tiles from inputs/A/HD_EN_TILES_20261014 for both roles.
      # Overlay ONLY /data/imagegen; browser profile, state and logs stay on named volumes.
      # Docker daemon host path must exist; do not silently create an empty bind directory.
      - type: bind
        source: /home/chatgpt-runner2/work/image-src
        target: /data/imagegen
        bind:
          create_host_path: false
      - outrun_chat_localization_recovery_logs:/logs


  # Live GitHub/Portainer C slot. This is a member of THIS existing
  # localization-recovery stack, not a standalone Compose/Portainer stack.
  # A/B remain PAUSED; their browser schedules and state are untouched.
  outrun-c-english-native-crop:
    build:
      context: .
      dockerfile: c_english_crop/Dockerfile
    pull_policy: build
    container_name: outrun-localization-c-english-crop
    restart: unless-stopped
    init: true
    network_mode: "none"
    read_only: true
    user: "1002:1002"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    cpus: 0.75
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Seoul
      # Explicit role guard; English source extraction only.
      OUTRUN_C_ROLE: "UNSPLIT_HD_NATIVE_ENGLISH_CROP_ONLY"
    command: ["--interval-seconds", "60", "--max-per-cycle", "10"]
    volumes:
      # Existing 108 SHA-verified unsplit originals, receipt, original ZIPs,
      # C output/history and OCR position are in this SAME persisted tree.
      - type: bind
        source: /home/chatgpt-runner2/work/c_salvage_text_roi/c_original_hd_crop_only
        target: /home/chatgpt-runner2/work/c_salvage_text_roi/c_original_hd_crop_only
        bind:
          create_host_path: false
      # Source DDS+PNG stay read-only; never write translated game textures.
      - type: bind
        source: /home/chatgpt-runner2/work/c_salvage_text_roi/source_full_20261012
        target: /home/chatgpt-runner2/work/c_salvage_text_roi/source_full_20261012
        read_only: true
        bind:
          create_host_path: false
      # Existing 255-crop SSOT manifest is immutable input.
      - type: bind
        source: /home/chatgpt-runner2/work/c_salvage_text_roi/original_hd_phrase_crops_20261016/MASTER_255_V2_20261016/MASTER_CROP_MANIFEST_255.json
        target: /home/chatgpt-runner2/work/c_salvage_text_roi/original_hd_phrase_crops_20261016/MASTER_255_V2_20261016/MASTER_CROP_MANIFEST_255.json
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

  # User-approved 2026-10-17: A/B KOREAN PNG GENERATION ONLY.
  # 00/20/40 A, 10/30/50 B (KST). C remains an independent English-only service.
  # No DDS composition, CLEAN, game patch or output approval.
  outrun-ab-imagegen-only:
    image: outrun-imagegen-a-stable:20261013
    pull_policy: never
    container_name: outrun-ab-imagegen-only
    entrypoint: ["/bin/bash", "/app/start.sh"]
    restart: unless-stopped
    init: true
    shm_size: "1g"
    mem_limit: 3g
    cpus: 1.5
    environment:
      DISPLAY: ":99"
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      VNC_PASSWORD: "${VNC_PASSWORD:?Configure VNC_PASSWORD in Portainer}"
      CHATGPT_PROJECT_URL: "${LOCALIZATION_PROJECT_URL:-https://chatgpt.com/g/g-p-6acdb8270260819190da244c0bf006a3-ausreon-hangeulhwa-singyu}"
      AUTO_SEND: "true"
      INPUT_ROOT: /inputs
      STATE_ROOT: /state
      OUTPUT_ROOT: /output
      PROMPT_ROOT: /prompts
      PROFILE_ROOT: /profile
      GENERATION_TIMEOUT_SECONDS: "420"
    ports:
      - "6083:6080"
    volumes:
      - /home/chatgpt-runner2/work/outrun-ab-imagegen-only/app/runner.py:/app/runner.py:ro
      - /home/chatgpt-runner2/work/outrun-ab-imagegen-only/app/start.sh:/app/start.sh:ro
      - /home/chatgpt-runner2/work/outrun-ab-imagegen-only/inputs:/inputs:ro
      - /home/chatgpt-runner2/work/outrun-ab-imagegen-only/prompts:/prompts:ro
      - /home/chatgpt-runner2/work/outrun-ab-imagegen-only/profile:/profile
      - /home/chatgpt-runner2/work/outrun-ab-imagegen-only/state:/state
      - /home/chatgpt-runner2/work/outrun-ab-imagegen-only/output:/output
      - /home/chatgpt-runner2/work/outrun-ab-imagegen-only/logs:/logs

volumes:
  outrun_chat_localization_recovery_data:
    name: outrun_chat_localization_recovery_data
  outrun_chat_localization_recovery_logs:
    name: outrun_chat_localization_recovery_logs