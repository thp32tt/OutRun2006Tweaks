services:
  outrun-chat-controller-vr:
    build:
      context: .
      dockerfile: Dockerfile.portainer
    container_name: outrun-chat-controller-vr
    restart: unless-stopped
    init: true
    shm_size: "768m"
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 1.5
    environment:
      TZ: Asia/Seoul
      CONTROLLER_MODE: conversion
      AUTO_SEND: "${AUTO_SEND:-true}"
      GITHUB_REPO: thp32tt/OutRun2006Tweaks
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      CHATGPT_PROJECT_URL: "${VR_PROJECT_URL:-}"
      REQUIRE_PROJECT_URL: "true"
      PREFERRED_THINKING_LEVEL: High
      TICK_SECONDS: "15"
      SEND_GAP_SECONDS: "30"
      SAME_CHAT_CONTINUATION_GAP_SECONDS: "20"
      TURN_IDLE_GRACE_SECONDS: "8"
      NO_WORK_RETRY_SECONDS: "600"
      CHAT_REUSE_MAX_JOBS: "12"
      CHAT_REUSE_MAX_AGE_MINUTES: "240"
      RATE_LIMIT_BACKOFF_SECONDS: "90,180,300,600"
      STATUS_PORT: "8787"
      VNC_PASSWORD: "${VNC_PASSWORD:-change-me}"
    ports:
      - "6080:6080"
      - "8787:8787"
    volumes:
      - outrun_chat_vr_data:/data
      - outrun_chat_vr_logs:/logs

volumes:
  outrun_chat_vr_data:
    name: outrun_chat_vr_data
  outrun_chat_vr_logs:
    name: outrun_chat_vr_logs
