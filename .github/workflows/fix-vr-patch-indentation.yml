name: Fix VR patch indentation

on:
  push:
    branches: [ vr-openxr ]
    paths:
      - '.github/workflows/fix-vr-patch-indentation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize patched C++ indentation
        run: python tools/fix_vr_patch_indentation_once.py
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          python tools/verify_vr_architecture.py
          git config user.name 'thp32tt'
          git config user.email '129367814+thp32tt@users.noreply.github.com'
          git add src/vr/d3d9/stereo_renderer_r7.inc src/vr/d3d9/stereo_renderer.cpp
          git commit -m 'vr: normalize 10-pass hardening source indentation'
          git push origin HEAD:vr-openxr
