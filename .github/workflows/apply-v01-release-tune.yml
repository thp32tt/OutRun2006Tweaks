name: Apply v0.1 Final Engine Haptic Tune

on:
  push:
    branches: [ wheel-ffb-v0.2-dev ]
    paths:
      - '.github/workflows/apply-v01-release-tune.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wheel-ffb-v0.2-dev
          fetch-depth: 0
      - name: Apply final engine haptic tune
        run: python3 tools/finalize_v01_tune.py
      - name: Commit tuned sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hooks_wheel_ffb.cpp src/hooks_wheel_ffb_build.cpp src/wheel_ffb_math.hpp src/overlay/wheel_setup_ui.cpp OutRun2006Tweaks.ini tools/test_wheel_ffb_current.cpp tools/verify_wheel_ffb_current.py
          git commit -m 'ffb v0.1: make engine vibration optional and lighter [skip ci]'
          git push origin HEAD:wheel-ffb-v0.2-dev
