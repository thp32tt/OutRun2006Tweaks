name: DX9Ex HUD 1000 Static Review

on:
  workflow_dispatch:
  push:
    branches:
      - vr-d3d9ex-focus
    paths:
      - 'tools/audit_vr_hud_1000.py'
      - '.github/workflows/dx9ex-hud-1000-review.yml'
      - 'src/hooks_uiscaling.cpp'
      - 'src/hooks_textures.cpp'
      - 'src/hooks_graphics.cpp'
      - 'src/vr/game/render_semantics.hpp'
      - 'src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp'
      - 'src/vr/d3d9/ex_device_upgrade_r14.cpp'
      - 'src/overlay/hooks_overlay.cpp'
      - 'docs/VR_BINARY_CONTRACT.json'

permissions:
  contents: read

jobs:
  hud-1000:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Audit 1000 HUD source/contract cycles with 30-cycle records
        run: python3 tools/audit_vr_hud_1000.py --cycles 1000 --batch 30 --output hud-audit-output
      - name: Preserve findings and 30-cycle checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dx9ex-hud-1000-static-review
          path: hud-audit-output/
          if-no-files-found: warn
          retention-days: 90
