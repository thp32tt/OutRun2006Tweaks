name: One-shot v0.3 final debug

on:
  push:
    branches: [ wheel-ffb-v0.3-xforce ]

permissions:
  contents: write

jobs:
  final-debug:
    if: ${{ !contains(github.event.head_commit.message, '[v03-final-debug-patched]') }}
    runs-on: windows-2022
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7.0.1
        with:
          ref: wheel-ffb-v0.3-xforce
          fetch-depth: 0

      - name: Apply final reviewed fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected source block not found')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one source block, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Debug 1: a hard-invalid sample while stopped must invalidate the
          # stopped baseline. Otherwise the next moving sample can compare
          # against a stale pre-fault baseline and re-arm in the same frame.
          replace_once(
              'src/wheel_ffb_math.hpp',
              '''                if (speedNorm < XForceResumeSpeed)\n                {\n                    if (out.rangeValid)\n                    {\n                        stoppedRaw_ = raw;\n                        baselineCaptured_ = true;\n                    }\n                    responseObserved_ = false;\n                    nativeBlend_ = 0.0f;\n                    lastNormalized_ = 0.0f;\n                    unresponsiveSeconds_ = 0.0f;\n                    out.responseObserved = false;\n                    out.stopped = true;\n                    return out;\n                }''',
              '''                if (speedNorm < XForceResumeSpeed)\n                {\n                    if (out.rangeValid)\n                    {\n                        stoppedRaw_ = raw;\n                        baselineCaptured_ = true;\n                    }\n                    else\n                    {\n                        // Invalid data at rest is still a hard trust fault. Do\n                        // not retain a pre-fault stopped baseline into launch.\n                        stoppedRaw_ = 0.0f;\n                        baselineCaptured_ = false;\n                    }\n                    awaitingFreshAfterStop_ = true;\n                    responseObserved_ = false;\n                    nativeBlend_ = 0.0f;\n                    lastNormalized_ = 0.0f;\n                    unresponsiveSeconds_ = 0.0f;\n                    out.responseObserved = false;\n                    out.stopped = true;\n                    return out;\n                }''',
              'stopped hard-invalid baseline guard')

          # Debug 2: do not install a second inline hook on InputManager_Update.
          # The existing WheelSelectorDPadAlias hook already owns this function;
          # observe the candidate from that hook instead.
          compat = Path('src/hooks_wheel_input_compat_v2.hpp')
          text = compat.read_text(encoding='utf-8')
          text = text.replace(
              '''\n// Implemented by input_manager.cpp. The wheel build already calls this from the\n// normal new-input path; the research hook below only observes after that update.\nvoid InputManager_Update();\n''', '\n')
          start = text.find('    // The default wheel build uses UseNewInput=true')
          end_marker = '    WheelXForceResearchNewInput WheelXForceResearchNewInput::instance;\n\n'
          if start < 0:
              raise SystemExit('new-input research hook: start block not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('new-input research hook: end block not found')
          text = text[:start] + text[end + len(end_marker):]
          compat.write_text(text, encoding='utf-8')

          replace_once(
              'src/hooks_wheel_ffb_build.cpp',
              '''        static void InputManager_Update_dest()\n        {\n            InputUpdateHook.ccall<void>();\n\n            if (!Settings::UseNewInput || !Game::current_mode ||''',
              '''        static void InputManager_Update_dest()\n        {\n            InputUpdateHook.ccall<void>();\n\n            // Reuse this existing input hook for research capture instead of\n            // stacking another inline hook on InputManager_Update.\n            if (Settings::UseNewInput)\n                WheelXForceResearch::capture_neighbors();\n\n            if (!Settings::UseNewInput || !Game::current_mode ||''',
              'reuse existing InputManager_Update hook')

          # Debug 3: nearest-time matching must be one-to-one. Reusing one input
          # sample for multiple physics samples artificially strengthens
          # correlation and can make an unverified candidate look convincing.
          replace_once(
              'tools/analyze_xforce_capture.py',
              '''def pair_rows(physics: Sequence[Row], neighbors: Sequence[Row]) -> List[Tuple[Row, Row, int]]:\n    if not physics or not neighbors:\n        return []\n\n    neighbor_ticks = [row.tick for row in neighbors]\n    pairs: List[Tuple[Row, Row, int]] = []\n    for physics_row in physics:\n        index = bisect.bisect_left(neighbor_ticks, physics_row.tick)\n        candidates = []\n        if index < len(neighbors):\n            candidates.append(neighbors[index])\n        if index > 0:\n            candidates.append(neighbors[index - 1])\n        if not candidates:\n            continue\n        neighbor = min(candidates, key=lambda row: abs(row.tick - physics_row.tick))\n        delta = abs(neighbor.tick - physics_row.tick)\n        if delta <= PAIR_TOLERANCE_MS:\n            pairs.append((physics_row, neighbor, delta))\n    return pairs\n''',
              '''def pair_rows(physics: Sequence[Row], neighbors: Sequence[Row]) -> List[Tuple[Row, Row, int]]:\n    if not physics or not neighbors:\n        return []\n\n    neighbor_ticks = [row.tick for row in neighbors]\n    pairs: List[Tuple[Row, Row, int]] = []\n    next_neighbor = 0\n    for physics_row in physics:\n        # Find the closest still-unused input-side sample. A candidate record may\n        # be paired at most once; otherwise dropped/irregular samples bias both\n        # the magnitude distribution and Pearson correlation.\n        index = bisect.bisect_left(\n            neighbor_ticks, physics_row.tick, lo=next_neighbor)\n        candidate_indices: List[int] = []\n        if index < len(neighbors):\n            candidate_indices.append(index)\n        if index > next_neighbor:\n            candidate_indices.append(index - 1)\n        if not candidate_indices:\n            continue\n        chosen = min(\n            candidate_indices,\n            key=lambda i: abs(neighbors[i].tick - physics_row.tick))\n        delta = abs(neighbors[chosen].tick - physics_row.tick)\n        if delta <= PAIR_TOLERANCE_MS:\n            pairs.append((physics_row, neighbors[chosen], delta))\n            next_neighbor = chosen + 1\n    return pairs\n''',
              'one-to-one timestamp pairing')

          # Debug 4: host tests cover both the guard boundary above and the
          # Python analyzer pairing logic rather than syntax-checking only.
          replace_once(
              'tools/test_wheel_ffb_current.cpp',
              ''' XForceGuard xn; xn.reset();\n auto xNan=xn.update(std::numeric_limits<float>::quiet_NaN(),.5f,.5f,false);\n require(!xNan.rangeValid&&!xNan.valid&&xNan.nativeBlend==0.0f&&xNan.normalized==0.0f,"X-Force NaN stays fail closed");\n''',
              ''' XForceGuard xn; xn.reset();\n auto xNan=xn.update(std::numeric_limits<float>::quiet_NaN(),.5f,.5f,false);\n require(!xNan.rangeValid&&!xNan.valid&&xNan.nativeBlend==0.0f&&xNan.normalized==0.0f,"X-Force NaN stays fail closed");\n\n // A hard-invalid value received while already stopped must discard the last\n // valid stopped baseline. The first moving sample after the fault is baseline\n // only, and only a later changed sample may re-arm native torque.\n XForceGuard xStopFault; xStopFault.reset();\n xStopFault.update(62.0f,0.0f,.5f,false);\n auto xStopNan=xStopFault.update(std::numeric_limits<float>::quiet_NaN(),0.0f,.5f,false);\n auto xStopFaultBaseline=xStopFault.update(40.0f,.20f,.5f,false);\n auto xStopFaultRecovered=xStopFault.update(39.0f,.20f,.5f,false);\n require(!xStopNan.rangeValid&&xStopNan.stopped&&!xStopNan.valid,"X-Force stopped hard-invalid is rejected");\n require(!xStopFaultBaseline.valid&&!xStopFaultBaseline.freshAfterStop&&xStopFaultBaseline.nativeBlend==0.0f,"X-Force stopped fault invalidates old baseline before launch");\n require(xStopFaultRecovered.valid&&xStopFaultRecovered.freshAfterStop,"X-Force stopped fault requires a changed post-baseline sample to re-arm");\n''',
              'stopped hard-invalid host invariant')

          Path('tools/test_xforce_analyzer.py').write_text(r'''#!/usr/bin/env python3\n"""Host-only invariants for tools/analyze_xforce_capture.py."""\nfrom importlib.util import module_from_spec, spec_from_file_location\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nSPEC = spec_from_file_location("xforce_analyzer", ROOT / "tools/analyze_xforce_capture.py")\nassert SPEC and SPEC.loader\nMOD = module_from_spec(SPEC)\nSPEC.loader.exec_module(MOD)\n\ndef require(value, message):\n    if not value:\n        raise SystemExit(message)\n\n# One candidate record must never be reused for two physics records.\nphysics = [MOD.Row(100, {"modern": 0.1}), MOD.Row(108, {"modern": 0.2})]\nneighbors = [MOD.Row(104, {"dbc": 1.0})]\npairs = MOD.pair_rows(physics, neighbors)\nrequire(len(pairs) == 1, "pair_rows reused one neighbor sample")\nrequire(len({id(pair[1]) for pair in pairs}) == len(pairs), "pair_rows produced duplicate candidate objects")\n\n# Normal near-synchronous streams pair completely and preserve chronology.\nphysics = [MOD.Row(100 + i * 16, {"modern": float(i)}) for i in range(6)]\nneighbors = [MOD.Row(101 + i * 16, {"dbc": float(i)}) for i in range(6)]\npairs = MOD.pair_rows(physics, neighbors)\nrequire(len(pairs) == 6, "pair_rows lost ordinary near-synchronous samples")\nrequire(all(pairs[i][1].tick < pairs[i + 1][1].tick for i in range(5)), "pair_rows lost input chronology")\nrequire(max(delta for _, _, delta in pairs) == 1, "pair_rows nearest timestamp selection failed")\n\n# A one-record phase offset must be discoverable by the lagged correlation scan.\npairs = []\nfor i in range(40):\n    physics_row = MOD.Row(1000 + i * 16, {"modern": float(i)})\n    # Candidate i contains the previous physics value, so the next candidate\n    # record should correlate best with the current physics target.\n    candidate_value = float(i - 1) if i else -1.0\n    neighbor_row = MOD.Row(1001 + i * 16, {"dbc": candidate_value})\n    pairs.append((physics_row, neighbor_row, 1))\nr, lag = MOD.best_lag_correlation(pairs, "dbc", "modern")\nrequire(r is not None and r > 0.999 and lag == 1, "lag scan failed to recover one-record phase offset")\nprint("X-Force analyzer host invariants passed")\n''', encoding='utf-8')

          verify = Path('tools/verify_wheel_ffb_math.py')
          v = verify.read_text(encoding='utf-8')
          if 'import sys\n' not in v:
              v = v.replace('import subprocess\n', 'import subprocess\nimport sys\n', 1)
          marker = "compile(ANALYZER.read_text(encoding='utf-8'), str(ANALYZER), 'exec')\n"
          if marker not in v:
              raise SystemExit('verify analyzer syntax marker not found')
          v = v.replace(marker, marker + "subprocess.run([sys.executable, str(ROOT / 'tools/test_xforce_analyzer.py')], check=True)\n", 1)
          verify.write_text(v, encoding='utf-8')

          # Keep the real-device run reproducible and deliberately start in
          # Modern DD so the candidate can be observed before it controls torque.
          docs = Path('docs')
          docs.mkdir(exist_ok=True)
          (docs / 'XFORCE_MOZA_R3_TEST_SCENARIO.md').write_text('''# MOZA R3 X-Force validation scenario\n\nUse this scenario for the first real-device run after the v0.3 final debug build.\n\n## Safety / starting settings\n\n- FeedbackCharacter = Modern DD (0)\n- PhysicsSAT = true\n- XForceGain = 1.00\n- XForceMix = 0.50 (not consumed in Modern DD)\n- XForceInvert = false\n- XForceCapture60Hz = true only for this capture\n- Keep the existing universal v0.2 Spring/Damper/SteeringWeight values unchanged.\n- Confirm the wheel returns toward centre normally before starting the capture.\n- If force direction is suddenly wrong, oscillation becomes violent, or steering force persists while stopped, stop the run and use F11/panic-stop rather than continuing.\n\n## One-pass drive sequence\n\n1. **Stationary baseline (10 s)** — wheel centred for 5 s, then hold about 25% left and 25% right while stationary. Native torque must remain gated out.\n2. **Low-speed slalom (20 s)** — gentle alternating steering at low speed. This tests fresh-after-stop arming and the low-speed motion gate.\n3. **Steady left circle (15 s)** — hold a repeatable loaded left corner. Note steering weight and any plateau.\n4. **Steady right circle (15 s)** — repeat in the opposite direction to verify sign symmetry.\n5. **Progressive understeer (15 s)** — increase steering until the front pushes wide. Modern SAT should unload progressively; record whether DBC/DC0/DC4 do the same.\n6. **Medium/high-speed same-angle comparison (20 s)** — repeat similar steering angles at two clearly different speeds. This is important because Howard-style X-Force is reported to change magnitude strongly with speed.\n7. **Fast left-right transitions (15 s)** — several deliberate counter-steer/reversal inputs. Look for stale torque, reversal latency and false freeze detection.\n8. **Full stop (10 s)** — stop completely without moving the wheel for 5 s, then move the wheel while still stopped. Native path must lose trust.\n9. **Restart (15 s)** — pull away and repeat two slalom inputs. The first moving native sample must be baseline-only; native trust may return only after a fresh change.\n10. **Optional fault-free Arcade/Hybrid feel check** — only after the log is reviewed. Do not enable Arcade X-Force during the identity-validation pass.\n\n## Log analysis\n\nRun:\n\n```text\npython tools/analyze_xforce_capture.py OutRun2006Tweaks.log\n```\n\nRecord for `dbc`, `dc0`, and `dc4`: p95/p99/max, best correlation with steer/Modern SAT/frontSlip/yaw, the reported lag, and the DBC/raw pairing sanity correlation. A promising rack/tyre-force candidate should change with vehicle state rather than merely mirror steering position, should not remain as a stale non-zero force at a stop, and should show coherent sign behavior in both corner directions. Correlation alone is not proof; a promising field still requires write-site/reverse-engineering confirmation before it becomes a production force source.\n''', encoding='utf-8')
          '@ | Set-Content -Path "$env:RUNNER_TEMP\patch_v03.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\patch_v03.py"

      - name: Debug pass 3 - consolidated source verifier
        shell: pwsh
        run: python tools/verify_wheel_ffb_current.py

      - name: Debug pass 4 - production math and analyzer invariants
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat" || exit /b 1
          python tools/verify_wheel_ffb_math.py

      - name: Debug pass 5 - configure Win32 Release
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A Win32 ..

      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build Win32 Release
        run: cmake --build build --config Release

      - name: Verify built DLL
        shell: pwsh
        run: |
          $dllPath = "build/bin/dinput8.dll"
          if (-not (Test-Path $dllPath)) { throw "dinput8.dll was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($dllPath)
          if ($bytes.Length -lt 1000000) { throw "dinput8.dll is unexpectedly small" }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "dinput8.dll has no MZ header" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $signature = [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)
          if ($signature -ne "PE`0`0") { throw "invalid PE signature" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014C) { throw ("expected Win32 x86 DLL, machine=0x{0:X4}" -f $machine) }
          $hash = (Get-FileHash $dllPath -Algorithm SHA256).Hash
          Write-Host "FINAL_DLL_SHA256=$hash"

      - name: Commit reviewed fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wheel_ffb_math.hpp src/hooks_wheel_input_compat_v2.hpp src/hooks_wheel_ffb_build.cpp tools/analyze_xforce_capture.py tools/test_wheel_ffb_current.cpp tools/test_xforce_analyzer.py tools/verify_wheel_ffb_math.py docs/XFORCE_MOZA_R3_TEST_SCENARIO.md
          if (git diff --cached --quiet) { throw "Final debug patch produced no changes" }
          git commit -m "fix: finalize guarded X-Force validation [v03-final-debug-patched]"
          git push origin HEAD:wheel-ffb-v0.3-xforce
