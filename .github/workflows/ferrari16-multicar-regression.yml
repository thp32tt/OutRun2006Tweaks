          assert 'DashboardCoverageComplete(needles,gears,' in seed_ready and 'HostDirectTransportReady()' in seed_ready
          assert stage.index('dash.DrawNativeScene(') < stage.index('const IsolatedMeshInterleave between') < stage.index('body.DrawNativeScene(')
          assert 'IsolatedMeshPass::All,input.includeDashboard?&between:nullptr' in stage
          assert native.index('pass==1u&&between') < native.index('between->draw(between->context,interleaveDirty)') < native.index('for(unsigned order=0;order<')
