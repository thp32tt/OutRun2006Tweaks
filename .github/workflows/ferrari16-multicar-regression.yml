name: Ferrari16 All-Car Sidecar Regression
on:
  push:
    branches: [vr-ferrari16-v003-multicar-debug-20261122, fix/ferrari16-stereo-loader-guard-20261122, fix/ferrari16-pbr-stereo-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test 16 canonical / 30 retail selection and all previous sidecar contracts
        shell: bash
        run: |
          set -euo pipefail
          for t in ferrari16_multicar_runtime_test ferrari14_lift_pose_contract_test external_car_draw_order_test external_car_ground_test external_car_gate_test external_car_dashboard_test external_car_sidecar_v4_test game_reset_events_test external_car_selection_test external_car_legacy_fallback_test external_car_trace_budget_test external_car_runtime_policy_test ferrari14_trace_50_test external_car_stereo_receipt_test external_car_eye_transform_proof_test external_car_stereo_failure_diagnostics_test external_car_stereo_retry_test external_vehicle_semantic_isolation_test external_car_pbr_eye_math_test; do
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic "tests/${t}.cpp" -o "/tmp/${t}"
            "/tmp/${t}"
          done
      - name: Run read-only OVC header, CRC, asset-layout and corruption smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ferrari16/verify_all_car_ovc.py --self-test
      - name: Assert exact sixteen-car routing and per-car diagnostics in production source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('src/hooks_graphics.cpp').read_text()
          gpu=Path('src/vr/game/dino_external_d3d9.hpp').read_text()
          selection=Path('src/vr/game/external_car_selection.hpp').read_text()
          between=source[source.index('static F50ExternalDrawTicket PrepareF50External('):source.index('static bool DrawPreparedF50External(')]
          assert 'ticket.slot=extraCar ?' in between
          assert 'FerrariModelSlot::GenericId :' in between
          assert 'const float requestedLift=!extraCar ?' in between
          assert 'FerrariModelSlot::Gto288 :' not in between
          assert 'FerrariModelSlot::F40 :' not in between
          assert 'CanonicalFerrariExternalCarId(observedId)' in selection
          assert 'LegacyFerrariCarSuffix(canonicalId)' in gpu
          assert 'GetFileAttributesW(candidate)' in gpu
          assert 'LegacyFallbackForMissingCanonical(' in gpu
          assert 'GetLastError()' in gpu
          assert 'CanonicalFerrariExternalCarId(carId):carId;' in gpu
          floor=gpu[gpu.index('bool SafeFloorLift('):gpu.index('bool EnsureResources(')]
          assert 'EnsureLoaded()' in floor and 'Installed()' not in floor
          assert 'rejectedByCar[id]++' in source
          assert 'gateRejectByCar[id]++' in source
          assert 'traceBudget.ShouldLog(' in source
          assert 'traceBudget.attempts' in source
          assert 'terminalMilestone' in source
          assert 'MaterialModeName()' in source
          assert 'transformSamplesByCar[id]++' in source
          assert 'if(f50.valid && DrawPreparedF50External(f50))' in source
          assert 'D3DRS_CLIPPING,TRUE' in gpu
          assert 'D3DRS_CLIPPLANEENABLE,0u' in gpu
          assert 'if(!MeshInDrawPass(m.glass,pass))continue;' in gpu
          assert 'ScopedExternalStereoMeshReceipt eyeScope(physical)' in gpu
          assert 'physical.Complete()' in gpu
          assert 'ExternalEyeFailureName(' in source
          assert 'ClassifyExternalEyeFailure(physical)' in gpu
          assert 'DistinctFiniteExternalEyeTransforms(' in Path('src/vr/d3d9/stereo_renderer_r7.inc').read_text()
          assert 'receipt->rightDrawFailed = receipt->rightDrawFailed || rightGpuFailure' in Path('src/vr/game/external_car_stereo_receipt.hpp').read_text()
          assert 'stereoRetry_.OnSoftStereoFailure()' in gpu
          assert 'ScopedExternalVehicleSemantic externalScope' in gpu
          assert 'MainBackbufferActive(device)' in source
          assert 'OutRunVRStereo::R29OwnerStereoWanted()' not in source
          assert 'OutRunVRStereo::R29OwnerTargetIsBackBuffer()' not in source
          assert 'GetBackBuffer(' in gpu and 'GetRenderTarget(0,&active)' in gpu
          assert 'GetRenderTarget(slot,&auxiliary)' in gpu
          assert 'result!=D3DERR_NOTFOUND' in gpu
          assert 'if(bound)return false;' in gpu
          # DDS parsing alone cannot certify PBR stereo. Only the exact
          # bound PBR pair may be duplicated via R7's physical eye path.
          r7=Path('src/vr/d3d9/stereo_renderer_r7.inc').read_text()
          r33=Path('src/vr/d3d9/stereo_renderer_r33.cpp').read_text()
          pbr=Path('src/vr/game/dino_external_pbr_shader.hpp').read_text()
          scope=Path('src/vr/game/external_car_pbr_stereo_scope.hpp').read_text()
          assert 'ActiveExternalStereoMesh ?' in r7
          assert 'ActiveExternalPbrStereo' in r7 and 'ActiveExternalPbrStereo' in r33
          assert 'boundShader==externalPbr->vertex' in r7
          assert 'boundPixel==externalPbr->pixel' in r7
          assert 'state.externalPbrWorld=true' in r7
          assert 'SetExternalPbrEyeConstants(device,draw,0)' in r7
          assert 'SetExternalPbrEyeConstants(device,draw,1)' in r7
          assert 'RestoreExternalPbrConstants(device,draw)' in r7
          assert 'GetPixelShaderConstantF(' in r7
          assert 'SetPixelShaderConstantF(1,camera,1)' in r7
          assert 'if (!resyncAlreadyFlushed) return E_FAIL;' in r33
          assert 'return lowerR29Draw();' in r33
          assert 'ScopedExternalPbrStereo pbrEyeScope(' in gpu
          assert 'ScopedExternalPbrStereo' in scope
          assert 'ExternalPbrEyeConstants(' in pbr
          pbr_trace=Path('tools/ferrari16/RUN-FERRARI16-V003-PBR-TRACE.cmd').read_text()
          assert 'OUTRUN_VR_EXTERNAL_FIXED_FUNCTION_TEST=0' in pbr_trace
          assert 'OUTRUN_VR_EXTERNAL_FIXED_FUNCTION_TEST=1' in Path('tools/ferrari16/RUN-FERRARI16-V003-ALL-CARS-TRACE.cmd').read_text()
          runners=[
              'tools/ferrari16/RUN-FERRARI16-V003-ALL-CARS.cmd',
              'tools/ferrari16/RUN-FERRARI16-V003-ALL-CARS-TRACE.cmd',
              'tools/ferrari16/RUN-FERRARI16-V003-MODEL-OFF.cmd']
          for name in runners:
              s=Path(name).read_text()
              assert '-VR.PreferD3D9Ex=true' in s, name
              assert '-VR.DirectGpuOnly=true' in s, name
              assert '-VR.FrameCadenceMode=1' in s, name
              assert '-VR.FollowGameResolution=false' in s, name
          on=Path(runners[0]).read_text()
          trace=Path(runners[1]).read_text()
          off=Path(runners[2]).read_text()
          assert '-VR.ExternalFerrariTest=true' in on
          assert '-VR.ExternalFerrariTestCarId=-1' in on
          assert '-VR.F50ExternalModel=false' in on
          assert '-VR.ExternalFerrariNativeCallbackReplacement=true' in on
          assert '-VR.ExternalFerrariDiag=true' in trace
          assert '-VR.FileLogging=true' in trace
          assert '-VR.ExternalFerrariTest=false' in off
          print('FERRARI16_PRODUCTION_16_CAR_ROUTE_AND_DIAG_PASS')
          PY
      - name: Confirm official v0.03 core and host unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 2446269aa33bc3c90a2a57f36a650cdd4d4fd5d7
          test -z "$(git diff --name-only 2446269aa33bc3c90a2a57f36a650cdd4d4fd5d7 HEAD -- vrhost src/vr/game/quest_cockpit_v2_runtime.hpp src/vr/game/quest_cockpit_v2_native_frame.hpp Start-OutRun.cmd)"

      - name: Only specifically reviewed R7 R30 R33 stereo owners may differ from v0.03
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 2446269aa33bc3c90a2a57f36a650cdd4d4fd5d7 HEAD -- src/vr/d3d9)"
          if grep -Ev '^src/vr/d3d9/stereo_renderer_r(7\.inc|30\.cpp|33\.cpp)$' <<< "$changed" | grep -q .; then
            echo "$changed"
            exit 1
          fi
