      - name: Confirm official v0.03 core and host unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 2446269aa33bc3c90a2a57f36a650cdd4d4fd5d7
          test -z "$(git diff --name-only 2446269aa33bc3c90a2a57f36a650cdd4d4fd5d7 HEAD -- vrhost src/vr/game/quest_cockpit_v2_runtime.hpp src/vr/game/quest_cockpit_v2_native_frame.hpp Start-OutRun.cmd)"

      - name: Restrict stereo changes to reviewed R7 R30 R33, exact R9 R22 R23 R29 and typed R32 bridge
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 2446269aa33bc3c90a2a57f36a650cdd4d4fd5d7 HEAD -- src/vr/d3d9)"
          if grep -Ev '^src/vr/d3d9/(stereo_renderer(\.cpp|_r(7\.inc|13\.cpp|22\.cpp|23\.cpp|29\.cpp|30\.cpp|30_r26_safe\.cpp|32\.cpp|33\.cpp))|r30_particle_(dual_eye_ring|upload_policy)\.hpp|depth_clear_replay_stamp\.hpp)$' <<< "$changed" | grep -q .; then
            echo "$changed"
            exit 1
          fi
          # Iter71 R9/R23 baseline integration: allow only the exact reviewed blobs.
          test "$(git hash-object src/vr/d3d9/stereo_renderer.cpp)" = 62dd2e7fee54b7735fd4520ddf4dd0673ad536f9
          test "$(git hash-object src/vr/d3d9/stereo_renderer_r22.cpp)" = 98fdd61cadf8fac632bde296047a8f2b8bf8f18e
          test "$(git hash-object src/vr/d3d9/stereo_renderer_r23.cpp)" = cfdeee7950b47432797784003371dd5230967b71
          # A4: exact reviewed R30-safe raw candidate integration, including HUD/UP.
          test "$(git hash-object src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp)" = 470b73a895bce433d46acc1e988aaf3a8f51f5fb
          # Only these exact reviewed R30 transaction helper blobs are allowed.
          # Further byte changes fail closed; the R32 bridge guard remains.
          test "$(git hash-object src/vr/d3d9/r30_particle_dual_eye_ring.hpp)" = 55832210c09cff2c4940d7a06745b15f09284243
          test "$(git hash-object src/vr/d3d9/r30_particle_upload_policy.hpp)" = 40f32f3a349ef61cd109d6f55c364c98b2f7434e
          # EXT16-011 iteration 41: pin the reviewed write-aware clear receipt helper.
          test "$(git hash-object src/vr/d3d9/depth_clear_replay_stamp.hpp)" = 9c983f208d75c2980b81763044f40e3b334e2d87
          # R32 remains restricted to the exact single reviewed return type.
          # Require all remaining bytes of the original file and both headers.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = '2446269aa33bc3c90a2a57f36a650cdd4d4fd5d7'
          # R13 ResetEx must consume the same clear receipt as R7 Reset.
          # Allow exactly the old two reset assignments -> one invalidation.
          r13path = 'src/vr/d3d9/stereo_renderer_r13.cpp'
          old13 = subprocess.check_output(['git','show',base+':'+r13path])
          newline13 = b'\r\n' if b'\r\n' in old13 else b'\n'
          marker13 = b'            LastMainDepthClearEpoch = 0;' + newline13 + b'            LastMainDepthClearFlags = 0;'
          assert old13.count(marker13) == 1
          expected13 = old13.replace(marker13, b'            LastMainDepthClearStamp.Invalidate();', 1)
          # Iter77: invalidate only the automatic depth creation proof before ResetEx.
          markerDepth13 = b'            R13ReleaseAckState();' + newline13 + b'            ReleaseStereoResources();'
          assert expected13.count(markerDepth13) == 1
          expected13 = expected13.replace(markerDepth13, b'            R13ReleaseAckState();' + newline13 + b'            R7ForgetAutomaticDepthProof();' + newline13 + b'            ReleaseStereoResources();', 1)
          # Iter88: exact reviewed R13 reset notification scope and pose-latch retirement, including
          # the prior clear receipt and automatic-depth invalidation changes.
          # Iter91: reviewed prior-generation capture and retained-depth recovery only.
          assert subprocess.check_output(['git','hash-object',r13path]).strip() == b'4ad4d0ee40ad7703d82269b8c1f74a0aa54665e4', 'Unreviewed R13 change'
          # R29 raw wrappers bypass R7 ExecuteStereoDraw. Permit exactly
          # four calls to its existing LEFT receipt revocation helper.
          r29path = 'src/vr/d3d9/stereo_renderer_r29.cpp'
          old29 = subprocess.check_output(['git','show',base+':'+r29path])
          nl29 = b'\r\n' if b'\r\n' in old29 else b'\n'
          begin29 = old29.index(b'    HRESULT R29OwnerCallRawDrawPrimitive(')
          end29 = old29.index(b'    HRESULT R29OwnerCallRawPresent(',begin29)
          raw29 = old29[begin29:end29]
          import re
          raw29, count29 = re.subn(rb'(?m)^        return Draw(?:Indexed)?Primitive(?:UP)?Hook\.stdcall<HRESULT>\(', lambda m: b'        RevokeDepthClearReplayBeforeLeftDraw(d);'+nl29+m.group(0),raw29)
          assert count29 == 4
          expected29 = old29[:begin29]+raw29+old29[end29:]
          # Iter51: exact dirty-bootstrap veto; keep all other R29 bytes pinned.
          marker29 = b'                TryBootstrapRightDepthFromRecentClear(device);'
          assert expected29.count(marker29) == 1
          patch29 = nl29.join([b'                bool bootstrapRestoreFailed = false;', b'                TryBootstrapRightDepthFromRecentClear(device, &bootstrapRestoreFailed);', b'                if (bootstrapRestoreFailed)', b'                {', b'                    R29ArmMonoSafety();', b'                    return E_FAIL;', b'                }'])
          expected29 = expected29.replace(marker29,patch29,1)
          # Iter52: exact dirty-bootstrap result forwarding; no other bytes allowed.
          for before, after in [(b'R29OwnerTryBootstrapRightDepth(IDirect3DDevice9* device) noexcept', b'R29OwnerTryBootstrapRightDepth(IDirect3DDevice9* device, bool* restoreFailed) noexcept'), (b'return TryBootstrapRightDepthFromRecentClear(device);', b'return TryBootstrapRightDepthFromRecentClear(device, restoreFailed);')]:
              assert expected29.count(before) == 1
              expected29 = expected29.replace(before, after, 1)
          # Iter65: raw VB calls use attachment-identified R7 replay; UP revocation remains exact.
          for before, after in [(b'        RevokeDepthClearReplayBeforeLeftDraw(d);\n        return DrawPrimitiveHook.stdcall<HRESULT>(d, t, s, p);', b'        return R7ExecuteRawCandidateVb(d,[&](){\n            return DrawPrimitiveHook.stdcall<HRESULT>(d, t, s, p);\n        });'), (b'        RevokeDepthClearReplayBeforeLeftDraw(d);\n        return DrawIndexedPrimitiveHook.stdcall<HRESULT>(d,t,b,m,n,s,p);', b'        return R7ExecuteRawCandidateVb(d,[&](){\n            return DrawIndexedPrimitiveHook.stdcall<HRESULT>(d,t,b,m,n,s,p);\n        });')]:
              before, after = before.replace(b'\n',nl29), after.replace(b'\n',nl29)
              assert expected29.count(before) == 1
              expected29 = expected29.replace(before,after,1)
          # Iter66: raw UP replay restores stream zero and indexed input before live raster.
          for before, after in [(b'        RevokeDepthClearReplayBeforeLeftDraw(d);\n        return DrawPrimitiveUPHook.stdcall<HRESULT>(d,t,p,data,st);', b'        return R7ExecuteRawCandidateVb(d,[&](){\n            return DrawPrimitiveUPHook.stdcall<HRESULT>(d,t,p,data,st);\n        },true);'), (b'        RevokeDepthClearReplayBeforeLeftDraw(d);\n        return DrawIndexedPrimitiveUPHook.stdcall<HRESULT>(\n            d,t,m,n,p,idx,f,v,st);', b'        return R7ExecuteRawCandidateVb(d,[&](){\n            return DrawIndexedPrimitiveUPHook.stdcall<HRESULT>(\n                d,t,m,n,p,idx,f,v,st);\n        },true,true);')]:
              before, after = before.replace(b'\n',nl29), after.replace(b'\n',nl29)
              assert expected29.count(before) == 1
              expected29 = expected29.replace(before,after,1)
          # A3 batch: pin the exact reviewed R29 direct-ring transfer integration.
          assert subprocess.check_output(['git','hash-object',r29path]).strip() == b'f5985bded36a5017be6eaa83fbd60eca9a09f4e1', 'Unreviewed R29 change'
          paths = {
              'src/vr/d3d9/stereo_renderer_r32.cpp': ('R32Review', False),
              'src/vr/core/r32_review_api.hpp': ('R32Review', True),
              'src/vr/core/r30_support_api.hpp': ('R30Support', True),
          }
          def expected_bridge(original, prefix, header):
              names = ['TryXyzrhwIndexedPrimitiveVB', 'TryExternalImGuiIndexed',
                       'TryXyzrhwPrimitiveVB', 'TryXyzrhwPrimitiveUP',
                       'TryXyzrhwIndexedPrimitiveUP']
              if prefix == 'R30Support':
                  names += ['TryFixedFunctionProjectedRankIndexed',
                            'TryFixedFunctionOriginalSpritePrimitive',
                            'TryFixedFunctionOriginalSpritePrimitiveUP',
                            'TryFixedFunctionOriginalSpriteIndexedUP']
              result = original
              for name in names:
                  signature = ('HRESULT ' + prefix + name + '(').encode()
                  assert result.count(signature) == 1
                  result = result.replace(signature, b'OutRunVR::StereoLowerDraw::Attempt<HRESULT> ' + signature[len(b'HRESULT '):], 1)
              if header:
                  marker = b'#pragma once'
                  assert result.count(marker) == 1
                  newline = b'\r\n' if b'\r\n' in result else b'\n'
                  result = result.replace(marker, marker + newline + b'#include "../game/stereo_lower_draw_result.hpp"', 1)
              arg = 'device' if header else 'd'
              before = (prefix + 'TryBootstrapRightDepth(IDirect3DDevice9* ' + arg + ') noexcept').encode()
              after = (prefix + 'TryBootstrapRightDepth(IDirect3DDevice9* ' + arg + ', bool* restoreFailed) noexcept').encode()
              assert result.count(before) == 1
              result = result.replace(before, after, 1)
              if not header:
                  before = b'return R30SupportTryBootstrapRightDepth(d);'
                  assert result.count(before) == 1
                  result = result.replace(before, b'return R30SupportTryBootstrapRightDepth(d, restoreFailed);', 1)
              return result
          for path, (prefix, header) in paths.items():
              old = subprocess.check_output(['git','show',base+':'+path])
              expected = expected_bridge(old, prefix, header)
              actual = Path(path).read_bytes()
              if path.endswith('stereo_renderer_r32.cpp'):
                  # Iter87: retain exact reviewed baseline plus direct ResetEx lifecycle owner.
                  assert subprocess.check_output(['git','hash-object',path]).strip() == b'9255bd9ed409cb59a4721b3acbc8277d0d24d634', 'Unreviewed R32 lifecycle change'
              else:
                  assert actual == expected, 'Unreviewed baseline bridge change: ' + path
                  assert actual + b'\n// unauthorized change\n' != expected
          print('EXACT_R32_TYPED_BRIDGE_ONLY_PASS')
          PY

