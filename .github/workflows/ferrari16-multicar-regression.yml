          assert 'return attempt.hr;' in screen
          assert 'if (hr != E_NOTIMPL)' not in screen
          native=gpu[gpu.index('GpuDrawResult DrawNativeScene('):gpu.index('inline GpuOwner& GlobalGpu()')]
          route=native.index('!ConfigureExternalTextureRouting(')
          assert native.index('saved->Capture()') < route < native.index('if(SUCCEEDED(hr))for(unsigned pass=phase==IsolatedMeshPass::GlassOnly?1u:0u;')
          assert route < native.index('D3DTSS_RESULTARG,D3DTA_CURRENT') < native.index('D3DRS_WRAP0,D3DRS_WRAP1,D3DRS_WRAP2') < native.index('D3DTSS_COLOROP,D3DTOP_SELECTARG1')
          assert 'SetRenderState(states[coordinate],0u)' in native
          assert native.index('device->DrawIndexedPrimitive(') < native.index('saved->Apply()')
          glass_sort=native[native.index('std::array<GlassDepthItem,MaxGroups>'):native.index('SortGlassBackToFront(')]
          assert 'AnimatedWorld(world,binding,dashboard)' in glass_sort
          assert 'm.glassCenter,&meshWorld.m[0][0],&view.m[0][0],' in glass_sort
          assert 'ComputeIndexedMeshBounds(mesh,bounds)' in gpu
          assert 'ComputeIndexedMeshBounds(m,bounds)' in gpu
          assert 'lowest=(std::min)(lowest,bounds.low[1]);' in gpu
          assert 'next.glassCenter[k]=bounds.low[k]*0.5f+bounds.high[k]*0.5f;' in gpu
          assert 'projection._34' in glass_sort
          assert 'DashboardOverlayMeshVisible(' in glass_sort
          assert '!RuntimeExternalCarAtomicStageReady())return result;' in native
          raster_setup=native[native.index('HRESULT hr=S_OK;'):native.index('std::array<GlassDepthItem,MaxGroups>')]
          assert '!ConfigureExternalRasterCoverage(' in raster_setup
