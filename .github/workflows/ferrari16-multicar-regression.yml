          assert 'RetailPlayerFollowupCallVa-0x00400000u' in install
          assert 'std::array<std::uint8_t,27> RetailPlayerWrapperPrefix' in abi
          assert 'RetailPlayerFollowupRet{{0xC3}}' in abi
          assert '0x0C,0x5E,0xC3' in abi
          assert 'D3DRS_CLIPPING,TRUE' in gpu
          assert 'D3DRS_CLIPPLANEENABLE,0u' in gpu
          assert 'if(!MeshInDrawPass(m.glass,pass))continue;' in gpu
          assert 'ScopedExternalStereoMeshReceipt eyeScope(physical)' in gpu
          assert 'physical.Complete()' in gpu
          assert 'ExternalEyeFailureName(' in source
          assert 'ClassifyExternalEyeFailure(physical)' in gpu
          assert 'CanFallbackAfterNoExternalRaster(physical,priorAttempts,' in gpu
          assert 'result.receipt.possiblySubmitted=false;' in gpu
          assert 'ProveExternalNoPhysicalDraw()' in Path('src/vr/d3d9/stereo_renderer_r7.inc').read_text()
          assert 'ProveExternalNoPhysicalDraw()' in Path('src/vr/d3d9/stereo_renderer_r33.cpp').read_text()
          assert 'DistinctFiniteExternalEyeTransforms(' in Path('src/vr/d3d9/stereo_renderer_r7.inc').read_text()
          # External physical submissions must not report LEFT-only S_OK.
          r7=Path('src/vr/d3d9/stereo_renderer_r7.inc').read_text()
          # A descriptor-compatible depth rebind must revoke the old clear receipt.
          depth_bind=r7[r7.index('HRESULT __stdcall SetDepthStencilSurfaceDest('):r7.index('HRESULT __stdcall QueryIssueDest(')]
          assert depth_bind.index('LastMainDepthClearStamp.OnBindingChange(changed);') < depth_bind.index('ReplaceSurfaceRef(TrackedDepthStencil,surface);')
          retire=r7[r7.index('void ReleaseStereoResources()'):r7.index('bool CreateRightDepthForTracked(')]
          assert retire.index('LastMainDepthClearStamp.Invalidate();') < retire.index('ReleaseCom(TrackedDepthStencil)')
          bootstrap=r7[r7.index('bool TryBootstrapRightDepthFromRecentClear('):r7.index('std::uint32_t NextStereoFrameId()')]
          assert bootstrap.index('!LastMainDepthClearStamp.Current(PresentEpoch)') < bootstrap.index('ClearHook.stdcall<HRESULT>')
          assert 'LastMainDepthClearStamp.Record(PresentEpoch,depthFlags);' in r7
          left_draw=r7[r7.index('HRESULT ExecuteStereoDraw('):r7.index('HRESULT __stdcall DrawPrimitiveDest(')]
          import re
          assert len(re.findall(r'RevokeDepthClearReplayBeforeLeftDraw\(device\);\s+const HRESULT hr=drawCall\(\);',left_draw)) == 2
          assert len(re.findall(r'RevokeDepthClearReplayBeforeLeftDraw\(device\);\s+if\(!leftCurrent\(\)\)return retiredLeft\(\);\s+const HRESULT hr=drawCall\(\);',left_draw)) == 3
          assert left_draw.count('const HRESULT leftHr=drawCall();') == 1
          assert left_draw.index('RevokeDepthClearReplayBeforeLeftDraw(device,mirrorCandidate);') < left_draw.index('R7ReplayInactiveDraw(device,0') < left_draw.index('const HRESULT leftHr=drawCall();')
          assert left_draw.index('R7ReplayInactiveDraw(device,1') < left_draw.index('rightHr=drawCall();')
          assert left_draw.count('rightHr=drawCall();') == 1
          revoke=r7[r7.index('void RevokeDepthClearReplayBeforeLeftDraw('):r7.index('bool ViewportCoversStereoBackbuffer(')]
          assert 'InternalStereoPass || !LastMainDepthClearStamp.Current(PresentEpoch)' in revoke
          assert 'LeftDrawMayWriteDepth(device)' in revoke and 'LeftDrawMayWriteStencil(device)' in revoke
          assert 'LastMainDepthClearStamp.OnPotentialWrite(writes);' in revoke
          clear=r7[r7.index('HRESULT __stdcall ClearDest('):r7.index('HRESULT __stdcall SetRenderTargetDest(')]
          assert clear.index('LastMainDepthClearStamp.OnPotentialWrite(flags&') < clear.index('const bool candidate=StereoWanted()&&TargetIsBackBuffer();')
          assert clear.index('LastMainDepthClearStamp.OnPotentialWrite(flags&') < clear.index('const HRESULT leftHr=clearCall();')
          assert clear.index('LastMainDepthClearStamp.OnPotentialWrite(flags&') < clear.index('RecordFullMainDepthClear(')
          r13=Path('src/vr/d3d9/stereo_renderer_r13.cpp').read_text()
          assert 'LastMainDepthClearStamp.Invalidate();' in r13
          assert 'LastMainDepthClearEpoch' not in r13 and 'LastMainDepthClearFlags' not in r13
          particle=Path('src/vr/d3d9/stereo_renderer_r30.cpp').read_text()
          particle=particle[particle.index('IDirect3DVertexBuffer9* savedStream = nullptr;'):particle.index('bool leftAttempted = false;',particle.index('IDirect3DVertexBuffer9* savedStream = nullptr;'))]
          assert particle.index('device->GetStreamSource(') < particle.index('R30ParticleGpuRing.bindEye(eye)')
          assert particle.index('physicalDrawAttempted = true;') < particle.index('R29OwnerCallRawDrawPrimitive(')
          assert 'FinishSpeculativeUpStream(' in particle
          assert '0, savedStream, savedOffset, savedStride' in particle
          assert 'R30ParticleGpuRing.finishUp();' in particle
          assert particle.index('if (!streamRestored)') < particle.index('MayUseNativeUpAfterGpuAttempt(')
          receipt=Path('src/vr/game/external_car_stereo_receipt.hpp').read_text()
          draw=r7[r7.index('HRESULT ExecuteStereoDraw('):r7.index('HRESULT __stdcall DrawPrimitiveDest(')]
          assert draw.count('if(OutRunVR::DinoSidecar::ActiveExternalStereoMesh) {')>=5
          assert 'CanCompleteExternalStereoDraw(' in draw
          precommit=Path('src/vr/game/external_car_atomic_precommit.hpp').read_text()
          assert 'RuntimeExternalCarAtomicStageReady()' in precommit
          assert 'return false;' in precommit[precommit.index('RuntimeExternalCarAtomicStageReady()'):]
          assert 'MaySubmitExternalCarLiveEye()' in draw
          final_dispatch=Path('src/vr/d3d9/stereo_renderer_r33.cpp').read_text()
          final_dip=final_dispatch[final_dispatch.index('HRESULT __stdcall DrawIndexedPrimitiveDestR33('):final_dispatch.index('HRESULT __stdcall DrawPrimitiveUPDestR33(')]
          assert 'MaySubmitExternalCarLiveEye()' in final_dip
          mid_dispatch=Path('src/vr/d3d9/stereo_renderer_r30.cpp').read_text()
          mid_dip=mid_dispatch[mid_dispatch.index('HRESULT __stdcall DrawIndexedPrimitiveDestR30('):mid_dispatch.index('HRESULT __stdcall DrawPrimitiveUPDestR30(')]
          assert 'MaySubmitExternalCarLiveEye()' in mid_dip
          # R30 screen-space fallback must be independent of the GPU HRESULT.
          screen=mid_dispatch[mid_dispatch.index('R30ScreenDrawAttempt R30TryScreenSpaceFovDraw('):mid_dispatch.index('HRESULT __stdcall DrawPrimitiveDestR30(')]
          assert 'return E_NOTIMPL;' not in screen
          assert 'return leftHr;' not in screen
          assert screen.count('R30ScreenDrawAttempt::AfterDraw(leftHr,') == 5
          assert 'R30ScreenDrawAttempt::Handled(E_FAIL)' in screen
