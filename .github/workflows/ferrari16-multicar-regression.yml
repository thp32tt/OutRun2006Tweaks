name: Ferrari16 All-Car Sidecar Regression
on:
  push:
    branches: [vr-ferrari16-v003-multicar-debug-20261122, fix/ferrari16-stereo-loader-guard-20261122, fix/ferrari16-pbr-stereo-20261123, automation/ferrari16-external-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test 16 canonical / 30 retail selection and all previous sidecar contracts
        shell: bash
        run: |
          set -euo pipefail
          for t in ferrari16_multicar_runtime_test ferrari14_lift_pose_contract_test external_car_draw_order_test external_car_ground_test external_car_gate_test external_car_dashboard_test external_car_sidecar_v4_test external_car_dds_upload_test external_car_mesh_upload_test game_reset_events_test external_car_selection_test external_car_legacy_fallback_test external_car_trace_budget_test external_car_runtime_policy_test ferrari14_trace_50_test external_car_stereo_receipt_test external_car_atomic_precommit_test external_car_isolated_transaction_test external_car_native_stock_replay_test depth_clear_replay_stamp_test stereo_lower_draw_result_test external_car_original_wrapper_contract_test external_car_eye_transform_proof_test external_car_stereo_failure_diagnostics_test external_car_stereo_retry_test external_vehicle_semantic_isolation_test external_car_pbr_eye_math_test external_car_pbr_normal_math_test external_car_normal_repair_test external_car_mesh_batch_test r84_fixed_sprite_preflight_test; do
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic "tests/${t}.cpp" -o "/tmp/${t}"
            "/tmp/${t}"
          done
      - name: Run read-only OVC header, CRC, asset-layout and corruption smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ferrari16/verify_original_player_callback_abi.py --self-test
          python3 tests/r29_raw_depth_receipt_test.py
          python3 tests/r30_shadow_descriptor_cache_test.py
          python3 tests/r7_disjoint_offscreen_raster_test.py
          python3 tests/r7_depth_bootstrap_restore_test.py
          python3 tests/r7_stereo_init_preflight_test.py
          python3 tests/r7_external_vehicle_stage_transport_test.py
          python3 tests/ferrari16_pbr_material_gate_test.py
          python3 tests/ferrari16_pbr_derivative_gate_test.py
          python3 tests/ferrari16_overlay_status_test.py
          python3 tests/ferrari16_launcher_isolation_test.py
          python3 tools/ferrari16/v003_parity_gate.py --self-test
          python3 tests/ferrari16_exact_variant_quality_gate_test.py
          python3 tools/ferrari16/verify_all_car_ovc.py --self-test
          python3 tests/external_ao_bake_test.py
      - name: Assert exact sixteen-car routing and per-car diagnostics in production source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('src/hooks_graphics.cpp').read_text()
          gpu=Path('src/vr/game/dino_external_d3d9.hpp').read_text()
          selection=Path('src/vr/game/external_car_selection.hpp').read_text()
          r7=Path('src/vr/d3d9/stereo_renderer_r7.inc').read_text()
          upload=gpu[gpu.index('static bool UploadDDS('):gpu.index('std::uint64_t ReleaseGpu()')]
          assert upload.index('if(!CopyAndUnlockDdsMip(') < upload.index('D3DPOOL_DEFAULT,out')
          assert 'return SUCCEEDED(staging->UnlockRect(mip));' in upload
          assert 'staging->Release();return false;' in upload[upload.index('if(!CopyAndUnlockDdsMip('):upload.index('D3DPOOL_DEFAULT,out')]
          mesh=gpu[gpu.index('const UINT vertexBytes='):gpu.index('const DashboardBinding* DashboardFor(')]
          assert '|| !next.vb || !current() ||' in mesh and '|| !next.ib || !current()' in mesh
          assert mesh.count('if(!UploadExternalMeshBuffer(')==2
          assert mesh.index('return SUCCEEDED(next.vb->Unlock());') < mesh.index('return reject("VERTEX_BUFFER_UPLOAD_FAILED");') < mesh.index('return SUCCEEDED(next.ib->Unlock());') < mesh.index('return reject("INDEX_BUFFER_UPLOAD_FAILED");') < mesh.index('meshes_.push_back(next);') < mesh.index('++nextMesh_;')
          assert mesh.count('next.vb->Release();next.ib->Release();')==2
          assert mesh.count('},current))')==2
          assert 'UploadDDS(dev,cpu_.textures[material],&pending,current)' in gpu
          assert 'UploadDDS(dev,src,&pending,current)' in gpu
          assert gpu.count('PublishExternalGpuResource(pending,current,')==2
          assert 'retiredMeshes.swap(meshes_)' in gpu
          assert 'retiredTextures.swap(textures_)' in gpu
          between=source[source.index('static F50ExternalDrawTicket PrepareF50External('):source.index('static bool DrawPreparedF50External(')]
          # Real source-order regression: no OVC IO/selector/device reads if
          # the atomic two-eye owner has not been implemented and admitted.
          assert 'MayPrepareExternalCarAssets(' in between
          guard=between.index('MayPrepareExternalCarAssets(')
          assert 'NativeVehicleReplacementBackendReady()' in between[guard:guard+200]
          for costly in ('GetLatchedStereoFrameView()', 'Game::D3DDevice()',
                         'GlobalGpu()', 'SelectSidecar(', 'SafeFloorLift('):
              assert guard < between.index(costly), costly
          assert 'ticket.slot=extraCar ?' in between
          assert 'FerrariModelSlot::GenericId :' in between
          assert 'const float requestedLift=!extraCar ?' in between
          assert 'FerrariModelSlot::Gto288 :' not in between
          assert 'FerrariModelSlot::F40 :' not in between
          assert 'CanonicalFerrariExternalCarId(observedId)' in selection
          assert 'LegacyFerrariCarSuffix(canonicalId)' in gpu
          assert 'GetFileAttributesW(candidate)' in gpu
          assert 'LegacyFallbackForMissingCanonical(' in gpu
          assert 'GetLastError()' in gpu
          assert 'CanonicalFerrariExternalCarId(carId):carId;' in gpu
          floor=gpu[gpu.index('bool SafeFloorLift('):gpu.index('bool EnsureResources(')]
          assert 'EnsureLoaded()' in floor and 'Installed()' not in floor
          assert 'rejectedByCar[id]++' in source
          assert 'gateRejectByCar[id]++' in source
          assert 'traceBudget.ShouldLog(' in source
          assert 'traceBudget.attempts' in source
          assert 'terminalMilestone' in source
          assert 'MaterialModeName()' in source
          assert 'transformSamplesByCar[id]++' in source
          # Gear coverage must reach BOTH receipt count and real mesh draw,
          # only after the body is certified complete, never stock fallback.
          assert gpu.count('DashboardOverlayMeshVisible(binding,dashboard,embeddedNeedleMask,embeddedGearMask)') == 2
          assert 'DashboardGearMask(cpu_.dashboardBindings.data(),' in gpu
          overlay=source[source.index('if(route==OutRunVR::DinoSidecar::OriginalCarRoute::ExternalComplete &&'):source.index('if(Settings::VRTelemetry || Settings::VRExternalFerrariDiag)')]
          assert 'GlobalGpu().EmbeddedGearMask()' in overlay
          assert 'GlobalGpu().HasEmbeddedSpeedAndRpm()' in overlay
          # EXT16-008: Full 49F3E0 wrapper includes an additional 49A650
          # CALL after 46BD30. It must NEVER be skipped by a sidecar.
          player_wrapper=source[source.index('static void CallOriginalPlayerWithGlassScope('):source.index('static void __cdecl OnPlayerCallback(')]
          assert 'PlayerCallbackHook.ccall<void>(player);' in player_wrapper
          assert 'PrepareF50External(player)' not in player_wrapper
          assert 'DrawPreparedF50External(f50)' not in player_wrapper
          assert 'return;' not in player_wrapper
          assert player_wrapper.count('PlayerCallbackHook.ccall<void>(player);') == 1
          model=source[source.index('static void __cdecl OnNativeRaceModel('):source.index('static bool InstallNativeModelEdges(')]
          assert 'PrepareF50External(player)' in model and 'BeginNativeVehicleReplacement(' in model
          assert 'ScopedNativeVehicleStockReplay stock(replay);' in model
          assert model.index('ScopedNativeVehicleStockReplay stock(replay);') < model.index('original(player,model,variant); // native geometry') < model.index('FinishNativeVehicleReplacement(')
          assert 'NativeVehicleQueueEntryOwned(entry,false)' in source
          assert 'NativeVehicleQueueEntryOwned(entry,true)' in source
          assert 'replay->OwnsObject(entry[14])' in source
          assert 'Module::exe_ptr(0x5BE4)' in source
          assert 'TraceNativeVehicleSortedAlpha,Memory::HookType::Call' in source
          assert 'R7NativeCompletedVehicle.Same(key)' in r7
          assert 'R7RecordNativeStockOmission(eye,result)' in r7
          safe=Path('src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp').read_text()
          assert safe.count('return R30SafeCandidateRaw(device,') == 17
          assert 'return R7ExecuteRawCandidateVb(device,draw,up,indexedUp);' in safe
          assert 'NativeVehiclePmtConsumerReady.store(true,' in source
          glass_scope=source[source.index('struct PlayerCallback {'):source.index('static bool HasDeferredOwner(')]
          assert 'PlayerOwnerScope owner{CurrentPlayerOwner};' in glass_scope
          assert 'owner.Admit(epoch);' in glass_scope
          assert 'if(!admitted||!owner.CanCapture(epoch))return;' in glass_scope
          assert 'PlayerOwnerScope::Immediate(CurrentPlayerOwner,epoch)' in source
          material=source[source.index('static void OnMaterialBefore('):source.index('static void OnMaterialAfter(')]
          assert 'const bool owner=immediateOwner ||\n        (PlayerOwnerScope::MayLookupDeferred(CurrentPlayerOwner,epoch) &&\n         HasDeferredOwner(ctx,epoch));' in material
          assert material.index('MayLookupDeferred(CurrentPlayerOwner,epoch)') < material.index('HasDeferredOwner(ctx,epoch)') < material.index('if(!owner)return;')
          capture=source[source.index('static void CaptureAfter('):source.index('struct PlayerCallback {')]
          assert capture.index('SameDeferredQueueAppend(') < capture.index('for(int i=before.before.count;i<count;++i)') < capture.index('RememberDeferredOwner(')
          assert 'TooMany=true;TokenCount=0;return;' in capture[capture.index('SameDeferredQueueAppend('):capture.index('const int count=current.count;')]
          assert 'PlayerDepth' not in source
          abi=Path('src/vr/game/external_car_original_wrapper_contract.hpp').read_text()
          assert 'MaySkipRetailPlayerWrapper() noexcept {return false;}' in abi
          assert 'RetailPlayerFollowupCallVa=0x0049A650u' in abi
          assert 'MatchReadableRetailPlayerWrapper(' in source
          install=source[source.index('constexpr int followupRva='):source.index('auto first=safetyhook::create_mid(',source.index('constexpr int followupRva='))]
          assert 'playerCode,followupCode' in install
