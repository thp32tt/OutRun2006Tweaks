name: R57 targeted deep reverse

on:
  workflow_dispatch:
  pull_request:
    branches:
      - vr-d3d9ex-focus
    paths:
      - 'tools/reverse/r57_deep_disasm.py'
      - '.github/workflows/vr-r57-deep-reverse.yml'
  push:
    branches:
      - 'vr-d3d9ex-candidate/R57-ORTHOGONAL-ROOTCAUSE-20260926'
    paths:
      - 'tools/reverse/r57_deep_disasm.py'
      - '.github/workflows/vr-r57-deep-reverse.yml'

permissions:
  contents: read

jobs:
  disasm:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install disassembler
        shell: pwsh
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Download canonical replacement EXE
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE' -OutFile OR2006C2C.EXE
      - name: Verify canonical identity
        shell: pwsh
        run: |
          $hash=(Get-FileHash OR2006C2C.EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '68ceb386829066f8455b9d027320af962584321f3e2e8a79c72841495a6134c3'){ throw "Unexpected EXE $hash" }
      - name: Targeted deep disassembly
        shell: pwsh
        run: python tools/reverse/r57_deep_disasm.py --exe OR2006C2C.EXE --out analysis/R57_TARGETED_DISASM.md
      - name: Derive Calc3D2D inverse-projection facts
        shell: pwsh
        run: python tools/reverse/r57_projection_formula.py --exe OR2006C2C.EXE --out analysis/R57_PROJECTION_FORMULA.md
      - name: Map projected-marker pipeline xrefs
        shell: pwsh
        run: python tools/reverse/r57_pipeline_xrefs.py --exe OR2006C2C.EXE --out analysis/R57_PIPELINE_XREFS.md
      - uses: actions/upload-artifact@v4
        with:
          name: R57-targeted-disasm-${{ github.sha }}
          path: |
            analysis/R57_TARGETED_DISASM.md
            analysis/R57_PROJECTION_FORMULA.md
            analysis/R57_PIPELINE_XREFS.md
          if-no-files-found: error
