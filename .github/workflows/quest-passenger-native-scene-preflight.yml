name: Quest passenger native scene preflight (read only)
on:
  push:
    paths:
      - 'tools/probe_original_passenger_scene.py'
      - '.github/workflows/quest-passenger-native-scene-preflight.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Inspect exact original PC event renderer and static scene masks
        run: |
          curl -fLSs --retry 3 --retry-delay 2 \
            'https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE' \
            -o /tmp/OR2006C2C.EXE
          python3 tools/probe_original_passenger_scene.py /tmp/OR2006C2C.EXE
          rm -f /tmp/OR2006C2C.EXE
