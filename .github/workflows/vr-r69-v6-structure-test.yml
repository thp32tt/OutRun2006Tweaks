name: R69 V6 Structure Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - vr-d3d9ex-candidate/r69-perf-exp-all-v6
    paths:
      - 'src/vr/**'
      - 'tools/verify_vr_proven_baseline.py'
      - 'docs/VR_R69_V6_INHERITANCE_AUDIT.md'
      - '.github/workflows/vr-r69-v6-structure-test.yml'

permissions:
  contents: read

concurrency:
  group: vr-r69-v6-structure-test
  cancel-in-progress: true

jobs:
  validate-build-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92ce3403c6e68fe5c945b88440e5fa7d5d23cd4d
          submodules: recursive
          fetch-depth: 1

      - name: Validate production baseline and architecture
        shell: pwsh
        run: |
          python tools/verify_vr_proven_baseline.py
          if($LASTEXITCODE -ne 0){ throw "proven baseline verification failed" }
          python tools/verify_vr_architecture.py
          if($LASTEXITCODE -ne 0){ throw "architecture verification failed" }
          python tools/verify_vr_r32_review.py
          if($LASTEXITCODE -ne 0){ throw "R32 review verification failed" }

      - name: Configure and build Win32 game
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_R26_HUD_COMPARE=ON -DOUTRUN_VR_C1_COMPARE=OFF -DOUTRUN_VR_C2_COMPARE=OFF
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ''
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
          cmake --build build-game --config Release --target outrun2006tweaks

      - name: Build x64 host and smoke tests
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host outrun-vr-shader-smoke outrun-vr-runtime-eligibility-smoke outrun-vr-r23-verified-bundle-smoke outrun-vr-r32-policy-smoke outrun-vr-direct-ack-identity-smoke outrun-vr-protocol-v3-smoke outrun-vr-core-math-smoke outrun-vr-host-state-v3-channel-smoke outrun-vr-v2-v3-shadow-conversion-smoke outrun-vr-host-pose-v3-validation-smoke

      - name: Run deterministic no-HMD smoke tests
        shell: pwsh
        run: |
          $tests=@(
            'outrun-vr-shader-smoke.exe',
            'outrun-vr-runtime-eligibility-smoke.exe',
            'outrun-vr-r23-verified-bundle-smoke.exe',
            'outrun-vr-r32-policy-smoke.exe',
            'outrun-vr-direct-ack-identity-smoke.exe',
            'outrun-vr-protocol-v3-smoke.exe',
            'outrun-vr-core-math-smoke.exe',
            'outrun-vr-host-state-v3-channel-smoke.exe',
            'outrun-vr-v2-v3-shadow-conversion-smoke.exe',
            'outrun-vr-host-pose-v3-validation-smoke.exe'
          )
          foreach($test in $tests){
            $testPath=Join-Path 'build-host/bin' $test
            if(-not (Test-Path $testPath)){ throw "host smoke missing: $test" }
            & $testPath
            if($LASTEXITCODE -ne 0){ throw "host smoke failed ($LASTEXITCODE): $test" }
          }

      - name: Assemble V6 structure-audit HMD test build
        shell: pwsh
        run: |
          $dir='OutRun2_VR_R69_V6_STRUCTURE_TEST'
          $backend=Join-Path $dir 'backends/d3d9'
          New-Item -ItemType Directory -Force $backend | Out-Null

          $dll=Get-ChildItem build-game -Recurse -Filter dinput8.dll |
            Where-Object { $_.FullName -match '\\bin\\' } |
            Select-Object -First 1
          if(-not $dll){ throw 'dinput8.dll missing' }
          if(!(Test-Path build-host/bin/outrun-vr-host.exe)){ throw 'outrun-vr-host.exe missing' }

          Copy-Item $dll.FullName (Join-Path $backend 'dinput8.dll')
          Copy-Item build-host/bin/outrun-vr-host.exe (Join-Path $backend 'outrun-vr-host.exe')
          Set-Content (Join-Path $backend 'SOURCE_SHA.txt') '92ce3403c6e68fe5c945b88440e5fa7d5d23cd4d' -Encoding ascii

          foreach($file in @('OutRun2006Tweaks.ini','OutRun2006Tweaks.lods.ini')){
            if(Test-Path $file){ Copy-Item $file (Join-Path $dir $file) }
          }
          foreach($file in @(
            'OutRunVR-TestProfiles.ps1','OutRunVR-BackendContract.ps1',
            'Select-OutRunVRBackend.ps1','Run-OutRunVRTest.ps1',
            'Collect-OutRunVRLogs.ps1','Analyze-OutRunVRSession.ps1',
            'START_HERE_VR_TEST.cmd'
          )){
            $src=Join-Path 'tools' $file
            if(Test-Path $src){ Copy-Item $src (Join-Path $dir $file) }
          }

          @(
            'CANDIDATE=EXP_ALL_V6_STRUCTURE'
            'SOURCE_REF=92ce3403c6e68fe5c945b88440e5fa7d5d23cd4d'
            'GAME_RENDERER=D3D9Ex R26/R23 + R30 HUD'
            'OPENXR_HOST=D3D11 R32 DirectGPU + SafeEye fallback'
            'VISUAL_POLICY=V5 equivalent'
            'STATUS=TEST_ONLY_NOT_FOR_INTEGRATION'
            ''
            'CHECK: normal startup, menu/HUD, car selection, lens flare, start-grid shadow, heavy route FPS'
          ) | Set-Content (Join-Path $dir 'V6_TEST_NOTES.txt') -Encoding UTF8

          Get-ChildItem $dir -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              "$($_.Hash)  $($_.Path.Substring((Resolve-Path $dir).Path.Length + 1))"
            } | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii

          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath 'OutRun2_VR_R69_V6_STRUCTURE_TEST.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-R69-V6-STRUCTURE-TEST
          path: OutRun2_VR_R69_V6_STRUCTURE_TEST.zip
          if-no-files-found: error
