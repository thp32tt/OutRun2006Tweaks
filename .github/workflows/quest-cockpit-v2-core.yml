name: QuestCockpitV2 Isolated Core Smoke

on:
  push:
    branches: [ vr-quest-cockpit-v2, 'vr-quest-cockpit-v2-*' ]
    paths:
      - '.github/workflows/quest-cockpit-v2-core.yml'
      - 'src/vr/d3d9/stereo_renderer_r7.inc'
      - 'src/vr/game/outrun_renderer.cpp'
      - 'src/vr/game/quest_cockpit_v2_apk_xr_pose.hpp'
      - 'QuestCockpit-CopyRun.ps1'
      - 'RUN-QUEST-COCKPIT-V2.cmd'
      - 'RUN-QUEST-COCKPIT-V2-F0.cmd'
      - 'RUN-QUEST-COCKPIT-V2-LOD0.cmd'
      - 'RUN-QUEST-COCKPIT-V2-SKY-DIAG.cmd'
      - 'RUN-QUEST-COCKPIT-V2-TURN-DIAG.cmd'
      - 'RUN-QUEST-COCKPIT-V2-INTERP-OFF.cmd'
      - 'tools/verify_quest_cockpit_launchers.py'
      - 'src/vr/d3d9/direct_gpu_hold_policy.hpp'
      - 'tools/tests/direct_gpu_hold_smoke.cpp'
      - 'src/vr/game/quest_cockpit_v2_runtime.hpp'
      - 'src/vr/game/quest_cockpit_v2_native_frame.hpp'
      - 'src/vr/game/quest_cockpit_v2_glass_hook.hpp'
      - 'tools/tests/quest_cockpit_v2_glass_hook_smoke.cpp'
      - 'src/vr/game/quest_cockpit_v2_seat.hpp'
      - 'tools/tests/quest_cockpit_v2_seat_smoke.cpp'
      - 'src/vr/game/quest_cockpit_v2_occupant.hpp'
      - 'src/vr/game/quest_cockpit_v2_visibility.hpp'
      - 'tools/tests/quest_cockpit_v2_occupant_smoke.cpp'
      - 'tools/tests/quest_cockpit_v2_arm64_reference_parity.cpp'
      - 'tools/Run-OutRunVRTest.ps1'
      - 'src/vr/d3d9/ex_device_upgrade.cpp'
      - 'Run-QuestCockpitV2-CrashDiag.ps1'
      - 'RUN-QUEST-COCKPIT-V2-DIAG.cmd'
      - 'tools/tests/quest_cockpit_v2_native_frame_smoke.cpp'
      - 'tools/tests/quest_cockpit_v2_runtime_smoke.cpp'
      - 'tools/quest_cockpit_glass.py'
      - 'tools/tests/test_quest_cockpit_glass.py'
      - 'QuestCockpitV2-GlassControl.ps1'
      - 'RUN-QUEST-COCKPIT-V2-GLASS.cmd'
      - 'src/hooks_graphics.cpp'
      - 'src/vr/game/quest_cockpit_v2_turn_yaw.hpp'
      - 'tools/tests/quest_cockpit_v2_turn_yaw_smoke.cpp'
      - 'src/vr/settings.cpp'
      - 'OutRun2006Tweaks.ini'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp17-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build QuestCockpitV2 frame and matrix regression tests
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tools/tests/quest_cockpit_v2_runtime_smoke.cpp \
            -o /tmp/quest-cockpit-v2-runtime
          /tmp/quest-cockpit-v2-runtime
      - name: DirectGPU deferred-frame must not overwrite safe stereo with mono
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tools/tests/direct_gpu_hold_smoke.cpp -o /tmp/direct-gpu-hold
          /tmp/direct-gpu-hold
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/vr/d3d9/stereo_renderer_r7.inc').read_text(encoding='utf-8')
          assert 'if(OutRunVR::DirectGpuHold::PublishPrePresentMono(' in source
          assert 'stereoRequested,directTransport,directOnlyHold))' in source
          assert 'if(stereoRequested&&!directTransport)' not in source
          # Prior Windows builds were blocked by missing documented FFB
          # provenance, not by C++ code. Keep these legacy verifications,
          # never delete or bypass the original wheel-FFB check.
          for rel, marker in (
              ('docs/reverse/LINDBERGH_FFB_MAP.md','0x08105A48'),
              ('docs/reverse/C2C_STAGE_FFB_MAP.md','surface'),
              ('docs/reverse/FFB_MODEL_MODES.md','FFB')):
              document = Path(rel)
              assert document.is_file() and marker in document.read_text(encoding='utf-8'), rel
          PY
      - name: Native original frame-render correlation state regression
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tools/tests/quest_cockpit_v2_native_frame_smoke.cpp \
            -o /tmp/quest-cockpit-v2-native
          /tmp/quest-cockpit-v2-native
      - name: Original Quest/PC mode1 yaw-source angle-wrap regression
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tools/tests/quest_cockpit_v2_turn_yaw_smoke.cpp \
            -o /tmp/quest-v2-yaw
          /tmp/quest-v2-yaw
      - name: Original 30-record model-1 seat anchors and frame trial
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tools/tests/quest_cockpit_v2_seat_smoke.cpp \
            -o /tmp/quest-v2-seat
          /tmp/quest-v2-seat
      - name: Compare 1500 noncommuting affine matrices against original ARM64-FMADD research transcription
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tools/tests/quest_cockpit_v2_arm64_reference_parity.cpp \
            -o /tmp/quest-v2-arm64-parity
          /tmp/quest-v2-arm64-parity
      - name: Quest original exact player robot model W x C and scoped restore
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tools/tests/quest_cockpit_v2_occupant_smoke.cpp \
            -o /tmp/quest-v2-occupant
          /tmp/quest-v2-occupant
      - name: Build live glass hook opacity and strict ownership tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic             tools/tests/quest_cockpit_v2_glass_hook_smoke.cpp             -o /tmp/quest-cockpit-glass
          /tmp/quest-cockpit-glass
      - name: Reversible glass tint brightness ON/OFF synthetic tests
        run: python3 -m unittest discover -s tools/tests -p test_quest_cockpit_glass.py -v
      - name: Verify all F0-stable cockpit launchers
        run: python3 tools/verify_quest_cockpit_launchers.py
      - name: Reject removed legacy hooks and unsafe defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          hook=Path('src/hooks_graphics.cpp').read_text(encoding='utf-8')
          settings=Path('src/vr/settings.cpp').read_text(encoding='utf-8')
          ini=Path('OutRun2006Tweaks.ini').read_text(encoding='utf-8')
          for forbidden in ['VRDriverSeatRenderTest','VRDriverSeatVehicleScaleRenderHook',
                            'VRDriverSeatGlassMaterialProbe','VRDriverSeatCameraPose',
                            'ApplyDriverSeatCameraOffset','DriverSeatCameraActive']:
              assert forbidden not in hook, forbidden
          assert 'QuestCockpitV2PlayerCandidateProbe' in hook
          assert 'VR CAMERA YAW PROBE:' in hook
          assert 'player->field_1FE' in hook
          assert 'player->field_2C[1]' in hook
          assert 'QuestCockpitV2NativeFrameProbe' in hook
          assert 'MatchOriginalRva(FrameEnterRva,begin)' in hook
          assert 'ComputeBodyCorrection(b0,f0,correction)' in hook
          assert 'DriverSeatView =' not in ini
          assert 'VRDriverSeatView' not in settings
          launcher=Path('tools/Run-OutRunVRTest.ps1').read_text(encoding='utf-8')
          diag=Path('Run-QuestCockpitV2-CrashDiag.ps1').read_text(encoding='utf-8')
          assert "$env:OUTRUN_VR_LAUNCH='1'" in launcher
          assert "'-VR.Enabled=true','-VR.AutoLaunchHost=true'" in launcher
          device=Path('src/vr/d3d9/ex_device_upgrade.cpp').read_text(encoding='utf-8')
          assert "COCKPIT DEVICE DIAG: phase=CREATE_EX_BEFORE" in device
          assert "COCKPIT DEVICE DIAG: phase=CREATE_EX_AFTER" in device
          assert "OUTRUN_VR_COCKPIT_DEVICE_DIAG" in device
          assert "QuestCockpitV2DeviceMode" in launcher
          assert "effectiveVrArguments[$matches[1]] = $matches[2]" in launcher
          assert r"(?:VR\.)?" in launcher
          assert "QuestCockpitV2ReleaseParity" in launcher
          for script in ('RUN-QUEST-COCKPIT-V2.cmd',
                         'RUN-QUEST-COCKPIT-V2-F0.cmd',
                         'RUN-QUEST-COCKPIT-V2-LOD0.cmd',
                          'RUN-QUEST-COCKPIT-V2-SKY-DIAG.cmd',
                          'RUN-QUEST-COCKPIT-V2-TURN-DIAG.cmd',
                          'RUN-QUEST-COCKPIT-V2-INTERP-OFF.cmd'):
              launcher_script=Path(script).read_text(encoding='utf-8')
              assert '-QuestCockpitV2ReleaseParity ON' in launcher_script, script
          assert "'-VR.DirectGpuOnly=true'" in launcher
          assert "'-Graphics.ReflectionUpdateRate=0.25'" in launcher
          assert "VR_RELEASE_VERSION.txt" in launcher
          assert "Windows Error Reporting" in diag
          assert "DumpType" in diag and "finally" in diag
          assert 'CockpitFrameProbe = false' in ini
          assert 'QuestCockpitV2Enabled = false' in ini
          assert 'QuestCockpitV2HideDriver = true' in ini
          assert 'QuestCockpitV2PassengerVisible = true' in ini
          assert 'QuestCockpitV2GlassHidden = false' in ini
          assert 'QuestCockpitV2GlassReflectionOff = true' in ini
          assert 'QuestCockpitV2NativeSeatProfile = true' in ini
          r7=Path('src/vr/d3d9/stereo_renderer_r7.inc').read_text(encoding='utf-8')
          assert 'VR SKY PROBE:' in r7
          r9=Path('src/vr/d3d9/stereo_renderer.cpp').read_text(encoding='utf-8')
          assert 'MaybeLogCockpitSkyProbe(stereoRequested, composedStereo,' in r9
          assert 'ProbeCockpitCarMotion(player);' in hook
          assert 'VR CAR MOTION PROBE:' in hook
          assert "QuestCockpitV2Interpolation -eq 'OFF'" in launcher
          assert "'-FramerateInterpolation=false'" in launcher
          assert 'MaybeLogCockpitSkyProbe(stereoRequested,composedStereo,' in r7
          assert 'VRQuestCockpitV2SkyProbe' in settings
          assert "if($QuestCockpitV2SkyProbe -eq 'ON')" in launcher
          # HMD regression 2026-11-04: Quest profile XYZ must be consumed as
          # the original mode-1 camera input. A post-CalcCameraMatrix delta
          # sinks the eye toward the floor and amplifies view jitter.
          assert 'NativeVrProfilePose(' not in hook
          assert 'NativeVrProfileInputAnchor(' in hook
          assert 'OriginalModeOneTableInitialized(' in hook
          assert '0x1BA4E0' in hook
          # Original camera runs before native frame_enter. Assert the
          # changed source's real two call sites and live eye gate, rather
          # than requiring the removed no-argument helper spelling.
          assert 'SyncNativeSeatProfile(true)' in hook
          assert 'original 30-car table' in hook
          copy_launcher=Path('QuestCockpit-CopyRun.ps1').read_text(encoding='utf-8')
          assert "QuestCockpitV2F0='ON'" in copy_launcher
          assert "'NORMAL','SKY','INTERP','TURN'" in copy_launcher
          assert "if($Mode -eq 'TURN')" in copy_launcher
          assert "$launchArgs.QuestCockpitV2Interpolation='ON'" in copy_launcher
          assert "$launchArgs.QuestCockpitV2SkyProbe='ON'" in copy_launcher
          assert "'-VR.QuestCockpitV2SeatBack=-0.08'" in launcher
          assert "'-VR.QuestCockpitV2SeatDown=-0.05'" in launcher
          assert 'SyncNativeSeatProfile(false)' in hook
          assert 'NativeSeatCameraTick.AfterSeatSync(' in hook
          native_renderer=Path('src/vr/game/outrun_renderer.cpp').read_text(encoding='utf-8')
          assert 'NativeSeatCameraTick.Ready()' in native_renderer
          assert 'NativeQuestEyeEligible(' in native_renderer
          native_eye_getter=native_renderer.split('bool GetQuestNativeEyeInverse(',1)[1].split('bool GetLatchedHeadInverse(',1)[0]
          assert 'NativeSeatCameraTick.Ready()' in native_eye_getter
          assert 'OriginalQuestGameCameraState(' in native_eye_getter
          assert 'SeatTablePatched=true;' in hook
          assert 'OriginalQuestVrProfileAnchor(' in hook
          assert 'QuestCockpitV2SeatBack = 0.0' in ini
          assert 'QuestCockpitV2SeatDown = 0.0' in ini
          assert 'QuestCockpitV2ApkNativeCamera = true' in ini
          assert 'OriginalQuestModeOneInput(' in hook
          assert 'OriginalQuestGameCameraState(' in hook
          assert 'OriginalQuestGameCameraState(' in native_renderer
          assert 'OriginalQuestGameCameraState(0x10u)' in Path('tools/tests/quest_cockpit_v2_seat_smoke.cpp').read_text(encoding='utf-8')
          assert 'OriginalQuestPadSnapshotCameraInputValid' in Path('src/vr/game/quest_cockpit_v2_seat.hpp').read_text(encoding='utf-8')
          assert 'OriginalQuestDefaultVirtualWheelRadius' in Path('tools/tests/quest_cockpit_v2_seat_smoke.cpp').read_text(encoding='utf-8')
          assert 'guestProfile.y+0.319999993f' in Path('src/vr/game/quest_cockpit_v2_seat.hpp').read_text(encoding='utf-8')
          assert 'if(rotationOnly) {' in r7 and 'nativeView._41=0.f;' in r7
          assert 'shaderSkyMixedEyes={}' in r7
          assert 'ProgrammableSkyViewModeSwitches-windowSwitches' in r7
          native_pose=Path('src/vr/game/quest_cockpit_v2_apk_xr_pose.hpp').read_text(encoding='utf-8')
          assert 'NativeYawOrigin(' in native_pose
          assert 'NativeInverseOriginCompose(' in native_renderer
          assert 'NativeStereoEye(' in native_renderer
          assert 'The PC OpenXR' in native_renderer
          assert 'LatchedStereo.effectiveEyeOrientation[eye][0]=q.x' not in native_renderer
          assert 'frame.eye[eye].orientation,stereo->effectiveEyeOrientation' in r7
          assert 'GetQuestNativeEyeInversePair(' in native_renderer
          assert 'GetQuestNativeEyeInversePair(' in r7
          # Quest XrRig::locate commits two eyes as one frame. The R7 consumer
          # must also freeze native-vs-fallback once per Present so the two
          # original sky layers cannot change eye basis mid-frame.
          assert 'struct QuestNativePairPresentLatch' in r7
          assert 'GetQuestNativeEyePairForPresent(' in r7
          assert 'QuestNativePairLatch.presentEpoch!=PresentEpoch' in r7
          assert 'const auto* fixedNativeEyePair=' in r7
          assert 'const auto* programmableNativeEyePair=' in r7
          assert 'GetQuestNativeEyePairForPresent(stereo.poseSequence)' in r7
          assert 'return &QuestNativePairLatch.matrices;' in r7
          assert '(*fixedNativeEyePair)[eye]' in r7
          assert '(*programmableNativeEyePair)[eye]' in r7
          assert 'GetQuestHeadInverseForPresent(' in r7
          assert 'QuestNativePairLatch.headResolved' in r7
          assert 'return &QuestNativePairLatch.headInverse;' in r7
          assert 'std::memcpy(&QuestNativePairLatch.headInverse,headBytes' in r7
          assert 'reinterpret_cast<const D3DMATRIX*>(headBytes)' not in r7
          assert 'if(!fixedNativeEyePair)' in r7
          assert 'InverseRigid(*programmableHeadInverse),nativeFullView' in r7
          assert 'stereo.eyeOrientation[eye],skyEyeOffset' in r7
          assert 'programmableNativeEyePair' in r7 and 'fixedNativeEyePair' in r7
          assert 'OriginalQuestModeOneInput(' in Path('src/vr/game/quest_cockpit_v2_seat.hpp').read_text(encoding='utf-8')
          assert "'-VR.QuestCockpitV2ApkNativeCamera=true'" in launcher
          assert "'-VR.QuestCockpitV2NativeSeatProfile=true'" in launcher
          assert "'-VR.QuestCockpitV2SeatBack=0.0'" not in launcher
          assert "'-VR.QuestCockpitV2SeatDown=0.0'" not in launcher
          assert 'Range<float>{-1.2f,1.2f}' in settings
          assert 'Range<float>{-1.0f,0.8f}' in settings
          assert 'RemoveGlassReflectionFlags(' in hook
          assert 'RemoveGlassReflectionLayer(' in hook
          assert 'OriginalPassengerForceVisible' in hook
          assert 'ScopedOriginalOccupantLod0 passengerVisible(passengerLod0);' in hook
          assert 'const bool passengerLod0=' in hook
          assert 'if(action==CockpitOccupantRender::OriginalPassengerForceVisible){' not in hook
          assert 'NativeSeatOffset(' in hook
          assert 'QuestCockpitV2RawB0Camera = false' in ini
          assert 'QuestCockpitV2OccupantCorrection = false' in ini
          assert 'QuestCockpitV2OccupantLod0 = false' in ini
          assert 'QuestCockpitV2OccupantLod0' in settings
          assert 'ScopedOriginalOccupantLod0 lod0(' in hook
          assert 'OriginalOccupantLod0Active()' in hook
          assert 'kLodReadOriginal' in hook
          assert 'static_cast<std::uintptr_t>(ctx.esp)+0x1Cu' in hook
          assert 'ctx.eax=1u' in hook
          assert 'QuestCockpitV2F0RenderScope = false' in ini
          assert 'ScopedOriginalPlayerF0 scope(' in hook
          assert 'PlayerCallbackHook.ccall<void>(player)' in hook
          assert 'auto actor=safetyhook::create_inline(' in hook
          assert 'RobotRva=0x114E60' in hook
          assert 'Game::event(EVENT_ROB02)' in hook
          assert 'ResolveOriginalCockpitWork(' in hook
          assert 'slot!=OriginalOccupantSlot::None' in hook
          assert 'OriginalRobotDrawSignature()' in hook
          assert 'ComposeOccupantModel(work,own->occupantCorrection,corrected)' in hook
          assert 'if(OriginalRobotCorrectionActive())' in hook
          assert 'ScopedOriginalRobotCorrectionOwner correctionOwner(true)' in hook
          assert 'ScopedPreF0Snapshot preF0Owner(originalMatrices,true)' in hook
          assert 'MatchOriginalPreF0(' in hook
          assert 'sample.matrixF0=preF0->matrixF0' in hook
          assert 'else if(ActivePreF0Snapshot)' in hook
          assert 'ScopedOriginalPlayerF0 scope(' in hook
          assert 'RawB0Camera is retired' in hook
          assert 'NativeSeatOffset(' in hook
          assert 'QuestCockpitV2CameraPose(camera,pose)' in hook
          # Native per-model camera table belongs to the original PC game;
          # the old raw-B0 double transform must never be reintroduced.
          assert 'OriginalModeOneAnchor(table,kTableSize,model,anchor)' not in hook
          assert 'RawB0Camera is retired' in hook
          assert 'Settings::VRQuestCockpitV2SeatBack.get()' in hook
          assert 'Settings::VRQuestCockpitV2SeatDown.get()' in hook
          print('QuestCockpitV2 isolated-core contract PASS')
          PY
