name: Localization Real Image Edit Binding
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths:
      - 'tools/localization/imagegen_source_edit_bridge.py'
      - 'tools/localization/test_imagegen_source_edit_bridge.py'
      - 'tools/localization/imagegen_b_pipeline.py'
      - 'localization/graphics/role_B/imagegen_requests/q092_B_OPENAI_EDIT_SOURCE_REQUEST.json'
      - 'localization/graphics/role_B/imagegen_requests/q048_B_OPENAI_EDIT_SOURCE_REQUEST.json'
      - 'localization/graphics/role_C1/imagegen_requests/q102_C1_OPENAI_EDIT_SOURCE_REQUEST.json'
      - 'localization/graphics/role_C1/imagegen_requests/q102_LINE2_C1_OPENAI_EDIT_SOURCE_REQUEST.json'
      - '.github/workflows/localization-real-image-edit-binding.yml'
  workflow_dispatch:
    inputs:
      pilot:
        type: choice
        description: SHA-pinned B/C1 English lettering PNG multipart-image pilot
        required: true
        options:
          - C1_q102
          - C1_q102_line2
          - B_q092
          - B_q048
permissions:
  contents: read
jobs:
  preflight-and-multipart-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bridge dependencies
        run: python -m pip install Pillow numpy
      - name: Assert source PNG bytes reach real image= file parameter (synthetic API)
        run: python -m unittest discover -s tools/localization -p 'test_imagegen_source_edit_bridge.py' -v
      - name: Existing B/C1 SHA and DDS conversion guards
        run: python -m unittest discover -s tools/localization -p 'test_imagegen_b_pipeline.py' -v
      - name: C1 real English canonical glyph-only SHA preflight (no generation)
        run: python tools/localization/imagegen_source_edit_bridge.py --repo . --dry-run --request localization/graphics/role_C1/imagegen_requests/q102_C1_OPENAI_EDIT_SOURCE_REQUEST.json
      - name: C1 second-line canonical English glyph-only SHA preflight (no generation)
        run: python tools/localization/imagegen_source_edit_bridge.py --repo . --dry-run --request localization/graphics/role_C1/imagegen_requests/q102_LINE2_C1_OPENAI_EDIT_SOURCE_REQUEST.json
      - name: B PSD English text-only SHA preflight (no generation)
        run: python tools/localization/imagegen_source_edit_bridge.py --repo . --dry-run --request localization/graphics/role_B/imagegen_requests/q092_B_OPENAI_EDIT_SOURCE_REQUEST.json
      - name: B q048 source-derived Slipstream actual binary SHA preflight (no generation)
        run: python tools/localization/imagegen_source_edit_bridge.py --repo . --dry-run --request localization/graphics/role_B/imagegen_requests/q048_B_OPENAI_EDIT_SOURCE_REQUEST.json

  live-remote-multipart-edit:
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight-and-multipart-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stop without a configured API credential
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::SOURCE_ATTACHMENT_API_CREDENTIAL_MISSING, no generation or DDS"
            exit 2
          fi
      - name: Install official image edit SDK
        run: python -m pip install 'openai>=1.50,<4' Pillow
      - name: Send verified PNG bytes to image editing multipart endpoint
        shell: bash
        run: |
          case "${{ inputs.pilot }}" in
            C1_q102_line2) REQUEST="localization/graphics/role_C1/imagegen_requests/q102_LINE2_C1_OPENAI_EDIT_SOURCE_REQUEST.json";;
            C1_q102) REQUEST="localization/graphics/role_C1/imagegen_requests/q102_C1_OPENAI_EDIT_SOURCE_REQUEST.json";;
            B_q092) REQUEST="localization/graphics/role_B/imagegen_requests/q092_B_OPENAI_EDIT_SOURCE_REQUEST.json";;
            B_q048) REQUEST="localization/graphics/role_B/imagegen_requests/q048_B_OPENAI_EDIT_SOURCE_REQUEST.json";;
            *) echo "::error::Unknown pilot"; exit 2;;
          esac
          python tools/localization/imagegen_source_edit_bridge.py --repo . --request "$REQUEST"
      - name: Keep actual API response and raw unapproved evidence as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-edit-${{ inputs.pilot }}-${{ github.run_id }}
          path: |
            localization/graphics/role_B/imagegen_requests/*_RAW_UNREVIEWED.png
            localization/graphics/role_B/imagegen_requests/*_TOOL_INPUT_RECEIPT.json
            localization/graphics/role_B/imagegen_requests/*_OUTPUT_MANIFEST.json
            localization/graphics/role_C1/imagegen_requests/*_RAW_UNREVIEWED.png
            localization/graphics/role_C1/imagegen_requests/*_TOOL_INPUT_RECEIPT.json
            localization/graphics/role_C1/imagegen_requests/*_OUTPUT_MANIFEST.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit raw unreviewed PNG and input receipt only (never DDS approval)
        shell: bash
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -A localization/graphics/role_B/imagegen_requests localization/graphics/role_C1/imagegen_requests
          git diff --cached --quiet && { echo "::error::No new raw image evidence"; exit 2; }
          git commit -m 'localization(imagegen): record real multipart image edit RAW output and receipt [skip ci]'
          git fetch origin korean-localization-recovery-20260928
          git rebase origin/korean-localization-recovery-20260928
          git push origin HEAD:korean-localization-recovery-20260928
