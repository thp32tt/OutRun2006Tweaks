name: Localization A-only image-src Portainer preflight
on:
  push:
    branches: [localization-controller-recovery-20260928]
    paths:
      - tools/chat-controller/localization-recovery-v1/**
      - .github/workflows/localization-q217-a-imagegen-smoke-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-a-image-src-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify original 4-part controller accepts exact build-time patch, no extra schedules
        run: |
          python - <<'PY'
          import ast, importlib.util, os, pathlib, re, tempfile
          import yaml
          root=pathlib.Path("tools/chat-controller/localization-recovery-v1")
          src=b"".join(p.read_bytes() for p in sorted((root/"src").glob("controller.py.part*"))).decode()
          sp=importlib.util.spec_from_file_location("png_patch",root/"patch_controller_png_upload.py")
          mod=importlib.util.module_from_spec(sp);sp.loader.exec_module(mod)
          result=mod.patch(src)
          assert mod.patch(result)==result, "patch must be idempotent"
          ast.parse(result)
          assert 'LOCALIZATION_SLOT_NAMES = ("A",)' in result
          assert 'SCHEDULED_LOCALIZATION_LANES = {minute: "A" for minute in range(0, 60, 10)}' in result
          assert 'SCHEDULED_LOCALIZATION_LANES = {0: "A", 10:' not in result
          schedule_assign = next(n for n in ast.parse(result).body if isinstance(n,ast.Assign) and
              any(isinstance(t,ast.Name) and t.id=="SCHEDULED_LOCALIZATION_LANES" for t in n.targets))
          schedule_value = eval(compile(ast.Expression(schedule_assign.value),"<controller-schedule>","eval"),{"range":range})
          assert schedule_value == {minute:"A" for minute in range(0,60,10)}, schedule_value
          assert '("B", "C1", "C2")' in result, "ensure retired slot backup covers all disabled roles"
          # Execute the actual patched load_registry with a legacy four-lane
          # checkpoint. All non-A slot URLs and counters must be safely saved.
          from dataclasses import dataclass, asdict
          from datetime import datetime, timedelta, timezone
          from typing import Optional
          from unittest.mock import Mock
          tree = ast.parse(result)
          wanted = {"Slot", "Registry", "logical_date", "new_registry", "load_registry", "save_registry"}
          nodes = [n for n in tree.body if isinstance(n,(ast.FunctionDef,ast.ClassDef)) and n.name in wanted]
          assert len(nodes) == len(wanted)
          with tempfile.TemporaryDirectory() as tempdir:
              home = pathlib.Path(tempdir)
              state_file = home / "chat_registry.json"
              now = datetime(2026,10,13,22,0,tzinfo=timezone.utc)
              originals = [
                  {"name": role, "url": "https://chatgpt.com/c/" + role.lower(), "runs": i+3}
                  for i,role in enumerate(("A","B","C1","C2"))
              ]
              state_file.write_text(__import__("json").dumps({
                  "logical_date": "2026-10-13", "next_slot": 2, "slots": originals,
                  "rate_limit_attempts": 0
              }))
              env = {"dataclass":dataclass, "asdict":asdict, "datetime":datetime,
                     "timedelta":timedelta, "TZ":timezone.utc,"ROLLOVER_HOUR":2,
                     "CHAT_SLOTS":1, "CONTROLLER_MODE":"localization",
                     "LOCALIZATION_SLOT_NAMES":("A",), "STATE_DIR":home,
                     "REGISTRY_FILE":state_file,"json":__import__("json"),
                     "log":Mock(),"Optional":Optional}
              module=ast.Module(body=[ast.ImportFrom(module="__future__",names=[
                  ast.alias(name="annotations")],level=0)]+nodes,type_ignores=[])
              exec(compile(ast.fix_missing_locations(module),"<patched-registry>","exec"),env)
              reg=env["load_registry"](now)
              assert [slot.name for slot in reg.slots] == ["A"]
              assert reg.slots[0].url == originals[0]["url"] and reg.slots[0].runs == 3
              for old in originals[1:]:
                  backup=home/("retired_"+old["name"]+"_slot_before_a_only_20261013.json")
                  assert backup.is_file() and __import__("json").loads(backup.read_text())["url"]==old["url"], old
              assert len(env["load_registry"](now).slots)==1
              assert [item["name"] for item in __import__("json").loads(state_file.read_text())["slots"]] == ["A"]
          assert 'if CONTROLLER_MODE == "localization" and slot.name != "A":' in result
          assert "ATTACHMENT_UPLOAD_COMPLETED" in result
          assert "verify_submission_receipt" in result
          assert "A_PROJECT_COMPOSER_READY" in result
          assert "verify_task_id_missing" in result
          assert "SOURCE_REFERENCE_NOT_BOUND" in result
          assert "SUBMISSION_UNVERIFIED_DO_NOT_AUTO_RETRY" in result
          docker=(root/"Dockerfile").read_text()
          assert "COPY controller_png_attach.py" in docker
          assert "COPY tile_batch_queue.py" in docker
          assert "tile_batch_queue.py" in (root/"Dockerfile").read_text()
          assert "COPY patch_controller_png_upload.py" in docker
          assert "RUN python /tmp/patch_controller_png_upload.py /opt/outrun/app/controller.py" in docker
          c=yaml.safe_load((root/"docker-compose.yml").read_text())
          svc=c["services"]["outrun-chat-controller-localization-recovery"]
          env=svc["environment"]
          assert env["AUTO_SEND"]=="true" and env["SCHEDULE_MINUTES"]=="0,10,20,30,40,50"
          assert env["CHAT_SLOTS"]=="1"
          assert env["OUTRUN_A_TILE_BATCH_QUEUE"]=="true"
          assert env["OUTRUN_A_TILE_BATCH_SIZE"]=="5"
          assert [int(x) for x in env["SCHEDULE_MINUTES"].split(",")] == list(range(0,60,10))
          assert env["SLOT_DEDUP_SECONDS"]=="180"
          assert env["MIN_SEND_GAP_SECONDS"]=="60"
          assert env["OUTRUN_A_SINGLE_SMOKE_TASK_ID"]==""
          assert env["OUTRUN_A_PROJECT_NAME"]=="아웃런 한글화 신규"
          assert env["WATCHDOG_ENABLED"]=="false"
          assert env["REQUIRE_PROJECT_URL"]=="false", "standalone A must not force AUTO_SEND off"
          assert svc["pull_policy"]=="build"
          vols=svc["volumes"]
          assert "outrun_chat_localization_recovery_data:/data" in vols
          assert "outrun_chat_localization_recovery_logs:/logs" in vols
          assert any(isinstance(m,dict) and m.get("type")=="bind" and m.get("source")=="/home/chatgpt-runner2/work/image-src" and m.get("target")=="/data/imagegen" and m.get("bind",{}).get("create_host_path") is False for m in vols)
          assert c["volumes"]["outrun_chat_localization_recovery_data"]["name"]=="outrun_chat_localization_recovery_data"
          assert c["volumes"]["outrun_chat_localization_recovery_logs"]["name"]=="outrun_chat_localization_recovery_logs"
          print("A-ONLY CONTROLLER PATCH + BUILD + NAMED VOLUMES + BIND: STATIC PASS")
          PY
      - name: Test five-source queue isolation, idempotence and five-result gate
        run: python tools/chat-controller/localization-recovery-v1/tests/test_tile_batch_queue.py
      - name: Check distinct A inputs, SHA/CRC and duplicate-submit guard
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, struct, tempfile, zlib
          from unittest.mock import patch
          path=pathlib.Path("tools/chat-controller/localization-recovery-v1/controller_png_attach.py")
          sp=importlib.util.spec_from_file_location("source_binding",path)
          mod=importlib.util.module_from_spec(sp);sp.loader.exec_module(mod)
          def chunk(tag,data):
              return struct.pack(">I",len(data))+tag+data+struct.pack(">I",zlib.crc32(tag+data))
          raw=(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",1,1,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(b"\x00\x00\x00\x00\x00"))+chunk(b"IEND",b""))
          with tempfile.TemporaryDirectory() as td, patch.dict(os.environ,{"OUTRUN_A_SINGLE_SMOKE_TASK_ID":""}):
              root=pathlib.Path(td);(root/"inputs"/"A").mkdir(parents=True);(root/"inputs"/"A"/"source.png").write_bytes(raw)
              tasks=("OUTRUN-A-Q101-IMG-20261013","OUTRUN-A-Q218-IMG-20261013")
              manifest={"role":"A","task_id":tasks[0],"png":"A/source.png","png_sha256":hashlib.sha256(raw).hexdigest(),"source_dds_sha256":"d"*64,"prompt":"START -> 출발; GOAL -> 골"}
              for task in tasks:
                  manifest["task_id"]=task
                  (root/"pending_A.json").write_text(json.dumps(manifest),encoding="utf-8")
                  binding,reason=mod.load_binding("A",root)
                  assert reason is None and binding["task_id"]==task and binding["dimensions"]==[1,1],reason
                  mod.mark_sent(binding,root=root)
                  assert mod.load_binding("A",root)[1]=="ALREADY_SENT", "do not duplicate an already-submitted task"
              assert mod.load_binding("B",root)[1]=="SOURCE_REFERENCE_NOT_BOUND", "no unbound B source"
              manifest["task_id"]="OUTRUN-A-Q219-IMG-20261013"
              manifest["png_sha256"]="0"*64
              (root/"pending_A.json").write_text(json.dumps(manifest),encoding="utf-8")
              assert mod.load_binding("A",root)[1]=="PNG_SHA_MISMATCH", "fail closed on stale/corrupt PNG"
              # Regression: a missing persisted receipt must never count as sent.
          import asyncio
          class NoReceipt:
              async def wait_for_function(self, *a, **kw):
                  raise TimeoutError("no durable user bubble with image")
          assert asyncio.run(mod.verify_submission_receipt(
              NoReceipt(), "OUTRUN-A-TEST", "source.png"))=="SEND_UNVERIFIED"
          class WrongOrigin:
              url="https://example.invalid/"
          assert asyncio.run(mod.prepare_a_project_target(
              WrongOrigin(), "아웃런 한글화 신규"))=="TARGET_ORIGIN_NOT_CHATGPT"
          assert "ATTACHMENT_UPLOAD_COMPLETED" in path.read_text()
          assert "data-message-author-role" in path.read_text()
          assert "location.pathname.includes('/c/')" in path.read_text()
          print("A receipt and project-target false-success guards: PASS")
          print("TWO A SOURCE INPUTS + DUPLICATE GUARD + SHA FAIL-CLOSED: PASS")
          PY