name: Localization A/B HD 5-image queue preflight

on:
  push:
    branches: [localization-controller-recovery-20260928]
    paths:
      - 'tools/chat-controller/localization-recovery-v1/**'
      - '.github/workflows/localization-q217-a-imagegen-smoke-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ab-imagegen-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline QA dependencies
        run: python -m pip install PyYAML==6.0.3 Pillow==11.3.0
      - name: Compile A/B modules and the original controller
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, importlib.util, json, yaml
          root=Path('tools/chat-controller/localization-recovery-v1')
          for part in [
             'ab_batch_queue.py','controller_png_attach.py',
             'tile_batch_queue.py','tile_orientation_policy.py',
             'patch_controller_png_upload.py',
          ]:
             ast.parse((root/part).read_text(encoding='utf-8'),filename=part)
          source=''.join(p.read_text(encoding='utf-8') for p in sorted((root/'src').glob('controller.py.part*')))
          sp=importlib.util.spec_from_file_location('patch',root/'patch_controller_png_upload.py')
          mod=importlib.util.module_from_spec(sp);sp.loader.exec_module(mod)
          result=mod.patch(source)
          ast.parse(result)
          assert mod.patch(result)==result
          assert 'LOCALIZATION_SLOT_NAMES = ("A", "B")' in result
          assert 'CHAT_SLOTS != 2' in result
          needle='SCHEDULED_LOCALIZATION_LANES = {minute: ("A" if minute % 10 == 0 else "B") for minute in range(0, 60, 5)}'
          assert needle in result
          tree=ast.parse(result)
          stmt=next(n for n in tree.body if isinstance(n,ast.Assign) and
             any(isinstance(t,ast.Name) and t.id=='SCHEDULED_LOCALIZATION_LANES' for t in n.targets))
          policy=eval(compile(ast.Expression(stmt.value),'<schedule>','eval'),{'range':range})
          assert policy=={m:('A' if m%10==0 else 'B') for m in range(0,60,5)}
          assert 'if FRESH_CHAT_EACH_RUN:' in result
          assert 'from app.ab_batch_queue import inspect_slot, stage_submission, record_chat_url' in result
          assert 'SUBMISSION_UNVERIFIED_DO_NOT_AUTO_RETRY' in result
          assert 'BATCH_SUBMISSION_BLOCKED' in result
          assert '("C1", "C2")' in result
          assert 'for retired_name in ("B", "C1", "C2"):' not in result
          assert 'verify_submission_receipt' in result
          assert 'ensure_image_tool' in result
          assert 'if CONTROLLER_MODE == "localization" and slot.name not in ("A", "B")' in result
          print('PATCHED CONTROLLER: two roles, staggered schedule, fresh-chat and fail-closed PASS')
          PY
      - name: Validate Compose without deployment
        run: |
          docker compose -f tools/chat-controller/localization-recovery-v1/docker-compose.yml config --quiet
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('tools/chat-controller/localization-recovery-v1')
          compose=yaml.safe_load((root/'docker-compose.yml').read_text())
          assert len(compose['services'])==1
          c=compose['services']['outrun-chat-controller-localization-recovery']
          e=c['environment']
          assert e['CHAT_SLOTS']=='2'
          assert e['AUTO_SEND']=='true'
          assert e['SCHEDULE_MINUTES']=='0,5,10,15,20,25,30,35,40,45,50,55'
          assert e['FRESH_CHAT_EACH_RUN']=='true'
          assert e['CHAT_RECYCLE_RUNS']=='0'
          assert e['OUTRUN_AB_BATCH_QUEUE']=='true'
          assert e['OUTRUN_AB_BATCH_SIZE']=='5'
          assert e['OUTRUN_AB_LIBRARY_FOLDER']=='아웃런 한글화 신규'
          assert e['OUTRUN_AB_PROJECT_LIBRARY_NAME']=='아웃런 한글화 신규'
          assert e['OUTRUN_AB_PROJECT_NAME']=='아웃런 한글화 신규'
          assert e['OUTRUN_A_TILE_BATCH_QUEUE']=='false'
          assert e['WATCHDOG_ENABLED']=='false'
          assert e['REQUIRE_PROJECT_URL']=='false'
          assert c['pull_policy']=='build'
          assert c['ports']==['6082:6080','8788:8787']
          assert any(isinstance(m,dict) and m.get('type')=='bind' and
             m['source']=='/home/chatgpt-runner2/work/image-src' and
             m['target']=='/data/imagegen' and m.get('bind',{}).get('create_host_path') is False
             for m in c['volumes'])
          assert 'outrun_chat_localization_recovery_data:/data' in c['volumes']
          assert 'outrun_chat_localization_recovery_logs:/logs' in c['volumes']
          docker=(root/'Dockerfile').read_text()
          for module in ['ab_batch_queue.py','controller_png_attach.py',
                         'tile_orientation_policy.py','project_library_gate.py']:
             assert 'COPY '+module+' /opt/outrun/app/'+module in docker
          print('A/B Compose, mounts, service isolation and Docker copies: PASS')
          PY
      - name: Execute role queue, Library gate and orientation unit tests
        run: |
          python tools/chat-controller/localization-recovery-v1/tests/test_ab_batch_queue.py
          python tools/chat-controller/localization-recovery-v1/tests/test_ab_carousel.py
          python tools/chat-controller/localization-recovery-v1/tests/test_project_library_gate.py
          python tools/chat-controller/localization-recovery-v1/tests/test_tile_orientation_policy.py
          python tools/chat-controller/localization-recovery-v1/tests/test_tile_batch_queue.py
      - name: Verify live-message DOM receipt selector without sending a message
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/chat-controller/localization-recovery-v1/controller_png_attach.py').read_text()
          for name in ['data-markdown-text-tone="user-message"','data-chatgpt-search-unit-key','img[alt="User attachment"]','location.pathname.includes(\'/c/\')']:
             assert name in p,name
          import importlib.util
          sp=importlib.util.spec_from_file_location('source_binding','tools/chat-controller/localization-recovery-v1/controller_png_attach.py')
          mod=importlib.util.module_from_spec(sp);sp.loader.exec_module(mod)
          import asyncio
          class NoReceipt:
             async def wait_for_function(self,*a,**kwargs):raise TimeoutError('not sent')
          assert asyncio.run(mod.verify_submission_receipt(NoReceipt(),'TASK','f.png'))=='SEND_UNVERIFIED'
          print('Receipt fails closed on missing durable user bubble')
          PY
      - name: Verify carousel result selection and distinct blob gate
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('tools/chat-controller/localization-recovery-v1')
          src=(root/'ab_batch_queue.py').read_text(encoding='utf-8')
          for mark in ('button[aria-label^="Show generated image "]',
                       'CAROUSEL_DISTINCT_IMAGE_BLOBS',
                       'DUPLICATED_IMAGE_PREVIEWS',
                       'IMAGE_BLOB_NOT_READY',
                       'OUTPUT_ORDER_ONLY_NOT_VISUALLY_VERIFIED',
                       'PROJECT_LIBRARY_NOT_VERIFIED'):
            assert mark in src,mark
          assert src.count('button[aria-label^="Show generated image "]') >= 2
          library=(root/'project_library_gate.py').read_text(encoding='utf-8')
          assert 'GENERATED_PNG_HASHES_JS' in library
          assert 'LIBRARY_CARD_DIGEST_JS' in library
          assert 'browser_content_sha256_match' in library
          assert 'PROJECT_LIBRARY_HASH_MATCH_INCOMPLETE' in library
          assert 'outrun_kor' not in library
          print('PASS: distinct carousel outputs + cryptographic project Library verification')
          PY