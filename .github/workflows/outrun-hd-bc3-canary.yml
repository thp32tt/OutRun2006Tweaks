name: OutRun DXT5 HD 3-Atlas Real-Source Canary (GitHub CPU)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/outrun-hd-bc3-canary.yml

permissions:
  contents: read

concurrency:
  group: outrun-hd-bc3-canary
  cancel-in-progress: true

jobs:
  source-pinned-test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/localization/github_ab_imagegen_atlas_batch.py
            tools/localization/hd_strict_qa.py
            tools/localization/hd_existing_candidate_salvage.py
            tools/localization/hd_bc3_index_patch.py
            tools/localization/probe_hd_bc3_real_sources.py
            tools/localization/test_hd_bc3_index_patch.py
            localization/automation_inputs/hd_original_png_source_plan.json
            localization/test_packages/ab_preparation_20261102/ab_roi_crosswalk.csv
            localization/automation_inputs/candidate_outputs/B/Q098_5112ccfe2d458ff6_source_k.png
            localization/automation_inputs/candidate_outputs/A/Q055_dd5213d64f53d429_source_k.png
            localization/automation_inputs/candidate_outputs/B/Q099_861e16d020961ed5_k.png
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load/spr_sprani_selector_cvt_Exst/42E618FD_512x32.dds
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load/spr_sprani_game_cvt_Exst/2EA557B4_512x64.dds
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load/spr_sprani_selector_cvt_Exst/4F68708E_512x64.dds
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Check DXT5 bit-exact endpoint safety
        run: python -m unittest discover -s tools/localization -p test_hd_bc3_index_patch.py -v
      - name: Validate original DDS SHA and A/B image, attempt REAL BC3 canary (TEST_ONLY)
        run: |
          python tools/localization/probe_hd_bc3_real_sources.py --repo . --out "$RUNNER_TEMP/bc3-one"
          python tools/localization/probe_hd_bc3_real_sources.py --repo . --out "$RUNNER_TEMP/bc3-two"
          cmp "$RUNNER_TEMP/bc3-one/bc3_real_source_report.json" "$RUNNER_TEMP/bc3-two/bc3_real_source_report.json"
          cmp "$RUNNER_TEMP/bc3-one/BC3_CANARY_TEST_ONLY.zip" "$RUNNER_TEMP/bc3-two/BC3_CANARY_TEST_ONLY.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outrun-hd-bc3-real-source-canary-${{ github.run_id }}
          path: ${{ runner.temp }}/bc3-one/
          retention-days: 14
          if-no-files-found: ignore
