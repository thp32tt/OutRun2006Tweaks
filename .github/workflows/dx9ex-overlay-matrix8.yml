name: DX9Ex Overlay Matrix8

on:
  workflow_dispatch:
  push:
    branches: [ vr-d3d9ex-overlay-matrix8 ]
    paths:
      - 'src/vr/d3d9/**'
      - 'src/vr/game/**'
      - 'vrhost/**'
      - 'cmake.toml'
      - 'tools/Run-DX9Ex-Matrix8-Test.ps1'
      - 'tools/RUN_DX9EX_MATRIX8_TEST.cmd'
      - '.github/workflows/dx9ex-overlay-matrix8.yml'

concurrency:
  group: dx9ex-overlay-matrix8
  cancel-in-progress: true

jobs:
  host:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build OpenXR host
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host
          if (-not (Test-Path build-host/bin/outrun-vr-host.exe)) { throw "host missing" }
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build-host/bin/outrun-vr-host.exe stage/outrun-vr-host.exe
          Set-Content stage/HOST_SHA.txt $env:GITHUB_SHA -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: dx9ex-m8-host
          path: stage/
          if-no-files-found: error

  game:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: M0_BASE_R46_HOST
            owner: OFF
            live: OFF
            window32: OFF
            depth4: OFF
            depth8: OFF
            r13exact: OFF
            r13common: OFF
            r13broad: OFF
            purpose: "Baseline R26+R30 HUD plus robust Theater-until-first-stereo host transition"
          - variant: M1_OWNER_FIRST_12
            owner: ON
            live: OFF
            window32: OFF
            depth4: OFF
            depth8: OFF
            r13exact: OFF
            r13common: OFF
            r13broad: OFF
            purpose: "Raw c64 owner classification before verified-world early-out; 12-draw owner window"
          - variant: M2_OWNER_FIRST_32
            owner: ON
            live: OFF
            window32: ON
            depth4: OFF
            depth8: OFF
            r13exact: OFF
            r13common: OFF
            r13broad: OFF
            purpose: "Owner-first plus 32-draw group lifetime for multi-draw HUD/rank batches"
          - variant: M3_OWNER_DEPTH4
            owner: ON
            live: OFF
            window32: ON
            depth4: ON
            depth8: OFF
            r13exact: OFF
            r13common: OFF
            r13broad: OFF
            purpose: "Owner-first 32; treat owned overlays nearer than view depth 4 as PerspectiveHud"
          - variant: M4_OWNER_DEPTH8
            owner: ON
            live: OFF
            window32: ON
            depth4: OFF
            depth8: ON
            r13exact: OFF
            r13common: OFF
            r13broad: OFF
            purpose: "Owner-first 32; treat owned overlays nearer than view depth 8 as PerspectiveHud"
          - variant: M5_LIVE_WVP_18B
            owner: OFF
            live: ON
            window32: OFF
            depth4: OFF
            depth8: OFF
            r13exact: OFF
            r13common: OFF
            r13broad: OFF
            purpose: "Recreate 18b live-c64 PerspectiveHud/WorldBillboard split before world early-out"
          - variant: M6_OWNER32_R13_EXACT
            owner: ON
            live: OFF
            window32: ON
            depth4: OFF
            depth8: OFF
            r13exact: ON
            r13common: ON
            r13broad: OFF
            purpose: "Owner-first rank path plus exact R13 flat white-overlay zero-disparity diagnostic"
          - variant: M7_OWNER32_DEPTH4_BROAD
            owner: ON
            live: OFF
            window32: ON
            depth4: ON
            depth8: OFF
            r13exact: OFF
            r13common: ON
            r13broad: ON
            purpose: "Candidate combo: owner-first HUD/rank plus broad depth-off alpha common-eye white overlay"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure ${{ matrix.variant }}
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32 `
            -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF `
            -DOUTRUN_VR_R26_HUD_COMPARE=ON `
            -DOUTRUN_VR_OVERLAY_OWNER_FIRST=${{ matrix.owner }} `
            -DOUTRUN_VR_OVERLAY_LIVE_FIRST=${{ matrix.live }} `
            -DOUTRUN_VR_OVERLAY_WINDOW_32=${{ matrix.window32 }} `
            -DOUTRUN_VR_OVERLAY_SPATIAL_DEPTH_4=${{ matrix.depth4 }} `
            -DOUTRUN_VR_OVERLAY_SPATIAL_DEPTH_8=${{ matrix.depth8 }} `
            -DOUTRUN_VR_R13_FLAT_PREEMPT=${{ matrix.r13exact }} `
            -DOUTRUN_VR_R13_FLAT_COMMON=${{ matrix.r13common }} `
            -DOUTRUN_VR_R13_FLAT_PREEMPT_BROAD=${{ matrix.r13broad }}
      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      - name: Build game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks
      - name: Stage game DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw "dinput8.dll missing" }
          Copy-Item $dll.FullName stage/dinput8.dll
          @(
            "variant=${{ matrix.variant }}"
            "sourceSha=$env:GITHUB_SHA"
            "baseHistoricalSha=110b5c6c5732f3bde569d42352126502262dcc2a"
            "ownerFirst=${{ matrix.owner }}"
            "liveFirst=${{ matrix.live }}"
            "window32=${{ matrix.window32 }}"
            "depth4=${{ matrix.depth4 }}"
            "depth8=${{ matrix.depth8 }}"
            "r13Exact=${{ matrix.r13exact }}"
            "r13Common=${{ matrix.r13common }}"
            "r13Broad=${{ matrix.r13broad }}"
            "purpose=${{ matrix.purpose }}"
          ) | Set-Content stage/MATRIX8_VARIANT.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: dx9ex-m8-${{ matrix.variant }}
          path: stage/
          if-no-files-found: error

  package:
    runs-on: windows-2022
    needs: [host, game]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dx9ex-m8-host
          path: payload/host
      - uses: actions/download-artifact@v4
        with:
          pattern: dx9ex-m8-M*
          path: payload/games
          merge-multiple: false
      - name: Assemble eight tester ZIPs
        shell: pwsh
        run: |
          $variants = @(
            'M0_BASE_R46_HOST',
            'M1_OWNER_FIRST_12',
            'M2_OWNER_FIRST_32',
            'M3_OWNER_DEPTH4',
            'M4_OWNER_DEPTH8',
            'M5_LIVE_WVP_18B',
            'M6_OWNER32_R13_EXACT',
            'M7_OWNER32_DEPTH4_BROAD'
          )
          New-Item -ItemType Directory -Force output | Out-Null
          foreach ($variant in $variants) {
            $dir = Join-Path package $variant
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "payload/games/dx9ex-m8-$variant/dinput8.dll" (Join-Path $dir 'dinput8.dll')
            Copy-Item "payload/games/dx9ex-m8-$variant/MATRIX8_VARIANT.txt" (Join-Path $dir 'MATRIX8_VARIANT.txt')
            Copy-Item payload/host/outrun-vr-host.exe (Join-Path $dir 'outrun-vr-host.exe')
            Copy-Item tools/Run-DX9Ex-Matrix8-Test.ps1 (Join-Path $dir 'Run-DX9Ex-Matrix8-Test.ps1')
            Copy-Item tools/RUN_DX9EX_MATRIX8_TEST.cmd (Join-Path $dir 'RUN_DX9EX_MATRIX8_TEST.cmd')
            foreach($f in @('d3d9.dll','multiviewpatcher.dll','outrun-vr-host-dx12.exe')){
              if(Test-Path (Join-Path $dir $f)){ throw "Forbidden non-DX9Ex file $f" }
            }
            Get-ChildItem $dir -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
              "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
            } | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
            Compress-Archive -Path (Join-Path $dir '*') -DestinationPath (Join-Path output ("OutRun2_VR_DX9EX_M8_{0}.zip" -f $variant)) -Force
          }
          $z = Get-ChildItem output -Filter '*.zip'
          if($z.Count -ne 8){ throw "Expected 8 zips, found $($z.Count)" }
      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-DX9EX-MATRIX8-${{ github.sha }}
          path: output/*.zip
          if-no-files-found: error
