name: Apply FFB interface compatibility

on:
  push:
    branches: [wheel-ffb-v0.2-dev]
    paths:
      - .github/workflows/patch-ffb-interface-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wheel-ffb-v0.2-dev
          fetch-depth: 0

      - name: Apply compatibility patch
        run: python tools/patch_ffb_interface_compat.py

      - name: Update verifier for validated fallback structure
        run: python tools/fix_ffb_verifier_indent.py

      - name: Remove stale release verifier dependency
        run: python tools/fix_stale_release_verifier.py

      - name: Verify patched source
        run: python tools/verify_wheel_ffb_current.py

      - name: Commit clean source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-ffb-interface-compat.yml
          git rm tools/patch_ffb_interface_compat.py
          git rm tools/fix_ffb_verifier_indent.py
          git rm tools/fix_stale_release_verifier.py
          git add src/hooks_wheel_ffb.cpp tools/verify_wheel_ffb_current.py
          git commit -m "fix: validate and auto-select FFB interfaces"
          git push origin HEAD:wheel-ffb-v0.2-dev
