name: Ferrari F430 Exact Source Probe

on:
  push:
    branches:
      - vr-quest-cockpit-v2-external-dino-actions-20261116
    paths:
      - '.github/workflows/f430-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect Assetto World exact F430 page
        shell: python
        run: |
          import html, re, urllib.request
          url='https://www.assettoworld.com/car/ferrari-f430-1'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          try:
              r=urllib.request.urlopen(req,timeout=30)
              body=r.read().decode('utf-8','ignore')
              print('STATUS',getattr(r,'status',None),'FINAL',r.geturl(),'BYTES',len(body))
              title=re.search(r'<title>(.*?)</title>',body,re.I|re.S)
              print('TITLE',re.sub(r'\s+',' ',title.group(1)).strip() if title else '')
              links=[]
              for x in re.findall(r'(?:href|action|data-url|data-href|src)=["\']([^"\']+)["\']',body,re.I):
                  x=html.unescape(x)
                  if any(k in x.lower() for k in ('download','.zip','.rar','.7z','cdn','storage','api','file')):
                      if x not in links: links.append(x)
              print('LINKS',links[:300])
              for needle in ('download','ferrari-f430','opperslang','fileUrl','downloadUrl'):
                  print('NEEDLE',needle)
                  for m in list(re.finditer(needle,body,re.I))[:10]:
                      print(re.sub(r'\s+',' ',body[max(0,m.start()-500):m.start()+1200])[:1700])
          except Exception as exc:
              print('ERROR',repr(exc))
              raise
