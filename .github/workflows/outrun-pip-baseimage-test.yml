name: OutRun pip base image test
on:
  push:
    branches:
      - localization-controller-recovery-20260928
    paths:
      - 'tools/chat-controller/localization-recovery-v1/requirements.txt'
      - '.github/workflows/outrun-pip-baseimage-test.yml'
  workflow_dispatch:

jobs:
  pip-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Python and pip
        run: |
          python --version
          python -m pip --version
      - name: Install exact requirements
        run: |
          python -m pip install --no-cache-dir --prefer-binary --retries 5 --timeout 120 --index-url https://pypi.org/simple -r tools/chat-controller/localization-recovery-v1/requirements.txt
