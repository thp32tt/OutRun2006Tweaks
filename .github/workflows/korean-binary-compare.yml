name: Korean Binary Compare Prepare

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - '.github/workflows/korean-binary-compare.yml'

permissions:
  contents: write

jobs:
  inspect-full-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0

      - name: Reconstruct FULL_DRAFT binary
        shell: bash
        run: |
          set -euo pipefail
          SRC="localization/validation/internal_snapshot/20260926/full_draft_b64_1m"
          OUT="localization/validation/binary_compare"
          mkdir -p "$OUT"
          cat "$SRC"/part-*.b64 | base64 -d > "$OUT/OutRun2_Korean_GFX_FULL_DRAFT_Test.zip"
          sha256sum "$OUT/OutRun2_Korean_GFX_FULL_DRAFT_Test.zip" > "$OUT/FULL_DRAFT_SHA256.txt"
          unzip -l "$OUT/OutRun2_Korean_GFX_FULL_DRAFT_Test.zip" > "$OUT/FULL_DRAFT_CONTENTS.txt"
          unzip -Z1 "$OUT/OutRun2_Korean_GFX_FULL_DRAFT_Test.zip" > "$OUT/FULL_DRAFT_FILES.txt"

      - name: Build DDS manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT="localization/validation/binary_compare"
          TMP="$RUNNER_TEMP/full_draft_extract"
          mkdir -p "$TMP"
          unzip -q "$OUT/OutRun2_Korean_GFX_FULL_DRAFT_Test.zip" -d "$TMP"
          {
            echo -e "sha256\tsize\tpath"
            find "$TMP" -type f \( -iname '*.dds' -o -iname '*.bin' -o -iname '*.exe' -o -iname '*.dll' \) -print0 |
              sort -z |
              while IFS= read -r -d '' f; do
                sha=$(sha256sum "$f" | awk '{print $1}')
                size=$(stat -c '%s' "$f")
                rel="${f#$TMP/}"
                printf '%s\t%s\t%s\n' "$sha" "$size" "$rel"
              done
          } > "$OUT/FULL_DRAFT_BINARY_MANIFEST.tsv"

      - name: Commit reconstructed comparison material
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/validation/binary_compare/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "localization: reconstruct binary comparison material"
          git push origin HEAD:korean-localization-clean
