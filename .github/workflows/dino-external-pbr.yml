name: Dino external OVC3 PBR (R26 VR)
on:
  push:
    branches:
      - feature/dino-external-pbr-runtime-v1-20261106
    paths:
      - 'src/vr/game/dino_external_*.hpp'
      - 'src/hooks_graphics.cpp'
      - 'tests/test_dino_original_car_gate.cpp'
      - 'tests/test_dino_external_*.cpp'
      - 'tools/upgrade_dino_ovc_pbr.py'
      - 'tools/package_dino_pbr_copyrun.py'
      - 'tools/tests/test_package_dino_pbr_copyrun.py'
      - 'BUILD-DINO-PBR-TEST-ZIP.cmd'
      - 'tools/tests/test_upgrade_dino_ovc_pbr.py'
      - 'tools/tests/test_dino_pbr_hlsl_win.cpp'
      - 'tools/tests/test_dino_pbr_copyrun.ps1'
      - 'QuestCockpit-CopyRun.ps1'
      - 'QuestCockpit-CopyRestore.ps1'
      - 'RUN-QUEST-APK-DINO-PBR.cmd'
      - 'tools/tests/dino_pbr_hlsl_win/**'
      - '.github/workflows/dino-external-pbr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-parser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all OVC generations and PBR packer
        run: |
          set -eu
          for test in tests/test_dino_external_sidecar.cpp tests/test_dino_external_hq.cpp tests/test_dino_external_pbr.cpp; do
            exe="/tmp/$(basename "$test" .cpp)"
            c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. "$test" -o "$exe"
            "$exe"
          done
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. tests/test_dino_original_car_gate.cpp -o /tmp/test_dino_original_car_gate
          /tmp/test_dino_original_car_gate
          python3 -m unittest -v tools.tests.test_upgrade_dino_ovc_pbr tools.tests.test_package_dino_pbr_copyrun
      - name: Validate actual GitHub checkout paths for flat test package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.package_dino_pbr_copyrun import ROOT_FILES, SCRIPT_FILES, DEFAULT_FILES
          for name in ROOT_FILES:
              assert Path(name).is_file(), name
          for name in DEFAULT_FILES:
              assert Path(name).is_file(), name
          for name in SCRIPT_FILES:
              path = Path(name) if name == 'Run-QuestCockpitV2-CrashDiag.ps1' else Path('tools') / name
              assert path.is_file(), f"missing same-source helper: {path}"
          for path in ('tools/package_dino_pbr_copyrun.py','BUILD-DINO-PBR-TEST-ZIP.cmd'):
              assert Path(path).is_file(), path
          print('DINO_PBR_COPYRUN_SAME_SOURCE_CHECKOUT_PATHS_PASS')
          PY
      - name: Check original player callback is gated after replacement submission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          hook = Path('src/hooks_graphics.cpp').read_text()
          renderer = Path('src/vr/game/dino_external_d3d9.hpp').read_text()
          start = hook.index('static void CallOriginalPlayerWithGlassScope(')
          end = hook.index('static void __cdecl OnPlayerCallback(', start)
          scope = hook[start:end]
          assert scope.count('PlayerCallbackHook.ccall<void>(player)') == 1
          assert 'if(DrawPreparedDinoFitV6(dino))' in scope
          assert scope.index('if(DrawPreparedDinoFitV6(dino))') < scope.index('PlayerCallbackHook.ccall<void>(player)')
          assert 'OriginalCarGate gate{' in hook
          assert 'ChooseOriginalCarRoute(' in hook
          assert 'EXTERNAL_PARTIAL_QUARANTINED' in hook
          assert 'QuarantineFailedSubmission(' in renderer
          assert '++result.receipt.submittedMeshes;' in renderer
          assert 'result.receipt.stateRestored=SUCCEEDED(restore)' in renderer
          assert 'ticket.originalPlayer' in hook and 'ticket.xrPose' in hook
          assert 'GlobalGpu().DrawNativeScene(' in hook
          assert 'OnDeviceReset()' in renderer
          assert 'OUTRUN_VR_DINO_PBR_TEST' in renderer
          for sampler in (1, 2):
              assert f'SetSamplerState({sampler},D3DSAMP_MAXMIPLEVEL,0u)' in renderer
              assert f'SetSamplerState({sampler},D3DSAMP_MIPMAPLODBIAS,0u)' in renderer
          print('DINO_ORIGINAL_CAR_CALLBACK_EXCLUSIVE_TRANSACTION_CONTRACT_PASS')
          PY
  win32-script-compat:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse actual copy-run/restore scripts and test OVC3 VerifyOnly
        shell: pwsh
        run: |
          & ./tools/tests/test_dino_pbr_copyrun.ps1
          if(-not $?){throw "PBR launcher compatibility smoke failed"}
  win32-shader:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build actual D3D9 Shader Model 3 compiler test
        shell: pwsh
        run: |
          cmake -S tools/tests/dino_pbr_hlsl_win -B build-pbr-hlsl -G "Visual Studio 17 2022" -A Win32
          if($LASTEXITCODE -ne 0){throw "Shader gate configure failed"}
          cmake --build build-pbr-hlsl --config Release --parallel 2
          if($LASTEXITCODE -ne 0){throw "Shader gate build failed"}
          & ./build-pbr-hlsl/Release/dino_pbr_shader_ci.exe
          if($LASTEXITCODE -ne 0){throw "VS3/PS3 HLSL did not compile"}
  win32-r26:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure stable R26/HUD external model path
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-r26 -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_R26_HUD_COMPARE=ON -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_C1_COMPARE=OFF -DOUTRUN_VR_C2_COMPARE=OFF -DOUTRUN_VR_REFACTOR_SPLIT_R33_R32=OFF -DOUTRUN_VR_REFACTOR_SPLIT_R32_R31=OFF -DOUTRUN_VR_REFACTOR_SPLIT_R31_R30=OFF -DOUTRUN_VR_REFACTOR_SPLIT_R30_R29=OFF
          if($LASTEXITCODE -ne 0){throw "R26 configure failed"}
      - name: Build Win32 mod DLL using PBR runtime
        shell: pwsh
        run: |
          cmake --build build-r26 --config Release --target outrun2006tweaks --parallel 4
          if($LASTEXITCODE -ne 0){throw "R26 Win32 build failed"}
          $dll=Get-ChildItem build-r26 -Recurse -Filter dinput8.dll | Where-Object {$_.FullName -notmatch '_deps'} | Sort-Object Length -Descending | Select-Object -First 1
          if(-not $dll){throw "Missing dinput8.dll"}
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $dll.FullName out/dinput8.dll
          $env:GITHUB_SHA | Set-Content out/SOURCE_SHA.txt -Encoding ascii
          Get-FileHash out/dinput8.dll -Algorithm SHA256
      - name: Build matching x64 OpenXR host from the same checkout SHA
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          if($LASTEXITCODE -ne 0){throw "OpenXR host configure failed"}
          cmake --build build-host --config Release --target outrun-vr-host --parallel 4
          if($LASTEXITCODE -ne 0){throw "OpenXR host build failed"}
          $hostExe=Get-ChildItem build-host -Recurse -Filter outrun-vr-host.exe | Sort-Object Length -Descending | Select-Object -First 1
          if(-not $hostExe){throw "Missing matching OpenXR host"}
          Copy-Item $hostExe.FullName out/outrun-vr-host.exe
          $env:GITHUB_SHA | Set-Content out/HOST_BUILD_SOURCE_SHA.txt -Encoding ascii
          'ACTIVE_R26_R43_R44' | Set-Content out/VARIANT_ID.txt -Encoding ascii
          Get-FileHash out/outrun-vr-host.exe -Algorithm SHA256
      - name: Stage complete same-source copy-run helpers without original game files
        shell: pwsh
        run: |
          New-Item -ItemType Directory out/scripts,out/defaults -Force | Out-Null
          foreach($name in @('QuestCockpit-CopyRun.ps1','QuestCockpit-CopyRestore.ps1',
            'RUN-QUEST-APK-DINO-PBR.cmd','RESTORE-QUEST-APK-COCKPIT.cmd')) {
              Copy-Item -LiteralPath $name -Destination (Join-Path out $name) -Force
          }
          foreach($name in @('Run-OutRunVRTest.ps1','Select-OutRunVRBackend.ps1',
            'OutRunVR-TestProfiles.ps1','Collect-OutRunVRLogs.ps1',
            'Collect-OutRunVRLogs.cmd','Analyze-OutRunVRSession.ps1',
            'Run-QuestCockpitV2-CrashDiag.ps1','analyze_outrun_assets.py')) {
              # The runtime install layout is flat, but the repository stores
              # most helper scripts under tools/. Only the crash diagnostic
              # lives at repository root. Resolve explicit source ownership.
              $src=if($name -eq 'Run-QuestCockpitV2-CrashDiag.ps1') {
                $name
              } else { Join-Path tools $name }
              if(!(Test-Path -LiteralPath $src -PathType Leaf)) {
                throw "Missing source helper for same-SHA package: $src"
              }
              Copy-Item -LiteralPath $src -Destination (Join-Path out/scripts $name) -Force
          }
          foreach($name in @('OutRun2006Tweaks.ini','OutRun2006Tweaks.lods.ini')) {
              Copy-Item -LiteralPath $name -Destination (Join-Path out/defaults $name) -Force
          }
          Copy-Item tools/package_dino_pbr_copyrun.py out/CREATE-DINO-PBR-PACKAGE.py -Force
          Copy-Item BUILD-DINO-PBR-TEST-ZIP.cmd out/BUILD-DINO-PBR-TEST-ZIP.cmd -Force
          if(Test-Path out/OR2006C2C.EXE){throw 'Unsafe original game executable in artifact'}
          Write-Host "Matched Win32/x64 game backend, launchers, defaults and packager staged; no OVC or original EXE included"
      - uses: actions/upload-artifact@v4
        with:
          name: Dino-OVC3-PBR-R26-MatchedDLLHost
          path: out/
          retention-days: 14
          if-no-files-found: error
