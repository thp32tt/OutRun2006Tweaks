name: Source-only 30-pass review

# Trigger file for the one-time source review; removed after verification.
on:
  push:
    branches: [ wheel-ffb ]
    paths:
      - '.github/workflows/source-review30.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wheel-ffb
        uses: actions/checkout@v7.0.1
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Configure review commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate review driver
        run: python3 -m py_compile .github/source_review30.py

      - name: Apply justified 30-pass fixes
        run: python3 .github/source_review30.py

      - name: Push reviewed source commits
        run: git push origin wheel-ffb
