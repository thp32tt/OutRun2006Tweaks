name: OpenXR VR architecture

on:
  push:
    branches: [ vr-openxr ]
    paths:
      - 'src/vr/**'
      - 'src/vr_shared.hpp'
      - 'cmake.toml'
      - 'vrhost/**'
      - 'tools/verify_vr_architecture.py'
      - 'docs/VR_ARCHITECTURE.md'
      - '.github/workflows/vr-openxr.yml'
  pull_request:
    paths:
      - 'src/vr/**'
      - 'src/vr_shared.hpp'
      - 'cmake.toml'
      - 'vrhost/**'
      - 'tools/verify_vr_architecture.py'
      - 'docs/VR_ARCHITECTURE.md'
      - '.github/workflows/vr-openxr.yml'

jobs:
  game-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify reconstructed VR architecture boundaries
        run: python tools/verify_vr_architecture.py

      - name: Configure Win32 VR build
        shell: cmd
        run: |
          set CI=
          cmake -S . -B build-vr-game -G "Visual Studio 17 2022" -A Win32

      - name: Apply dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-vr-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-vr-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-vr-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-vr-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-vr-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-vr-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-vr-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-vr-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-vr-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build Win32 VR DLL and v3 contract
        run: cmake --build build-vr-game --config Release

      - name: Verify Win32 binary
        shell: pwsh
        run: |
          $dllPath = 'build-vr-game/bin/dinput8.dll'
          if (-not (Test-Path $dllPath)) { throw 'dinput8.dll was not produced' }
          $bytes = [System.IO.File]::ReadAllBytes($dllPath)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            'renderer-boundary head tracking + true stereo + 6DoF + plain-D3D9 SBS fallback default',
            'VR stereo: D3D9 full-eye renderer installed',
            'VR stereo: TRUE GEOMETRY STEREO active',
            'VR v3 shadow: live dual-protocol diagnostics active',
            'protocol v3 pose is PRIMARY',
            'v3-primary/v2-fallback frame-latched c64 WVP injection armed',
            'VR D3D9Ex upgrade: Direct3DCreate9 IAT hook armed before game device creation',
            'VR D3D9 probe: deviceType=',
            'VR helper D3D9Ex probe:',
            'R9-finaltest-20260915',
            'VR R9 FIRST FAILURE:',
            'mono safety shadow ready'
          )) {
            if (-not $ascii.Contains($marker)) { throw "VR DLL marker missing: $marker" }
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x014C) { throw 'expected x86 DLL' }

      - uses: actions/upload-artifact@v4
        with:
          name: outrun2006-vr-x86
          path: build-vr-game/bin/dinput8.dll
          if-no-files-found: error

  host-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify reconstructed VR architecture boundaries
        run: python tools/verify_vr_architecture.py

      - name: Configure x64 OpenXR host
        run: cmake -S vrhost -B build-vrhost -G "Visual Studio 17 2022" -A x64

      - name: Build x64 OpenXR host and architecture tests
        run: cmake --build build-vrhost --config Release

      - name: Compile exact stereo HLSL shader
        shell: pwsh
        run: |
          $test = 'build-vrhost/bin/outrun-vr-shader-smoke.exe'
          if (-not (Test-Path $test)) { throw 'shader smoke executable was not produced' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'stereo HLSL failed D3DCompile smoke test' }

      - name: Run protocol v3 cross-bitness contract smoke
        shell: pwsh
        run: |
          $test = 'build-vrhost/bin/outrun-vr-protocol-v3-smoke.exe'
          if (-not (Test-Path $test)) { throw 'protocol v3 smoke executable was not produced' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'protocol v3 contract smoke failed' }

      - name: Run v3 HostState named mapping round-trip
        shell: pwsh
        run: |
          $test = 'build-vrhost/bin/outrun-vr-host-state-v3-channel-smoke.exe'
          if (-not (Test-Path $test)) { throw 'HostState v3 channel smoke executable was not produced' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "HostState v3 channel smoke failed: $LASTEXITCODE" }

      - name: Run v2 to v3 shadow conversion regression
        shell: pwsh
        run: |
          $test = 'build-vrhost/bin/outrun-vr-v2-v3-shadow-conversion-smoke.exe'
          if (-not (Test-Path $test)) { throw 'v2-v3 shadow conversion smoke executable was not produced' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "v2-v3 shadow conversion regression failed: $LASTEXITCODE" }

      - name: Run v3 primary pose validation regression
        shell: pwsh
        run: |
          $test = 'build-vrhost/bin/outrun-vr-host-pose-v3-validation-smoke.exe'
          if (-not (Test-Path $test)) { throw 'v3 pose validation smoke executable was not produced' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "v3 pose validation regression failed: $LASTEXITCODE" }

      - name: Run renderer-independent core math regression
        shell: pwsh
        run: |
          $test = 'build-vrhost/bin/outrun-vr-core-math-smoke.exe'
          if (-not (Test-Path $test)) { throw 'core math smoke executable was not produced' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "core stereo math regression failed: $LASTEXITCODE" }

      - name: Verify x64 host binary
        shell: pwsh
        run: |
          $hostPath = 'build-vrhost/bin/outrun-vr-host.exe'
          if (-not (Test-Path $hostPath)) { throw 'outrun-vr-host.exe was not produced' }
          $bytes = [System.IO.File]::ReadAllBytes($hostPath)
          if ($bytes.Length -lt 10000) { throw 'outrun-vr-host.exe is unexpectedly small' }
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            '[v3] live shadow HostState/AckState bridge ready.',
            'outrun-vr-host-v3.log',
            'outrun-vr-watchdog.log',
            'R9-finaltest-host-20260915',
            '[finaltest] build=',
            '[finaltest] endFrame total=',
            'no-layer OpenXR test pattern ready'
          )) {
            if (-not $ascii.Contains($marker)) { throw "VR host marker missing: $marker" }
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw 'expected x64 host' }

      - uses: actions/upload-artifact@v4
        with:
          name: outrun-vr-host-x64
          path: build-vrhost/bin/outrun-vr-host.exe
          if-no-files-found: error
