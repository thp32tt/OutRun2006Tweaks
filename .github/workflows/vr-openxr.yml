name: OpenXR VR

on:
  push:
    branches: [ vr-openxr ]
    paths:
      - 'src/hooks_vr.cpp'
      - 'src/vr_renderer_probe.cpp'
      - 'src/vr_stereo.cpp'
      - 'src/vr_shared.hpp'
      - 'src/overlay/notifications.hpp'
      - 'src/overlay/update_check.cpp'
      - 'cmake.toml'
      - 'vrhost/**'
      - '.github/workflows/vr-openxr.yml'
  pull_request:
    paths:
      - 'src/hooks_vr.cpp'
      - 'src/vr_renderer_probe.cpp'
      - 'src/vr_stereo.cpp'
      - 'src/vr_shared.hpp'
      - 'src/overlay/notifications.hpp'
      - 'src/overlay/update_check.cpp'
      - 'cmake.toml'
      - 'vrhost/**'
      - '.github/workflows/vr-openxr.yml'

jobs:
  game-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Verify VR render and frame integrity contract
        shell: pwsh
        run: |
          $legacy = Get-Content src/hooks_vr.cpp -Raw
          if ($legacy.Contains('CalcCameraMatrixHook') -or $legacy.Contains('d3dmatrix140 =')) { throw 'legacy camera mutation returned' }
          foreach ($marker in @('CalcCameraMatrix remains untouched','VRStereo','VRCullingCameraSync','VRCullingUnionFov')) {
            if (-not $legacy.Contains($marker)) { throw "missing VR setting marker: $marker" }
          }

          $renderer = Get-Content src/vr_renderer_probe.cpp -Raw
          foreach ($marker in @(
            'BeginSceneVtableIndex = 41','EndSceneVtableIndex = 42','HostPoseStaleMs = 250',
            'ImageContainsRange','VirtualQuery','ClientRendererWvpVerified','ClientRendererUploadFailed',
            'YawOnly','frame-latched c64 WVP injection armed','GetLatchedStereoFrame','GetCurrentShaderEpoch',
            'IsInternalStereoPassActive','InvalidateVerifiedWvp','StereoEyeOrientationValid',
            'DecodePackedEyeOrientations','PackedEyeOrientationOffset',
            'effectiveHeadPosition','delta.x * Settings::VRWorldScale',
            'sample.eyeOffset[eye][0] * Settings::VRWorldScale')) {
            if (-not $renderer.Contains($marker)) { throw "missing renderer safety marker: $marker" }
          }

          $stereo = Get-Content src/vr_stereo.cpp -Raw
          foreach ($marker in @(
            'DrawPrimitiveVtableIndex = 81','DrawIndexedPrimitiveVtableIndex = 82',
            'DrawPrimitiveUPVtableIndex = 83','DrawIndexedPrimitiveUPVtableIndex = 84',
            'SetDepthStencilSurfaceVtableIndex = 39','StereoSbsActive','ProjectionFromFov',
            'BuildEyeConstants','GetVertexShaderConstantF','SetWvpOneRegisterAtATime','ComposeSbs',
            'RightEyeSurface','Simulation, input, timers, native FFB','GetLatchedStereoFrame',
            'GetCurrentShaderEpoch','AnyAuxRenderTargetActive','GetViewport','SetViewport',
            'PublishRenderFrame','SharedRenderFrameState','FrameStereoIncomplete',
            'StereoFailureDepthUnsynchronized','RightDepthSynchronized','presentStart.QuadPart',
            'D3DCLEAR_ZBUFFER) != 0 && count == 0')) {
            if (-not $stereo.Contains($marker)) { throw "missing stereo renderer marker: $marker" }
          }
          if ($stereo.Contains('ReadStereoSnapshot')) { throw 'stereo renderer must not resample shared pose per draw' }
          if ($stereo.Contains('Game::ModeControl()') -or $stereo.Contains('Game::EventControl()') -or $stereo.Contains('WheelFFB_ServiceSafety')) { throw 'stereo renderer must never execute simulation/input/FFB' }
          if ($stereo -match '(?m)^\\t') { throw 'literal backslash-t indentation returned' }

          $presentStamp = $stereo.IndexOf('QueryPerformanceCounter(&presentStart)')
          $presentCall = if ($presentStamp -ge 0) { $stereo.IndexOf('PresentHook.stdcall<HRESULT>', $presentStamp) } else { -1 }
          $activePublish = if ($presentCall -ge 0) { $stereo.IndexOf('PublishStereoState(OutRunVR::StereoSbsActive', $presentCall) } else { -1 }
          $framePublish = if ($activePublish -ge 0) { $stereo.IndexOf('PublishRenderFrame(OutRunVR::StereoSbsActive', $activePublish) } else { -1 }
          if ($presentStamp -lt 0 -or $presentCall -lt $presentStamp -or $activePublish -lt $presentCall -or $framePublish -lt $activePublish) {
            throw 'stereo frame metadata must publish only after the real Present call'
          }

          $shared = Get-Content src/vr_shared.hpp -Raw
          foreach ($marker in @(
            'static_assert(sizeof(SharedPoseState) == 248)',
            'offsetof(SharedPoseState, recommendedWidth) == 104',
            'offsetof(SharedPoseState, recommendedHeight) == 112',
            'offsetof(SharedPoseState, runtimeName) == 120',
            'offsetof(SharedPoseState, reserved) == 184',
            'PackedEyeOrientationOffset = 48','PackedEyeOrientationBytes = 16',
            'recommendedWidth[2]','recommendedHeight[2]','runtimeName[64]',
            'static_assert(sizeof(SharedRenderFrameState) == 256)',
            'StereoViewsValid','StereoEyeOrientationValid','RenderFrameMemoryName',
            'SharedRenderFrameState','RenderFrameEffectivePoseValid','StereoFailureReason',
            'HostEyeOffsetLeftXIndex','HostEyeOffsetRightXIndex','clientStereoPoseSequence',
            'LatchedStereoFrame')) {
            if (-not $shared.Contains($marker)) { throw "missing stereo IPC ABI marker: $marker" }
          }

      - name: Configure Win32 VR build
        shell: cmd
        run: |
          set CI=
          cmake -S . -B build-vr-game -G "Visual Studio 17 2022" -A Win32

      - name: Apply existing dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-vr-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-vr-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-vr-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-vr-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-vr-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-vr-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-vr-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-vr-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-vr-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build Win32 VR DLL
        run: cmake --build build-vr-game --config Release

      - name: Verify VR stereo code is in DLL
        shell: pwsh
        run: |
          $dllPath = "build-vr-game/bin/dinput8.dll"
          if (-not (Test-Path $dllPath)) { throw "dinput8.dll was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($dllPath)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @('renderer-boundary head tracking + true stereo configured','VR renderer inject: verified OutRun c64 = Transpose(WorldView*Proj)','VR stereo: D3D9 full-eye renderer installed','VR stereo: TRUE GEOMETRY STEREO active','VR stereo: SBS transport active')) {
            if (-not $ascii.Contains($marker)) { throw "VR binary marker missing: $marker" }
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014C) { throw ("expected x86 DLL, machine=0x{0:X4}" -f $machine) }

      - name: Package game artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-vr-game/package | Out-Null
          Copy-Item build-vr-game/bin/dinput8.dll build-vr-game/package/dinput8.dll
          Copy-Item OutRun2006Tweaks.ini build-vr-game/package/OutRun2006Tweaks.ini
          Copy-Item OutRun2006Tweaks.lods.ini build-vr-game/package/OutRun2006Tweaks.lods.ini
          Copy-Item VR_OPENXR.md build-vr-game/package/VR_OPENXR.md

      - name: Upload Win32 VR artifact
        uses: actions/upload-artifact@v4
        with:
          name: outrun2006-vr-x86
          path: build-vr-game/package
          if-no-files-found: error

  host-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Verify projection stereo transport and lifecycle
        shell: pwsh
        run: |
          $src = Get-Content vrhost/main_stereo.cpp -Raw
          foreach ($marker in @(
            'DXGI_FORMAT_R16G16B16A16_FLOAT','QuerySdrWhiteScale',
            'XrCompositionLayerProjectionView','XrCompositionLayerProjection','imageArrayIndex=eye','arraySize=2',
            'StereoSbsActive','RenderTheater','EnsureTheaterAnchor','xrRequestExitSession','fs.shouldRender==XR_TRUE',
            'StereoEyeOrientationValid','ToHeadLocalOrientation','StorePackedEyeOrientations',
            'PackedEyeOrientationOffset','recommendedImageRectWidth','RenderFrameReader','SharedRenderFrameState',
            'QpcAtOrAfter','BindCaptureOutput','CommitStereoSource','StereoGraceMs','HostTimings',
            'pendingReferenceSpaceChangeTime')) {
            if (-not $src.Contains($marker)) { throw "missing true-stereo host marker: $marker" }
          }
          if ($src.Contains('InitializeLegacyCaptureRemoved')) { throw 'duplicate legacy capture initializer returned' }
          if ($src.Contains('QpcLowAtOrAfter')) { throw 'obsolete 32-bit QPC matching returned' }
          if ($src.Contains('context_->Flush()')) { throw 'per-frame D3D11 Flush must not return' }

          $metaBefore = $src.IndexOf('renderFrames.Read(before)')
          $capture = if ($metaBefore -ge 0) { $src.IndexOf('compositor.Capture(2)', $metaBefore) } else { -1 }
          $metaAfter = if ($capture -ge 0) { $src.IndexOf('renderFrames.Read(after)', $capture) } else { -1 }
          $commit = if ($metaAfter -ge 0) { $src.IndexOf('compositor.CommitStereoSource()', $metaAfter) } else { -1 }
          if ($metaBefore -lt 0 -or $capture -lt $metaBefore -or $metaAfter -lt $capture -or $commit -lt $metaAfter) {
            throw 'host must validate metadata -> capture -> same metadata before committing stereo source'
          }
          if (-not $src.Contains('before.eye[eye].orientation') -or -not $src.Contains('before.eye[eye].position')) {
            throw 'host must submit renderer-effective eye poses from Frame.v1'
          }

          $shader = Get-Content vrhost/stereo_shader.hpp -Raw
          foreach ($marker in @('UvScale','UvOffset','SrgbToLinear','SourceIsScRgb','linearColor')) {
            if (-not $shader.Contains($marker)) { throw "missing stereo shader marker: $marker" }
          }

      - name: Configure x64 OpenXR host
        run: cmake -S vrhost -B build-vrhost -G "Visual Studio 17 2022" -A x64

      - name: Build x64 OpenXR host and shader test
        run: cmake --build build-vrhost --config Release

      - name: Compile exact stereo HLSL shader
        shell: pwsh
        run: |
          $test = "build-vrhost/bin/outrun-vr-shader-smoke.exe"
          if (-not (Test-Path $test)) { throw "shader smoke executable was not produced" }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "stereo HLSL failed D3DCompile smoke test" }

      - name: Verify host binary
        shell: pwsh
        run: |
          $hostPath = "build-vrhost/bin/outrun-vr-host.exe"
          if (-not (Test-Path $hostPath)) { throw "outrun-vr-host.exe was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($hostPath)
          if ($bytes.Length -lt 10000) { throw "outrun-vr-host.exe is unexpectedly small" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("expected x64 host, machine=0x{0:X4}" -f $machine) }
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @('OpenXR true stereo ready','true stereo projection','LOCAL-fixed theater','another outrun-vr-host already owns')) {
            if (-not $ascii.Contains($marker)) { throw "host binary missing stereo marker: $marker" }
          }

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: outrun-vr-host-x64
          path: build-vrhost/bin/outrun-vr-host.exe
          if-no-files-found: error
