name: Localization Mirrored PSD Layer Inventory
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths: [.github/workflows/localization-local-psd-layer-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PSD layer reader
        run: pip install 'psd-tools[composite]' Pillow
      - name: Verify queue index maps to copied and SHA-verified local PSD
        run: |
          python tools/localization/psd_source_lookup.py --index 60 > q060_psd_lookup.json
          python tools/localization/psd_source_lookup.py --index 121 > q121_psd_lookup.json
          python tools/localization/psd_source_lookup.py --index 49 > q049_psd_lookup.json
          python - <<'PY'
          import json
          for q in (60,121,49):
              j = json.load(open(f'q{q:03d}_psd_lookup.json'))
              assert j['copied_revisions'] >= 1
              print('LOCAL_PSD_VERIFIED', q, j['copied_revisions'])
          PY
      - name: Inspect actual copied q060 q121 q049 source PSD layers
        run: |
          python tools/localization/psd_layer_workbase.py inventory \
            --psd localization/graphics/source_psd_upstream/A064FDFC/872dd766_A064FDFC_1024x512-v02.psd \
            --output _psd_mirror_inventory/q060
          python tools/localization/psd_layer_workbase.py inventory \
            --psd localization/graphics/source_psd_upstream/FD90AA9/68e32365_FD90AA9_1024x1024.psd \
            --output _psd_mirror_inventory/q121
          python tools/localization/psd_layer_workbase.py inventory \
            --psd localization/graphics/source_psd_upstream/BF3EE5C6/498540db_BF3EE5C6_512x512.psd \
            --output _psd_mirror_inventory/q049
      - name: Record actual English candidate layer names, no false CLEAN PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for q in (60,121,49):
              p=Path(f'_psd_mirror_inventory/q{q:03d}/psd_layer_inventory.json')
              j=json.loads(p.read_text())
              names=[{'path':x['path'],'name':x['name'],'kind':x['kind']} for x in j['layers']
                     if any(t in x['name'].lower() for t in
                      ('text','font','goal','time','stage','title','english','sprite','gas','pedal'))]
              print('PSD_ORIGINAL_LAYER_SCAN',q,'canvas',j['size'],'count',len(j['layers']),
                    'interesting',names[:60])
              assert j['C2_PLATE_PASS'] is False
          PY
      - name: Upload PSD inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: copied-psd-layer-inventories
          path: |
            _psd_mirror_inventory/
            q060_psd_lookup.json
            q121_psd_lookup.json
            q049_psd_lookup.json
          retention-days: 5
