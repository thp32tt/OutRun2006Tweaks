name: OutRun HD 8 Existing A/B Source-Owner STRICT Native QA (GitHub CPU)

# Test the real multi-ROI native DDS assembler on the six atlases containing
# eight SHA-pinned and previously BC3-preserved source-owner Korean PNGs.
# The result can lower machine HOLD counts only if the strict assembler does.
# It is NOT a C1/C3 release approval.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/outrun-hd-8-source-owner-native-qa.yml"

permissions:
  contents: read

concurrency:
  group: outrun-hd-eight-owner-native-qa
  cancel-in-progress: true

jobs:
  strict-native-eight:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout exact original source/native atlas code and six DDS only
        uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/localization
            localization/automation_inputs/candidate_outputs
            localization/automation_inputs/native_source_owner_canary
            localization/automation_inputs/hd_original_png_source_plan.json
            localization/test_packages/ab_preparation_20261102/ab_roi_crosswalk.csv
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load/spr_sprani_ranking_cvt_Exst/C598919A_1024x1024.dds
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load/spr_sprani_selector_cvt_Exst/1A43E9D9_512x64.dds
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load/spr_sprani_selector_cvt_Exst/F6811E94_512x64.dds
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load/spr_sprani_sumo_fe_cvt_Exst/55B57CDE_512x512.dds
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow only, no browser/N100/paid API
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Verify no unsafe source-owner SHA or fake C1 acceptance
        run: python -m unittest discover -s tools/localization -p test_hd_bc3_source_owner_import.py -v
      - name: Run six real original DDS atlases through the full strict C1/C3-pending assembler
        run: |
          set -euo pipefail
          python tools/localization/hd_bc3_native_targeted_qa.py \
            --repo-root . --out "$RUNNER_TEMP/source-owner-native-8"
      - name: Publish per-image native DDS result and HOLD reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outrun-hd-eight-source-owner-strict-${{ github.run_id }}
          path: ${{ runner.temp }}/source-owner-native-8/
          retention-days: 30
          if-no-files-found: warn
