name: Apply DX9Ex compatibility review patch

on:
  push:
    branches: [ vr-openxr ]
    paths:
      - tools/apply_dx9ex_compat_review.py
      - .github/workflows/apply-dx9ex-compat-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-openxr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply source patch
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/apply_dx9ex_compat_review.py 2>&1 | Tee-Object "$env:TEMP\dx9ex_patch.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save patch diagnostic
        if: steps.patch.outcome == 'failure'
        shell: pwsh
        run: |
          Copy-Item "$env:TEMP\dx9ex_patch.log" "$env:TEMP\dx9ex_patch_saved.log"
          git reset --hard HEAD
          Copy-Item "$env:TEMP\dx9ex_patch_saved.log" tools/dx9ex_patch_error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/dx9ex_patch_error.txt
          git commit -m "chore(vr): record DX9Ex patch diagnostic"
          git push origin HEAD:vr-openxr
      - name: Remove staging helpers
        if: steps.patch.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item tools/apply_dx9ex_compat_review.py
          Remove-Item .github/workflows/apply-dx9ex-compat-review.yml
          if (Test-Path tools/dx9ex_patch_error.txt) { Remove-Item tools/dx9ex_patch_error.txt }
      - name: Commit source changes
        if: steps.patch.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix(vr): harden D3D9Ex compatibility contract"
          git push origin HEAD:vr-openxr
