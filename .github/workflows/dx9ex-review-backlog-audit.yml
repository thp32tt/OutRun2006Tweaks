name: DX9Ex Review Source Audit

on:
  push:
    branches:
      - vr-d3d9ex-focus
    paths:
      - '.github/workflows/dx9ex-review-backlog-audit.yml'
      - 'tools/audit_dx9ex_review_backlog.py'
      # Re-evaluate live source receipts whenever their implementations move.
      - 'src/vr/d3d9/stereo_renderer.cpp'
      - 'src/vr/d3d9/stereo_renderer_r7.inc'
      - 'src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp'
      - 'src/vr/game/outrun_renderer.cpp'
      - 'src/vr/game/quest_cockpit_v2_phase0_probe.hpp'
      - 'tools/tests/quest_cockpit_v2_phase0_probe_smoke.cpp'
      - 'vrhost/src/main_r23.cpp'
      - 'docs/reviews/dx9ex/automation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read all available review documents
        run: python3 tools/audit_dx9ex_review_backlog.py
      - name: QuestCockpitV2 Phase-0 C++17 bounded correlation smoke
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/tests/quest_cockpit_v2_phase0_probe_smoke.cpp -o /tmp/quest-cockpit-v2-p0
          /tmp/quest-cockpit-v2-p0
      - name: Archive exact-SHA review evidence
        uses: actions/upload-artifact@v4
        with:
          name: dx9ex-review-inventory-${{ github.sha }}
          path: out/reviews/dx9ex/
          if-no-files-found: error
          retention-days: 90
