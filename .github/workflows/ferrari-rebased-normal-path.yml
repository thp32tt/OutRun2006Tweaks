name: Ferrari Rebased Normal-Path CI

on:
  push:
    branches:
      - 'vr-ferrari16-v4-rebased-*'
    paths:
      - '.github/workflows/ferrari-rebased-normal-path.yml'
      - 'src/hooks_graphics.cpp'
      - 'src/vr/d3d9/stereo_renderer_r7.inc'
      - 'src/vr/d3d9/stereo_renderer.cpp'
      - 'src/vr/game/quest_cockpit_v2_runtime.hpp'
      - 'src/vr/game/quest_cockpit_v2_native_frame.hpp'
      - 'src/vr/game/dino_external_*.hpp'
      - 'src/vr/game/external_car_*.hpp'
      - 'src/vr/game/f50_external_pose_filter.hpp'
      - 'tests/external_car_*.cpp'
      - 'tests/game_reset_events_test.cpp'
      - 'src/vr/state/game_reset_events.hpp'
      - 'src/vr/game/outrun_renderer.cpp'
      - 'tools/Run-OutRunVRTest.ps1'
      - 'RUN-QUEST-COCKPIT-V2-FERRARI16.cmd'
      - 'RUN-QUEST-COCKPIT-V2-FERRARI16-FIXED.cmd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-runtime-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build portable external-car regressions
        run: |
          set -euo pipefail
          for test in             external_car_ground_test             external_car_gate_test             external_car_dashboard_test             external_car_sidecar_v4_test; do
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic               "tests/${test}.cpp" -o "/tmp/${test}"
            "/tmp/${test}"
          done

      - name: Prove modeling is only an opt-in gameplay layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          hook = Path('src/hooks_graphics.cpp').read_text(encoding='utf-8')
          runner = Path('tools/Run-OutRunVRTest.ps1').read_text(encoding='utf-8')
          launcher = Path('RUN-QUEST-COCKPIT-V2-FERRARI16.cmd').read_text(encoding='utf-8')
          fixed_launcher = Path('RUN-QUEST-COCKPIT-V2-FERRARI16-FIXED.cmd').read_text(encoding='utf-8')
          external = Path('src/vr/game/dino_external_d3d9.hpp').read_text(encoding='utf-8')
          pbr = Path('src/vr/game/dino_external_pbr_shader.hpp').read_text(encoding='utf-8')
          renderer = Path('src/vr/game/outrun_renderer.cpp').read_text(encoding='utf-8')
          reset_events = Path('src/vr/state/game_reset_events.hpp').read_text(encoding='utf-8')

          # Latest known-good cockpit semantics must survive the rebase.
          for marker in (
              'static bool IsCockpitRacePhase() noexcept',
              'maxCameraConventionGap',
              'ScopedExactProducerSemantic sky',
              'QuestCockpitV2NativeFrameProbe'):
              assert marker in hook, marker

          # External rendering must be gated to an actual gameplay/player/cockpit frame.
          for marker in (
              'struct F50ExternalDrawTicket final',
              '*Game::current_mode != STATE_GAME',
              'player != Game::pl_car()',
              'camera && camera->cam_mode_34A==1',
              'CanReplaceOriginalCar(gate)',
              'OriginalFallback'):
              assert marker in hook, marker

          prep = hook.split('static F50ExternalDrawTicket PrepareF50External',1)[1].split(
              'static bool DrawPreparedF50External',1)[0]
          # Regression guard from the working single-F50 path: menu/loading
          # callbacks must return before reading any player vehicle field.
          assert prep.index('*Game::current_mode != STATE_GAME') < prep.index(
              'const unsigned char carId=player->car_id_10')
          assert prep.index('player != Game::pl_car()') < prep.index(
              'const unsigned char carId=player->car_id_10')

          # The normal runner owns VR policy; modeling only adds its opt-in switches.
          for marker in (
              "QuestCockpitV2ReleaseParity",
              "'-VR.DirectGpuOnly=true'",
              "'-VR.AutoRenderResolution=false'",
              "'-VR.RenderWidth=2496'",
              "'-VR.RenderHeight=2688'",
              "'-VR.FollowGameResolution=false'",
              "ExternalFerrariTest",
              "F50ExternalModel"):
              assert marker in runner, marker

          for marker in (
              '-TestProfile CORRECTNESS',
              '-QuestCockpitV2ReleaseParity ON',
              '-QuestCockpitV2 ON',
              '-QuestCockpitV2F0 ON',
              '-ExternalFerrariTest ON',
              '-F50ExternalModel ON'):
              assert marker in launcher, marker

          # A/B only: reproduce the known-working fixed-function F50 render
          # route without changing the normal/PBR default.
          assert 'OUTRUN_VR_EXTERNAL_FIXED_FUNCTION_TEST=1' in fixed_launcher
          assert 'RUN-QUEST-COCKPIT-V2-FERRARI16.cmd' in fixed_launcher
          assert 'ForceFixedFunctionStereoProbe' in external
          assert 'cpu_.pbrEnabled && !fixedFunctionStereoProbe' in external

          # D3DPOOL_DEFAULT external buffers/textures must be released before
          # the underlying D3D9 Reset/ResetEx. NotifyGameReset is invoked from
          # the stereo Reset owner before the actual reset call.
          assert 'GameResetEvents::NotifyBeforeReset();' in renderer
          assert 'using BeforeResetFn = void (*)() noexcept;' in reset_events
          assert 'GameResetEvents::Configure(&ReleaseExternalBeforeDeviceReset)' in hook
          assert 'GlobalGpu().OnDeviceReset();' in hook
          assert 'GlobalDashboardGpu().OnDeviceReset();' in hook

          # PBR is not yet a proven true-stereo route. Its custom VS owns
          # c0/c4/c8, while the generic programmable stereo path is built
          # around the game's verified c64 WVP lineage. Keep fixed-function
          # A/B available and do not claim PBR stereo parity.
          assert 'row_major float4x4 view : register(c4);' in pbr
          assert 'row_major float4x4 projection : register(c8);' in pbr
          stereo = Path('src/vr/d3d9/stereo_renderer_r7.inc').read_text(encoding='utf-8')
          assert 'constexpr UINT OutRunWvpRegister = 64;' in stereo

          print('FERRARI_REBASED_NORMAL_PATH_CONTRACT_PASS')
          PY

      - name: Reject accidental VR-host or stereo-core fork
        run: |
          set -euo pipefail
          # Pinned reviewed normal baseline. Do not compare to the moving
          # normal branch tip: later diagnostics there must not invalidate a
          # reproducible Ferrari test build.
          baseline=e0167393c164779895e4b34c43ccd618fe635fad
          git fetch origin "$baseline" --depth=1
          changed="$(git diff --name-only "$baseline" HEAD --             vrhost src/vr/d3d9/stereo_renderer_r7.inc src/vr/d3d9/stereo_renderer.cpp             src/vr/game/quest_cockpit_v2_runtime.hpp src/vr/game/quest_cockpit_v2_native_frame.hpp)"
          if [ -n "$changed" ]; then
            echo "Forbidden normal-path drift:"
            echo "$changed"
            exit 1
          fi
          echo "NORMAL_VR_CORE_UNCHANGED_PASS"
