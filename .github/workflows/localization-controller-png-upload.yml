name: Localization PNG Upload Bridge

on:
  push:
    branches:
      - korean-localization-recovery-20260928
    paths:
      - tools/localization/controller_png_attach.py
      - tools/localization/patch_controller_png_upload.py
      - tools/localization/test_controller_png_upload.py
      - tools/localization/deploy_plate_controller.py
      - .github/workflows/localization-controller-png-upload.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-bridge-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile attachment modules
        run: python -m py_compile tools/localization/controller_png_attach.py tools/localization/patch_controller_png_upload.py tools/localization/deploy_plate_controller.py tools/localization/test_controller_png_upload.py
      - name: Run fail-closed attachment and patch unit tests
        run: python -m unittest discover -s tools/localization -p test_controller_png_upload.py -v
      - name: Confirm no automatic deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("tools/localization/deploy_plate_controller.py").read_text()
          assert "docker" in source
          assert "patch_controller_png_upload.py" in source
          assert "if not a.stage:" in source
          print("manual staging contract found; this workflow never calls deploy()")
          PY
