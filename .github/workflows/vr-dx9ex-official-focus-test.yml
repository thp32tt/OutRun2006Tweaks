name: DX9Ex OFFICIAL FOCUS R26 HUD Test and Debug

# USER-DX9EX-LOG-FOLLOWTHROUGH-20261026: full-eye F11 raster, raster-restore telemetry and exact-source validation.

permissions:
  contents: read

on:
  push:
    branches:
      - vr-d3d9ex-focus
    paths:
      - '.github/workflows/vr-dx9ex-official-focus-test.yml'
      - 'tools/Run-FocusOfficialTest.ps1'
      - 'tools/verify_focus_official_diagnostics.py'
      - 'tools/verify_vr_stage_extension_d3dx_batch_owner.py'
      - 'src/hooks_uiscaling.cpp'
      - 'src/hooks_graphics.cpp'
      - 'tools/verify_vr_e_flare_unhidden.py'
      - 'src/hooks_misc.cpp'
      - 'src/vr/d3d9/ex_device_upgrade.cpp'
      - 'src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp'
      - 'src/vr/d3d9/stereo_renderer_r7.inc' # Shared compositor/query-depth guards must revalidate packaged R26.
      - 'src/vr/game/render_semantics.hpp'
      - 'src/vr/settings.cpp'
      - 'OutRun2006Tweaks.ini'
      - 'tools/verify_vr_menu_resolution_split.py'
      - 'tools/verify_vr_d_logfix_20261026.py'
      - 'src/vr/game/hud_command_batch.hpp'
      - 'src/vr/game/stage_extension_source_admission.hpp'
      - 'src/vr/game/goal_progress_source_admission.hpp'
      - 'src/vr/game/sprite_queue_tail_proof.hpp'
      - 'tools/verify_vr_abc_goal_c.py'
      - 'tools/verify_vr_r26_review_apply_20261027.py'
      - 'tools/verify_vr_f11_eye_viewport.py'
      - 'tools/tests/f11_eye_viewport_harness.cpp'
      - 'tools/verify_vr_goal_progress_source_admission.py'
      - 'tools/verify_vr_producer_provenance.py'
      - 'tools/verify_vr_hud_exact_callsite_contract.py'
      - 'tools/verify_vr_visual_composition_p0.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect official source and protected profile
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw 'Wrong exact GitHub HEAD' }
          $lines = Get-Content OutRun2006Tweaks.ini
          $duplicates = @($lines | Where-Object { $_ -match '^\s*DriverSeatCarSpaceBasis\s*=\s*false' })
          if ($duplicates.Count -ne 1) { throw 'Invalid official INI: DriverSeatCarSpaceBasis must occur exactly once' }
          if (-not (Select-String OutRun2006Tweaks.ini -Pattern 'HudScale = 0.55' -SimpleMatch -Quiet)) { throw 'HUD scale changed unexpectedly' }
          if (-not (Select-String OutRun2006Tweaks.ini -Pattern 'AntiAliasing = 2' -SimpleMatch -Quiet)) { throw 'VR MSAA baseline changed unexpectedly' }
          if (-not (Select-String OutRun2006Tweaks.ini -Pattern 'CullingUnionMarginDegrees = 8.0' -SimpleMatch -Quiet)) { throw 'Culling setting changed unexpectedly' }
          if (-not (Select-String OutRun2006Tweaks.ini -Pattern 'DriverSeatView = false' -SimpleMatch -Quiet)) { throw 'Unstable cockpit mode enabled in source INI' }
          if (-not (Select-String src/vr/settings.cpp -Pattern 'Setting<bool> VRDriverSeatView{ "VR", "DriverSeatView", false,' -SimpleMatch -Quiet)) { throw 'Unstable cockpit mode enabled in source defaults' }
          if (-not (Select-String src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp -Pattern 'VR R26 RESULT_HUD_STAGE_HR' -SimpleMatch -Quiet)) { throw 'R26 result HUD stage telemetry missing' }
          if (-not (Select-String src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp -Pattern 'VR R26 RESULT_XYZRHW_PIXEL_PROBE' -SimpleMatch -Quiet)) { throw 'R26 source XYZRHW pixel evidence missing' }
          if (-not (Select-String src/hooks_uiscaling.cpp -Pattern 'VR RIVAL A22 CURRENT QUEUE COMPARE' -SimpleMatch -Quiet)) { throw 'Rival pre/post-native queue comparison missing' }
          if (-not (Select-String src/hooks_uiscaling.cpp -Pattern 'VR RIVAL NATIVE GPU FLUSH SINK' -SimpleMatch -Quiet)) { throw 'Rival actual D3DX Flush sink evidence missing' }
          if (-not (Select-String src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp -Pattern 'VR RIVAL R30 GPU EYES' -SimpleMatch -Quiet)) { throw 'Rival physical stereo eye receipt missing' }
      - name: Validate +TIME entry/reentry/exit plus four destructive ticket regressions
        shell: pwsh
        run: |
          python tools/verify_vr_stage_extension_d3dx_batch_owner.py
          if ($LASTEXITCODE -ne 0) { throw 'Native +TIME ticket/epoch regression failed' }

      - name: Validate R9 physical pre-Draw and R7 occlusion depth guards
        shell: pwsh
        run: |
          python tools/verify_vr_r26_review_apply_20261027.py
          if ($LASTEXITCODE -ne 0) { throw 'DX9Ex review 01516/01521 regression failed' }

      - name: Verify GOAL inner/full exact source and queue epoch admission
        shell: pwsh
        run: |
          python tools/verify_vr_goal_progress_source_admission.py
          if ($LASTEXITCODE -ne 0) { throw 'GOAL progress source admission contract failed' }

      - name: Check ABC C single-child experimental safety
        shell: pwsh
        run: |
          python tools/verify_vr_abc_goal_c.py
          if ($LASTEXITCODE -ne 0) { throw 'ABC C GOAL source fallback contract failed' }

      - name: Verify Quest DEBUG log-derived source fixes
        shell: pwsh
        run: |
          python tools/verify_vr_d_logfix_20261026.py
          if ($LASTEXITCODE -ne 0) { throw 'Quest D log-derived source contract failed' }

      - name: Confirm no flare hiding and exact XR/rival source isolation
        shell: pwsh
        run: |
          python tools/verify_vr_e_flare_unhidden.py
          if ($LASTEXITCODE -ne 0) { throw 'Original flare and Quest E contract failed' }

      - name: Configure Win32 R26+HUD
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32
          $cache = Get-Content build-game/CMakeCache.txt
          if ($cache -notcontains 'OUTRUN_VR_R26_HUD_COMPARE:BOOL=ON') {
            throw 'R26+HUD default renderer is not active'
          }

      - name: Verify runnable diagnostic profile
        run: python tools/verify_focus_official_diagnostics.py

      - name: Execute F11 raster transaction regression
        run: python tools/verify_vr_f11_eye_viewport.py

      - name: Verify protected outer flare path
        run: python tools/verify_dx9ex_r26_projected_flare_fusion.py

      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ''
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build Win32 game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks

      - name: Build x64 OpenXR host
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host

      - name: Snapshot Release payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force payload-release | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $hostExe = Get-ChildItem build-host -Recurse -Filter outrun-vr-host.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dll -or -not $hostExe) { throw 'Missing Release DLL or host' }
          Copy-Item $dll.FullName payload-release/dinput8.dll
          Copy-Item $hostExe.FullName payload-release/outrun-vr-host.exe

      - name: Compile RelWithDebInfo Win32 game and x64 host
        shell: pwsh
        run: |
          cmake --build build-game --config RelWithDebInfo --target outrun2006tweaks
          if ($LASTEXITCODE -ne 0) { throw 'Win32 debug-symbols game build failed' }
          cmake --build build-host --config RelWithDebInfo --target outrun-vr-host
          if ($LASTEXITCODE -ne 0) { throw 'x64 debug-symbols host build failed' }
          New-Item -ItemType Directory -Force payload-debug | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $hostExe = Get-ChildItem build-host -Recurse -Filter outrun-vr-host.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dll -or -not $hostExe) { throw 'Missing RelWithDebInfo DLL or host' }
          Copy-Item $dll.FullName payload-debug/dinput8.dll
          Copy-Item $hostExe.FullName payload-debug/outrun-vr-host.exe
          Get-ChildItem build-game -Recurse -Filter dinput8.pdb | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName payload-debug/dinput8.pdb }
          Get-ChildItem build-host -Recurse -Filter outrun-vr-host.pdb | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName payload-debug/outrun-vr-host.pdb }

      - name: Assemble TEST and DEBUG standalone runnable ZIPs
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,12)
          $parseErrors = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content tools/Run-FocusOfficialTest.ps1 -Raw),[ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
          foreach ($mode in @('TEST','DEBUG')) {
            $variant = if ($mode -eq 'TEST') { 'R26_FOCUS_OFFICIAL_TEST' } else { 'R26_FOCUS_OFFICIAL_DEBUG' }
            $payload = if ($mode -eq 'TEST') { 'payload-release' } else { 'payload-debug' }
            $dir = "OutRun2_VR_R26_FOCUS_OFFICIAL_$($mode)_$short"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "$payload/dinput8.dll" "$dir/dinput8.dll"
            Copy-Item "$payload/outrun-vr-host.exe" "$dir/outrun-vr-host.exe"
            # The repository INI must already be unambiguous: never silently
            # repair duplicate keys only in one packaging workflow.
            Copy-Item OutRun2006Tweaks.ini "$dir/OutRun2006Tweaks.ini"
            $env:OFFICIAL_PACKAGE_INI = (Resolve-Path "$dir/OutRun2006Tweaks.ini").Path
            python -c 'import configparser,os; p=configparser.ConfigParser(strict=True,interpolation=None); p.read(os.environ["OFFICIAL_PACKAGE_INI"],encoding="utf-8"); assert p.getboolean("VR","DriverSeatView") is False; assert p.getfloat("VR","HudScale") == 0.55; assert p.getfloat("VR","CullingUnionMarginDegrees") == 8.0; assert p.getboolean("VR","FollowGameResolution") is False; assert p.getboolean("VR","RivalDx11NativeRoute") is False; assert p.getboolean("VR","DriverSeatCarSpaceBasis") is False; assert p.getboolean("VR","MirrorPreserveAspect") is True; assert p.getint("VR","AntiAliasing") == 2'
            if ($LASTEXITCODE -ne 0) { throw 'Packaged INI strict parse failed' }
            Copy-Item OutRun2006Tweaks.lods.ini "$dir/OutRun2006Tweaks.lods.ini"
            Copy-Item tools/START_FOCUS_OFFICIAL_TEST.cmd "$dir/START_HERE.cmd"
            Copy-Item tools/START_FOCUS_OFFICIAL_TEST.cmd "$dir/RUN_DX9EX_TEST.cmd"
            Copy-Item tools/Run-FocusOfficialTest.ps1 "$dir/Run-FocusOfficialTest.ps1"
            if ($mode -eq 'DEBUG') { Get-ChildItem $payload -Filter *.pdb | ForEach-Object { Copy-Item $_.FullName $dir } }
            # Run-FocusOfficialTest.ps1 requires exactly one standalone
            # variant token. Version diagnostics go in FOCUS_BUILD.txt only.
            Set-Content "$dir/DX9EX_VARIANT.txt" "variant=$variant" -Encoding ascii
            $variantLines = @(Get-Content "$dir/DX9EX_VARIANT.txt")
            if ($variantLines.Count -ne 1 -or $variantLines[0].Trim() -cne "variant=$variant") {
              throw "Packaged FOCUS $mode DX9EX_VARIANT.txt invalid: $($variantLines -join '; ')"
            }
            $parsedVariant = ($variantLines[0] -split '=',2)[1].Trim()
            if ($parsedVariant -cne $variant -or
                $parsedVariant -cnotin @('R26_FOCUS_OFFICIAL_TEST','R26_FOCUS_OFFICIAL_DEBUG')) {
              throw "Packaged FOCUS $mode unexpected test variant"
            }
            Set-Content "$dir/FOCUS_BUILD.txt" @(
              "Branch: vr-d3d9ex-focus"
              "Commit: $env:GITHUB_SHA"
              "Mode: $mode"
              'Base: R26+HUD. Original flare/sun sprites fully rendered.'
              'XR startup live-eye negotiation, rival direct D3DX ownership, GOAL source admission.'
              'RUNTIME_VALIDATION=UNTESTED until Quest 3 verification.'
              'Do not mix packages from other branches.'
            ) -Encoding UTF8
            Set-Content "$dir/SOURCE_SHA.txt" $env:GITHUB_SHA -Encoding ascii
            @(
              'OFFICIAL DX9Ex FOCUS R26+HUD: Quest source follow-through (experimental optics unverified)'
              "Variant: $mode; TEST=Release; DEBUG=RelWithDebInfo and opt-in GPU diagnostics"
              'Original game EXE is not bundled. Backup your current DLL, host, and all INIs before unpacking.'
              '1. Unpack EXACTLY ONE variant ZIP into the original OR2006C2C.EXE directory.'
              '2. Double-click START_HERE.cmd, never launch outrun-vr-host.exe alone.'
              '3. Check DX9EX_LAUNCH_HEALTH.txt and DX9EX_LOGS after game exit.'
              '4. Test menu 4:3, car selection, +TIME, GOAL graph, rank/rival, F11 and cursor, flare/sun/sky.'
              '5. DriverSeatView=false is the default to prevent reported cockpit oscillation.'
              '5a. RESULT_HUD_STAGE_HR logs each eye projection/draw and right-state failures; GOAL optical repair is still unverified.'
              '6. Experimental reflection throttle and particle VB remain disabled.'
              '7. No HMD success claimed; RUNTIME_VALIDATION=UNTESTED.'
              '8. This is the official focus branch build; do not overlay other test branches.'
              '9. Restore backups after testing; return DX9EX_LOGS ZIP and screenshots.'
            ) | Set-Content "$dir/START_HERE.txt" -Encoding UTF8
            foreach ($required in @('START_HERE.cmd','RUN_DX9EX_TEST.cmd','Run-FocusOfficialTest.ps1','dinput8.dll','outrun-vr-host.exe','OutRun2006Tweaks.ini','OutRun2006Tweaks.lods.ini','SOURCE_SHA.txt','DX9EX_VARIANT.txt','FOCUS_BUILD.txt','START_HERE.txt')) {
              if (-not (Test-Path (Join-Path $dir $required))) { throw "Missing packaged $mode file: $required" }
            }
            foreach ($binary in @('dinput8.dll','outrun-vr-host.exe')) {
              $bytes = [IO.File]::ReadAllBytes((Join-Path $dir $binary))
              if ($bytes.Length -lt 512 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "Bad PE: $binary" }
            }
            Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip" -Force
            if ((Get-Item "$dir.zip").Length -lt 250000) { throw "Undersized archive" }
            Get-FileHash "$dir.zip" -Algorithm SHA256 | Format-List
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-R26-OFFICIAL-FOCUS-${{ github.sha }}
          path: OutRun2_VR_R26_FOCUS_OFFICIAL_*.zip
          if-no-files-found: error

