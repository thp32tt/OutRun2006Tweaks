name: Dino 246 GTS External Model Conversion

on:
  push:
    branches:
      - vr-quest-cockpit-v2-external-dino-actions-20261116
    paths:
      - '.github/workflows/dino246gts-external-convert.yml'
      - 'tools/car_importer/github_actions/dino246gts_fetch_audit.py'
      - 'tools/car_importer/github_actions/dino246gts_blender_convert.py'
      - 'tools/car_importer/ferrari16_hq_batch/tools/ferrari_batch_converter.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow

      - name: Download Blender 5.2.4 and KN5 importer
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/dino246"
          mkdir -p "$WORK"
          curl -fL --retry 3             https://mirror.blender.org/release/Blender5.2/blender-5.2.4-linux-x64.tar.xz             -o "$WORK/blender.tar.xz"
          tar -xf "$WORK/blender.tar.xz" -C "$WORK"
          BLENDER="$(find "$WORK" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$BLENDER"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"

          git clone --depth 1 https://github.com/nazariyKul/kn5-blender-tools.git "$WORK/kn5-tools"
          cd "$WORK/kn5-tools"
          test "$(git rev-parse HEAD)" = "502ab4861dd3f324a794db5874c0f8237dbeaa79"
          echo "KN5_TOOLS=$WORK/kn5-tools" >> "$GITHUB_ENV"

      - name: Fetch Dino source and rights audit
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/dino246"
          python tools/car_importer/github_actions/dino246gts_fetch_audit.py --work "$WORK"
          CAR_ROOT="$(python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'dino246'/'source_audit.json'
          print(json.loads(p.read_text(encoding='utf-8'))['car_root'])
          PY
          )"
          echo "CAR_ROOT=$CAR_ROOT" >> "$GITHUB_ENV"

      - name: Blender KN5 to normalized GLB
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/dino246"
          mkdir -p "$WORK/output"
          "$BLENDER" -b             --python tools/car_importer/github_actions/dino246gts_blender_convert.py --             --source-audit "$WORK/source_audit.json"             --kn5-tools "$KN5_TOOLS"             --output "$WORK/output"

      - name: Convert GLB to OVC3
        shell: bash
        run: |
          set -euo pipefail
          ROOT="tools/car_importer/ferrari16_hq_batch"
          mkdir -p "$ROOT/sources/dino246gts" "$ROOT/outputs/dino246gts"
          cp "${RUNNER_TEMP}/dino246/output/source.glb" "$ROOT/sources/dino246gts/source.glb"
          cp "${RUNNER_TEMP}/dino246/output/source.json" "$ROOT/sources/dino246gts/source.json"
          rm -f "$ROOT/outputs/dino246gts/dino246gts_External_Test.ovc"                 "$ROOT/outputs/dino246gts/conversion_report.json"
          python "$ROOT/tools/ferrari_batch_converter.py" audit --workspace "$ROOT" --car dino246gts --strict
          python "$ROOT/tools/ferrari_batch_converter.py" convert --workspace "$ROOT" --car dino246gts
          python "$ROOT/tools/ferrari_batch_converter.py" verify --workspace "$ROOT" --car dino246gts

      - name: Package private test artifact
        shell: bash
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/Dino246GTS_Private_Test"
          mkdir -p "$PKG/ExternalCars" "$PKG/QA"
          cp tools/car_importer/ferrari16_hq_batch/outputs/dino246gts/dino246gts_External_Test.ovc              "$PKG/ExternalCars/car_id_01.ovc"
          cp tools/car_importer/ferrari16_hq_batch/outputs/dino246gts/conversion_report.json "$PKG/QA/"
          cp "${RUNNER_TEMP}/dino246/output/source.json" "$PKG/QA/"
          cp "${RUNNER_TEMP}/dino246/source_audit.json" "$PKG/QA/"
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'Dino246GTS_Private_Test'
          ovc=root/'ExternalCars'/'car_id_01.ovc'
          report={
            'car_id': 1,
            'vehicle': 'Dino 246 GTS',
            'ovc_bytes': ovc.stat().st_size,
            'ovc_sha256': hashlib.sha256(ovc.read_bytes()).hexdigest(),
            'distribution': 'PRIVATE_TEST_ONLY',
            'runtime_state': 'OVC_STATIC_QA_PASS_NOT_QUEST_LIVE_TESTED',
          }
          (root/'QA'/'package_report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Upload private test package
        uses: actions/upload-artifact@v4
        with:
          name: Dino246GTS-Private-Test-${{ github.sha }}
          path: ${{ runner.temp }}/Dino246GTS_Private_Test
          if-no-files-found: error
          retention-days: 1
