name: DX11 Exhaustive HMD Candidate Package

permissions:
  contents: read

on:
  push:
    branches:
      - test/dx11-exhaustive-census-20261004
      - test/dx11-xr-cadence-performance-20261004
  workflow_dispatch:

concurrency:
  group: dx11-exhaustive-hmd-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Build packaged runtime test ZIP
        shell: pwsh
        env:
          OUTRUN_TEST_DROP_ROOT: ${{ github.workspace }}\out\hosted-drop
        run: |
          ./tools/Build-OutRunPCFast.ps1
          $zip = (Get-Content out/pc-fast/LAST_ZIP_PATH.txt -Raw).Trim()
          if (-not (Test-Path $zip -PathType Leaf)) { throw "Test ZIP missing: $zip" }
          "OUTRUN_TEST_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload runtime test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-DX11-EXHAUSTIVE-${{ github.sha }}
          path: ${{ env.OUTRUN_TEST_ZIP }}
          if-no-files-found: error
          retention-days: 7
