name: VR Release v0.01 Beta

on:
  push:
    branches:
      - vr-d3d9ex-focus
    paths:
      - '.github/workflows/vr-release-v0.01-beta.yml'
      - 'src/dllmain.cpp'
      - 'src/vr/settings.cpp'
      - 'src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp'
      - 'src/overlay/hooks_overlay.cpp'
      - 'vrhost/src/main.cpp'
      - 'vrhost/src/main_r23.cpp'
      - 'OutRun2006Tweaks.ini'
      - 'OutRun2006Tweaks.lods.ini'
      - 'tools/verify_vr_release_quiet_profile.py'
      - 'RELEASE_NOTES_VR_v0.01-beta.md'
      - 'Start-OutRun-VR.cmd'
      - 'Start-OutRun.cmd'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish/replace the GitHub prerelease after user runtime validation'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release_notes_only:
    if: "${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'release-notes-only') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit vr-v0.01-beta \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file RELEASE_NOTES_VR_v0.01-beta.md

  release:
    if: "${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, 'release-notes-only')) }}"
    # Relevant pushes build a candidate artifact only. Publishing is a separate
    # manual action after direct-EXE 2D and VR launcher runtime validation.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify quiet release profile
        shell: pwsh
        run: |
          python tools/verify_vr_release_quiet_profile.py
          if ($LASTEXITCODE -ne 0) { throw 'v0.01-beta quiet release profile failed' }
          python tools/verify_vr_r26_projected_particle_canvas.py
          if ($LASTEXITCODE -ne 0) { throw 'particle fastpath regression failed' }
          python tools/verify_vr_r26_mono_elision.py
          if ($LASTEXITCODE -ne 0) { throw 'mono-elision regression failed' }
          python tools/verify_vr_menu_resolution_split.py
          if ($LASTEXITCODE -ne 0) { throw 'menu coordinate regression failed' }
          python tools/verify_vr_menu_letterbox_aspect.py
          if ($LASTEXITCODE -ne 0) { throw 'letterbox physical-map regression failed' }

      - name: Configure Win32 R26+HUD
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32
          $cache = Get-Content build-game/CMakeCache.txt
          if ($cache -notcontains 'OUTRUN_VR_R26_HUD_COMPARE:BOOL=ON') {
            throw 'R26+HUD default renderer is not active'
          }

      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ''
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build Win32 game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks

      - name: Build x64 OpenXR host
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host

      - name: Assemble v0.01 Beta
        shell: pwsh
        run: |
          $dir = 'OutRun2_VR_v0.01_Beta'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw 'dinput8.dll missing' }
          $hostExe = Get-ChildItem build-host -Recurse -Filter outrun-vr-host.exe | Select-Object -First 1
          if (-not $hostExe) { throw 'outrun-vr-host.exe missing' }

          Copy-Item $dll.FullName "$dir/dinput8.dll"
          Copy-Item $hostExe.FullName "$dir/outrun-vr-host.exe"
          Copy-Item OutRun2006Tweaks.ini "$dir/OutRun2006Tweaks.ini"
          Copy-Item OutRun2006Tweaks.lods.ini "$dir/OutRun2006Tweaks.lods.ini"
          Copy-Item Start-OutRun.cmd "$dir/Start-OutRun.cmd"
          Copy-Item Start-OutRun-VR.cmd "$dir/Start-OutRun-VR.cmd"

          # Release-only entrypoint policy: direct OR2006C2C.exe is 2D.
          # The dedicated launcher overrides VR.Enabled on its command line.
          $releaseIni = "$dir/OutRun2006Tweaks.ini"
          $inVr = $false
          $enabledPatched = $false
          $patchedIni = foreach ($line in Get-Content $releaseIni) {
            if ($line -match '^\s*\[([^]]+)\]\s*$') {
              $inVr = ($Matches[1] -ieq 'VR')
            }
            if ($inVr -and -not $enabledPatched -and $line -match '^\s*Enabled\s*=') {
              'Enabled = false'
              $enabledPatched = $true
            } else {
              $line
            }
          }
          if (-not $enabledPatched) { throw 'release INI [VR] Enabled key not found' }
          $patchedIni | Set-Content $releaseIni -Encoding utf8
          if (Test-Path LICENSES.txt) { Copy-Item LICENSES.txt "$dir/LICENSES.txt" }
          Copy-Item RELEASE_NOTES_VR_v0.01-beta.md "$dir/README_VR_v0.01_Beta.md"
          Set-Content "$dir/VR_RELEASE_VERSION.txt" 'OutRun 2006 VR v0.01 Beta (crash fix)' -Encoding ascii
          Set-Content "$dir/SOURCE_SHA.txt" $env:GITHUB_SHA -Encoding ascii
          @(
            'DirectExeMode=2D'
            'SelectorEntrypoint=Start-OutRun.cmd'
            'VrEntrypoint=Start-OutRun-VR.cmd'
            'SharedDllIncludesFFB=true'
            'PowerShellRequired=false'
            'DirectGpuOnly=true'
            'Graphics.ReflectionUpdateRate=0.25'
            'Graphics.TransparencySupersampling=false'
            'VR.TransparencySupersampling=false'
            'OUTRUN_VR_R23_PIXEL_PROBE=OFF (default)'
            'VR.Telemetry=false'
            'VR.FileLogging=false'
            'GitHubReleaseUpdatePolling=REMOVED'
            'RUNTIME_VALIDATION=FOCUS_USER_CONFIRMED_ENTRYPOINT_CI_PASS_PC_RETEST_PENDING'
          ) | Set-Content "$dir/VR_RELEASE_PROFILE.txt" -Encoding ascii

          $env:VR_RELEASE_INI = (Resolve-Path "$dir/OutRun2006Tweaks.ini").Path
          python -c 'import configparser,os; p=configparser.ConfigParser(strict=True,interpolation=None); p.read(os.environ["VR_RELEASE_INI"],encoding="utf-8-sig"); assert p.getboolean("VR","Enabled") is False; assert p.getboolean("VR","DirectGpuOnly") is True; assert abs(p.getfloat("Graphics","ReflectionUpdateRate")-0.25)<1e-9; assert p.getboolean("Graphics","TransparencySupersampling") is False; assert p.getboolean("VR","TransparencySupersampling") is False; assert p.getboolean("VR","Telemetry") is False; assert p.getboolean("VR","FileLogging") is False'
          if ($LASTEXITCODE -ne 0) { throw 'release INI profile mismatch' }

          foreach ($forbidden in @(
            'RUN_DX9EX_TEST.cmd','Run-DX9ExFocusTest.ps1',
            'Run-FocusOfficialTest.ps1','Run-OutRunVRTest.ps1',
            'Collect-OutRunVRLogs.ps1','Collect-OutRunVRLogs.cmd')) {
            if (Test-Path (Join-Path $dir $forbidden)) {
              throw "diagnostic file leaked into release: $forbidden"
            }
          }

          if (-not (Test-Path "$dir/Start-OutRun.cmd")) { throw '2D/VR selector missing' }
          if (-not (Test-Path "$dir/Start-OutRun-VR.cmd")) { throw 'VR shortcut missing' }
          $selectorText = Get-Content "$dir/Start-OutRun.cmd" -Raw
          foreach ($requiredToken in @(
            'OUTRUN_VR_FORCE_DISABLED=1',
            'OUTRUN_VR_LAUNCH=1',
            '-VR.Enabled=true',
            '-VR.PreferD3D9Ex=true',
            '-VR.DirectGpuOnly=true',
            '-VR.AutoRenderResolution=true',
            '-VR.MirrorFitDesktop=true',
            '-VR.Hud1080pReference=true',
            '-VR.MenuScale=0.75')) {
            if ($selectorText -notmatch [regex]::Escape($requiredToken)) {
              throw "release selector missing validated launch token: $requiredToken"
            }
          }

          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "$dir/*" -DestinationPath 'release/OutRun2_VR_v0.01_Beta.zip' -Force
          Get-FileHash 'release/OutRun2_VR_v0.01_Beta.zip' -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-v0.01-Beta-${{ github.sha }}
          path: release/OutRun2_VR_v0.01_Beta.zip
          if-no-files-found: error

      - name: Publish corrected beta with numeric tag and preserved legacy link
        if: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'release(vr): v0.01-beta publish')) }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $numericTag = 'v0.01'
          $legacyTag = 'vr-v0.01-beta'
          $assetPath = 'release/OutRun2_VR_v0.01_Beta.zip'
          $assetName = 'OutRun2_VR_v0.01_Beta.zip'
          $notesPath = 'RELEASE_NOTES_VR_v0.01-beta.md'
          $releaseTitle = 'OutRun 2006 VR v0.01 Beta (crash fix)'
          if (!(Test-Path $assetPath)) { throw 'Verified release package missing' }
          $expectedLength = (Get-Item $assetPath).Length
          $expectedHash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()

          # Canonical numeric release: legacy stoi parsers can read v0.01.
          # It stays a prerelease, so /releases/latest continues returning v0.2.
          gh release view $numericTag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $numericTag $assetPath --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw 'Canonical beta upload failed' }
            gh release edit $numericTag --repo $repo --prerelease --title $releaseTitle --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'Canonical beta metadata update failed' }
          } else {
            gh release create $numericTag $assetPath --repo $repo --target $env:GITHUB_SHA --title $releaseTitle --notes-file $notesPath --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Canonical numeric-tag beta creation failed' }
          }

          # Keep links shared before this fix working: update the old asset
          # instead of deleting the release, tag or its download URL.
          gh release view $legacyTag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Legacy release missing; refusing to delete user-facing link' }
          gh release upload $legacyTag $assetPath --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'Legacy beta asset replacement failed' }
          gh release edit $legacyTag --repo $repo --prerelease --title 'OutRun 2006 VR v0.01 Beta (legacy download link)' --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Legacy beta metadata edit failed' }

          foreach ($tag in @($numericTag, $legacyTag)) {
            $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Readback failed for $tag" }
            if (-not $release.prerelease) { throw "$tag must remain a prerelease" }
            $matching = @($release.assets | Where-Object { $_.name -eq $assetName })
            if ($matching.Count -ne 1) { throw "$tag release ZIP missing or duplicated" }
            if ($matching[0].size -ne $expectedLength) { throw "$tag release ZIP size mismatch" }
            if ($matching[0].digest -and $matching[0].digest -ne "sha256:$expectedHash") {
              throw "$tag release ZIP SHA256 mismatch"
            }
            Write-Host "PUBLISHED_VERIFIED tag=$tag id=$($release.id) asset=$assetName sha256=$expectedHash source=$env:GITHUB_SHA"
          }
          $latest = gh api "repos/$repo/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -ne 'v0.2') {
            throw 'Legacy executable safety: /releases/latest is not the expected numeric v0.2'
          }
          Write-Host 'LEGACY_CLIENT_LATEST_SAFE=v0.2'
