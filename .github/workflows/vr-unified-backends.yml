name: Unified VR Backend Test Package

on:
  workflow_dispatch:
  push:
    branches: [ vr-unified-backends ]
    paths:
      - 'tools/Select-OutRunVRBackend.*'
      - 'tools/OutRunVR-Backend-Selector.*'
      - 'docs/VR_UNIFIED_TEST_SCENARIO.md'
      - '.github/workflows/vr-unified-backends.yml'

concurrency:
  group: vr-unified-backends-package
  cancel-in-progress: true

jobs:
  d3d9-safe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-unified-backends
          submodules: recursive
      - name: Configure Win32 D3D9 safe game
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=ON
      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      - name: Build game
        run: cmake --build build-game --config Release --target outrun2006tweaks
      - name: Build x64 D3D11 OpenXR host
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host
      - name: Stage D3D9 safe payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw "D3D9 dinput8.dll missing" }
          Copy-Item $dll.FullName stage/dinput8.dll
          Copy-Item build-host/bin/outrun-vr-host.exe stage/outrun-vr-host.exe
          git rev-parse HEAD | Set-Content stage/SOURCE_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unified-d3d9-safe
          path: stage/
          if-no-files-found: error

  dx12:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-dx12-poc
          submodules: recursive
      - name: Configure Win32 DX12 strict game
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=ON
      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      - name: Build strict DX12 game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks
      - name: Build native x64 D3D12 OpenXR host
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host-dx12
      - name: Stage DX12 payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw "DX12 game dinput8.dll missing" }
          Copy-Item $dll.FullName stage/dinput8.dll
          Copy-Item build-host/bin/outrun-vr-host-dx12.exe stage/outrun-vr-host.exe
          git rev-parse HEAD | Set-Content stage/SOURCE_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unified-dx12
          path: stage/
          if-no-files-found: error

  dxvk-game-host:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-dxvk-poc
          submodules: recursive
      - name: Configure Win32 DXVK-aware game
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=ON
      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      - name: Build DXVK-aware game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks
      - name: Build x64 OpenXR host
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host
      - name: Stage DXVK game and host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw "DXVK game dinput8.dll missing" }
          Copy-Item $dll.FullName stage/dinput8.dll
          Copy-Item build-host/bin/outrun-vr-host.exe stage/outrun-vr-host.exe
          git rev-parse HEAD | Set-Content stage/SOURCE_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unified-dxvk-game-host
          path: stage/
          if-no-files-found: error

  dxvk-provider:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm git meson ninja mingw-w64-gcc glslang python
      - uses: actions/checkout@v4
        with:
          ref: vr-dxvk-poc
      - name: Build OutRun DXVK provider
        run: |
          git clone --branch latest --depth 1 --recurse-submodules --shallow-submodules https://github.com/Detegr/dxvk-openRBRVR.git dxvk-src
          cd dxvk-src
          python3 ../dxvk-fork/apply_openrbrvr_layer_switch.py
          meson setup --cross-file build-win32.txt --buildtype release --prefix "$GITHUB_WORKSPACE/dxvk-install" build.w32
          cd ..
          ninja -C dxvk-src/build.w32 install
          mkdir -p stage
          p=$(find dxvk-install -type f -iname d3d9.dll | head -n 1)
          test -n "$p"
          cp "$p" stage/d3d9.dll
          cp dxvk-src/LICENSE stage/LICENSE-DXVK-openRBRVR.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unified-dxvk-provider
          path: stage/
          if-no-files-found: error

  multiview-patcher:
    runs-on: windows-2022
    steps:
      - name: Build multiview patcher
        shell: pwsh
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Detegr/RBR-spirvpatcher.git patcher-src
          Push-Location patcher-src/spirv-tools
          python utils/git-sync-deps
          Pop-Location
          cmake -S patcher-src -B patcher-build -A Win32 -DCMAKE_BUILD_TYPE=Release
          cmake --build patcher-build --config Release
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item patcher-build/src/Release/multiviewpatcher.dll stage/multiviewpatcher.dll
          Copy-Item patcher-src/LICENSE stage/LICENSE-RBR-spirvpatcher-MPL-2.0.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unified-multiview-patcher
          path: stage/
          if-no-files-found: error

  package:
    runs-on: windows-2022
    needs: [d3d9-safe, dx12, dxvk-game-host, dxvk-provider, multiview-patcher]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-unified-backends
      - uses: actions/download-artifact@v4
        with:
          name: unified-d3d9-safe
          path: payload/d3d9
      - uses: actions/download-artifact@v4
        with:
          name: unified-dx12
          path: payload/dx12
      - uses: actions/download-artifact@v4
        with:
          name: unified-dxvk-game-host
          path: payload/dxvk
      - uses: actions/download-artifact@v4
        with:
          name: unified-dxvk-provider
          path: payload/dxvk-extra
      - uses: actions/download-artifact@v4
        with:
          name: unified-multiview-patcher
          path: payload/dxvk-patcher
      - name: Assemble unified test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/backends/d3d9 | Out-Null
          New-Item -ItemType Directory -Force package/backends/dxvk | Out-Null
          New-Item -ItemType Directory -Force package/backends/dx12 | Out-Null

          Copy-Item payload/d3d9/dinput8.dll package/backends/d3d9/dinput8.dll
          Copy-Item payload/d3d9/outrun-vr-host.exe package/backends/d3d9/outrun-vr-host.exe
          Copy-Item payload/d3d9/SOURCE_SHA.txt package/backends/d3d9/SOURCE_SHA.txt

          Copy-Item payload/dxvk/dinput8.dll package/backends/dxvk/dinput8.dll
          Copy-Item payload/dxvk/outrun-vr-host.exe package/backends/dxvk/outrun-vr-host.exe
          Copy-Item payload/dxvk/SOURCE_SHA.txt package/backends/dxvk/SOURCE_SHA.txt
          Copy-Item payload/dxvk-extra/d3d9.dll package/backends/dxvk/d3d9.dll
          Copy-Item payload/dxvk-extra/LICENSE-DXVK-openRBRVR.txt package/backends/dxvk/LICENSE-DXVK-openRBRVR.txt
          Copy-Item payload/dxvk-patcher/multiviewpatcher.dll package/backends/dxvk/multiviewpatcher.dll
          Copy-Item payload/dxvk-patcher/LICENSE-RBR-spirvpatcher-MPL-2.0.txt package/backends/dxvk/LICENSE-RBR-spirvpatcher-MPL-2.0.txt

          Copy-Item payload/dx12/dinput8.dll package/backends/dx12/dinput8.dll
          Copy-Item payload/dx12/outrun-vr-host.exe package/backends/dx12/outrun-vr-host.exe
          Copy-Item payload/dx12/SOURCE_SHA.txt package/backends/dx12/SOURCE_SHA.txt

          Copy-Item OutRun2006Tweaks.ini package/OutRun2006Tweaks.ini
          Copy-Item OutRun2006Tweaks.lods.ini package/OutRun2006Tweaks.lods.ini
          Copy-Item tools/Select-OutRunVRBackend.ps1 package/Select-OutRunVRBackend.ps1
          Copy-Item tools/Select-OutRunVRBackend.cmd package/Select-OutRunVRBackend.cmd
          Copy-Item tools/OutRunVR-Backend-Selector.ps1 package/OutRunVR-Backend-Selector.ps1
          Copy-Item tools/OutRunVR-Backend-Selector.cmd package/OutRunVR-Backend-Selector.cmd
          Copy-Item tools/Collect-OutRunVRLogs.ps1 package/Collect-OutRunVRLogs.ps1
          Copy-Item tools/Collect-OutRunVRLogs.cmd package/Collect-OutRunVRLogs.cmd
          Copy-Item docs/VR_UNIFIED_TEST_SCENARIO.md package/VR_UNIFIED_TEST_SCENARIO.md

          $ini = Get-Content package/OutRun2006Tweaks.ini -Raw
          $ini = [regex]::Replace($ini, '(?m)^SkyGlowFactor\s*=.*$', 'SkyGlowFactor = 1')
          Set-Content package/OutRun2006Tweaks.ini $ini -Encoding UTF8

          Copy-Item package/backends/d3d9/dinput8.dll package/dinput8.dll
          Copy-Item package/backends/d3d9/outrun-vr-host.exe package/outrun-vr-host.exe
          Set-Content package/ACTIVE_VR_BACKEND.txt "backend=d3d9"

          Get-ChildItem package -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $([IO.Path]::GetRelativePath((Resolve-Path package), $_.Path))"
          } | Set-Content package/SHA256SUMS.txt

          $short = $env:GITHUB_SHA.Substring(0,12)
          Compress-Archive -Path package/* -DestinationPath "OutRun2_VR_UNIFIED_$short.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-UNIFIED-${{ github.sha }}
          path: OutRun2_VR_UNIFIED_*.zip
          if-no-files-found: error
