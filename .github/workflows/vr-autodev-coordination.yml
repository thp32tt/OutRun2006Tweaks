name: VR Autodev Coordination

on:
  workflow_dispatch:
  push:
    branches: [ vr-d3d9ex-focus ]
    paths:
      - 'docs/VR_AUTODEV_PROTOCOL.md'
      - 'docs/VR_AUTODEV_STATE.json'
      - 'docs/VR_WORK_QUEUE.json'
      - 'docs/VR_RUNTIME_FEEDBACK.json'
      - 'docs/automation/**'
      - 'tools/Test-VRAutodevCoordination.ps1'
      - '.github/workflows/vr-autodev-coordination.yml'
      - '.github/workflows/vr-dx9ex-active.yml'

concurrency:
  group: vr-autodev-coordination
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate four-role coordination contract
        shell: pwsh
        run: ./tools/Test-VRAutodevCoordination.ps1
