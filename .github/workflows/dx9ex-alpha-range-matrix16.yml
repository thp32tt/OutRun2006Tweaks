name: DX9Ex Target Matrix6

on:
  workflow_dispatch:
  push:
    branches: [ vr-d3d9ex-alpha-range-matrix16 ]
    paths:
      - 'src/vr/d3d9/**'
      - 'src/vr/game/**'
      - 'vrhost/**'
      - 'cmake.toml'
      - 'tools/Run-DX9Ex-Range16-Test.ps1'
      - 'tools/RUN_DX9EX_RANGE16_TEST.cmd'
      - '.github/workflows/dx9ex-alpha-range-matrix16.yml'

concurrency:
  group: dx9ex-target-matrix6
  cancel-in-progress: true

jobs:
  host:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build OpenXR host
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host
          if (-not (Test-Path build-host/bin/outrun-vr-host.exe)) { throw "host missing" }
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build-host/bin/outrun-vr-host.exe stage/outrun-vr-host.exe
          Set-Content stage/HOST_SHA.txt $env:GITHUB_SHA -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: dx9ex-m6-host
          path: stage/
          if-no-files-found: error

  game:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: T0_BASE_STABLE
            r26hud: ON
            c1: OFF
            c2: OFF
            range: NONE
            hud: OFF
            common: OFF
            commonEye: OFF
            purpose: "Stable S0 renderer + persistent last-good stereo Host"
          - variant: T1_HUD_33_128
            r26hud: ON
            c1: OFF
            c2: OFF
            range: R33_128
            hud: ON
            common: OFF
            commonEye: OFF
            purpose: "Depth-off alpha 33..128 primitives -> PerspectiveHud"
          - variant: T2_HUD_129_512
            r26hud: ON
            c1: OFF
            c2: OFF
            range: R129_512
            hud: ON
            common: OFF
            commonEye: OFF
            purpose: "Depth-off alpha 129..512 primitives -> PerspectiveHud"
          - variant: T3_HUD_513_1024
            r26hud: ON
            c1: OFF
            c2: OFF
            range: R513_1024
            hud: ON
            common: OFF
            commonEye: OFF
            purpose: "Depth-off alpha 513..1024 primitives -> PerspectiveHud"
          - variant: T4_WHITE_COMMON_33_512
            r26hud: ON
            c1: OFF
            c2: OFF
            range: R33_512
            hud: OFF
            common: ON
            commonEye: ON
            purpose: "Depth-off alpha 33..512 primitives -> identical-eye FlatEffectHud for white overlays"
          - variant: T5_FAST_C2_HUD
            r26hud: OFF
            c1: OFF
            c2: ON
            range: NONE
            hud: OFF
            common: OFF
            commonEye: OFF
            purpose: "R29 LEFT+RIGHT-only fast path + R30 HUD correction; performance comparison"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure ${{ matrix.variant }}
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          $r33128 = if ('${{ matrix.range }}' -eq 'R33_128') {'ON'} else {'OFF'}
          $r129512 = if ('${{ matrix.range }}' -eq 'R129_512') {'ON'} else {'OFF'}
          $r33512 = if ('${{ matrix.range }}' -eq 'R33_512') {'ON'} else {'OFF'}
          $r513 = if ('${{ matrix.range }}' -eq 'R513_1024') {'ON'} else {'OFF'}
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32 `
            -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF `
            -DOUTRUN_VR_R26_HUD_COMPARE=${{ matrix.r26hud }} `
            -DOUTRUN_VR_C1_COMPARE=${{ matrix.c1 }} `
            -DOUTRUN_VR_C2_COMPARE=${{ matrix.c2 }} `
            -DOUTRUN_VR_OVERLAY_OWNER_FIRST=OFF `
            -DOUTRUN_VR_OVERLAY_LIVE_FIRST=OFF `
            -DOUTRUN_VR_OVERLAY_WINDOW_32=OFF `
            -DOUTRUN_VR_OVERLAY_SPATIAL_DEPTH_4=OFF `
            -DOUTRUN_VR_OVERLAY_SPATIAL_DEPTH_8=OFF `
            -DOUTRUN_VR_R13_FLAT_PREEMPT=OFF `
            -DOUTRUN_VR_R13_FLAT_PREEMPT_BROAD=OFF `
            -DOUTRUN_VR_R13_FLAT_COMMON=${{ matrix.commonEye }} `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_2=OFF `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_4=OFF `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_8=OFF `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_16=OFF `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_32=OFF `
            -DOUTRUN_VR_ALPHA_RANGE_33_128=$r33128 `
            -DOUTRUN_VR_ALPHA_RANGE_129_512=$r129512 `
            -DOUTRUN_VR_ALPHA_RANGE_33_512=$r33512 `
            -DOUTRUN_VR_ALPHA_RANGE_33_64=OFF `
            -DOUTRUN_VR_ALPHA_RANGE_65_128=OFF `
            -DOUTRUN_VR_ALPHA_RANGE_129_256=OFF `
            -DOUTRUN_VR_ALPHA_RANGE_257_512=OFF `
            -DOUTRUN_VR_ALPHA_RANGE_513_1024=$r513 `
            -DOUTRUN_VR_SMALL_ALPHA_HUD=${{ matrix.hud }} `
            -DOUTRUN_VR_SMALL_ALPHA_COMMON=${{ matrix.common }} `
            -DOUTRUN_VR_SMALL_ALPHA_ANYZ_MATRIX=OFF
      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      - name: Build game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks
      - name: Stage game DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw "dinput8.dll missing" }
          Copy-Item $dll.FullName stage/dinput8.dll
          @(
            "variant=${{ matrix.variant }}"
            "sourceSha=$env:GITHUB_SHA"
            "range=${{ matrix.range }}"
            "r26Hud=${{ matrix.r26hud }}"
            "c2=${{ matrix.c2 }}"
            "hud=${{ matrix.hud }}"
            "common=${{ matrix.common }}"
            "purpose=${{ matrix.purpose }}"
          ) | Set-Content stage/RANGE16_VARIANT.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: dx9ex-m6-${{ matrix.variant }}
          path: stage/
          if-no-files-found: error

  package:
    runs-on: windows-2022
    needs: [host, game]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dx9ex-m6-host
          path: payload/host
      - uses: actions/download-artifact@v4
        with:
          pattern: dx9ex-m6-T*
          path: payload/games
          merge-multiple: false
      - name: Assemble six tester ZIPs
        shell: pwsh
        run: |
          $variants = @(
            'T0_BASE_STABLE',
            'T1_HUD_33_128',
            'T2_HUD_129_512',
            'T3_HUD_513_1024',
            'T4_WHITE_COMMON_33_512',
            'T5_FAST_C2_HUD'
          )
          New-Item -ItemType Directory -Force output | Out-Null
          foreach ($variant in $variants) {
            $dir = Join-Path package $variant
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "payload/games/dx9ex-m6-$variant/dinput8.dll" (Join-Path $dir 'dinput8.dll')
            Copy-Item "payload/games/dx9ex-m6-$variant/RANGE16_VARIANT.txt" (Join-Path $dir 'RANGE16_VARIANT.txt')
            Copy-Item payload/host/outrun-vr-host.exe (Join-Path $dir 'outrun-vr-host.exe')
            Copy-Item tools/Run-DX9Ex-Range16-Test.ps1 (Join-Path $dir 'Run-DX9Ex-Range16-Test.ps1')
            Copy-Item tools/RUN_DX9EX_RANGE16_TEST.cmd (Join-Path $dir 'RUN_DX9EX_RANGE16_TEST.cmd')
            foreach($f in @('d3d9.dll','multiviewpatcher.dll','outrun-vr-host-dx12.exe')){
              if(Test-Path (Join-Path $dir $f)){ throw "Forbidden non-DX9Ex file $f" }
            }
            Compress-Archive -Path (Join-Path $dir '*') -DestinationPath (Join-Path output ("OutRun2_VR_DX9EX_M6_{0}.zip" -f $variant)) -Force
          }
          if((Get-ChildItem output -Filter '*.zip').Count -ne 6){ throw "Expected 6 zips" }
      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-DX9EX-MATRIX6-${{ github.sha }}
          path: output/*.zip
          if-no-files-found: error
