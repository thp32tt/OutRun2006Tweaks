name: Localization A00478 import DDF0392A canonical source

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - '.github/workflows/localization-a00478-ddf0392a-source-import.yml'

permissions:
  contents: write

concurrency:
  group: localization-a00478-ddf0392a-source-import
  cancel-in-progress: false

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0

      - name: Refresh branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin korean-localization-clean

      - name: Acquire and verify canonical v0.25.10a DDF0392A
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5             -o /tmp/OR2-HD-GUI-v0.25.10a.zip             https://github.com/envido32/OR2006Sprites/releases/download/v0.25.10a/OR2-HD-GUI-v0.25.10a.zip
          echo '76f85ed2ca27344a4292ac7e010a786579b4eebb1a370c0aa126fcb2b231d958  /tmp/OR2-HD-GUI-v0.25.10a.zip' | sha256sum -c -
          mkdir -p textures/load/spr_sprani_sumo_fe_cvt_Exst
          unzip -p /tmp/OR2-HD-GUI-v0.25.10a.zip             textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds             > textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds
          echo 'bcfad5a1a71ab66c841134b0f3f3aa8fa5571b806bd3945dabeca3722d18fb72  textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds' | sha256sum -c -
          python - <<'PY'
          import pathlib, struct
          p=pathlib.Path('textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds')
          b=p.read_bytes()
          assert b[:4] == b'DDS '
          h,w = struct.unpack_from('<II', b, 12)
          mip = struct.unpack_from('<I', b, 28)[0] or 1
          fourcc = b[84:88]
          assert (w,h,mip,fourcc) == (1024,2048,1,b'DXT5'), (w,h,mip,fourcc)
          print(f'DDS_OK width={w} height={h} mipmaps={mip} fourcc={fourcc.decode()} bytes={len(b)}')
          PY

      - name: Commit canonical source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds
          git rm .github/workflows/localization-a00478-ddf0392a-source-import.yml
          git commit -m "localization(A): import canonical DDF0392A source [AUTO:LOCALIZATION-LOCALIZATION_A-00478]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
