name: Recovery v1 Chrome Stability / A+B 5-minute stagger

on:
  push:
    branches: [localization-controller-recovery-20260928]
    paths:
      - 'tools/chat-controller/localization-recovery-v1/**'
      - '.github/workflows/recovery-v1-chrome-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recovery-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile original recovery controller and maintenance
        run: |
          cat tools/chat-controller/localization-recovery-v1/src/controller.py.part* >/tmp/recovery-v1-controller.py
          python -m py_compile /tmp/recovery-v1-controller.py
          python -m py_compile tools/chat-controller/localization-recovery-v1/chrome_maintenance.py
          bash -n tools/chat-controller/localization-recovery-v1/entrypoint.sh
          bash -n tools/chat-controller/localization-recovery-v1/chrome-cache-clean.sh
      - name: Historical four-worker source and Chrome repair regression
        run: python tools/chat-controller/localization-recovery-v1/tests/test_recovery_maintenance.py
      - name: Prove Chrome cookies and session files survive cleaning
        run: bash tools/chat-controller/localization-recovery-v1/tests/test_chrome_cache_clean.sh
      - name: Check active GitOps + HOLD browser Compose contract
        run: |
          docker compose -f tools/chat-controller/localization-recovery-v1/docker-compose.yml config --quiet
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('tools/chat-controller/localization-recovery-v1')
          compose=yaml.safe_load((root/'docker-compose.yml').read_text())
          assert set(compose['services'])=={
              'outrun-chat-controller-localization-recovery','outrun-chat-qa-rework'}
          gitops=compose['services']['outrun-chat-controller-localization-recovery']
          qa=compose['services']['outrun-chat-qa-rework']
          assert gitops['build']['dockerfile']=='Dockerfile.gitops'
          assert gitops['read_only'] is True
          assert qa['build']['dockerfile']=='Dockerfile.chat-rework'
          assert 'hd_imagegen_fallback' in qa['environment']['OUTRUN_REWORK_QUEUE_NAME']
          assert ':-0}' in qa['environment']['OUTRUN_REWORK_REUSE_ONLY']
          assert any('6084' in str(p) and '6080' in str(p) for p in qa['ports'])
          assert 'outrun_chat_browser_profile_clean_v2:/browser-profile' in qa['volumes']
          assert 'outrun_chat_localization_recovery_data:/data' in qa['volumes']
          assert 'outrun_chat_localization_recovery_logs:/logs' in qa['volumes']
          src=''.join(p.read_text() for p in sorted((root/'src').glob('controller.py.part*')))
          assert 'next_production_id' not in src and 'task_events' not in src
          print("PASS GitOps dispatcher + HOLD browser Compose contract")
          PY
      - name: Build patched A+B recovery image
        run: docker build -t recovery-v1-chrome:test tools/chat-controller/localization-recovery-v1
      - name: Historical recovery image is compile-only
        run: |
          echo "Legacy Recovery v1 runtime is retired; active GitOps + HOLD browser runtime is covered by outrun-chat-rework-real-docker-smoke.yml"
