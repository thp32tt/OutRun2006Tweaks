name: Refresh v0.1 Snow Fix

on:
  push:
    branches: [ wheel-ffb-v0.2-dev ]
    paths:
      - '.github/workflows/publish-v01-snow-fix.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 0df1face7a295cf05b8e620f44fb2a54e957f798
      BUILD_RUN_ID: '34702340372'
      BUILD_ARTIFACT: outrun2006tweaks-0df1face7a295cf05b8e620f44fb2a54e957f798
      RELEASE_ASSET: OutRun2006Tweaks-Wheel-FFB-v0.1.zip
    steps:
      - name: Checkout stable release branch
        uses: actions/checkout@v4
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Download validated final binary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact-bin
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$BUILD_ARTIFACT" -D artifact-bin
          for f in dinput8.dll OutRun2006Tweaks.ini OutRun2006Tweaks.lods.ini OR2006C2C.exe LICENSES.txt; do
            test -f "artifact-bin/$f" || { echo "$f missing"; exit 1; }
          done

      - name: Build clean v0.1 package
        run: |
          rm -rf release-bin release
          mkdir -p release-bin release
          for f in dinput8.dll OutRun2006Tweaks.ini OutRun2006Tweaks.lods.ini OR2006C2C.exe LICENSES.txt; do
            cp "artifact-bin/$f" "release-bin/$f"
          done
          cp README.md release-bin/README.md
          python - <<'PY'
          from pathlib import Path
          import zipfile
          allowed = {'dinput8.dll','OutRun2006Tweaks.ini','OutRun2006Tweaks.lods.ini','OR2006C2C.exe','README.md','LICENSES.txt'}
          files = {p.name for p in Path('release-bin').iterdir() if p.is_file()}
          if files != allowed:
              raise SystemExit(f'unexpected package files: {sorted(files ^ allowed)}')
          out = Path('release/OutRun2006Tweaks-Wheel-FFB-v0.1.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for name in sorted(allowed):
                  z.write(Path('release-bin') / name, name)
          PY
          sha256sum release/"$RELEASE_ASSET"
          unzip -l release/"$RELEASE_ASSET"

      - name: Move v0.1 tag to validated stable commit
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git tag -f v0.1 "$TARGET_SHA"
          git push origin refs/tags/v0.1 --force

      - name: Update existing v0.1 release and replace ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1 --repo "$GITHUB_REPOSITORY" \
            --title 'OutRun2006Tweaks Wheel FFB v0.1' \
            --notes-file RELEASE_NOTES_v0.1.md \
            --prerelease=false \
            --latest
          gh release delete-asset v0.1 "$RELEASE_ASSET" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release upload v0.1 release/"$RELEASE_ASSET" --repo "$GITHUB_REPOSITORY"

      - name: Upload exact public release package
        uses: actions/upload-artifact@v4
        with:
          name: v0.1-snow-fix-release-package
          path: release/OutRun2006Tweaks-Wheel-FFB-v0.1.zip
          if-no-files-found: error

      - name: Remove temporary release workflow from dev branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin wheel-ffb-v0.2-dev
          git checkout -B cleanup origin/wheel-ffb-v0.2-dev
          git rm .github/workflows/publish-v01-snow-fix.yml
          git commit -m 'chore: remove v0.1 snow-fix release workflow [skip ci]'
          git push origin HEAD:wheel-ffb-v0.2-dev
