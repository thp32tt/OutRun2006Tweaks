name: Ferrari16 EXT16-005 Exact SHA Isolated Test Package
on:
  push:
    branches: [automation/ferrari16-external-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-sha-x86-x64-package:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
      - name: Exact SHA and Python positive/negative package tests
        shell: pwsh
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'Wrong checkout SHA'}
          python tests/ferrari16_package_integrity_test.py
          if($LASTEXITCODE -ne 0){throw 'Package tamper gate failed'}
          python tests/ferrari16_launcher_isolation_test.py
          if($LASTEXITCODE -ne 0){throw 'Tamper tests failed'}
          python tools/ferrari16/v003_parity_gate.py --self-test
          if($LASTEXITCODE -ne 0){throw 'v0.03 parity gate failed'}
      - name: Windows PowerShell 5.1 syntax gates
        shell: powershell
        run: |
          foreach($name in @(
            'PREPARE-FERRARI16-ISOLATED.ps1',
            'INSTALL-FERRARI16-ISOLATED.ps1',
            'RESTORE-FERRARI16-ISOLATED.ps1',
            'COLLECT-FERRARI16-LOGS.ps1')) {
            $path=(Resolve-Path -LiteralPath ("tools/ferrari16/"+$name)).Path
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0){throw "$name parse failure: $(($errors|ForEach-Object Message)-join '; ')"}
          }
          Write-Host 'WINDOWS_PS51_INSTALL_RESTORE_LOGS_PARSE_PASS'
      - name: Configure Win32 x86 game DLL
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-ferrari16/game -G "Visual Studio 17 2022" -A Win32
          if($LASTEXITCODE -ne 0){throw 'Game configure failed'}
          foreach($p in @(
            'build-ferrari16/game/_deps/safetyhook-build/src/safetyhook.vcxproj',
            'build-ferrari16/game/_deps/zydis-build/Zydis.vcxproj',
            'build-ferrari16/game/_deps/zydis-build/zycore/Zycore.vcxproj')){
            if(!(Test-Path $p)){throw "Missing dependency: $p"}
            $t=Get-Content -LiteralPath $p -Raw
            if($t -notmatch '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR'){
              $t=$t -replace 'ZYCORE_STATIC_BUILD','_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD'
              Set-Content -LiteralPath $p -Value $t
            }
          }
          $sdl=@(
            'build-ferrari16/game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c',
            'build-ferrari16/game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.cpp') |
            Where-Object {Test-Path $_} | Select-Object -First 1
          if(!$sdl){throw 'SDL GameInput source missing'}
          Set-Content -LiteralPath $sdl -Value ''
          $cfg='build-ferrari16/game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h'
          if(!(Test-Path $cfg)){throw 'SDL GameInput config missing'}
          (Get-Content -LiteralPath $cfg -Raw) -replace '#define SDL_JOYSTICK_GAMEINPUT 1','/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content -LiteralPath $cfg
      - name: Build exact-SHA x86 DLL
        shell: pwsh
        run: |
          cmake --build build-ferrari16/game --config Release --target outrun2006tweaks --parallel 4
          if($LASTEXITCODE -ne 0){throw 'Game x86 build failed'}
          if(!(Test-Path build-ferrari16/game/bin/dinput8.dll)){throw 'Missing game x86 DLL'}
      - name: Build exact-SHA x64 OpenXR host
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S vrhost -B build-ferrari16/host -G "Visual Studio 17 2022" -A x64
          if($LASTEXITCODE -ne 0){throw 'Host x64 configure failed'}
          cmake --build build-ferrari16/host --config Release --target outrun-vr-host --parallel 4
          if($LASTEXITCODE -ne 0){throw 'Host x64 build failed'}
          if(!(Test-Path build-ferrari16/host/bin/outrun-vr-host.exe)){throw 'Missing OpenXR host'}
      - name: Generate and read back exact-SHA test ZIP
        shell: pwsh
        run: |
          python tools/ferrari16/private_test_package.py build --root . --dll build-ferrari16/game/bin/dinput8.dll --host build-ferrari16/host/bin/outrun-vr-host.exe --source-sha $env:GITHUB_SHA --output dist/Ferrari16_EXT16-005_Private_Test.zip
          if($LASTEXITCODE -ne 0){throw 'Package generation failed'}
          python tools/ferrari16/private_test_package.py verify --package dist/Ferrari16_EXT16-005_Private_Test.zip --source-sha $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'Package verification failed'}
          Get-Content dist/Ferrari16_EXT16-005_Private_Test.zip.sha256
      - name: Synthetic Windows install and rollback positive/negative proof
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'Ferrari16ExactShaZipReadback'
          $game=Join-Path $env:RUNNER_TEMP 'Ferrari16SyntheticIsolatedGame'
          Expand-Archive -LiteralPath dist/Ferrari16_EXT16-005_Private_Test.zip -DestinationPath $out
          New-Item -ItemType Directory -Path $game -Force|Out-Null
          $installer=Join-Path $out 'INSTALL-FERRARI16-ISOLATED.ps1'
          $restorer=Join-Path $out 'RESTORE-FERRARI16-ISOLATED.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer -GameRoot $game -Install *> $null
          if($LASTEXITCODE -eq 0){throw 'MISSING ISOLATED MARKER WAS ACCEPTED'}
          [IO.File]::WriteAllBytes((Join-Path $game 'OR2006C2C.exe'),[byte[]](1,2,3,4))
          [IO.File]::WriteAllBytes((Join-Path $game 'dinput8.dll'),[byte[]](5,6,7,8))
          [IO.File]::WriteAllBytes((Join-Path $game 'outrun-vr-host.exe'),[byte[]](9,10,11,12))
          'synthetic ini' | Set-Content -LiteralPath (Join-Path $game 'OutRun2006Tweaks.ini')
          $hashes=@{}
          foreach($name in @('OR2006C2C.exe','dinput8.dll','outrun-vr-host.exe','OutRun2006Tweaks.ini')){
            $hashes[$name]=(Get-FileHash -LiteralPath (Join-Path $game $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $marker=[ordered]@{Schema=1;Purpose='FERRARI16_ISOLATED_V003_TEST_COPY'
            TestRoot=$game;SourceRoot='SYNTHETIC_ONLY_SOURCE_NOT_REAL';OriginalHashes=$hashes}
          ($marker|ConvertTo-Json -Depth 5)|Set-Content -LiteralPath (Join-Path $game '.ferrari16-isolated.json') -Encoding UTF8
          # A valid lexical marker on a junction alias must not authorize
          # installation into its physical target. Exercise the real PS5.1.
          $alias=Join-Path $env:RUNNER_TEMP 'Ferrari16GameJunction'
          New-Item -ItemType Junction -Path $alias -Target $game -ErrorAction Stop|Out-Null
          $markerPath=Join-Path $game '.ferrari16-isolated.json'
          $markerBytes=[IO.File]::ReadAllBytes($markerPath)
          try {
            $aliasMarker=[ordered]@{Schema=1;Purpose='FERRARI16_ISOLATED_V003_TEST_COPY'
              TestRoot=$alias;SourceRoot=$game;OriginalHashes=$hashes}
            ($aliasMarker|ConvertTo-Json -Depth 5)|Set-Content -LiteralPath $markerPath -Encoding UTF8
            foreach($installMode in @($false,$true)){
              $extra=@()
              if($installMode){$extra=@('-Install')}
              $result=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer -GameRoot $alias @extra 2>&1
              if($LASTEXITCODE -eq 0 -or ($result|Out-String) -notmatch 'Reparse point is not allowed'){
                throw "JUNCTION INSTALL NOT REJECTED: install=$installMode"
              }
            }
            $prepare=Join-Path $out 'PREPARE-FERRARI16-ISOLATED.ps1'
            $inside=Join-Path $alias 'new-test'
            $result=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prepare -SourceRoot $game -TestRoot $inside 2>&1
            if($LASTEXITCODE -eq 0 -or ($result|Out-String) -notmatch 'Reparse point is not allowed'){
              throw 'JUNCTION DESTINATION ANCESTOR NOT REJECTED'
            }
            if(Test-Path -LiteralPath (Join-Path $game 'new-test')){throw 'Prepare wrote through junction'}
            foreach($name in $hashes.Keys){
              if((Get-FileHash -LiteralPath (Join-Path $game $name)).Hash.ToLowerInvariant() -ne $hashes[$name]){
                throw "Junction negative modified $name"
              }
            }
            if(@(Get-ChildItem -LiteralPath $game -Filter 'FERRARI16_BACKUP_*').Count -or
               @(Get-ChildItem -LiteralPath $game -Filter 'RUN-FERRARI16-V003-*.cmd').Count){
              throw 'Junction negative created backup or launcher'
            }
          } finally {
            [IO.File]::WriteAllBytes($markerPath,$markerBytes)
            [IO.Directory]::Delete($alias)
          }
          Write-Host 'PS51_JUNCTION_INSTALL_PREPARE_NEGATIVE_3_PASS'
          'tamper' | Add-Content -LiteralPath (Join-Path $game 'OutRun2006Tweaks.ini')
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer -GameRoot $game -Install *> $null
          if($LASTEXITCODE -eq 0){throw 'TAMPERED TEST COPY WAS ACCEPTED'}
          'synthetic ini' | Set-Content -LiteralPath (Join-Path $game 'OutRun2006Tweaks.ini')
          # Exercise the actual PS5.1 install entry, not just the Python ZIP verifier.
          $qaPath=Join-Path $out 'QA.json'
          $qaBytes=[IO.File]::ReadAllBytes($qaPath)
          $payload=Join-Path $out 'PAYLOAD/dinput8.dll'
          $payloadBytes=[IO.File]::ReadAllBytes($payload)
          foreach($case in @('missing-dll','missing-launcher','empty-map','missing-map',
                              'unexpected-path','malformed-hash','changed-dll')){
            $qa=[Text.Encoding]::UTF8.GetString($qaBytes)|ConvertFrom-Json
            [IO.File]::WriteAllBytes($payload,$payloadBytes)
            switch($case){
              'missing-dll' {
                $qa.ContentSha256.PSObject.Properties.Remove('PAYLOAD/dinput8.dll')
                [IO.File]::WriteAllBytes($payload,[byte[]](1,2,3))
              }
              'missing-launcher' {
                $qa.ContentSha256.PSObject.Properties.Remove('LAUNCHERS/RUN-FERRARI16-V003-ALL-CARS.cmd')
              }
              'empty-map' {$qa.ContentSha256=[pscustomobject]@{}}
              'missing-map' {$qa.PSObject.Properties.Remove('ContentSha256')}
              'unexpected-path' {
                $qa.ContentSha256.PSObject.Properties.Remove('PAYLOAD/dinput8.dll')
                $qa.ContentSha256|Add-Member -NotePropertyName '../unexpected.bin' -NotePropertyValue ('0'*64)
              }
              'malformed-hash' {$qa.ContentSha256.'PAYLOAD/dinput8.dll'='not-sha256'}
              'changed-dll' {[IO.File]::WriteAllBytes($payload,[byte[]](1,2,3))}
            }
            ($qa|ConvertTo-Json -Depth 8)|Set-Content -LiteralPath $qaPath -Encoding UTF8
            foreach($installMode in @($false,$true)){
              $extra=@()
              if($installMode){$extra=@('-Install')}
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer -GameRoot $game @extra *> $null
              if($LASTEXITCODE -eq 0){throw "INVALID PACKAGE ACCEPTED: $case install=$installMode"}
              foreach($name in @('dinput8.dll','outrun-vr-host.exe')){
                if((Get-FileHash -LiteralPath (Join-Path $game $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hashes[$name]){
                  throw "Invalid package modified $name"
                }
              }
              if(@(Get-ChildItem -LiteralPath $game -Filter 'FERRARI16_BACKUP_*').Count -or
                 @(Get-ChildItem -LiteralPath $game -Filter 'RUN-FERRARI16-V003-*.cmd').Count){
                throw 'Invalid package created backup or launcher'
              }
            }
          }
          [IO.File]::WriteAllBytes($qaPath,$qaBytes)
          [IO.File]::WriteAllBytes($payload,$payloadBytes)
          Write-Host 'PS51_PACKAGE_MANIFEST_NEGATIVE_14_PASS'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer -GameRoot $game
          if($LASTEXITCODE -ne 0){throw 'Verify-only installer preflight failed'}
          if((Get-FileHash (Join-Path $game 'dinput8.dll') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hashes['dinput8.dll']){
            throw 'Verify-only unexpectedly modified game DLL'
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer -GameRoot $game -Install
          if($LASTEXITCODE -ne 0){throw 'Synthetic isolated installer failed'}
          $backup=Get-ChildItem -LiteralPath $game -Directory -Filter 'FERRARI16_BACKUP_*' |
            Select-Object -First 1
          if(!$backup){throw 'No real rollback backup'}
          # An alias with the required backup prefix formerly passed the
          # lexical parent check and could restore from a different tree.
          $backupAlias=Join-Path $game 'FERRARI16_BACKUP_JUNCTION_NEGATIVE'
          New-Item -ItemType Junction -Path $backupAlias -Target $backup.FullName -ErrorAction Stop|Out-Null
          try {
            $beforeAlias=@{}
            foreach($name in @('dinput8.dll','outrun-vr-host.exe','RUN-FERRARI16-V003-ALL-CARS.cmd')){
              $beforeAlias[$name]=(Get-FileHash -LiteralPath (Join-Path $game $name)).Hash
            }
            $result=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $restorer -GameRoot $game -BackupPath $backupAlias 2>&1
            if($LASTEXITCODE -eq 0 -or ($result|Out-String) -notmatch 'Reparse point is not allowed'){
              throw 'JUNCTION ROLLBACK NOT REJECTED'
            }
            foreach($name in $beforeAlias.Keys){
              if((Get-FileHash -LiteralPath (Join-Path $game $name)).Hash -ne $beforeAlias[$name]){
                throw "Junction rollback modified $name"
              }
            }
          } finally {
            [IO.Directory]::Delete($backupAlias)
          }
          Write-Host 'PS51_JUNCTION_ROLLBACK_NEGATIVE_PASS'
          $dll=Join-Path $game 'dinput8.dll'
          [IO.File]::WriteAllBytes($dll,[byte[]](1,1,1))
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $restorer -GameRoot $game -BackupPath $backup.FullName *> $null
          if($LASTEXITCODE -eq 0){throw 'TAMPERED PATCH RESTORE WAS ACCEPTED'}
          Copy-Item -LiteralPath (Join-Path $out 'PAYLOAD/dinput8.dll') -Destination $dll -Force
          # Corrupt rollback manifests must fail BEFORE touching installed files.
          $manifest=Join-Path $backup.FullName 'manifest.json'
          $manifestBytes=[IO.File]::ReadAllBytes($manifest)
          $backupDll=Join-Path $backup.FullName 'dinput8.dll'
          $backupBytes=[IO.File]::ReadAllBytes($backupDll)
          $sentinel=Join-Path $env:RUNNER_TEMP 'Ferrari16RollbackOutsideSentinel.txt'
          'must survive'|Set-Content -LiteralPath $sentinel
          $sentinelHash=(Get-FileHash -LiteralPath $sentinel).Hash.ToLowerInvariant()
          $tracked=@('dinput8.dll','outrun-vr-host.exe','OR2006C2C.exe','OutRun2006Tweaks.ini',
            'RUN-FERRARI16-V003-ALL-CARS.cmd','RUN-FERRARI16-V003-ALL-CARS-TRACE.cmd',
            'RUN-FERRARI16-V003-MODEL-OFF.cmd','RUN-FERRARI16-V003-PBR-TRACE.cmd')
          $before=@{}
          foreach($name in $tracked){$before[$name]=(Get-FileHash -LiteralPath (Join-Path $game $name)).Hash}
          foreach($case in @('missing-map','empty-map','missing-launcher','unexpected-file',
                              'outside-path','case-alias','malformed-hash','changed-backup-and-hash')){
            $b=[Text.Encoding]::UTF8.GetString($manifestBytes).TrimStart([char]0xfeff)|ConvertFrom-Json
            [IO.File]::WriteAllBytes($backupDll,$backupBytes)
            $name='RUN-FERRARI16-V003-ALL-CARS.cmd'
            switch($case){
              'missing-map' {$b.PSObject.Properties.Remove('Launchers')}
              'empty-map' {$b.Launchers=[pscustomobject]@{}}
              'missing-launcher' {$b.Launchers.PSObject.Properties.Remove($name)}
              'unexpected-file' {
                $b.Launchers.PSObject.Properties.Remove($name)
                $b.Launchers|Add-Member -NotePropertyName 'OR2006C2C.exe' -NotePropertyValue $hashes['OR2006C2C.exe']
              }
              'outside-path' {
                $b.Launchers.PSObject.Properties.Remove($name)
                $b.Launchers|Add-Member -NotePropertyName '../Ferrari16RollbackOutsideSentinel.txt' -NotePropertyValue $sentinelHash
              }
              'case-alias' {
                $value=$b.Launchers.$name
                $b.Launchers.PSObject.Properties.Remove($name)
                $b.Launchers|Add-Member -NotePropertyName ($name.ToLowerInvariant()) -NotePropertyValue $value
              }
              'malformed-hash' {$b.Launchers.$name='not-sha256'}
              'changed-backup-and-hash' {
                [IO.File]::WriteAllBytes($backupDll,[byte[]](55,66,77))
                $b.OriginalDll=(Get-FileHash -LiteralPath $backupDll).Hash.ToLowerInvariant()
              }
            }
            ($b|ConvertTo-Json -Depth 8)|Set-Content -LiteralPath $manifest -Encoding UTF8
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $restorer -GameRoot $game -BackupPath $backup.FullName *> $null
            if($LASTEXITCODE -eq 0){throw "INVALID ROLLBACK MANIFEST ACCEPTED: $case"}
            foreach($name in $tracked){
              if((Get-FileHash -LiteralPath (Join-Path $game $name)).Hash -ne $before[$name]){
                throw "Invalid rollback modified $name in $case"
              }
            }
            if((Get-FileHash -LiteralPath $sentinel).Hash.ToLowerInvariant() -ne $sentinelHash){
              throw 'Invalid rollback modified outside sentinel'
            }
          }
          [IO.File]::WriteAllBytes($manifest,$manifestBytes)
          [IO.File]::WriteAllBytes($backupDll,$backupBytes)
          Write-Host 'PS51_ROLLBACK_MANIFEST_NEGATIVE_8_PASS'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $restorer -GameRoot $game -BackupPath $backup.FullName
          if($LASTEXITCODE -ne 0){throw 'Rollback restore failed'}
          foreach($name in @('dinput8.dll','outrun-vr-host.exe')){
            if((Get-FileHash (Join-Path $game $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hashes[$name]){
              throw "$name original not restored"
            }
          }
          if(Test-Path (Join-Path $game 'RUN-FERRARI16-V003-ALL-CARS.cmd')){
            throw 'Rollback retained test launcher'
          }
          Write-Host 'WIN_5_1_INSTALL_ROLLBACK_NEGATIVE_POSITIVE_PASS_SYNTHETIC_ONLY'

      - name: Upload isolated-test-only payload
        uses: actions/upload-artifact@v4
        with:
          name: Ferrari16-EXT16-005-x86-x64-exact-sha-test
          path: |
            dist/Ferrari16_EXT16-005_Private_Test.zip
            dist/Ferrari16_EXT16-005_Private_Test.zip.sha256
          if-no-files-found: error
          retention-days: 14
