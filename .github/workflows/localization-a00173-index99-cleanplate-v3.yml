name: Localization A00173 Index99 Clean Plate V3

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00173.dispatch.json'

permissions:
  contents: write

concurrency:
  group: localization-a00173-index99-cleanplate-v3
  cancel-in-progress: false

jobs:
  produce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0

      - name: Refresh branch before production
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin korean-localization-clean

      - name: Install deterministic image dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Rework index99 source-effect mask and clean plate
        run: python tools/localization/a00173_index99_cleanplate_v3.py

      - name: Commit lane-local A00173 result and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/localization-a00173-index99-cleanplate-v3.yml
          git rm tools/localization/a00173_index99_cleanplate_v3.py
          git rm docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00173.dispatch.json
          git add             docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00173.json             localization/graphics/role_A/20260930-A00173-P00086             localization/graphics/KOREAN_PNG_REVIEW/4F68708E/A00173
          git commit -m "localization(A): rework index99 transparent clean plate v3 [AUTO:LOCALIZATION-LOCALIZATION_A-00173]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
