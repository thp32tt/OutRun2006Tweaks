name: Localization A00187 Index99 Producer

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00187.dispatch.json'

permissions:
  contents: write

concurrency:
  group: localization-a00187-index99
  cancel-in-progress: false

jobs:
  produce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0
      - name: Refresh branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin korean-localization-clean
      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-cjk-extra
          python -m pip install --disable-pip-version-check pillow numpy
      - name: Produce index99 candidate
        run: python tools/localization/a00187_index99.py
      - name: Refresh HEAD and commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m a00187-precommit
          git pull --ff-only origin korean-localization-clean
          git stash pop
          BASE_HEAD="$(git rev-parse HEAD)"
          python - "$BASE_HEAD" <<'PY'
          import json, sys
          from pathlib import Path
          base=sys.argv[1]
          task=Path("docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00187.json")
          tj=json.loads(task.read_text(encoding="utf-8"))
          tj["base_sha"]=base
          tj["base_head_sha"]=base
          task.write_text(json.dumps(tj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          for p in [
              Path("localization/graphics/role_A/20260930-A00187-P00095/A00187_P00095_INDEX99_DXT5_CANDIDATE_QA.json"),
              Path("localization/graphics/KOREAN_PNG_REVIEW/4F68708E/A00187/qa_report.json"),
          ]:
              q=json.loads(p.read_text(encoding="utf-8"))
              q["base_head_sha"]=base
              p.write_text(json.dumps(q,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git rm .github/workflows/localization-a00187-index99.yml
          git rm tools/localization/a00187_index99.py
          git rm docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00187.dispatch.json
          git add docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00187.json
          git add localization/graphics/role_A/20260930-A00187-P00095
          git add localization/graphics/KOREAN_PNG_REVIEW/4F68708E/A00187
          git add localization/graphics/hd_candidates/textures/load/spr_sprani_selector_cvt_Exst/4F68708E_512x64.dds
          git commit -m "localization(A): complete index99 residue-free Korean DXT5 candidate [AUTO:LOCALIZATION-LOCALIZATION_A-00187]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
