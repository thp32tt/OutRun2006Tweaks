    needs: policy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build x64 D3D11 OpenXR host and deterministic smoke tests
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host outrun-vr-cadence-presented-wait-smoke outrun-vr-cadence-schedule-smoke outrun-vr-eye-extent-smoke outrun-vr-frame-pacing-smoke outrun-vr-runtime-eligibility-smoke outrun-vr-r23-verified-bundle-smoke outrun-vr-r32-policy-smoke outrun-vr-projection-blit-upload-smoke outrun-vr-menu-projection-copy-smoke outrun-vr-menu-content-aspect-smoke outrun-vr-pause-eye-affine-smoke outrun-vr-stage-extension-owner-smoke outrun-vr-goal-progress-owner-smoke outrun-vr-semantic-tag-hint-smoke outrun-vr-capture-descriptor-smoke outrun-vr-direct-ack-device-epoch-smoke outrun-vr-direct-ring-latest-smoke outrun-vr-protocol-v3-smoke outrun-vr-core-math-smoke outrun-vr-host-state-v3-channel-smoke outrun-vr-v2-v3-shadow-conversion-smoke outrun-vr-host-pose-v3-validation-smoke
          if (-not (Test-Path build-host/bin/outrun-vr-host.exe)) { throw 'DX9Ex OpenXR host missing' }
      - name: Run deterministic no-HMD host smoke tests
        shell: pwsh
        run: |
          $tests = @(
            'outrun-vr-runtime-eligibility-smoke.exe',
            'outrun-vr-r23-verified-bundle-smoke.exe',
            'outrun-vr-projection-blit-upload-smoke.exe',
            'outrun-vr-menu-projection-copy-smoke.exe',
            'outrun-vr-menu-content-aspect-smoke.exe',
            'outrun-vr-pause-eye-affine-smoke.exe',
            'outrun-vr-stage-extension-owner-smoke.exe',
            'outrun-vr-goal-progress-owner-smoke.exe',
            'outrun-vr-semantic-tag-hint-smoke.exe',
            'outrun-vr-capture-descriptor-smoke.exe',
            'outrun-vr-direct-ack-device-epoch-smoke.exe',
            'outrun-vr-direct-ring-latest-smoke.exe',
            'outrun-vr-cadence-presented-wait-smoke.exe',
            'outrun-vr-cadence-schedule-smoke.exe',
            'outrun-vr-r32-policy-smoke.exe',
            'outrun-vr-protocol-v3-smoke.exe',
            'outrun-vr-core-math-smoke.exe',
            'outrun-vr-host-state-v3-channel-smoke.exe',
            'outrun-vr-v2-v3-shadow-conversion-smoke.exe',
            'outrun-vr-host-pose-v3-validation-smoke.exe'
          )
          foreach ($test in $tests) {
            $testPath = Join-Path 'build-host/bin' $test
            if (-not (Test-Path $testPath)) { throw "host smoke missing: $test" }
            & $testPath
            if ($LASTEXITCODE -ne 0) { throw "host smoke failed ($LASTEXITCODE): $test" }
          }
      - name: 'Feature acceptance: PACING-STAGES'
        shell: pwsh
        run: |
          $env:OUTRUN_VR_PACING_DIAGNOSTICS = '1'
          & ./build-host/bin/outrun-vr-frame-pacing-smoke.exe --stages
          if ($LASTEXITCODE -ne 0) { throw "PACING-STAGES regression failed" }
          Remove-Item Env:OUTRUN_VR_PACING_DIAGNOSTICS -ErrorAction SilentlyContinue
      - name: 'Feature acceptance: PACING-REGRESSION'
        shell: pwsh
        run: |
          Remove-Item Env:OUTRUN_VR_PACING_DIAGNOSTICS -ErrorAction SilentlyContinue
          & ./build-host/bin/outrun-vr-frame-pacing-smoke.exe --regression
          if ($LASTEXITCODE -ne 0) { throw "PACING-REGRESSION failed" }
      - name: 'Feature acceptance: XR-EYE-SIZING'
        shell: pwsh
        run: |
          & ./build-host/bin/outrun-vr-eye-extent-smoke.exe --sizing
          if ($LASTEXITCODE -ne 0) { throw 'XR-EYE-SIZING failed' }
      - name: 'Feature acceptance: XR-EYE-RESET'
        shell: pwsh
        run: |
          & ./build-host/bin/outrun-vr-eye-extent-smoke.exe --reset
          if ($LASTEXITCODE -ne 0) { throw 'XR-EYE-RESET failed' }
      - name: Stage host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage-host | Out-Null
          Copy-Item build-host/bin/outrun-vr-host.exe stage-host/outrun-vr-host.exe
          Set-Content stage-host/SOURCE_SHA.txt $env:GITHUB_SHA -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: dx9ex-active-host
          path: stage-host/
          if-no-files-found: error

  game:
    needs: policy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Win32 active DX9Ex path
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_R26_HUD_COMPARE=ON -DOUTRUN_VR_C1_COMPARE=OFF -DOUTRUN_VR_C2_COMPARE=OFF
      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ''
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      - name: Build Win32 active game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks
      - name: Stage active game DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage-game | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw 'dinput8.dll missing' }
          Copy-Item $dll.FullName stage-game/dinput8.dll
          Set-Content stage-game/SOURCE_SHA.txt $env:GITHUB_SHA -Encoding ascii
          Set-Content stage-game/VARIANT_ID.txt 'ACTIVE_R26_R43_R44' -Encoding ascii
          Set-Content stage-game/CMAKE_FLAGS.txt '-DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_R26_HUD_COMPARE=ON -DOUTRUN_VR_C1_COMPARE=OFF -DOUTRUN_VR_C2_COMPARE=OFF' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: dx9ex-active-game
          path: stage-game/
          if-no-files-found: error

  full-chain-compile:
    needs: policy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Win32 R84 independent R29-R33 full-chain gate
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-full-chain -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_R26_HUD_COMPARE=OFF -DOUTRUN_VR_C1_COMPARE=OFF -DOUTRUN_VR_C2_COMPARE=OFF -DOUTRUN_VR_REFACTOR_SPLIT_R33_R32=ON -DOUTRUN_VR_REFACTOR_SPLIT_R32_R31=ON -DOUTRUN_VR_REFACTOR_SPLIT_R31_R30=ON -DOUTRUN_VR_REFACTOR_SPLIT_R30_R29=ON
      - name: Apply VC2022 dependency workarounds for full-chain gate
        shell: pwsh
        run: |
          (Get-Content build-full-chain/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-full-chain/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-full-chain/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-full-chain/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-full-chain/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-full-chain/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-full-chain/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ''
          (Get-Content build-full-chain/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-full-chain/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      - name: Build Win32 R84 independent R29-R33 full-chain gate
        run: cmake --build build-full-chain --config Release --target outrun2006tweaks
      - name: Stage exact-SHA R84 independently linked x86 game
        shell: pwsh
        run: |
          $dll = Get-ChildItem build-full-chain -Recurse -File -Filter dinput8.dll | Select-Object -First 1
          if (-not $dll) { throw 'R84 independent full-chain DLL missing' }
          New-Item -ItemType Directory -Force stage-r84-chain | Out-Null
          Copy-Item $dll.FullName stage-r84-chain/dinput8.dll
          Set-Content stage-r84-chain/SOURCE_SHA.txt $env:GITHUB_SHA -Encoding ascii
          Set-Content stage-r84-chain/BUILD_VARIANT.txt 'R84_SPLIT_R33_R32_R31_R30_R29' -Encoding ascii
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path stage-r84-chain/dinput8.dll))
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'R84 Win32 DLL PE header invalid' }
          $pe = [BitConverter]::ToInt32($bytes,0x3c)
          if ($pe -lt 0 -or $pe + 6 -gt $bytes.Length -or [BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x14c) { throw 'R84 DLL is not x86 PE32' }
      - uses: actions/upload-artifact@v4
        with:
          name: dx9ex-r84-independent-full-chain-game
          path: stage-r84-chain/
          if-no-files-found: error

  package:
    needs: [host, game]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dx9ex-active-host
          path: payload/host
      - uses: actions/download-artifact@v4
        with:
          name: dx9ex-active-game
          path: payload/game
      - name: Assemble one profile-aware DX9Ex package
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,12)
          $matrixId = "DX9EX-ACTIVE-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))-$short"
          $dir = 'package'
          $backend = Join-Path $dir 'backends/d3d9'
          New-Item -ItemType Directory -Force $backend | Out-Null
          Copy-Item payload/game/dinput8.dll (Join-Path $backend 'dinput8.dll')
          Copy-Item payload/host/outrun-vr-host.exe (Join-Path $backend 'outrun-vr-host.exe')
          Set-Content (Join-Path $backend 'SOURCE_SHA.txt') $env:GITHUB_SHA -Encoding ascii
          Copy-Item OutRun2006Tweaks.ini (Join-Path $dir 'OutRun2006Tweaks.ini')
          Copy-Item OutRun2006Tweaks.lods.ini (Join-Path $dir 'OutRun2006Tweaks.lods.ini')
          # Keep one GUI launcher. The slot selector invokes the PowerShell
          # test runner directly; duplicate batch entrypoints are not needed.
          foreach ($file in @('OutRunVR-TestProfiles.ps1','Select-OutRunVRBackend.ps1','Run-OutRunVRTest.ps1','Collect-OutRunVRLogs.ps1','Analyze-OutRunVRSession.ps1','OutRunVR-Slot-Selector.ps1','OutRunVR-Slot-Selector.cmd','START_DX9EX_TEST.cmd','Start-OutRunVRPacing.ps1','Collect-OutRunVRFramePacing.ps1','Collect-OutRunVREyeExtent.ps1')) {
            Copy-Item (Join-Path 'tools' $file) (Join-Path $dir $file)
          }
          Copy-Item docs/VR_TEST_STRATEGY.md (Join-Path $dir 'VR_TEST_STRATEGY.md')
          Copy-Item docs/DX9EX_TEST_LAUNCH_CONTRACT.md (Join-Path $dir 'DX9EX_TEST_LAUNCH_CONTRACT.md')
          Copy-Item docs/VR_HUD_NIGHT_TEST_20261009.md (Join-Path $dir 'HUD_NIGHT_TEST_GUIDE.md')
          @(
            'OUTRUN 2006 VR DX9EX - START HERE / 실행 방법'
            ''
            '1. Extract ZIP contents into the folder containing OR2006C2C.EXE.'
            '   ZIP 내용물을 OR2006C2C.EXE가 있는 게임 폴더에 풀어주세요.'
            '2. Double-click START_DX9EX_TEST.cmd (visible direct launch; optional GUI selector available).'
            '   START_DX9EX_TEST.cmd를 더블클릭하세요. 실패 원인과 로그 위치가 표시됩니다.'
            '3. CURRENT FOCUS / CORRECTNESS is selected automatically.'
            '   GUI는 OutRunVR-Slot-Selector.cmd에서 선택적으로 사용할 수 있습니다.'
            '4. The selector configures the DX9Ex backend and runs OR2006C2C.EXE.'
            '   설정 후 실제 게임 실행 파일은 OR2006C2C.EXE입니다.'
            '5. After the game closes, its diagnostic ZIP is auto-collected.'
            '6. For tonight HUD tests, choose B HUD (HUD_SCREEN) in the selector.'
            'XR EYE EXTENT: actual OpenXR allocated per-eye extent, not desktop pixels.'
            'After game exit run Collect-OutRunVREyeExtent.ps1 to compare shared texture allocation.'
            'Quest3/VDXR visual quality is UNTESTED.'
            'OPTIONAL PACING: run Start-OutRunVRPacing.ps1 instead of the usual selector.'
            'After game exit use Collect-OutRunVRFramePacing.ps1 for CSV and SHA summary.'
            'GPU 상세 진단: 슬롯 선택기에서 GPU 상세 진단 체크 (기본 OFF, DX9Ex 전용).'
            'GPU timestamps + sampled alpha/depth/stencil/PS + XR/QPC + optional nvidia-smi usage.'
            'GPU measurement overhead requires OFF/ON A/B; HMD runtime UNTESTED.'
            'This is CPU/QPC instrumentation when only PACING launcher is used; no Quest3 native FPS conclusion.'
            '   For the lens centre and projected rank markers choose C FLARE / WORLD.'
            '   게임 종료 후 진단 로그 ZIP이 자동 생성됩니다.'
            ''
            'outrun-vr-host.exe is a helper process, not the user launcher.'
            'outrun-vr-host.exe는 직접 실행하는 파일이 아닙니다.'
            'Old CMD files may remain if extracted over an old test folder.'
            '구버전 CMD가 남아 있다면 이번 패키지 파일이 아니므로 무시하세요.'
          ) | Set-Content (Join-Path $dir 'START_HERE_실행방법.txt') -Encoding UTF8
          @(
            'OUTRUN VR TEST / LOG UPLOAD'
            ''
            '1. Run the packaged test normally.'
            '2. Exit the game to let the collector seal the session.'
            '3. Upload the generated OutRun2_VR_ANALYZE_*.zip to the OutRun VR project chat.'
            '4. No additional problem description is required. The ZIP itself is the analysis request.'
            ''
            'Optional: add a short symptom note only when you want to provide extra human-observed evidence.'
          ) | Set-Content (Join-Path $dir 'UPLOAD_LOG_ZIP_ONLY.txt') -Encoding UTF8
          Set-Content (Join-Path $dir 'BUILD_MATRIX_ID.txt') $matrixId -Encoding ascii
          $buildInputs = [ordered]@{
            SchemaVersion = 1
            BuildMatrixId = $matrixId
            IntegrationSha = $env:GITHUB_SHA
            VariantId = 'ACTIVE_R26_R43_R44'
            DefaultTestProfile = 'CORRECTNESS'
            Profiles = @('CONTROL','CORRECTNESS','HUD_SCREEN','HUD_MENU','HUD_WORLD','PERFORMANCE')
            RecommendedHudProfile = 'HUD_SCREEN'
            RecommendedLensAndMarkerProfile = 'HUD_WORLD'
            UserRuntimeVerified = $false
            XrEyeExtentPolicy = 'OPENXR_ALLOCATED_COMMON_EYE_EXTENT'
            XrEyeExtentHmdVerified = $false
            FramePacingDiagnosticsDefault = 'OFF'
            FramePacingEnableWith = 'Start-OutRunVRPacing.ps1'
            GpuDiagnosticsDefault = 'OFF'
            GpuDiagnosticsMode = 'SLOT_SELECTOR_CHECKBOX'
            GpuDiagnosticsIncludes = @('D3D9_GPU_TIMESTAMP','SPARSE_ALPHA_DEPTH_STENCIL','GPU_WHOLE_1S_NVIDIA_SMI','XR_CPU_QPC')
          }
          $buildInputs | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $dir 'BUILD_INPUTS.json') -Encoding UTF8
          $bad = Get-ChildItem $dir -Recurse -File | Where-Object { $_.Name -in @('d3d9.dll','multiviewpatcher.dll','outrun-vr-host-dx12.exe') }
          if ($bad) { throw "Forbidden backend payload: $($bad.FullName -join ', ')" }
          Get-ChildItem $dir -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path.Substring((Resolve-Path $dir).Path.Length + 1))"
          } | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
          $zip = "OutRun2_VR_DX9EX_ACTIVE_${short}.zip"
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256 | Format-List
      - name: Validate active package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter 'OutRun2_VR_DX9EX_ACTIVE_*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'active DX9Ex ZIP missing' }
          Expand-Archive $zip.FullName verify
          foreach ($file in @('START_DX9EX_TEST.cmd','DX9EX_TEST_LAUNCH_CONTRACT.md','OutRunVR-Slot-Selector.cmd','OutRunVR-Slot-Selector.ps1','Select-OutRunVRBackend.ps1','Run-OutRunVRTest.ps1','Collect-OutRunVRLogs.ps1','Analyze-OutRunVRSession.ps1','OutRunVR-TestProfiles.ps1','Start-OutRunVRPacing.ps1','Collect-OutRunVRFramePacing.ps1','Collect-OutRunVREyeExtent.ps1','SHA256SUMS.txt','BUILD_INPUTS.json','BUILD_MATRIX_ID.txt','UPLOAD_LOG_ZIP_ONLY.txt','START_HERE_실행방법.txt','HUD_NIGHT_TEST_GUIDE.md')) {
            if (-not (Test-Path (Join-Path verify $file))) { throw "package missing $file" }
          }
          # Both one-click visible and optional GUI launchers are required.
          $launchers = @(Get-ChildItem verify -Recurse -File | Where-Object { $_.Extension -in @('.cmd','.bat') })
          if ($launchers.Count -ne 2 -or
              @($launchers | Where-Object { $_.Name -notin @('START_DX9EX_TEST.cmd','OutRunVR-Slot-Selector.cmd') }).Count -ne 0) {
            throw "Invalid DX9Ex launchers: $($launchers.Name -join ', ')"
          }
          $launcherText = Get-Content (Join-Path verify 'START_DX9EX_TEST.cmd') -Raw
          foreach ($item in @('pushd "%~dp0"','OR2006C2C.EXE','backends\d3d9\dinput8.dll','backends\d3d9\outrun-vr-host.exe','-Backend d3d9','-VariantId CURRENT_FOCUS','Run-OutRunVRTest.ps1','if errorlevel 1','pause')) {
            if (-not $launcherText.Contains($item)) { throw "Direct batch launch contract missing $item" }
          }
          $guiLauncherText = Get-Content (Join-Path verify 'OutRunVR-Slot-Selector.cmd') -Raw
          if ($guiLauncherText -notlike '*OutRunVR-Slot-Selector.ps1*') { throw 'Optional GUI launcher invalid' }
          $slotText = Get-Content (Join-Path verify 'OutRunVR-Slot-Selector.ps1') -Raw
          foreach ($marker in @('CURRENT_FOCUS','Run-OutRunVRTest.ps1','Start-Slot','설정 + 바로 실행')) {
            if ($slotText -notlike "*$marker*") { throw "Slot selector marker missing: $marker" }
          }
          $collectorText = Get-Content (Join-Path verify 'Collect-OutRunVRLogs.ps1') -Raw
          foreach ($requiredMarker in @('ANALYSIS_REQUEST.json','AutoAnalyzeOnUpload=$true','RequiresUserDescription=$false','OutRun2_VR_ANALYZE_')) {
            if ($collectorText -notlike "*$requiredMarker*") { throw "collector missing runtime auto-analysis contract marker: $requiredMarker" }
          }
          foreach ($file in @('dinput8.dll','outrun-vr-host.exe','SOURCE_SHA.txt')) {
            if (-not (Test-Path (Join-Path 'verify/backends/d3d9' $file))) { throw "backend payload missing $file" }
          }

          # Regression: extracting a new package over an older R71 test folder
          # must not fail just because the old launcher passes R71_HUD_FLARE.
          Copy-Item verify verify-legacy -Recurse
          & ./verify-legacy/Select-OutRunVRBackend.ps1 -Backend d3d9 -TestProfile HUD_WORLD -VariantId R71_HUD_FLARE
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'legacy VariantId migration failed' }
          $legacyState = Get-Content verify-legacy/CURRENT_VR_SESSION.json -Raw | ConvertFrom-Json
          if ($legacyState.VariantId -ne 'C_FLARE') { throw "legacy VariantId mapped incorrectly: $($legacyState.VariantId)" }
          if ($legacyState.Backend -ne 'd3d9') { throw "legacy VariantId changed backend unexpectedly: $($legacyState.Backend)" }
          $runnerText = Get-Content (Join-Path verify 'Run-OutRunVRTest.ps1') -Raw
          $guiText = Get-Content (Join-Path verify 'OutRunVR-Slot-Selector.ps1') -Raw
          $inputPolicy = Get-Content (Join-Path verify 'BUILD_INPUTS.json') -Raw | ConvertFrom-Json
          if ($inputPolicy.GpuDiagnosticsDefault -ne 'OFF' -or
              $inputPolicy.GpuDiagnosticsMode -ne 'SLOT_SELECTOR_CHECKBOX') { throw 'GPU diagnostics manifest gate failed' }
          foreach ($token in @('GpuDiagnostics','OUTRUN_VR_GPU_PROFILE','OUTRUN_VR_PACING_DIAGNOSTICS','D3D9TimestampQueryRequested','gpu-utilization-status.json')) {
            if ($runnerText -notlike "*$token*") { throw "GPU diagnostics runner marker missing $token" }
          }
          foreach ($token in @('GPU 상세 진단','-GpuDiagnostics','$gpuCheck.Checked')) {
            if ($guiText -notlike "*$token*") { throw "GPU diagnostics selector marker missing $token" }
          }
          if ($runnerText -match '-VariantId\s+\$variant\s+-VariantId') { throw 'runner still passes VariantId twice' }

          $bad = Get-ChildItem verify -Recurse -File | Where-Object { $_.Name -in @('d3d9.dll','multiviewpatcher.dll','outrun-vr-host-dx12.exe') }
          if ($bad) { throw 'active package contains forbidden backend payload' }
      - name: 'Feature acceptance: PACING-BUNDLE'
        shell: pwsh
        run: |
          $base = 'verify'
          foreach ($file in @(
            'backends/d3d9/dinput8.dll',
            'backends/d3d9/outrun-vr-host.exe',
            'backends/d3d9/SOURCE_SHA.txt',
            'SHA256SUMS.txt',
            'BUILD_INPUTS.json',
            'Start-OutRunVRPacing.ps1',
            'Collect-OutRunVRFramePacing.ps1',
            'Collect-OutRunVRLogs.ps1'
          )) {
            if (-not (Test-Path (Join-Path $base $file))) {
              throw "PACING-BUNDLE missing $file"
            }
          }
          $sha = (Get-Content verify/backends/d3d9/SOURCE_SHA.txt -Raw).Trim()
          if ($sha -ne $env:GITHUB_SHA) { throw "PACING-BUNDLE exact SHA mismatch" }
          $inputs = Get-Content verify/BUILD_INPUTS.json -Raw | ConvertFrom-Json
          if ($inputs.IntegrationSha -ne $env:GITHUB_SHA -or
              $inputs.FramePacingDiagnosticsDefault -ne 'OFF') {
            throw "PACING-BUNDLE manifest mismatch"
          }
          foreach ($helper in @('Start-OutRunVRPacing.ps1','Collect-OutRunVRFramePacing.ps1','Collect-OutRunVREyeExtent.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path (Join-Path verify $helper)), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw "Invalid pacing helper: $helper" }
          }
          # Exercise the shipped collector against a real two-row CSV, including
          # cached XR resubmission and invalid/unavailable game CPU samples.
          $probe = Join-Path $env:RUNNER_TEMP 'dx9ex-pacing-collector-smoke'
          $probeOut = Join-Path $probe 'export'
          New-Item -ItemType Directory -Force (Join-Path $probe 'backends/d3d9') | Out-Null
          Set-Content (Join-Path $probe 'backends/d3d9/SOURCE_SHA.txt') $env:GITHUB_SHA -Encoding ascii
          @(
            'xrTick,gameRunGeneration,gameFrameId,cached,gameRenderCpuMs,gamePresentCpuMs,gamePresentToHostMs,hostCaptureCpuMs,hostCopyCpuMs,hostRenderCpuMs,xrWaitFrameMs,xrEndFrameMs',
            '1,8,42,0,6.5,0.8,1.0,1.5,0.3,2.0,0.4,0.1',
            '2,8,42,1,-1.0,-1,-1,-1,-1,1.4,0.6,0.1'
          ) | Set-Content (Join-Path $probe 'outrun-vr-frame-pacing.csv') -Encoding ascii
          & ./verify/Collect-OutRunVRFramePacing.ps1 -Root $probe -Output $probeOut
          $report = Get-Content (Join-Path $probeOut 'frame-pacing-summary.json') -Raw | ConvertFrom-Json
          if ($report.SubmissionRows -ne 2 -or $report.CachedProjectionRows -ne 1 -or
              $report.MissingGameBeginRows -ne 1 -or $report.SourceSha -ne $env:GITHUB_SHA -or
              $report.HmdRuntimeVerified -or $report.NativeFpsVerified) {
            throw "PACING-BUNDLE executable collector regression failed"
          }
      - name: 'Feature acceptance: XR-EYE-BUNDLE'
        shell: pwsh
        run: |
          foreach ($file in @('backends/d3d9/dinput8.dll',
              'backends/d3d9/outrun-vr-host.exe','backends/d3d9/SOURCE_SHA.txt',
              'BUILD_INPUTS.json','SHA256SUMS.txt','Collect-OutRunVRLogs.ps1',
              'Collect-OutRunVREyeExtent.ps1')) {
            if (-not (Test-Path (Join-Path verify $file))) {
              throw "XR-EYE-BUNDLE missing $file"
            }
          }
          $sha = (Get-Content verify/backends/d3d9/SOURCE_SHA.txt -Raw).Trim()
          $inputs = Get-Content verify/BUILD_INPUTS.json -Raw | ConvertFrom-Json
          if ($sha -ne $env:GITHUB_SHA -or $inputs.IntegrationSha -ne $env:GITHUB_SHA -or
              $inputs.XrEyeExtentPolicy -ne 'OPENXR_ALLOCATED_COMMON_EYE_EXTENT' -or
              $inputs.XrEyeExtentHmdVerified) { throw 'XR-EYE-BUNDLE SHA/policy mismatch' }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path verify/Collect-OutRunVREyeExtent.ps1),[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw 'XR-EYE-BUNDLE collector parsing failed' }
          $root = Join-Path $env:RUNNER_TEMP 'xr-eye-regression'
          $out = Join-Path $root 'out'
          New-Item -ItemType Directory -Force (Join-Path $root 'backends/d3d9') | Out-Null
          Set-Content (Join-Path $root 'backends/d3d9/SOURCE_SHA.txt') $env:GITHUB_SHA
          Set-Content (Join-Path $root 'outrun-vr-eye-extent.log') 'XR_EYE_EXTENT_V1 allocated=2124x2284 recommended0=2016x2240 recommended1=2124x2284 scale=1 hmd_verification=UNTESTED'
          Set-Content (Join-Path $root 'OutRun2006Tweaks-test.log') 'VR stereo: verified 4-slot D3D9Ex shared eye ring ready 2124x2284 from desktop 3440x1440'
          & ./verify/Collect-OutRunVREyeExtent.ps1 -Root $root -Output $out
          $good = Get-Content (Join-Path $out 'eye-extent-summary.json') -Raw | ConvertFrom-Json
          if ($good.SourceSha -ne $env:GITHUB_SHA -or
              $good.XrSwapchainEyeWidth -ne 2124 -or $good.XrSwapchainEyeHeight -ne 2284 -or
              -not $good.GameDirectEyeSizeMatchesXr -or $good.HmdRuntimeVerified) {
            throw 'XR-EYE-BUNDLE positive fixture failed'
          }
          Set-Content (Join-Path $root 'OutRun2006Tweaks-test.log') 'VR stereo: verified 4-slot D3D9Ex shared eye ring ready 2048x2048 from desktop 3440x1440'
          & ./verify/Collect-OutRunVREyeExtent.ps1 -Root $root -Output $out
          $bad = Get-Content (Join-Path $out 'eye-extent-summary.json') -Raw | ConvertFrom-Json
          if ($bad.GameDirectEyeSizeMatchesXr -or -not $bad.GameDirectEyeAllocationObserved) {
            throw 'XR-EYE-BUNDLE mismatch detection failed'
          }
      - name: Assemble separate GUI GPU measurement ZIP
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,12)
          $dir = 'gpu-measurement'
          Copy-Item package $dir -Recurse
          Remove-Item (Join-Path $dir 'OutRunVR-Slot-Selector.cmd') -Force
          foreach ($file in @('OutRunVR-GPU-Lab.cmd','OutRunVR-GPU-Lab.ps1','OutRunVR-GPU-Lab-Settings.ps1')) {
            Copy-Item (Join-Path 'tools' $file) (Join-Path $dir $file)
          }
          Copy-Item docs/VR_GPU_LAB_TEST_BUILD.md (Join-Path $dir 'GPU_LAB_GUIDE.md')
          @(
            'OUTRUN DX9EX VR - GPU MEASUREMENT SPECIAL BUILD'
            ''
            'Extract ZIP into original OR2006C2C.EXE folder.'
            'Double click OutRunVR-GPU-Lab.cmd, the ONLY GUI launcher.'
            'Choose A/B/C/D/E or any alpha/reflect/SkyGlow/culling combinations.'
            'Tag waterfront/sand spray/buildings and click GPU 측정 시작 / 게임 실행.'
            'After the game exits upload OutRun2_VR_ANALYZE_*.zip.'
            'No environment-variable entry required. HMD runtime UNTESTED.'
          ) | Set-Content (Join-Path $dir 'START_HERE_실행방법.txt') -Encoding UTF8
          [ordered]@{
            ArtifactKind = 'SEPARATE_GPU_DIAGNOSTIC_ZIP'
            SourceSha = $env:GITHUB_SHA
            GuiEntryPoint = 'OutRunVR-GPU-Lab.cmd'
            DefaultGpuDiagnostics = 'ON_WHILE_MEASURING'
            OriginalDailyZipUnchanged = $true
            RuntimeValidation = 'UNTESTED'
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $dir 'GPU_LAB_BUILD.json') -Encoding UTF8
          Remove-Item (Join-Path $dir 'SHA256SUMS.txt')
          Get-ChildItem $dir -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path.Substring((Resolve-Path $dir).Path.Length + 1))"
          } | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
          $zip = "OutRun2_VR_GPU_DIAGNOSTIC_${short}.zip"
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -Force
          Expand-Archive $zip verify-gpu-lab
          $launchers=@(Get-ChildItem verify-gpu-lab -Recurse -File | Where-Object { $_.Extension -in @('.cmd','.bat') })
          if($launchers.Count -ne 1 -or $launchers[0].Name -ne 'OutRunVR-GPU-Lab.cmd'){
            throw "Separate GUI ZIP must have exactly one CMD entrypoint: $($launchers.Name -join ',')"
          }
          foreach($file in @('OutRunVR-GPU-Lab.ps1','OutRunVR-GPU-Lab-Settings.ps1',
              'GPU_LAB_BUILD.json','GPU_LAB_GUIDE.md','Run-OutRunVRTest.ps1',
              'Collect-OutRunVRLogs.ps1','Analyze-OutRunVRSession.ps1',
              'backends/d3d9/dinput8.dll','backends/d3d9/outrun-vr-host.exe',
              'backends/d3d9/SOURCE_SHA.txt','SHA256SUMS.txt')){
            if(!(Test-Path (Join-Path 'verify-gpu-lab' $file))){throw "Missing GPU lab payload: $file"}
          }
          if((Get-Content verify-gpu-lab/backends/d3d9/SOURCE_SHA.txt -Raw).Trim() -ne $env:GITHUB_SHA){
            throw 'GPU lab exact-SHA payload mismatch'
          }
          $meta=Get-Content verify-gpu-lab/GPU_LAB_BUILD.json -Raw | ConvertFrom-Json
          if($meta.SourceSha -ne $env:GITHUB_SHA -or $meta.RuntimeValidation -ne 'UNTESTED'){
            throw 'GPU lab metadata mismatch'
          }
          $bad=@(Get-ChildItem verify-gpu-lab -Recurse -File | Where-Object {
              $_.Name -in @('d3d9.dll','multiviewpatcher.dll','outrun-vr-host-dx12.exe')})
          if($bad.Count){throw "Unexpected provider in GPU lab package: $($bad.Name -join ',')"}
          Get-FileHash $zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-GPU-DIAGNOSTIC-${{ github.sha }}
          path: OutRun2_VR_GPU_DIAGNOSTIC_*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: feature-dx9ex-eye-extent-${{ github.sha }}
          path: package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: feature-dx9ex-pacing-${{ github.sha }}
          path: package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-DX9EX-ACTIVE-${{ github.sha }}
          path: OutRun2_VR_DX9EX_ACTIVE_*.zip
          if-no-files-found: error