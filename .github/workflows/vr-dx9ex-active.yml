      - 'vr-d3d9ex-candidate/**'
    paths:
      - 'src/**'
      - 'external/imgui' # Pinned ImGui DX9 F11 runtime code is compiled into the game.
      - '.gitmodules' # Whole-source changes can affect VR runtime, reset, input and frame pacing.
      - 'src/hooks_framerate.cpp'
