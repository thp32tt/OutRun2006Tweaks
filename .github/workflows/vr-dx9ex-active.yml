concurrency:
  group: vr-dx9ex-active-${{ github.ref_name }}
  # Preserve an already-running exact-SHA Win32 gate on independent commits.
  # GitHub keeps at most one successor pending in this branch group.
  cancel-in-progress: false

jobs:
  policy:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Enforce feature-sized DX9Ex autonomous completion
        shell: pwsh
        run: |
          python tools/test_vr_feature_unit_policy.py
          if ($LASTEXITCODE -ne 0) { throw 'DX9Ex feature contract tests failed' }
          python tools/test_dx9ex_function_dispatch.py
          if ($LASTEXITCODE -ne 0) { throw 'DX9Ex dispatcher tests failed' }
          python tools/verify_vr_feature_unit_policy.py --check-head
          if ($LASTEXITCODE -ne 0) { throw 'DX9Ex exact-HEAD feature record missing or invalid' }
          python tools/verify_vr_hud_edge_transition.py
          if ($LASTEXITCODE -ne 0) { throw 'DX9Ex HUD edge contract failed' }
          python tools/verify_vr_r30_positiont_decl.py
          if ($LASTEXITCODE -ne 0) { throw 'DX9Ex R30 POSITIONT input regression failed' }
      - name: Reject broken shipped PowerShell helpers and false HUD reports
        shell: pwsh
        run: |
          $scripts = @(
            'tools/OutRunVR-Slot-Selector.ps1',
            'tools/Select-OutRunVRBackend.ps1',
            'tools/Run-OutRunVRTest.ps1',
            'tools/Collect-OutRunVRLogs.ps1',
            'tools/Analyze-OutRunVRSession.ps1',
            'tools/Test-OutRunVRAnalysisContract.ps1'
          )
          foreach ($script in $scripts) {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Host ("{0}:{1}: {2}" -f $script,
                  $_.Extent.StartLineNumber, $_.Message)
              }
              throw "Packaged PowerShell script is syntactically invalid: $script"
            }
          }
          & ./tools/Test-OutRunVRAnalysisContract.ps1
      - name: Verify separate GPU lab GUI and A/B override semantics
        shell: pwsh
        run: ./tools/Test-OutRunVRGpuLab.ps1
      - name: Verify runtime-test minimization policy
        shell: pwsh
        run: ./tools/Test-OutRunVRTestPolicy.ps1
      - name: Verify durable regression knowledge
        shell: pwsh
        run: ./tools/Test-VRRegressionKnowledge.ps1
      - name: Verify DXVK selector/backend identity contract
        shell: pwsh
        run: ./tools/Test-VRDXVKBackendContract.ps1
      - name: Verify canonical original-mod EXE binary contract
        shell: pwsh
        run: |
          $contract = Get-Content docs/VR_BINARY_CONTRACT.json -Raw | ConvertFrom-Json
          $exe = Join-Path $env:RUNNER_TEMP 'OR2006C2C.EXE'
          Invoke-WebRequest -Uri $contract.canonicalExe.sourceUrl -OutFile $exe
          python -m pip install --disable-pip-version-check --quiet capstone
          python tools/verify_vr_binary_contract.py --exe $exe --manifest docs/VR_BINARY_CONTRACT.json --source-root .
      - name: Verify reconstructed VR architecture boundaries
