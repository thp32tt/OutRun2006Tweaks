name: Localization A00351 DDF0392A V19 Song Title Rework

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00351.dispatch.json'

permissions:
  contents: write

concurrency:
  group: localization-a00351-ddf0392a-v19
  cancel-in-progress: false

jobs:
  produce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0

      - name: Refresh branch before production
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin korean-localization-clean

      - name: Install deterministic image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-cjk unzip
          python -m pip install --disable-pip-version-check 'pillow==12.3.0' 'numpy==2.3.5'

      - name: Acquire exact pinned v0.25.10a source member
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 \
            -o /tmp/OR2-HD-GUI-v0.25.10a.zip \
            https://github.com/envido32/OR2006Sprites/releases/download/v0.25.10a/OR2-HD-GUI-v0.25.10a.zip
          echo '76f85ed2ca27344a4292ac7e010a786579b4eebb1a370c0aa126fcb2b231d958  /tmp/OR2-HD-GUI-v0.25.10a.zip' | sha256sum -c -
          unzip -p /tmp/OR2-HD-GUI-v0.25.10a.zip \
            textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds \
            > /tmp/DDF0392A_256x512.dds
          echo 'bcfad5a1a71ab66c841134b0f3f3aa8fa5571b806bd3945dabeca3722d18fb72  /tmp/DDF0392A_256x512.dds' | sha256sum -c -

      - name: Generate v19-compliant index222 candidate and review set
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE" \
          SOURCE_DDS=/tmp/DDF0392A_256x512.dds \
            python localization/graphics/role_A/20261001-A00351-P00221/generate_index222_v19_song_title_rework.py
          echo 'e8dadfb5a976a9addafa08fe7a9dd1d94d4979ac387c496c98983e2d01e68b83  localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('localization/graphics/KOREAN_PNG_REVIEW/DDF0392A/qa_report.json').read_text())
          assert q['candidate']['changed_pixels_outside_allowed_edit_mask']==0
          assert q['candidate']['changed_pixels_in_protected_regions']==0
          assert q['candidate']['song_title_regions_changed_pixels']==0
          assert q['candidate']['one_pixel_overflow']==0
          f=q['song_title_family']
          assert f['all_actual_font_sizes_equal'] is True
          assert f['family_target_font_size_px']==43
          assert all(x['candidate_pixels_equal_source'] for x in f['members'])
          assert q['runtime_validation']=='UNTESTED'
          print('A00351 self-QA assertions: PASS')
          PY

      - name: Commit atomic A00351 producer result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00351.json \
            localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds \
            localization/graphics/role_A/20261001-A00351-P00221/A00351_P00221_INDEX222_V19_SONG_TITLE_REWORK.json \
            localization/graphics/KOREAN_PNG_REVIEW/DDF0392A
          git commit -m "localization(A): restore index222 source song titles [AUTO:LOCALIZATION-LOCALIZATION_A-00351]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
