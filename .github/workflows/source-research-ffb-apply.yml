name: Source-only research-informed FFB update

on:
  push:
    branches: [ wheel-ffb ]
    paths:
      - '.github/research_ffb_apply.py'
      - '.github/workflows/source-research-ffb-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wheel-ffb
        uses: actions/checkout@v7.0.1
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Apply research-informed source changes
        run: python .github/research_ffb_apply.py

      - name: Verify current source invariants
        run: python tools/verify_wheel_ffb_current.py

      - name: Compile production-header math tests
        run: python tools/verify_wheel_ffb_math.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: research-informed SAT and wheel response model [skip ci]"
          git push origin HEAD:wheel-ffb
