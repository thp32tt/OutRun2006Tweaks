name: OutRun A/B High-Quality Multi-Atlas (GitHub CPU)

on:
  # The default-branch 30-minute SHA controller is now the only auto dispatcher.
  # No push storm, no daily blind 2-hour rebuild for unchanged A/B assets.
  workflow_dispatch:
  # One build for this code change, not a push storm for every PNG output.
  push:
    branches: [korean-localization-recovery-20260928]
    paths:
      - ".github/workflows/outrun-ab-multi-atlas.yml"
      - "tools/localization/hd_strict_qa.py"
      - "tools/localization/test_hd_strict_qa.py"
      - "tools/localization/hd_overlap_ownership.py"
      - "tools/localization/test_hd_overlap_ownership.py"
      - "tools/localization/hd_source_protection_evidence.py"
      - "tools/localization/test_hd_source_protection_evidence.py"
      - "tools/localization/hd_hold_resolution_plan.py"
      - "tools/localization/test_hd_hold_resolution_plan.py"
      - "tools/localization/hd_source_edge_rebind.py"
      - "tools/localization/test_hd_source_edge_rebind.py"
      - "tools/localization/hd_hold_auto_edit.py"
      - "tools/localization/test_hd_hold_auto_edit.py"
      - "tools/localization/hd_existing_candidate_salvage.py"
      - "tools/localization/github_ab_imagegen_atlas_batch.py"
      - "tools/localization/hd_manual_user_import.py"

permissions:
  contents: write

concurrency:
  group: outrun-ab-multi-atlas
  # Only the newest asset/code SHA needs full DDS QA. Avoid wasting runners on obsolete commits.
  # Cancel obsolete SHA runs when a newer user-approved manual pack is ready.
  cancel-in-progress: true

jobs:
  merge-source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout only A/B PNG and already-GitHub-native HD DDS (NO N100 or Docker)
        uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/localization/github_ab_imagegen_atlas_batch.py
            tools/localization/hd_strict_qa.py
            tools/localization/hd_manual_user_import.py
            tools/localization/test_hd_manual_user_import.py
            tools/localization/hd_overlap_ownership.py
            tools/localization/test_hd_overlap_ownership.py
            tools/localization/hd_source_protection_evidence.py
            tools/localization/test_hd_source_protection_evidence.py
            tools/localization/hd_hold_resolution_plan.py
            tools/localization/test_hd_hold_resolution_plan.py
            tools/localization/hd_source_edge_rebind.py
            tools/localization/test_hd_source_edge_rebind.py
            tools/localization/hd_hold_auto_edit.py
            tools/localization/test_hd_hold_auto_edit.py
            tools/localization/hd_bc3_index_patch.py
            tools/localization/hd_bc3_native_codec.py
            tools/localization/test_hd_bc3_index_patch.py
            tools/localization/test_hd_bc3_native_codec.py
            tools/localization/hd_existing_candidate_salvage.py
            tools/localization/hd_rework_queue.py
            tools/localization/hd_hold_triage.py
            tools/localization/test_hd_hold_triage.py
            tools/localization/publish_hd_rework_queue.py
            tools/localization/test_hd_rework_queue.py
            tools/localization/test_hd_strict_qa.py
            tools/localization/test_github_ab_imagegen_atlas_batch.py
            localization/automation_inputs/candidate_outputs
            localization/automation_inputs/qa_rework/approved
            localization/automation_inputs/hd_original_png_source_plan.json
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load
            localization/test_packages/ab_preparation_20261102/ab_roi_crosswalk.csv

      - name: Read previous QA ticket IDs and user manual SHA-pinned PNG pack
        uses: actions/checkout@v4
        with:
          ref: korean-localization-qa-queue-20261104
          path: hd-qa-queue-state
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            localization/automation_runs/hd_rework_queue/state
            localization/automation_inputs/manual_user_20261110/OUTRUN_HD_MANUAL_SUBMISSION_QA_TEST_ONLY_20261110.zip

      - name: Prepare pure GitHub Python runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (no fonts or ImageGen API)
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Verify synthetic multi-ROI safety and no-font guards
        run: |
          python -m unittest discover -s tools/localization -p test_github_ab_imagegen_atlas_batch.py -v
          python -m unittest discover -s tools/localization -p test_hd_strict_qa.py -v
          python -m unittest discover -s tools/localization -p test_hd_manual_user_import.py -v
          python -m unittest discover -s tools/localization -p test_hd_overlap_ownership.py -v
          python -m unittest discover -s tools/localization -p test_hd_source_protection_evidence.py -v
          python -m unittest discover -s tools/localization -p test_hd_hold_resolution_plan.py -v
          python -m unittest discover -s tools/localization -p test_hd_source_edge_rebind.py -v
          python -m unittest discover -s tools/localization -p test_hd_hold_auto_edit.py -v
          python -m unittest discover -s tools/localization -p test_hd_bc3_index_patch.py -v
          python -m unittest discover -s tools/localization -p test_hd_bc3_native_codec.py -v
          python -m unittest discover -s tools/localization -p test_hd_rework_queue.py -v
          python -m unittest discover -s tools/localization -p test_hd_hold_triage.py -v

      - name: Reuse and deterministically salvage existing A/B artwork into native HD DDS
        shell: bash
        run: |
          set -euo pipefail
          # User-approved fast completion mode: a single SHA-pinned assembly.
          # The assembler itself checks ZIP CRC, every DDS entry against the
          # generated bytes, source hashes and 954-row HOLD accountability.
          # Omit the second identical CPU-intensive full run.
          python tools/localization/github_ab_imagegen_atlas_batch.py --repo-root . --out "$RUNNER_TEMP/ab-multi-one"
          python - "$RUNNER_TEMP/ab-multi-one/qa_report.json" <<'PY'
          import json, sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["schema"]=="outrun.ab-imagegen-hd-strict.v2"
          assert j["release_approved"] is False and j["runtime_validation"]=="UNTESTED"
          assert j["legacy_oversize_outputs_rejected"] is True
          assert j["translated_roi_generated"] >= 301 # last confirmed 2026-11-10 strict source baseline
          assert j["manual_user_test_only_roi_count"]==6
          assert j["release_approved"] is False
          assert j["salvage_policy"]=="EXISTING_AB_PNG_RESIZE_REFLOW_ONLY_NO_NEW_IMAGEGEN_V2"
          assert j["translated_roi_generated"]+sum(j["hold_roi_reason_counts"].values())==954
          for atlas in j["generated"]:
              assert atlas["plate_evidence"]=="SOURCE_CLEAN_FINAL_PREVIEWS_REVIEW_REQUIRED"
              for roi in atlas["painted"]:
                  assert roi["clean_type"]=="ISOLATED_SOURCE_ALPHA_TO_TRANSPARENT"
                  assert roi["original_line_count"]==roi["translated_line_count"]
                  for original,translated in zip(roi["original_native_lines"],roi["translated_native_lines"]):
                      assert original[0] <= translated[0] < translated[2] <= original[2]
                      assert original[1] <= translated[1] < translated[3] <= original[3]
          print("HD_STRICT_NATIVE_SIZE_AND_CLEAN_QA_GATES_PASS")
          PY
          sha256sum "$RUNNER_TEMP/ab-multi-one/OUTRUN_AB_HD_STRICT_CLEAN_TEST_ONLY.zip"

      - name: Generate source-bound HOLD triage tickets without unsafe auto-PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization/hd_hold_triage.py --repo-root . \
            --qa-report "$RUNNER_TEMP/ab-multi-one/qa_report.json" \
            --out "$RUNNER_TEMP/ab-multi-one/hold_triage"

      - name: Extract SHA-pinned English-owner and protected-art masks for overlap HOLDs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization/hd_source_protection_evidence.py --repo-root . \
            --qa-report "$RUNNER_TEMP/ab-multi-one/qa_report.json" \
            --out "$RUNNER_TEMP/ab-multi-one/source_protection" --max-previews 200

      - name: Write source-bound prioritized repair worklist for every held ROI
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization/hd_hold_resolution_plan.py --repo-root . \
            --qa-report "$RUNNER_TEMP/ab-multi-one/qa_report.json" \
            --source-evidence "$RUNNER_TEMP/ab-multi-one/source_protection/source_protection_evidence.json" \
            --out "$RUNNER_TEMP/ab-multi-one/source_protection"

      - name: Propose exact-SHA native alpha edge coordinate rebindings for review (no DDS modifications)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization/hd_source_edge_rebind.py --repo-root . \
            --qa-report "$RUNNER_TEMP/ab-multi-one/qa_report.json" \
            --out "$RUNNER_TEMP/ab-multi-one/source_protection" --pad 64

      - name: Automatically edit existing A/B PNG pixels and produce source-protected review previews
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization/hd_hold_auto_edit.py --repo-root . \
            --qa-report "$RUNNER_TEMP/ab-multi-one/qa_report.json" \
            --source-evidence "$RUNNER_TEMP/ab-multi-one/source_protection/source_protection_evidence.json" \
            --edge-proposals "$RUNNER_TEMP/ab-multi-one/source_protection/source_edge_rebind_proposals.json" \
            --out "$RUNNER_TEMP/ab-multi-one/auto_edits" --max-edits 180
          python - "$RUNNER_TEMP/ab-multi-one/auto_edits/auto_edit_report.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema"]=="outrun-hd-existing-pixel-auto-editor-v1"
          assert d["source_dds_modified"] is False
          assert d["input_ab_candidate_overwritten"] is False
          assert d["release_approved"] is False and d["runtime_validation"]=="UNTESTED"
          assert d["original_hold_count_unchanged"]==640
          assert d["attempted_edits"]<=180
          print("HD_EXISTING_AB_AUTO_EDIT_TEST_ONLY_AUDIT_PASS")
          PY

      - name: Preserve existing-art-only HOLD accountability without new ImageGen requests
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization/hd_rework_queue.py --reuse-only --repo-root . \
            --qa-report "$RUNNER_TEMP/ab-multi-one/qa_report.json" \
            --out "$RUNNER_TEMP/qa-rework-queue" \
            --skip-state-root "$GITHUB_WORKSPACE/hd-qa-queue-state/localization/automation_runs/hd_rework_queue/state"

      - name: Publish reuse-only QA report with zero new ChatGPT tasks
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/localization/publish_hd_rework_queue.py \
            --queue-dir "$RUNNER_TEMP/qa-rework-queue" \
            --qa-report "$RUNNER_TEMP/ab-multi-one/qa_report.json"

      - name: Preserve QA rework tickets and HD reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outrun-hd-qa-chatqueue-${{ github.run_id }}
          path: ${{ runner.temp }}/qa-rework-queue/
          retention-days: 21
          if-no-files-found: ignore

      - name: Preserve DDS TEST_ONLY, previews and per-ROI HOLD receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outrun-ab-multi-atlas-${{ github.run_id }}
          path: ${{ runner.temp }}/ab-multi-one/
          retention-days: 21
          if-no-files-found: warn
