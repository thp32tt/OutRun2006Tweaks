name: DXVK VR PoC

on:
  push:
    branches: [ vr-dxvk-poc ]
    paths:
      - 'src/vr/**'
      - 'vrhost/**'
      - 'CMakeLists.txt'
      - 'cmake.toml'
      - 'OutRun2006Tweaks.ini'
      - 'OutRun2006Tweaks.lods.ini'
      - 'docs/VR_DXVK_ARCHITECTURE.md'
      - 'dxvk-fork/**'
      - '.github/workflows/vr-dxvk-poc.yml'
  pull_request:
    branches: [ vr-openxr ]
    paths:
      - 'src/vr/**'
      - 'vrhost/**'
      - 'CMakeLists.txt'
      - 'cmake.toml'
      - 'OutRun2006Tweaks.ini'
      - 'docs/VR_DXVK_ARCHITECTURE.md'
      - 'dxvk-fork/**'
      - '.github/workflows/vr-dxvk-poc.yml'
  workflow_dispatch:

jobs:
  game-x86:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: safe
            safe_draw: 'ON'
          - id: r34
            safe_draw: 'OFF'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify VR source architecture
        shell: pwsh
        run: |
          python tools/verify_vr_architecture.py
          python tools/verify_vr_r32_review.py

      - name: Configure Win32 game DLL
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B "build-dxvk-${{ matrix.id }}" -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=${{ matrix.safe_draw }}

      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          $b = "build-dxvk-${{ matrix.id }}"
          (Get-Content "$b/_deps/safetyhook-build/src/safetyhook.vcxproj") -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content "$b/_deps/safetyhook-build/src/safetyhook.vcxproj"
          (Get-Content "$b/_deps/zydis-build/Zydis.vcxproj") -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content "$b/_deps/zydis-build/Zydis.vcxproj"
          (Get-Content "$b/_deps/zydis-build/zycore/Zycore.vcxproj") -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content "$b/_deps/zydis-build/zycore/Zycore.vcxproj"
          Set-Content -Path "$b/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c" -Value ""
          (Get-Content "$b/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h") -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content "$b/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h"

      - name: Build Win32 game DLL
        run: cmake --build build-dxvk-${{ matrix.id }} --config Release --target outrun2006tweaks

      - name: Verify DXVK-aware x86 payload
        shell: pwsh
        run: |
          $build = "build-dxvk-${{ matrix.id }}"
          $dll = Get-ChildItem -Path $build -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw 'DXVK PoC dinput8.dll was not produced' }
          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'missing MZ header' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014C) { throw ('expected Win32/x86 DLL, machine=0x{0:X4}' -f $machine) }
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @('VR DXVK PROBE:', 'VR DXVK MULTIVIEW:', 'production-safe R7 world path accepted custom one-D3D9-draw stereo ownership')) {
            if (-not $ascii.Contains($marker)) { throw "DXVK marker missing: $marker" }
          }
          if ('${{ matrix.id }}' -eq 'safe') {
            if (-not $ascii.Contains('VR SAFE-DRAW COMPARE:')) { throw 'safe build marker missing' }
          } else {
            if (-not $ascii.Contains('VR R33 DISPATCH:')) { throw 'R34/R33 build marker missing' }
          }
          New-Item -ItemType Directory -Force "stage-${{ matrix.id }}" | Out-Null
          Copy-Item $dll.FullName "stage-${{ matrix.id }}/dinput8.dll"
          Get-FileHash $dll.FullName -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: outrun-vr-dxvk-game-${{ matrix.id }}-x86
          path: stage-${{ matrix.id }}/dinput8.dll
          if-no-files-found: error

  host-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify shared VR architecture
        run: |
          python tools/verify_vr_architecture.py
          python tools/verify_vr_r32_review.py

      - name: Configure and build x64 OpenXR host
        run: |
          cmake -S vrhost -B build-vrhost -G "Visual Studio 17 2022" -A x64
          cmake --build build-vrhost --config Release

      - name: Run host regressions
        shell: pwsh
        run: |
          $tests = @('outrun-vr-shader-smoke.exe','outrun-vr-protocol-v3-smoke.exe','outrun-vr-host-state-v3-channel-smoke.exe','outrun-vr-v2-v3-shadow-conversion-smoke.exe','outrun-vr-host-pose-v3-validation-smoke.exe','outrun-vr-core-math-smoke.exe','outrun-vr-runtime-eligibility-smoke.exe','outrun-vr-r23-verified-bundle-smoke.exe','outrun-vr-r32-policy-smoke.exe')
          foreach ($test in $tests) {
            $path = Join-Path 'build-vrhost/bin' $test
            if (-not (Test-Path $path)) { throw "missing host smoke binary: $test" }
            & $path
            if ($LASTEXITCODE -ne 0) { throw "host smoke failed: $test ($LASTEXITCODE)" }
          }

      - name: Verify and stage x64 host
        shell: pwsh
        run: |
          $host = 'build-vrhost/bin/outrun-vr-host.exe'
          if (-not (Test-Path $host)) { throw 'outrun-vr-host.exe was not produced' }
          $bytes = [System.IO.File]::ReadAllBytes($host)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw 'expected x64 OpenXR host' }
          New-Item -ItemType Directory -Force stage-host | Out-Null
          Copy-Item $host stage-host/outrun-vr-host.exe
          Get-FileHash $host -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: outrun-vr-dxvk-host-x64
          path: stage-host/outrun-vr-host.exe
          if-no-files-found: error

  dxvk-x86:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - name: Install DXVK build dependencies
        run: pacman -Syu --needed --noconfirm git meson ninja mingw-w64-gcc glslang python

      - uses: actions/checkout@v4

      - name: Clone official DXVK v3.1.1
        run: git clone --branch v3.1.1 --depth 1 --recurse-submodules --shallow-submodules https://github.com/doitsujin/dxvk.git dxvk-src

      - name: Apply and validate OutRun VR provider overlay
        run: |
          python3 -m py_compile dxvk-fork/apply_out_run_vr.py
          python3 dxvk-fork/apply_out_run_vr.py dxvk-src
          git -C dxvk-src diff --check
          grep -R "b16d40b8-1a79-4e11-9d47-7a50c1f56e62" dxvk-src/src/d3d9
          grep -R "GetCapabilities" dxvk-src/src/d3d9
          grep -R "return S_FALSE;" dxvk-src/src/d3d9/d3d9_interop.cpp

      - name: Configure and build x86 DXVK
        run: |
          cd dxvk-src
          meson setup --cross-file build-win32.txt --buildtype release --prefix "$GITHUB_WORKSPACE/dxvk-install" build.w32
          cd ..
          ninja -C dxvk-src/build.w32 install
          find dxvk-install -type f -iname 'd3d9.dll' -print

      - name: Verify and stage PE32 provider
        run: |
          python3 - <<'PY'
          import pathlib, struct
          matches = list(pathlib.Path("dxvk-install").rglob("d3d9.dll"))
          if not matches:
              raise SystemExit("custom DXVK x86 d3d9.dll was not produced")
          p = matches[0]
          data = p.read_bytes()
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, pe + 4)[0]
          if machine != 0x014C:
              raise SystemExit(f"expected PE32 i386, machine=0x{machine:04X}")
          pathlib.Path("stage-dxvk").mkdir(exist_ok=True)
          pathlib.Path("stage-dxvk/d3d9.dll").write_bytes(data)
          print(f"verified {p}: PE32 i386")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: outrun-vr-dxvk-provider-x86
          path: stage-dxvk/d3d9.dll
          if-no-files-found: error

  package-safe:
    runs-on: windows-2022
    needs: [ game-x86, host-x64, dxvk-x86 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: outrun-vr-dxvk-game-safe-x86
          path: payload/game

      - uses: actions/download-artifact@v4
        with:
          name: outrun-vr-dxvk-host-x64
          path: payload/host

      - uses: actions/download-artifact@v4
        with:
          name: outrun-vr-dxvk-provider-x86
          path: payload/dxvk

      - name: Assemble root-level test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item payload/game/dinput8.dll package/dinput8.dll
          Copy-Item payload/host/outrun-vr-host.exe package/outrun-vr-host.exe
          Copy-Item payload/dxvk/d3d9.dll package/d3d9.dll
          Copy-Item OutRun2006Tweaks.ini package/OutRun2006Tweaks.ini
          Copy-Item OutRun2006Tweaks.lods.ini package/OutRun2006Tweaks.lods.ini
          $readme = @("OutRun 2006 VR - DXVK PoC SAFE package","Branch: vr-dxvk-poc","Game renderer: production-safe R26/R23/R22/R13/R9","DXVK provider: official v3.1.1 + OutRun protocol-v1 overlay","Config: RenderBackend=Auto","","Current provider milestone is fail-closed. It advertises protocol v1 but no multiview capability bits, so the validated stereo fallback remains active while DXVK diagnostics are collected.","","Replace the files in the game directory as one set. Keep logs tagged VR DXVK PROBE and VR DXVK MULTIVIEW.")
          $readme | Set-Content package/DXVK_TEST_README.txt
          Get-ChildItem package -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content package/SHA256SUMS.txt
          $short = $env:GITHUB_SHA.Substring(0,12)
          Compress-Archive -Path package/* -DestinationPath "OutRun2_VR_DXVK_SAFE_$short.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-DXVK-SAFE-${{ github.sha }}
          path: OutRun2_VR_DXVK_SAFE_*.zip
          if-no-files-found: error
