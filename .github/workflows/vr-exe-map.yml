name: VR EXE Knowledge Map

on:
  workflow_dispatch:
  push:
    branches:
      - 'vr-d3d9ex-candidate/VR-EXE-KNOWLEDGE-MAP-*'
    paths:
      - 'tools/reverse/**'
      - 'reverse/semantics.json'
      - 'docs/VR_BINARY_CONTRACT.json'
      - '.github/workflows/vr-exe-map.yml'

permissions:
  contents: read

jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GHIDRA_TAG: Ghidra_12.1.4_build
      GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
      CANONICAL_EXE_URL: https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download canonical executable
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$CANONICAL_EXE_URL" -o OR2006C2C.EXE
          python3 tools/verify_vr_binary_contract.py \
            --exe OR2006C2C.EXE \
            --manifest docs/VR_BINARY_CONTRACT.json \
            --source-root .

      - name: Download pinned Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/${GHIDRA_TAG}"
          url="$(curl -fsSL "$api" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith(".zip")))')"
          curl -fL "$url" -o ghidra.zip
          echo "$GHIDRA_SHA256  ghidra.zip" | sha256sum -c -
          unzip -q ghidra.zip -d "$RUNNER_TEMP/ghidra"
          home="$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo "GHIDRA_HOME=$home" >> "$GITHUB_ENV"

      - name: Build full executable map
        shell: bash
        run: |
          set -euo pipefail
          bash tools/reverse/run_ghidra_map.sh "$GITHUB_WORKSPACE/OR2006C2C.EXE" "$RUNNER_TEMP/OR2006C2C-map"

      - name: Smoke-query known semantic anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/reverse/exequery.py --db "$RUNNER_TEMP/OR2006C2C-map/exe_map.sqlite" 0x2D734 --context 4 | tee "$RUNNER_TEMP/query-hud.txt"
          python3 tools/reverse/exequery.py --db "$RUNNER_TEMP/OR2006C2C-map/exe_map.sqlite" RankMarker | tee "$RUNNER_TEMP/query-rank.txt"
          grep -q 'SEM-HUD-SPRITENODE-QUEUE-ENTER' "$RUNNER_TEMP/query-hud.txt"
          grep -q 'SEM-RIVAL-RANK-TRUNCATE' "$RUNNER_TEMP/query-rank.txt"

      - name: Validate map density
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sqlite3
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "OR2006C2C-map"
          summary = json.loads((root / "summary.json").read_text())
          c = summary["counts"]
          minimums = {
              "functions": 7000,
              "instructions": 400000,
              "calls": 30000,
              "xrefs": 150000,
              "strings": 7000,
              "imports": 150,
          }
          for key, minimum in minimums.items():
              assert c[key] >= minimum, f"{key}: {c[key]} < {minimum}"
          con = sqlite3.connect(root / "exe_map.sqlite")
          assert con.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          con.close()
          print(json.dumps(c, sort_keys=True))
          PY

      - name: Write and verify map provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, sqlite3, subprocess

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "OR2006C2C-map"
          db = root / "exe_map.sqlite"

          def sha256(path):
              h = hashlib.sha256()
              with pathlib.Path(path).open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          source_sha = os.environ["GITHUB_SHA"]
          source_tree = subprocess.check_output(
              ["git", "rev-parse", f"{source_sha}^{{tree}}"], cwd=repo, text=True
          ).strip()
          exe_sha = sha256(repo / "OR2006C2C.EXE")
          tracked = [
              "tools/reverse/ghidra/ExportOutRunMap.java",
              "tools/reverse/build_exe_map.py",
              "tools/reverse/exequery.py",
              "reverse/semantics.json",
              "docs/VR_BINARY_CONTRACT.json",
          ]
          tracked_hashes = {p: sha256(repo / p) for p in tracked}
          raw_hashes = {
              p.name: sha256(p)
              for p in sorted(root.glob("*.jsonl"))
          }

          con = sqlite3.connect(db)
          schema_row = con.execute("SELECT value FROM meta WHERE key='schema_version'").fetchone()
          schema_version = int(schema_row[0]) if schema_row else 0
          meta_values = {
              "map_source_sha": source_sha,
              "map_source_tree": source_tree,
              "map_workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "map_workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "map_ghidra_tag": os.environ["GHIDRA_TAG"],
              "map_ghidra_archive_sha256": os.environ["GHIDRA_SHA256"],
              "map_canonical_exe_sha256": exe_sha,
              "map_generator_sha256": tracked_hashes["tools/reverse/ghidra/ExportOutRunMap.java"],
              "map_builder_sha256": tracked_hashes["tools/reverse/build_exe_map.py"],
              "map_query_sha256": tracked_hashes["tools/reverse/exequery.py"],
              "map_semantics_sha256": tracked_hashes["reverse/semantics.json"],
              "map_binary_contract_sha256": tracked_hashes["docs/VR_BINARY_CONTRACT.json"],
          }
          for key, value in meta_values.items():
              con.execute(
                  "INSERT OR REPLACE INTO meta(key,value) VALUES(?,?)",
                  (key, json.dumps(value)),
              )
          con.commit()
          con.close()

          manifest = {
              "schemaVersion": 1,
              "generatedUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "sourceSha": source_sha,
              "sourceTree": source_tree,
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "ghidraTag": os.environ["GHIDRA_TAG"],
              "ghidraArchiveSha256": os.environ["GHIDRA_SHA256"],
              "canonicalExeSha256": exe_sha,
              "mapSchemaVersion": schema_version,
              "trackedInputSha256": tracked_hashes,
              "rawExportSha256": raw_hashes,
              "exeMapSqliteSha256": sha256(db),
          }
          (root / "MAP_PROVENANCE.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          check = json.loads((root / "MAP_PROVENANCE.json").read_text(encoding="utf-8"))
          assert check["sourceSha"] == source_sha
          assert check["sourceTree"] == source_tree
          assert check["canonicalExeSha256"] == sha256(repo / "OR2006C2C.EXE")
          assert check["exeMapSqliteSha256"] == sha256(db)
          for rel, digest in check["trackedInputSha256"].items():
              assert digest == sha256(repo / rel), rel
          for name, digest in check["rawExportSha256"].items():
              assert digest == sha256(root / name), name
          print(json.dumps({
              "sourceSha": source_sha,
              "sourceTree": source_tree,
              "mapSchemaVersion": schema_version,
              "exeMapSqliteSha256": check["exeMapSqliteSha256"],
          }, sort_keys=True))
          PY

      - name: Pack map artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/OR2006C2C-map/ghidra-project"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/OR2006C2C-exe-map.tar.gz" OR2006C2C-map
          (
            cd "$RUNNER_TEMP"
            sha256sum OR2006C2C-exe-map.tar.gz > OR2006C2C-exe-map.tar.gz.sha256
          )

      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: OR2006C2C-exe-map
          path: |
            ${{ runner.temp }}/OR2006C2C-exe-map.tar.gz
            ${{ runner.temp }}/OR2006C2C-exe-map.tar.gz.sha256
          retention-days: 30
