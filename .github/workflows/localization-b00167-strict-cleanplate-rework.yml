name: Localization B00167 Strict Clean-Plate Rework

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00167.rework.dispatch.json'

permissions:
  contents: write

concurrency:
  group: localization-b00167-strict-cleanplate-rework
  cancel-in-progress: false

jobs:
  produce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0

      - name: Refresh branch before production
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin korean-localization-clean

      - name: Install deterministic image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-cjk-extra imagemagick
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Rework index152 clean plate and Korean DDS
        run: python tools/localization/b00167_rework_runner.py

      - name: Commit B00167 strict rework result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A             docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00167.json             localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/49BB5FE5_128x32.dds             localization/graphics/role_B/20260930-B00167-P00082             localization/graphics/KOREAN_PNG_REVIEW/49BB5FE5
          git commit -m "localization(B): strict-clean rework index152 DXT5 [AUTO:LOCALIZATION-LOCALIZATION_B-00167]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
