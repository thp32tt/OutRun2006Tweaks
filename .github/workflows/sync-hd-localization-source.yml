name: Sync HD localization source

# Legacy bootstrap workflow retained only for explicit recovery.
# Normal A/B production MUST acquire exact canonical HD source bytes using
# docs/KOREAN_LOCALIZATION_AUTOMATION_CONTRACT.md (approved Drive per-file fast
# path first, pinned v0.25.10a upstream fallback) and MUST NOT depend on this job.
#
# The previous implementation downloaded a small hard-coded subset from
# Sonic-TV/OR2006Sprites raw URLs. That duplicated source policy and could surface
# misleading HTTP 404s when a raw path was absent. Keep synchronization manual
# until a manifest-driven implementation can verify every requested asset against
# localization/graphics/inventory.csv.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-sync-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical source acquisition
        run: |
          echo "Automatic legacy raw-URL HD sync is disabled."
          echo "Use docs/KOREAN_LOCALIZATION_AUTOMATION_CONTRACT.md."
          echo "GitHub remains state SSOT; approved Google Drive is large-binary/source transport."
          echo "Only canonical inventory-verified HD English source bytes may be used."
