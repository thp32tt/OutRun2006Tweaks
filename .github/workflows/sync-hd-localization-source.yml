name: Sync all pinned HD localization source DDS

on:
  workflow_dispatch:
  push:
    branches:
      - korean-localization-recovery-20260928
    paths:
      - ".github/workflows/sync-hd-localization-source.yml"
      - "localization/automation_inputs/hd_original_png_source_plan.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: outrun-hd-source-sync
  cancel-in-progress: true

jobs:
  sync-hd-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pinned plan, exact candidates and HD source destination
        uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/sync-hd-localization-source.yml
            /localization/automation_inputs/hd_original_png_source_plan.json
            /localization/graphics/hd_candidates
            /localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a

      - name: Resolve all 104 source DDS by exact SHA only
        shell: bash
        env:
          SOURCE_REPO: Sonic-TV/OR2006Sprites
          SOURCE_COMMIT: a95efe01d1f136514cef94b0d9e9fd61df021754
          SOURCE_PLAN: localization/automation_inputs/hd_original_png_source_plan.json
          DEST_ROOT: localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a
          CANDIDATE_ROOT: localization/graphics/hd_candidates
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.parse, urllib.request

          def digest(raw):
              return hashlib.sha256(raw).hexdigest()

          source_repo=os.environ["SOURCE_REPO"]
          source_commit=os.environ["SOURCE_COMMIT"]
          github_token=os.environ.get("GH_TOKEN","")
          plan_path=pathlib.Path(os.environ["SOURCE_PLAN"])
          dest_root=pathlib.Path(os.environ["DEST_ROOT"])
          candidate_root=pathlib.Path(os.environ["CANDIDATE_ROOT"])
          plan=json.loads(plan_path.read_text(encoding="utf-8"))
          entries=plan.get("entries")
          if not isinstance(entries,list):
              raise SystemExit("SOURCE_PLAN_ENTRIES_MISSING")
          targets={}
          for row in entries:
              target=row.get("target")
              expected=row.get("original_dds_sha256")
              if not isinstance(target,str) or not target.startswith("textures/load/") or ".." in pathlib.PurePosixPath(target).parts:
                  raise SystemExit("UNSAFE_SOURCE_TARGET:"+str(target))
              if not isinstance(expected,str) or len(expected)!=64:
                  raise SystemExit("INVALID_SOURCE_SHA:"+target)
              prior=targets.setdefault(target,expected)
              if prior!=expected:
                  raise SystemExit("CONFLICTING_SOURCE_SHA:"+target)
          if len(targets)!=104:
              raise SystemExit(f"ACTIVE_HD_SOURCE_TARGET_COUNT_CHANGED:{len(targets)}")

          verified=[]
          unresolved=[]
          for n,(target,expected) in enumerate(sorted(targets.items()),1):
              dest=dest_root/target
              candidate=candidate_root/target
              chosen=None
              source_kind=None

              if dest.is_symlink() or candidate.is_symlink():
                  raise SystemExit("REFUSE_SOURCE_SYMLINK:"+target)

              if dest.is_file():
                  raw=dest.read_bytes()
                  if digest(raw)==expected:
                      chosen=raw
                      source_kind="EXISTING_HD_SOURCE_SHA_EXACT"
                  else:
                      raise SystemExit("EXISTING_SOURCE_SHA_CONFLICT:"+target+":"+digest(raw)+":"+expected)

              if chosen is None and candidate.is_file():
                  raw=candidate.read_bytes()
                  if digest(raw)==expected:
                      chosen=raw
                      source_kind="HD_CANDIDATE_SHA_EXACT"

              upstream_actual=None
              rel=target.removeprefix("textures/load/")
              encoded=urllib.parse.quote(rel,safe="/")
              if chosen is None:
                  url=f"https://raw.githubusercontent.com/{source_repo}/{source_commit}/Release/{encoded}"
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"OutRun-HD-localization-source-sync"})
                      with urllib.request.urlopen(req,timeout=90) as response:
                          raw=response.read()
                      upstream_actual=digest(raw)
                      if upstream_actual==expected:
                          chosen=raw
                          source_kind="PINNED_UPSTREAM_RELEASE_SHA_EXACT"
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError) as exc:
                      upstream_actual="FETCH_ERROR:"+str(exc)[:120]

              history_checked=0
              if chosen is None:
                  api_path=urllib.parse.quote("Release/"+rel,safe="")
                  api=f"https://api.github.com/repos/{source_repo}/commits?path={api_path}&per_page=100"
                  headers={
                      "User-Agent":"OutRun-HD-localization-source-sync",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  }
                  if github_token:
                      headers["Authorization"]="Bearer "+github_token
                  try:
                      req=urllib.request.Request(api,headers=headers)
                      with urllib.request.urlopen(req,timeout=90) as response:
                          commits=json.loads(response.read().decode("utf-8"))
                      for item in commits:
                          commit_sha=item.get("sha")
                          if not isinstance(commit_sha,str):
                              continue
                          history_checked+=1
                          history_url=f"https://raw.githubusercontent.com/{source_repo}/{commit_sha}/Release/{encoded}"
                          try:
                              hreq=urllib.request.Request(history_url,headers={"User-Agent":"OutRun-HD-localization-source-sync"})
                              with urllib.request.urlopen(hreq,timeout=90) as response:
                                  historical=response.read()
                          except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError):
                              continue
                          if digest(historical)==expected:
                              chosen=historical
                              source_kind="UPSTREAM_HISTORY_SHA_EXACT:"+commit_sha
                              break
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, json.JSONDecodeError) as exc:
                      print("HD_SOURCE_HISTORY_LOOKUP_ERROR",target,str(exc)[:160])

              if chosen is None:
                  candidate_actual=digest(candidate.read_bytes()) if candidate.is_file() else None
                  unresolved.append({
                      "target":target,
                      "expected":expected,
                      "candidate_sha256":candidate_actual,
                      "upstream_release_sha256":upstream_actual,
                      "upstream_history_versions_checked":history_checked,
                  })
                  print("HD_SOURCE_HOLD",json.dumps(unresolved[-1],sort_keys=True))
                  continue

              dest.parent.mkdir(parents=True,exist_ok=True)
              if not dest.is_file():
                  dest.write_bytes(chosen)
              if digest(dest.read_bytes())!=expected:
                  raise SystemExit("SOURCE_WRITE_READBACK_MISMATCH:"+target)
              verified.append({
                  "target":target,
                  "sha256":expected,
                  "bytes":len(chosen),
                  "source_kind":source_kind,
              })
              print(f"HD_SOURCE_OK {n:03d}/104 {source_kind} {target} {expected}")

          summary={
              "schema":"outrun.hd-source-pinned-resolver.v3",
              "package":"OR2-HD-GUI-v0.25.10a",
              "upstream_repo":source_repo,
              "upstream_commit":source_commit,
              "active_target_count":len(targets),
              "verified_count":len(verified),
              "unresolved_count":len(unresolved),
              "source_plan":str(plan_path),
              "source_plan_sha256":digest(plan_path.read_bytes()),
              "runtime_validation":"UNTESTED",
              "files":verified,
              "unresolved":unresolved,
          }
          dest_root.mkdir(parents=True,exist_ok=True)
          (dest_root/"SOURCE_INFO.json").write_text(
              json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+"\n",
              encoding="utf-8")
          print("HD_SOURCE_SUMMARY",json.dumps({
              "verified":len(verified),"unresolved":len(unresolved)
          },sort_keys=True))
          if unresolved:
              raise SystemExit("HD_SOURCE_UNRESOLVED_"+str(len(unresolved)))
          if len(verified)!=104:
              raise SystemExit("HD_SOURCE_VERIFIED_COUNT_"+str(len(verified)))
          print("HD_SOURCE_COMPLETE_104")
          PY

      - name: Commit only SHA-exact HD source bytes to the asset branch
        shell: bash
        env:
          ASSET_BRANCH: korean-localization-recovery-20260928
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a
          if git diff --cached --quiet; then
            echo "HD_SOURCE_104_ALREADY_SYNCHRONIZED"
            exit 0
          fi
          git diff --cached --check
          git commit -m "assets(localization): sync all 104 SHA-pinned HD source DDS"
          pushed=0
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$ASSET_BRANCH"; then
              pushed=1
              break
            fi
            git fetch origin "$ASSET_BRANCH"
            git rebase "origin/$ASSET_BRANCH"
          done
          test "$pushed" = 1
          echo "HD_SOURCE_104_COMMITTED"

      - name: Summary
        if: always()
        run: |
          echo "Pinned upstream: Sonic-TV/OR2006Sprites@a95efe01d1f136514cef94b0d9e9fd61df021754"
          echo "Exact GitHub hd_candidates are allowed only when their full SHA256 equals source plan."
          echo "Expected active HD DDS: 104"
