name: Korean Menu Native-HD Rework

on:
  push:
    branches:
      - korean-localization-recovery-20260928
    paths:
      - 'tools/localization/rework_q205_native_hd.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rework-q205:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install deterministic image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Rebuild screenshot-visible q205 rows at native HD
        run: python tools/localization/rework_q205_native_hd.py

      - name: Verify exact scope
        run: |
          python - <<'PY'
          import json
          p='localization/graphics/role_B/20261008-B240-Q205-NATIVE-HD/B240_Q205_REPORT.json'
          j=json.load(open(p,encoding='utf-8'))
          assert j['changed_outside_rework_bboxes'] == 0
          assert j['protected_token_changed_pixels']['OutRun'] == 0
          assert j['protected_token_changed_pixels']['OutRun2SP'] == 0
          assert j['pixel_scale'] == 1
          print(j['candidate_sha256'])
          PY

      - name: Commit generated bytes and QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/ACF61D7C_1024x512.dds             localization/graphics/role_B/20261008-B240-Q205-NATIVE-HD
          git commit -m "localization(B240): native-HD main menu typography q205 [AUTO:LOCALIZATION-B240-Q205]"
          git fetch origin korean-localization-recovery-20260928
          git rebase origin/korean-localization-recovery-20260928
          git push origin HEAD:korean-localization-recovery-20260928
