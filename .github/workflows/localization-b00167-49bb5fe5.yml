name: Localization B00167 49BB5FE5 Producer

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00167.dispatch.json'

permissions:
  contents: write

concurrency:
  group: localization-b00167-49bb5fe5
  cancel-in-progress: false

jobs:
  produce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0

      - name: Refresh branch before production
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin korean-localization-clean

      - name: Install deterministic image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-cjk-extra
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Produce index152 candidate and decoded-final QA
        run: python tools/localization/b00167_render_49bb5fe5.py

      - name: Commit lane-local B00167 result and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/localization-b00167-49bb5fe5.yml
          git rm tools/localization/b00167_render_49bb5fe5.py
          git rm docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00167.dispatch.json
          git add             docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00167.json             localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/49BB5FE5_128x32.dds             localization/graphics/role_B/20260930-B00167-P00082             localization/graphics/KOREAN_PNG_REVIEW/49BB5FE5
          git commit -m "localization(B): finalize index152 full-effect clean rework [AUTO:LOCALIZATION-LOCALIZATION_B-00167]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
