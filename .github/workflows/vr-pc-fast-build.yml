name: VR PC Fast Test Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Full clean rebuild. Use only for build-system/dependency/toolchain/major branch-contract changes or unexplained runtime mismatch.'
        required: false
        default: false
        type: boolean
      upload_artifact:
        description: 'Also upload the ZIP to GitHub artifacts (slower)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - vr-d3d9ex-evidence-debug

concurrency:
  group: outrun-pc-fast-test
  cancel-in-progress: false

jobs:
  fast-build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pc-build]') }}
    runs-on: [self-hosted, Windows, X64, outrun-pc]
    timeout-minutes: 30

    steps:
      - name: Keep temporary writes on the runner SSD
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP | Out-Null
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "TEMP/TMP -> $env:RUNNER_TEMP"

      - name: Checkout current VR integration branch without deleting build cache
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1
          clean: false

      - name: Skip stale queued push
        if: ${{ github.event_name == 'push' }}
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          $triggerSha = '${{ github.sha }}'
          if ($checkedOut -ne $triggerSha) { throw "PC Fast checkout drift: expected=$triggerSha actual=$checkedOut" }
          # SHA-pinned checkout alone is insufficient. An older queued push
          # must not overwrite LATEST after a newer branch commit.
          $remote = @(git ls-remote --heads origin refs/heads/vr-d3d9ex-evidence-debug)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1) { throw 'PC Fast cannot verify current remote branch HEAD' }
          $currentSha = ($remote[0] -split '\s+')[0]
          if ($currentSha -ne $triggerSha) {
            Write-Host "PC Fast stale push skipped: trigger=$triggerSha remote=$currentSha"
            "OUTRUN_PC_STALE=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Fast incremental build and local package
        if: ${{ env.OUTRUN_PC_STALE != 'true' }}
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # Parse the ACTUAL script before running it; a concatenated, truncated
          # or historical PC Fast body must never produce an artifact.
          $buildScript = Join-Path (Get-Location) 'tools/Build-OutRunPCFast.ps1'
          $tokens = $null; $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($buildScript, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors -and $parseErrors.Count -gt 0) { throw ('PC Fast SCRIPT SYNTAX FAILURE: ' + (($parseErrors | ForEach-Object { $_.Message }) -join '; ')) }
          $scriptText = Get-Content $buildScript -Raw
          if (([regex]::Matches($scriptText, '(?m)^param\(')).Count -ne 1 -or
              ([regex]::Matches($scriptText, 'R26HUD-PC-FAST-v3-EXACT-SHA')).Count -ne 1 -or
              $scriptText.Contains('R51-PC-FAST-v2-R26HUD-ON')) { throw 'PC Fast duplicated or stale build contract' }
          $cleanRequested = '${{ inputs.clean }}' -eq 'true'
          $expectedSha = '${{ github.sha }}'
          if ($cleanRequested) {
            ./tools/Build-OutRunPCFast.ps1 -Clean -ExpectedSha $expectedSha
          } else {
            ./tools/Build-OutRunPCFast.ps1 -ExpectedSha $expectedSha
          }

          $zip = (Get-Content out/pc-fast/LAST_ZIP_PATH.txt -Raw).Trim()
          $drop = (Get-Content out/pc-fast/LAST_DROP_PATH.txt -Raw).Trim()
          "OUTRUN_PC_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OUTRUN_PC_DROP=$drop" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "### PC fast build ready" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Source: $(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Local test folder: $drop" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- ZIP: $zip" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Build policy: exact SHA pinned; x86 R26+HUD compiled DLL and manifest SHA256 must agree`n          - Final hosted CI: not run by this fast path" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload PC fast artifact
        if: ${{ env.OUTRUN_PC_STALE != 'true' && (github.event_name == 'push' || inputs.upload_artifact) }}
        uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-PC-FAST-${{ github.sha }}
          path: ${{ env.OUTRUN_PC_ZIP }}
          if-no-files-found: error
