name: Chat Controller Selftest

on:
  push:
    branches: [chat-controller-downloads]
    paths:
      - 'tools/chat-controller/v0.4/**'
      - 'tools/chat-controller/localization/**'
      - 'tests/test_localization_execution.py'
      - '.github/workflows/chat-controller-selftest.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and compile deployed controller
        run: |
          cat tools/chat-controller/v0.4/src/controller.py.part* > /tmp/controller.py
          python3 -m py_compile /tmp/controller.py
          if grep -En 'TASK_ID|TaskEvent|task_id|production_id|event_id|rollover|retry_count|chat_rollovers' tools/chat-controller/v0.4/src/*; then
            echo 'Removed execution engine found in deployed source'
            exit 1
          fi

      - name: Lane asset identity, restart, material evidence and QA regression tests
        run: python3 tools/chat-controller/v0.4/tests/test_event_model_v2.py -v

      - name: VR Controller v2 DX11/DXVK/DX9Ex regression tests
        run: |
          cat tools/chat-controller/v0.4/src-vr-v2/controller.py.part* > /tmp/controller-vr-v2.py
          python3 -m py_compile /tmp/controller-vr-v2.py
          bash -n tools/chat-controller/v0.4/entrypoint.vr.sh
          python3 -m unittest discover -s tools/chat-controller/v0.4/tests -p "test_vr_*.py" -v

      - name: Separate legacy localization implementation regression tests
        run: python3 tests/test_localization_execution.py

      - name: Check undefined Python names
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyflakes
          pyflakes /tmp/controller.py /tmp/controller-vr-v2.py | tee /tmp/pyflakes.txt || true
          if grep -q 'undefined name' /tmp/pyflakes.txt; then exit 1; fi

      - name: Validate unchanged Portainer compose interfaces
        run: |
          docker compose -f tools/chat-controller/v0.4/docker-compose.portainer-vr.yml config >/tmp/vr-compose.txt
          docker compose -f tools/chat-controller/v0.4/docker-compose.portainer-localization.yml config >/tmp/loc-compose.txt
          for compose in tools/chat-controller/v0.4/docker-compose.portainer{,-vr,-localization}.yml; do
            grep -Fq 'PREFERRED_THINKING_LEVEL: "High"' "$compose"
            grep -Fq 'STRICT_THINKING_LEVEL: "true"' "$compose"
          done
          grep -Fq 'EXPECTED_PROJECT_ID: "g-p-6ab9a64fc428819198c7f39765d764bf"' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'COPY src/controller.py.part*' tools/chat-controller/v0.4/Dockerfile.portainer
          grep -Fq 'dockerfile: Dockerfile.portainer-vr' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'COPY src-vr-v2/controller.py.part*' tools/chat-controller/v0.4/Dockerfile.portainer-vr

      - name: Verify prompt isolation and project guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('tools/chat-controller/v0.4')
          src = Path('/tmp/controller.py').read_text()
          for role in 'ABC':
              prompt = (root / f'localization_{role}.md').read_text()
              assert not re.search(r'TASK_ID|PRODUCTION_ID|EVENT_ID|ATTEMPT=|CHAT_ROLLOVER', prompt)
              assert 'UNTESTED' in prompt
          assert 'authorized offline game-mod/VR development' in src
          assert 'is_configured_project_url(page.url)' in src
          assert 'ensure_thinking_level(page)' in src
          assert 'Google Drive canonical HD source transport' in src
          for name in ('conversion_dx11.md', 'conversion_dxvk.md', 'conversion_dx9ex.md'):
              assert (root / name).stat().st_size
          PY

