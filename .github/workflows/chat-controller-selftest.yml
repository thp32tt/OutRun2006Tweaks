name: Chat Controller Selftest

on:
  push:
    branches: [chat-controller-downloads]
    paths:
      - 'tools/chat-controller/v0.4/**'
      - '.github/workflows/chat-controller-selftest.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and compile controller
        run: |
          cat tools/chat-controller/v0.4/src/controller.py.part* > /tmp/controller.py
          python -m py_compile /tmp/controller.py

      - name: Check undefined Python names
        run: |
          python -m pip install --disable-pip-version-check --quiet pyflakes
          pyflakes /tmp/controller.py | tee /tmp/pyflakes.txt || true
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            echo "Undefined Python names detected:"
            grep "undefined name" /tmp/pyflakes.txt
            exit 1
          fi

      - name: Validate Portainer compose files
        run: |
          docker compose -f tools/chat-controller/v0.4/docker-compose.portainer-vr.yml config >/tmp/vr-compose.txt
          docker compose -f tools/chat-controller/v0.4/docker-compose.portainer-localization.yml config >/tmp/loc-compose.txt

      - name: Verify High-only automation policy
        run: |
          for compose in \
            tools/chat-controller/v0.4/docker-compose.portainer-vr.yml \
            tools/chat-controller/v0.4/docker-compose.portainer-localization.yml \
            tools/chat-controller/v0.4/docker-compose.portainer.yml; do
            grep -Fq 'PREFERRED_THINKING_LEVEL: "High"' "$compose"
            grep -Fq 'STRICT_THINKING_LEVEL: "true"' "$compose"
          done
          grep -Fq 'EXPECTED_PROJECT_ID: "g-p-6ab9a64fc428819198c7f39765d764bf"' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'No assistant response was detected before the queue result grace period expired' tools/chat-controller/v0.4/src/controller.py.part03

      - name: Verify GitHub plugin-only task contract
        run: |
          grep -Fq 'GITHUB_ACCESS_MODE=CONNECTED_GITHUB_PLUGIN' /tmp/controller.py
          grep -Fq 'GITHUB_PLUGIN_AVAILABLE=TRUE' /tmp/controller.py
          grep -Fq 'PUBLIC_GITHUB_ACCESS=DO_NOT_USE' /tmp/controller.py
          grep -Fq 'FIRST_ACTION=CALL_GITHUB_PLUGIN' /tmp/controller.py
          test "$(grep -Fc 'GITHUB_ACCESS_MODE=CONNECTED_GITHUB_PLUGIN' /tmp/controller.py)" -ge 2
          test "$(grep -Fc 'GITHUB_PLUGIN_AVAILABLE=TRUE' /tmp/controller.py)" -ge 2
          test "$(grep -Fc 'PUBLIC_GITHUB_ACCESS=DO_NOT_USE' /tmp/controller.py)" -ge 2
          grep -Fq '연결된 GitHub 플러그인' /tmp/controller.py
          grep -Fq 'schema 노출 여부를 GitHub 연결 여부로 판단하지 마' /tmp/controller.py
          grep -Fq 'def assistant_claims_github_tooling_absent' /tmp/controller.py
          grep -Fq 'BLOCKED_TOOLING' /tmp/controller.py
          grep -Fq 'Keep the same TASK_ID/chat' /tmp/controller.py
          grep -Fq 'status="github_tooling_circuit_wait"' /tmp/controller.py
          grep -Fq 'GitHub 연결돼 있어. 연결된 GitHub 플러그인으로 다시 시도하고 TASK_ID=' /tmp/controller.py
          python - <<'PY2'
          import ast
          from pathlib import Path
          src = Path('/tmp/controller.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'assistant_claims_github_tooling_absent')
          ns = {}
          exec(compile(ast.Module(body=[fn], type_ignores=[]), '<classifier>', 'exec'), ns)
          detect = ns['assistant_claims_github_tooling_absent']
          samples = [
              'GitHub 플러그인의 실제 호출 함수(schema)가 노출되지 않아 branch 조회: 실행 불가, commit 생성 불가',
              '연결 GitHub connector를 사용할 수 없어 HEAD 조회 불가. RESULT_SHA=NOT_CREATED AUTOMATION_VALIDATION=NOT_RUN',
              'GitHub 도구 접근이 불가능해서 소스 수정 불가, Git commit 생성 불가, Actions Gate 확인 불가',
              '플러그인 함수가 보이지 않아 진행하지 못했습니다. GitHub 저장소 조회 불가, 커밋 없음',
              '현재 이 대화 환경에서는 연결된 GitHub 플러그인의 실제 리소스 호출 결과를 반환받지 못했습니다. 따라서 korean-localization-clean HEAD, docs/automation/runs, localization/controller_roles.json, canonical contract 내용을 실제 조회한 것으로 가장하여 진행하지 않겠습니다. 변경/커밋 없음. 결과 커밋 생성 없음.',
              '현재 이 대화 실행 환경에서는 요청한 연결 GitHub 플러그인의 실제 GitHub 호출 인터페이스가 노출되어 있지 않아 vr-dxvk-r71-disasm 실제 HEAD 조회 실행 불가, AGENTS.md 조회 불가, 소스 수정 및 커밋 생성 불가, GitHub Actions Gate 확인 불가입니다. TASK_ID=CONVERSION-DXVK-00267 RESULT_SHA=NOT_CREATED AUTOMATION_VALIDATION=NOT_RUN RUNTIME_VALIDATION=UNTESTED.',
              'GitHub 연결 리소스 탐색 호출은 수행했으나, 현재 이 세션에 노출된 도구 목록에는 실제 GitHub 저장소 조회/파일 읽기/커밋 실행 함수가 로드되어 있지 않아 korean-localization-clean branch와 docs/automation/runs/ 상태 파일을 직접 읽는 단계까지 진행할 수 없습니다. Git HEAD 검증: 미완료. 변경/커밋 없음.',
          ]
          assert all(detect(x) for x in samples)
          assert not detect('GitHub 플러그인으로 HEAD를 확인했고 소스 수정과 commit을 완료했습니다. RESULT_SHA=abc123')
          print('semantic GitHub refusal classifier verified')
          PY2

      - name: Verify all task prompts require connected GitHub plugin
        run: |
          for prompt in             conversion_dx11.md conversion_dxvk.md             localization_A.md localization_B.md localization_C.md localization_E.md; do
            grep -Fq '연결된 GitHub 플러그인을 실제 호출해 수행하고' "tools/chat-controller/v0.4/$prompt"
          done

      - name: Verify browser transport self-recovery
        run: |
          grep -Fq 'mem_limit: 5g' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'mem_reservation: 2g' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'def is_browser_transport_failure' /tmp/controller.py
          grep -Fq 'status="browser_transport_lost"' /tmp/controller.py
          grep -Fq 'Docker restart policy can recover' /tmp/controller.py
          test "$(grep -Fc 'if is_browser_transport_failure(e):' /tmp/controller.py)" -ge 3

      - name: Verify GitHub refusal preempts generic Retry
        run: |
          grep -Fq 'status="github_recovery_preempted_retry"' /tmp/controller.py
          python - <<'PY2'
          from pathlib import Path
          src=Path('/tmp/controller.py').read_text(encoding='utf-8')
          a=src.index('async def queue_handle_retry_surface')
          b=src.index('def assistant_claims_github_unavailable', a)
          body=src[a:b]
          assert body.index('assistant_text = await last_assistant_text(page)') < body.index('if await click_retry_generation(page):')
          assert body.index('assistant_claims_github_tooling_absent(assistant_text)') < body.index('if await click_retry_generation(page):')
          print('GitHub refusal recovery preempts generic Retry')
          PY2

      - name: Verify bounded generic Retry recovery
        run: |
          grep -Fq 'GENERIC_RETRY_ROLLOVER_CLICKS: "2"' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'GENERIC_RETRY_ROLLOVER_CLICKS: "2"' tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'GENERIC_RETRY_COOLDOWN_SECONDS: "300"' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'GENERIC_RETRY_COOLDOWN_SECONDS: "300"' tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'GITHUB_TOOLING_RETRY_COOLDOWN_SECONDS: "300"' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'GITHUB_TOOLING_RETRY_COOLDOWN_SECONDS: "300"' tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'generic_retry_cooldown_until' /tmp/controller.py
          grep -Fq 'status="generic_retry_circuit_wait"' /tmp/controller.py
          grep -Fq 'same TASK_ID/chat and cooling down instead of opening another chat' /tmp/controller.py
          test "$(grep -Fc 'queue_handle_retry_surface(context, pages, page, reg, slot, active, q)' /tmp/controller.py)" -eq 2

      - name: Verify queue prompt files and image packaging
        run: |
          test -s tools/chat-controller/v0.4/conversion_dx11.md
          test -s tools/chat-controller/v0.4/conversion_dxvk.md
          test -s tools/chat-controller/v0.4/localization_A.md
          test -s tools/chat-controller/v0.4/localization_B.md
          test -s tools/chat-controller/v0.4/localization_C.md
          test -s tools/chat-controller/v0.4/localization_E.md
          dockerfile=tools/chat-controller/v0.4/Dockerfile.portainer
          grep -Fq 'COPY conversion_dx11.md /opt/outrun/prompts/conversion_dx11.md' "$dockerfile"
          grep -Fq 'COPY conversion_dxvk.md /opt/outrun/prompts/conversion_dxvk.md' "$dockerfile"
          grep -Fq 'COPY localization_A.md /opt/outrun/prompts/localization_A.md' "$dockerfile"
          grep -Fq 'COPY localization_B.md /opt/outrun/prompts/localization_B.md' "$dockerfile"
          grep -Fq 'COPY localization_C.md /opt/outrun/prompts/localization_C.md' "$dockerfile"
          grep -Fq 'COPY localization_E.md /opt/outrun/prompts/localization_E.md' "$dockerfile"
          grep -Fq 'def validate_runtime_assets()' /tmp/controller.py
          grep -Fq 'validate_runtime_assets()' /tmp/controller.py
          python - <<'PY2'
          from pathlib import Path
          import re
          root = Path('tools/chat-controller/v0.4')
          dockerfile = (root/'Dockerfile.portainer').read_text(encoding='utf-8')
          for line in dockerfile.splitlines():
              line=line.strip()
              if not line.startswith('COPY ') or '*' in line:
                  continue
              parts=line.split()
              if len(parts) < 3:
                  continue
              src=parts[1]
              if src.startswith('--'):
                  continue
              assert (root/src).exists(), f'Dockerfile COPY source missing: {src}'
          src=Path('/tmp/controller.py').read_text(encoding='utf-8')
          required={'conversion_dx11.md','conversion_dxvk.md','localization_A.md','localization_B.md','localization_C.md','localization_E.md'}
          copied=set(re.findall(r'^COPY\s+([^\s]+\.md)\s+/opt/outrun/prompts/', dockerfile, re.M))
          assert required.issubset(copied), (required-copied)
          main=src[src.index('async def main_async'):]
          assert main.index('validate_runtime_assets()') < main.index('async_playwright()')
          print('runtime prompt assets and Docker COPY sources verified')
          PY2

      - name: Verify authorized game-mod context
        run: |
          grep -Fq 'GAME_MOD_CONTEXT = (' tools/chat-controller/v0.4/src/controller.py.part00
          grep -Fq 'authorized offline game-mod/VR development' tools/chat-controller/v0.4/src/controller.py.part00
          grep -Fq 'context_prefix = (GAME_MOD_CONTEXT' tools/chat-controller/v0.4/src/controller.py.part02
          grep -Fq 'lines = [GAME_MOD_CONTEXT, ""] + lines' tools/chat-controller/v0.4/src/controller.py.part03


      - name: Verify localization liveness runtime policy
        run: |
          compose=tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'QUEUE_RESULT_GRACE_SECONDS: "180"' "$compose"
          grep -Fq 'GITHUB_POLL_SECONDS: "60"' "$compose"
          grep -Fq 'GITHUB_BOUND_RUN_POLL_SECONDS: "30"' "$compose"
          grep -Fq 'WAIT_ACTIONS_STALE_SECONDS: "75"' "$compose"
          grep -Fq 'WAIT_ACTIONS_NO_RUN_TIMEOUT_SECONDS: "600"' "$compose"
          grep -Fq 'QUEUE_NEXT_TASK_DELAY_SECONDS: "15"' "$compose"
          grep -Fq 'QUEUE_IDLE_REARM_SECONDS: "90"' "$compose"
          grep -Fq 'PARALLEL_LANE_STAGGER_SECONDS: "15"' "$compose"
          grep -Fq 'PARALLEL_DISTINCT_SLOT_SEND_GAP_SECONDS: "30"' "$compose"
          grep -Fq 'HEARTBEAT_SECONDS: "15"' "$compose"
          grep -Fq 'LOCALIZATION_QA_BATCH_SIZE: "4"' "$compose"
          grep -Fq 'LOCALIZATION_QA_COALESCE_SECONDS: "60"' "$compose"
          grep -Fq 'LOCALIZATION_SAME_SLOT_SEND_GAP_SECONDS: "90"' "$compose"
          grep -Fq 'LOCALIZATION_SLOT_DEDUP_SECONDS: "30"' "$compose"
          grep -Fq 'def github_action_run_by_id' /tmp/controller.py
          grep -Fq 'run_id=bound_run_id' /tmp/controller.py
          grep -Fq 'def startup_reconcile_queue_state' /tmp/controller.py
          grep -Fq 'def refresh_wait_actions_task_binding' /tmp/controller.py
          grep -Fq 'rebound_from_result_sha' /tmp/controller.py
          grep -Fq 'startup_task_rebounds' /tmp/controller.py
          grep -Fq 'def watchdog_rearm_queue_state' /tmp/controller.py
          grep -Fq 'queue_loop_heartbeat_at=now.isoformat()' /tmp/controller.py
          if grep -Fq 'watchdog_queue_observe_only' /tmp/controller.py; then
            echo "legacy observe-only queue watchdog remains"
            exit 1
          fi


      - name: Verify continuous producer and batch-QA architecture
        run: |
          grep -Fq 'CHAT_SLOTS: "4"' tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'FRESH_CHAT_EACH_RUN: "false"' tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'FRESH_CHAT_EACH_RUN: "false"' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'CHAT_REUSE_MAX_TASKS: "4"' tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'CHAT_REUSE_MAX_TASKS: "4"' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'PREVIOUS_TASK_UI_SETTLE_SECONDS: "180"' tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'PREVIOUS_TASK_UI_SETTLE_SECONDS: "180"' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'mem_limit: 4g' tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'mem_reservation: 2g' tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'def enqueue_producer_result_for_qa' /tmp/controller.py
          grep -Fq 'def finalize_c_qa_batch' /tmp/controller.py
          grep -Fq 'qa_pending' /tmp/controller.py
          grep -Fq '"D": "localization_E.md"' tools/chat-controller/v0.4/src/controller.py.part02
          grep -Fq 'def prepare_reusable_slot_chat' tools/chat-controller/v0.4/src/controller.py.part02
          grep -Fq 'previous_task_ui_settle_wait' tools/chat-controller/v0.4/src/controller.py.part02
          grep -Fq 'bounded_chat_recycle' tools/chat-controller/v0.4/src/controller.py.part02
          grep -Fq 'lane_dispatch_config_error' tools/chat-controller/v0.4/src/controller.py.part03
          grep -Fq 'lane_dispatch_errors' tools/chat-controller/v0.4/src/controller.py.part03
          grep -Fq 'except FileNotFoundError as e:' tools/chat-controller/v0.4/src/controller.py.part03
          grep -Fq 'schema_version, config_blob_sha = localization_controller_contract_fingerprint()' tools/chat-controller/v0.4/src/controller.py.part03
          grep -Fq 'CONTROLLER_CONFIG_BLOB_SHA=' tools/chat-controller/v0.4/src/controller.py.part03
          grep -Fq 'container_memory_current_mib' /tmp/controller.py
          for prompt in localization_A.md localization_B.md localization_C.md localization_E.md; do
            grep -Fq 'docs/KOREAN_LOCALIZATION_AUTOMATION_CONTRACT.md' "tools/chat-controller/v0.4/$prompt"
            grep -Fq 'localization/controller_roles.json' "tools/chat-controller/v0.4/$prompt"
          done
          python - <<'PY2'
          from pathlib import Path
          src = Path("/tmp/controller.py").read_text(encoding="utf-8")
          a = src.index("async def localization_parallel_cycle")
          b = src.index("def reconcile_legacy_conversion_blocked", a)
          body = src[a:b]
          assert 'active_lane_order = sorted(' in body
          assert 'for lane_key in active_lane_order:' in body
          assert 'for lane_key in ("A", "B", "D")' in body
          assert 'enqueue_producer_result_for_qa' in body
          assert 'LOCALIZATION_QA_COALESCE_SECONDS' in body
          proc = src[src.index("async def localization_process_lane"):src.index("def _qa_item_key")]
          assert 'if lane_key in {"A", "B", "D"}:' in proc
          send = src[src.index("async def localization_send_lane_task"):src.index("def finalize_localization_producer_commit")]
          assert 'if FRESH_CHAT_EACH_RUN:' in send
          assert 'prepare_reusable_slot_chat(context, pages, reg, slot' in send
          assert 'previous task still generating; not opening a new chat yet' in send
          assert 'No producer/C barrier exists.' in body
          assert body.index('Priority lane {priority_lane} waiting for {guard}') < body.index('active_lane_order = sorted(')
          assert 'preserving send gap before active Retry traffic' in body
          print("four-slot A/B/E producers + C QA with bounded chat reuse verified")
          PY2

      - name: Verify schema 32 policy alignment
        run: |
          git fetch --force origin refs/heads/korean-localization-clean:refs/remotes/origin/korean-localization-clean
          git show refs/remotes/origin/korean-localization-clean:localization/controller_roles.json > /tmp/controller_roles.json
          python - <<'PY2'
          import json, pathlib, re
          cfg=json.loads(pathlib.Path('/tmp/controller_roles.json').read_text())
          assert cfg['schema_version'] >= 32
          ex=cfg['execution']; rt=cfg['runtime_tuning']; obs=cfg['runtime_observability']
          assert ex['controller_slot_count'] == 4
          assert ex['slot_map'] == {'A':'A','B':'B','C':'C','D':'E'}
          assert ex['concurrent_group'] == ['A','B','E'] and ex['qa_consumer'] == 'C'
          assert cfg['lanes']['C']['coalesce_seconds'] == 60
          assert rt['localization_qa_batch_size'] == 4
          assert rt['localization_qa_coalesce_seconds'] == 60
          assert rt['parallel_distinct_slot_send_gap_seconds'] == 30
          assert rt['localization_same_slot_send_gap_seconds'] == 90
          assert rt['localization_slot_dedup_seconds'] == 30
          assert rt['localization_extra_producer_qa_pause_threshold'] == 16
          assert rt['localization_extra_producer_qa_resume_threshold'] == 12
          assert rt['generic_retry_rollover_clicks'] == 2
          assert rt['fresh_chat_each_task'] is False
          assert rt['chat_reuse_max_tasks'] == 4
          assert rt['chat_reuse_max_age_minutes'] == 90
          assert rt['previous_task_ui_settle_seconds'] == 180
          assert rt['max_chat_rollovers_per_task'] == 2
          assert rt['github_transient_retry_delays'] == [2,5,10,20]
          assert rt['github_transient_cooldown_seconds'] == 60
          assert obs['task_chat_lifecycle'] == 'BOUNDED_REUSE_4_TASKS_OR_90_MINUTES'
          assert obs['previous_task_ui_settle_status'] == 'previous_task_ui_settle_wait'
          assert obs['github_transient_status'] == 'github_retry_wait'
          cp=cfg['runtime_recovery']['continuous_progression']
          assert cp['missing_lane_dispatch_precedes_retry_traffic'] is True
          assert cp['preserve_send_gap_for_missing_lane'] is True
          assert cp['durable_git_precedes_ui_recovery'] is True
          assert cp['post_send_task_identity_preserved'] is True
          assert cp['chat_rate_limit_blocks_sends_not_git_reconcile'] is True
          assert cp['negative_task_commit_lookup_not_cached'] is True
          assert cp['lane_exception_isolation'] is True
          assert cp['lane_exception_block_threshold'] == 3
          assert cp['dispatch_exception_backoff_max_seconds'] == 300
          assert cp['browser_transport_failure_global_restart'] is True
          assert cp['previous_task_ui_must_settle_before_next_send'] is True
          assert cp['previous_task_ui_settle_seconds'] == 180
          assert cp['bounded_chat_reuse'] is True
          assert cp['chat_reuse_max_tasks'] == 4
          assert cp['chat_reuse_max_age_minutes'] == 90
          assert cp['github_transient_errors_never_consume_task_attempt'] is True
          assert cp['github_transient_errors_never_trigger_chat_rollover'] is True
          assert cp['github_transient_retry_forever_across_cycles'] is True
          assert cp['github_transient_internal_retry_delays'] == [2,5,10,20]
          assert cp['github_transient_cooldown_seconds'] == 60
          assert cp['active_lane_retry_fairness'] is True
          assert cp['active_lane_recovery_order'] == 'OLDEST_EFFECTIVE_SEND_FIRST'
          assert cp['active_lane_effective_send_fields'] == ['last_retry_click_at','last_rollover_at','sent_at']
          assert obs['active_lane_recovery_order_field'] == 'active_lane_recovery_order'
          wd=cfg['runtime_recovery']['watchdog']
          assert wd['queue_mode_role'] == 'STATE_REARM_ONLY'
          assert wd['queue_mode_ui_owner'] == 'QUEUE_ENGINE'
          assert wd['queue_mode_ui_observation'] is False
          assert wd['queue_mode_ui_actions'] is False
          assert obs['queue_mode_watchdog_role'] == 'STATE_REARM_ONLY'
          assert cp['pre_send_task_identity_persisted'] is True
          assert cp['dispatch_confirmation_after_send'] is True
          assert cp['uncertain_dispatch_grace_seconds'] == 180
          assert cp['uncertain_dispatch_same_task_rollover'] is True
          assert cp['live_page_url_reconciles_stale_registry'] is True
          assert obs['dispatch_confirmation_field'] == 'dispatch_confirmed'
          assert obs['dispatch_started_at_field'] == 'dispatch_started_at'
          assert cp['c_blocked_inputs_remain_qa_pending'] is True
          assert cp['qa_blocked_is_diagnostic_not_consumed'] is True
          assert cp['startup_requeues_legacy_qa_blocked_inputs'] is True
          assert obs['qa_blocked_semantics'] == 'DIAGNOSTIC_UNVALIDATED_INPUTS_REMAIN_PENDING'
          assert cp['qa_blocked_retry_backoff_seconds'] == [300,600,1200,1800]
          assert cp['qa_blocked_retry_rotates_to_tail'] is True
