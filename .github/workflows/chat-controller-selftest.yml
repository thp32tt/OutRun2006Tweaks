name: Chat Controller Selftest

on:
  push:
    branches: [chat-controller-downloads]
    paths:
      - 'tools/chat-controller/v0.4/**'
      - '.github/workflows/chat-controller-selftest.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and compile controller
        run: |
          cat tools/chat-controller/v0.4/src/controller.py.part* > /tmp/controller.py
          python -m py_compile /tmp/controller.py

      - name: Check undefined Python names
        run: |
          python -m pip install --disable-pip-version-check --quiet pyflakes
          pyflakes /tmp/controller.py | tee /tmp/pyflakes.txt || true
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            echo "Undefined Python names detected:"
            grep "undefined name" /tmp/pyflakes.txt
            exit 1
          fi

      - name: Validate Portainer compose files
        run: |
          docker compose -f tools/chat-controller/v0.4/docker-compose.portainer-vr.yml config >/tmp/vr-compose.txt
          docker compose -f tools/chat-controller/v0.4/docker-compose.portainer-localization.yml config >/tmp/loc-compose.txt

      - name: Verify High-only automation policy
        run: |
          for compose in \
            tools/chat-controller/v0.4/docker-compose.portainer-vr.yml \
            tools/chat-controller/v0.4/docker-compose.portainer-localization.yml \
            tools/chat-controller/v0.4/docker-compose.portainer.yml; do
            grep -Fq 'PREFERRED_THINKING_LEVEL: "High"' "$compose"
            grep -Fq 'STRICT_THINKING_LEVEL: "true"' "$compose"
          done
          grep -Fq 'EXPECTED_PROJECT_ID: "g-p-6ab9a64fc428819198c7f39765d764bf"' tools/chat-controller/v0.4/docker-compose.portainer-vr.yml
          grep -Fq 'No assistant response was detected before the queue result grace period expired' tools/chat-controller/v0.4/src/controller.py.part03

      - name: Verify queue prompt files
        run: |
          test -s tools/chat-controller/v0.4/conversion_dx11.md
          test -s tools/chat-controller/v0.4/conversion_dxvk.md
          test -s tools/chat-controller/v0.4/localization_A.md
          test -s tools/chat-controller/v0.4/localization_B.md
          test -s tools/chat-controller/v0.4/localization_C.md

      - name: Verify authorized game-mod context
        run: |
          grep -Fq 'GAME_MOD_CONTEXT = (' tools/chat-controller/v0.4/src/controller.py.part00
          grep -Fq 'authorized offline game-mod/VR development' tools/chat-controller/v0.4/src/controller.py.part00
          grep -Fq 'context_prefix = (GAME_MOD_CONTEXT' tools/chat-controller/v0.4/src/controller.py.part02
          grep -Fq 'lines = [GAME_MOD_CONTEXT, ""] + lines' tools/chat-controller/v0.4/src/controller.py.part03


      - name: Verify localization liveness runtime policy
        run: |
          compose=tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          grep -Fq 'QUEUE_RESULT_GRACE_SECONDS: "180"' "$compose"
          grep -Fq 'GITHUB_POLL_SECONDS: "60"' "$compose"
          grep -Fq 'GITHUB_BOUND_RUN_POLL_SECONDS: "30"' "$compose"
          grep -Fq 'WAIT_ACTIONS_STALE_SECONDS: "75"' "$compose"
          grep -Fq 'QUEUE_NEXT_TASK_DELAY_SECONDS: "15"' "$compose"
          grep -Fq 'QUEUE_IDLE_REARM_SECONDS: "90"' "$compose"
          grep -Fq 'PARALLEL_LANE_STAGGER_SECONDS: "15"' "$compose"
          grep -Fq 'PARALLEL_DISTINCT_SLOT_SEND_GAP_SECONDS: "15"' "$compose"
          grep -Fq 'HEARTBEAT_SECONDS: "15"' "$compose"
          grep -Fq 'def github_action_run_by_id' /tmp/controller.py
          grep -Fq 'run_id=bound_run_id' /tmp/controller.py
          grep -Fq 'def startup_reconcile_queue_state' /tmp/controller.py
          grep -Fq 'def watchdog_rearm_queue_state' /tmp/controller.py
          grep -Fq 'queue_loop_heartbeat_at=now.isoformat()' /tmp/controller.py
          if grep -Fq 'watchdog_queue_observe_only' /tmp/controller.py; then
            echo "legacy observe-only queue watchdog remains"
            exit 1
          fi


      - name: Verify queue recovery ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("/tmp/controller.py").read_text(encoding="utf-8")
          a = src.index("async def watchdog_cycle")
          b = src.index("async def run_cycle", a)
          body = src[a:b]
          assert body.index("watchdog_rearm_queue_state(now)") < body.index("candidates =")
          assert body.index("watchdog_rearm_queue_state(now)") < body.index("stale_min =")
          print("queue recovery runs before UI stall timing")
          PY
