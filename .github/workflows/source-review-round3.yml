name: Source-only five-pass wheel review

on:
  push:
    branches:
      - wheel-ffb
    paths:
      - '.github/workflows/source-review-round3.yml'

permissions:
  contents: write

jobs:
  review-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Apply reviewed source fixes
        run: python3 .github/source_review_round3.py

      - name: Commit source-only fixes
        run: |
          rm -f .github/source_review_round3.py .github/workflows/source-review-round3.yml
          git config user.name "thp32tt"
          git config user.email "129367814+thp32tt@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden live FFB ownership and legacy UI state [skip ci]"
          git push origin HEAD:wheel-ffb
