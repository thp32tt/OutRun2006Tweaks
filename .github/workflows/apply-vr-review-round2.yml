name: Apply VR review round 2

on:
  push:
    branches: [ vr-openxr ]
    paths:
      - '.github/workflows/apply-vr-review-round2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-openxr
          fetch-depth: 0
      - name: Align R13 transactional marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vr/d3d9/stereo_renderer_r13.cpp')
          text = p.read_text(encoding='utf-8')
          old = 'transactional R13 install state=READY + atomic R7/R9 handoff + single ResetEx owner'
          new = 'transactional R13 install state=READY + atomic R7/R9 install handoff + single ResetEx owner'
          if text.count(old) != 1:
              raise SystemExit(f'expected one R13 marker, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/vr/d3d9/stereo_renderer_r13.cpp"
      - name: Commit marker alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/vr/d3d9/stereo_renderer_r13.cpp
          git commit -m "vr: align R13 transactional install contract"
          git push origin HEAD:vr-openxr
