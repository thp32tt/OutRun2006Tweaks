name: Domain Isolation Guard

on:
  push:
    branches:
      - vr-d3d9ex-focus
      - korean-localization-prototype
      - ffb-arcade-dd-research
  pull_request:
    branches:
      - vr-d3d9ex-focus
      - korean-localization-prototype
      - ffb-arcade-dd-research

permissions:
  contents: read

jobs:
  domain-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve validation range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "\${{ github.event_name }}" == "pull_request" ]]; then
            echo "BASE_SHA=\${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=\${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            BEFORE="\${{ github.event.before }}"
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              BEFORE="$(git rev-parse HEAD^)"
            fi
            echo "BASE_SHA=$BEFORE" >> "$GITHUB_ENV"
            echo "HEAD_SHA=\${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Verify domain isolation
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH="\${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          python tools/verify_domain_isolation.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --branch "$TARGET_BRANCH"
