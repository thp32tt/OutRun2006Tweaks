name: Localization A183R Typography Fix
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths: ['.github/workflows/localization-a183-oneoff.yml']
permissions:
  contents: write
jobs:
  run-a183r:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Verify evidence-gate tests
        run: python -m unittest discover -s tools/localization -p test_qa_evidence_gate.py -v
      - name: Build q214 with strict source bbox protection
        env:
          OUTRUN_CPU_WORKER: github-actions
          OUTRUN_CPU_ROLE: A
        run: python tools/localization/cpu_jobs/A.py
      - name: Commit isolated A183R material
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(localization/graphics/hd_candidates/|localization/graphics/role_A/|localization/graphics/worker_results/)' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          git add -A localization/graphics/hd_candidates localization/graphics/role_A localization/graphics/worker_results
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "localization(cpu): A183R q214 source scale rework"
          git fetch origin korean-localization-recovery-20260928
          git rebase origin/korean-localization-recovery-20260928
          git push origin HEAD:korean-localization-recovery-20260928
