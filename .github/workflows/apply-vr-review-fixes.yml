name: Apply VR review fixes

on:
  push:
    branches:
      - vr-openxr
    paths:
      - tools/apply_vr_review_fixes.py
      - .github/workflows/apply-vr-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-openxr
          fetch-depth: 0
      - name: Apply reviewed source edits
        run: python3 tools/apply_vr_review_fixes.py
      - name: Commit source edits and remove staging helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_vr_review_fixes.py .github/workflows/apply-vr-review-fixes.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(vr): harden direct lifetime and render caches"
          git push origin HEAD:vr-openxr
