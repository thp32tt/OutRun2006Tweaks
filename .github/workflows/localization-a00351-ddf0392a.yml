name: Localization A00351 DDF0392A Song Title Restore

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00351.dispatch.json'

permissions:
  contents: write

concurrency:
  group: localization-a00351-ddf0392a
  cancel-in-progress: false

jobs:
  produce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0

      - name: Refresh branch before production
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin korean-localization-clean

      - name: Install deterministic image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-cjk unzip
          python -m pip install --disable-pip-version-check 'pillow==12.3.0' 'numpy==2.3.5'

      - name: Reconstruct durable generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p localization/graphics/role_A/20261001-A00351-P00221
          printf '%s' '' | base64 -d | gzip -d > localization/graphics/role_A/20261001-A00351-P00221/generate_a00351_index222.py
          chmod +x localization/graphics/role_A/20261001-A00351-P00221/generate_a00351_index222.py

      - name: Acquire exact pinned v0.25.10a source member
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 -o /tmp/OR2-HD-GUI-v0.25.10a.zip https://github.com/envido32/OR2006Sprites/releases/download/v0.25.10a/OR2-HD-GUI-v0.25.10a.zip
          echo '76f85ed2ca27344a4292ac7e010a786579b4eebb1a370c0aa126fcb2b231d958  /tmp/OR2-HD-GUI-v0.25.10a.zip' | sha256sum -c -
          unzip -p /tmp/OR2-HD-GUI-v0.25.10a.zip textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds > /tmp/DDF0392A_256x512.dds
          echo 'bcfad5a1a71ab66c841134b0f3f3aa8fa5571b806bd3945dabeca3722d18fb72  /tmp/DDF0392A_256x512.dds' | sha256sum -c -

      - name: Generate v20 index222 candidate and QA evidence
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE" SOURCE_DDS=/tmp/DDF0392A_256x512.dds python localization/graphics/role_A/20261001-A00351-P00221/generate_a00351_index222.py
          echo 'e8dadfb5a976a9addafa08fe7a9dd1d94d4979ac387c496c98983e2d01e68b83  localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds' | sha256sum -c -

      - name: Commit atomic lane-local A00351 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00351.json localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds localization/graphics/role_A/20261001-A00351-P00221 localization/graphics/KOREAN_PNG_REVIEW/DDF0392A
          git commit -m "localization(A): restore index222 source song titles [AUTO:LOCALIZATION-LOCALIZATION_A-00351]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
