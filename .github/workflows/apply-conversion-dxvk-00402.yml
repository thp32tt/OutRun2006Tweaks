name: Apply CONVERSION-DXVK-00402 material patch

on:
  push:
    branches:
      - vr-dxvk-r71-disasm
    paths:
      - '.github/workflows/apply-conversion-dxvk-00402.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-dxvk-r71-disasm
          fetch-depth: 0

      - name: Apply exact material patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH=docs/automation/patches/CONVERSION-DXVK-00402.patch
          test -f "$PATCH"
          git apply --check "$PATCH"
          git apply "$PATCH"
          rm "$PATCH"

      - name: Validate material tree before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             tools/analyze_outrun_exe.py             tools/test_dxvk_continuation_100_control_flow.py             tools/test_dxvk_continuation_101_control_flow.py
          python3 -m unittest             tools.test_dxvk_continuation_100_control_flow             tools.test_dxvk_continuation_101_control_flow             tools.test_extract_dxvk_canonical_window             tools.test_verify_dxvk_continuation_window             -q
          python3 tools/verify_vr_backend_disasm_contract.py
          git diff --check

      - name: Commit and push material result
        id: material
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "dxvk: prove canonical 0x183b44 control flow [AUTO:CONVERSION-DXVK-00402]"
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:refs/heads/vr-dxvk-r71-disasm

      - name: Dispatch exact-SHA validation workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run dxvk-disasm-evidence.yml --ref vr-dxvk-r71-disasm
          gh workflow run backend-conversion-gate.yml --ref vr-dxvk-r71-disasm
          echo "material_sha=${{ steps.material.outputs.sha }}"
