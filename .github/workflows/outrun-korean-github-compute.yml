name: OutRun Korean GitHub Compute (no Docker)

on:
  schedule:
    # 02:17 KST daily; schedule runs only on default branch.
    - cron: "17 17 * * *"
  workflow_dispatch:
  push:
    branches:
      - korean-localization-recovery-20260928
    paths:
      - ".github/workflows/outrun-korean-github-compute.yml"
      - "tools/localization/github_docker_qa.py"
      - "tools/localization/test_github_docker_qa.py"
      - "localization/test_packages/**"

permissions:
  contents: read

concurrency:
  group: outrun-korean-github-compute
  cancel-in-progress: false

jobs:
  compose-qa-test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Korean GitHub sources (no N100)
        uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/localization/github_docker_qa.py
            tools/localization/test_github_docker_qa.py
            localization/test_packages

      - name: Setup Python on GitHub runner (NO Docker)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Run QA security tests
        run: python -m unittest discover -s tools/localization -p test_github_docker_qa.py -v

      - name: Run DDS QA and reproducibility check on GitHub CPU
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization/github_docker_qa.py --repo-root . --out "$RUNNER_TEMP/outrun-qa-a"
          python tools/localization/github_docker_qa.py --repo-root . --out "$RUNNER_TEMP/outrun-qa-b"
          cmp "$RUNNER_TEMP/outrun-qa-a/OUTRUN_KOREAN_NATIVE_3DDS_STATIC_TEST_ONLY.zip" \
              "$RUNNER_TEMP/outrun-qa-b/OUTRUN_KOREAN_NATIVE_3DDS_STATIC_TEST_ONLY.zip"
          cmp "$RUNNER_TEMP/outrun-qa-a/qa_report.json" "$RUNNER_TEMP/outrun-qa-b/qa_report.json"
          sha256sum "$RUNNER_TEMP/outrun-qa-a/OUTRUN_KOREAN_NATIVE_3DDS_STATIC_TEST_ONLY.zip"
          echo "Static QA only: visual and game runtime remain UNTESTED"

      - name: Upload GitHub artifact (no N100, no game install)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outrun-korean-github-compute-${{ github.run_id }}
          path: ${{ runner.temp }}/outrun-qa-a/
          if-no-files-found: warn
          retention-days: 21
