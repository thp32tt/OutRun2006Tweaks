name: Korean Localization Test Build

on:
  push:
    branches:
      - korean-localization-recovery-20260928
    paths:
      - '.github/workflows/korean-test-build.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake.toml'
      - 'cmkr.cmake'
      - 'external/**'
      - 'OutRun2006Tweaks.ini'
      - 'OutRun2006Tweaks.lods.ini'
      - 'localization/text/runtime_ko.tsv'
      # Candidate DDS and queue edits are not export approvals. Avoid rebuilding
      # Windows on every A/B/C evidence-only recheck or unapproved rerender.
      # C export must refresh this manifest when exact-SHA approvals change.
      - 'localization/graphics/role_C/APPROVALS/**'
      - 'localization/graphics/role_C/PRE_INGAME_JPG_REVIEW/manifest.json'
  workflow_dispatch:

jobs:
  build-korean-test:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build
          cmake -G "Visual Studio 17 2022" -A Win32 ..

      - name: Add older VC2022 redist workaround to safetyhook
        shell: pwsh
        run: |
          (Get-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/safetyhook-build/safetyhook.vcxproj
          (Get-Content build/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/zycore/Zycore.vcxproj

      - name: Disable SDL GameInput workaround
        shell: pwsh
        run: |
          Set-Content -Path build/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build Win32 Release
        run: cmake --build build --config Release

      - name: Copy runtime files
        shell: pwsh
        run: |
          Copy-Item OutRun2006Tweaks.ini build/bin/OutRun2006Tweaks.ini -Force
          Copy-Item OutRun2006Tweaks.lods.ini build/bin/OutRun2006Tweaks.lods.ini -Force
          New-Item -ItemType Directory -Force -Path build/bin/localization/text | Out-Null
          Copy-Item localization/text/runtime_ko.tsv build/bin/localization/text/runtime_ko.tsv -Force
          Invoke-WebRequest -Uri https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE -OutFile build/bin/OR2006C2C.exe

      - name: Select evidence-approved Korean graphics or runtime-only QA
        id: graphics
        shell: pwsh
        run: |
          $rows = Import-Csv localization/graphics/asset_queue.csv
          $review = Get-Content localization/graphics/role_C/PRE_INGAME_JPG_REVIEW/manifest.json -Raw | ConvertFrom-Json

          $queueByIndex = @{}
          foreach ($row in $rows) {
            $queueByIndex[[string]$row.index] = $row
          }

          $blocked = @{}
          foreach ($item in $review.mandatory_c3_blocked) {
            $blocked[[string]$item.queue_index] = $true
          }

          $selected = @()
          foreach ($item in $review.items) {
            if ([string]$item.source_kind -ne 'localized_candidate') {
              continue
            }

            $index = [string]$item.queue_index
            if ($blocked.ContainsKey($index)) {
              Write-Host "Skip mandatory-C3-blocked q$index"
              continue
            }
            if (-not $queueByIndex.ContainsKey($index)) {
              throw "PRE_INGAME q$index missing from asset_queue.csv"
            }

            $row = $queueByIndex[$index]
            $status = [string]$row.artwork_status
            if ($status -match '(?i)rework_required|hold_strict|preserve_original') {
              throw "Unsafe PRE_INGAME q$index status: $status"
            }

            $source = Join-Path 'localization/graphics/hd_candidates' ([string]$row.path)
            if (-not (Test-Path $source)) {
              throw "Missing PRE_INGAME candidate: $source"
            }

            $actualSha = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedSha = ([string]$item.candidate_sha256).ToLowerInvariant()
            if ($actualSha -ne $expectedSha) {
              # Braces around index are required before the colon in PowerShell interpolation.
              throw "Candidate SHA mismatch q${index}: expected=$expectedSha actual=$actualSha"
            }

            $dest = Join-Path 'build/bin' ([string]$row.path)
            New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
            Copy-Item $source $dest -Force
            $selected += [pscustomobject]@{
              index = $row.index
              path = $row.path
              artwork_status = $row.artwork_status
              candidate_sha256 = $actualSha
            }
          }

          # Zero approved candidates is a graphics export HOLD, not a Win32 build error.
          $mode = if ($selected.Count -eq 0) { 'RUNTIME_ONLY' } else { 'EVIDENCE_APPROVED_GRAPHICS' }
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "selected_count=$($selected.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $blockedCount = @($review.mandatory_c3_blocked).Count
          if ($mode -eq 'EVIDENCE_APPROVED_GRAPHICS') {
            $selected | Export-Csv build/bin/KOREAN_TEST_GRAPHICS_MANIFEST.csv -NoTypeInformation -Encoding UTF8
          } else {
            if (Test-Path build/bin/textures) {
              throw 'RUNTIME_ONLY must not contain any graphics textures.'
            }
            Write-Warning 'No currently approved Korean DDS; omitted all graphics. RUNTIME_ONLY.'
          }

          @(
            'OutRun 2006 Korean localization QA test package'
            "Source commit: $env:GITHUB_SHA"
            "QA package mode: $mode"
            "Approved Korean graphics included: $($selected.Count)"
            "Graphics held from export: $blockedCount"
            'Graphics source: role_C/PRE_INGAME_JPG_REVIEW/manifest.json'
            'Graphics require independently validated exact-source/exact-candidate C/C3 evidence.'
            'Runtime translations: localization/text/runtime_ko.tsv'
            'RUNTIME_ONLY has NO Korean DDS; it cannot validate the latest graphic rework.'
            'EVIDENCE_APPROVED_GRAPHICS contains only SHA-pinned approved Korean DDS.'
            'Actual in-game validation: UNTESTED'
            ''
            'Install in a separate backup/copy of OutRun 2006 Coast 2 Coast, not over earlier QA builds.'
            'Keep OutRun2006Tweaks.log, screenshots, and exact source commit for failures.'
          ) | Set-Content build/bin/KOREAN_TEST_BUILD_README.txt -Encoding UTF8
          @(
            "source_sha=$env:GITHUB_SHA"
            "mode=$mode"
            "graphics_selected=$($selected.Count)"
            "graphics_held=$blockedCount"
            'actual_game_validation=UNTESTED'
          ) | Set-Content build/bin/KOREAN_QA_BUILD_SCOPE.txt -Encoding UTF8
          Write-Host "QA package mode: $mode; approved graphics: $($selected.Count); held graphics: $blockedCount"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Korean test build: **$mode**, approved Korean DDS: **$($selected.Count)**, held: **$blockedCount**. Game testing: **UNTESTED**."

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path build/bin/dinput8.dll)) { throw 'dinput8.dll missing' }
          if (-not (Test-Path build/bin/OR2006C2C.exe)) { throw 'OR2006C2C.exe missing' }
          $rows = (Get-Content build/bin/localization/text/runtime_ko.tsv | Measure-Object -Line).Lines
          if ($rows -lt 1355) { throw "runtime_ko.tsv unexpectedly short: $rows lines" }
          $dds = @(Get-ChildItem build/bin/textures -Recurse -Filter *.dds -ErrorAction SilentlyContinue).Count
          $mode = '${{ steps.graphics.outputs.mode }}'
          $expected = [int]'${{ steps.graphics.outputs.selected_count }}'
          if ($mode -eq 'RUNTIME_ONLY') {
            if ($expected -ne 0 -or $dds -ne 0 -or (Test-Path build/bin/KOREAN_TEST_GRAPHICS_MANIFEST.csv)) {
              throw 'RUNTIME_ONLY must contain zero Korean DDS and no graphics manifest.'
            }
          } elseif ($mode -eq 'EVIDENCE_APPROVED_GRAPHICS') {
            if ($expected -lt 1 -or $dds -ne $expected) {
              throw "Approved graphics count mismatch: expected=$expected actual=$dds"
            }
            if (-not (Test-Path build/bin/KOREAN_TEST_GRAPHICS_MANIFEST.csv)) { throw 'Missing approved graphics manifest' }
          } else {
            throw "Unknown QA package mode: $mode"
          }
          if (-not (Test-Path build/bin/KOREAN_QA_BUILD_SCOPE.txt)) { throw 'Missing QA scope receipt' }
          Write-Host "QA mode: $mode; runtime rows: $rows; approved DDS: $dds"

      # User acceptance must be possible BEFORE final production approval.
      # This is a separate, clearly UNAPPROVED preview package.
      - name: Assemble historical C3 user-review graphics (NOT APPROVED)
        id: user_review
        shell: pwsh
        run: |
          $queue = Import-Csv localization/graphics/asset_queue.csv
          New-Item -ItemType Directory -Path build/user-review -Force | Out-Null
          Copy-Item -Path build/bin/* -Destination build/user-review -Recurse -Force
          if (Test-Path build/user-review/textures) {
            Remove-Item build/user-review/textures -Recurse -Force
          }
          if (Test-Path build/user-review/KOREAN_TEST_GRAPHICS_MANIFEST.csv) {
            Remove-Item build/user-review/KOREAN_TEST_GRAPHICS_MANIFEST.csv -Force
          }

          $selected = @()
          $missing = @()
          $seenPaths = @{}
          foreach ($row in $queue) {
            $status = [string]$row.artwork_status
            if ($status -notmatch '(?i)c3_strict_pass') { continue }
            if ($status -match '(?i)rework_required|visual_fail|hold_strict|reopened|_fail') { continue }
            if (@('localize_text', 'hangul_name_entry') -notcontains [string]$row.action) { continue }
            $index = ([string]$row.index).Trim([char]0xFEFF).Trim()
            $asset = ([string]$row.path).Replace([char]92, '/')
            if ($asset -notmatch '^textures/load/[a-zA-Z0-9_./-]+\.dds$' -or $asset.Contains('..')) {
              throw "Unsafe user-review asset path q${index}: $asset"
            }
            if ($seenPaths.ContainsKey($asset)) {
              throw "Duplicate preview destination q${index}: $asset"
            }
            $source = Join-Path 'localization/graphics/hd_candidates' $asset
            if (-not (Test-Path -LiteralPath $source)) {
              $missing += [pscustomobject]@{index = $index; path = $asset; reason = 'candidate_missing_at_HEAD'}
              Write-Warning "User-review q${index} candidate missing; omitting: $asset"
              continue
            }
            $seenPaths[$asset] = $true
            $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            $dest = Join-Path 'build/user-review' $asset
            New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $dest -Force
            if ((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw "Copied user-review DDS hash mismatch q${index}"
            }
            $selected += [pscustomobject]@{
              queue_index = $index
              path = $asset
              sha256 = $hash
              queue_status = $status
              approval = 'NOT_APPROVED_HISTORICAL_C3_ONLY'
              game_test = 'UNTESTED'
            }
          }

          if ($selected.Count -eq 0) {
            throw 'No historical-C3 candidate DDS available for user review.'
          }
          $selected | Export-Csv build/user-review/USER_REVIEW_UNAPPROVED_GRAPHICS.csv -NoTypeInformation -Encoding UTF8
          if ($missing.Count -gt 0) {
            $missing | Export-Csv build/user-review/USER_REVIEW_MISSING_CANDIDATES.csv -NoTypeInformation -Encoding UTF8
          }
          @(
            'OUTRUN 2006 KOREAN - USER GRAPHICS REVIEW PREVIEW - NOT APPROVED'
            "Source commit: $env:GITHUB_SHA"
            "Historical C3 candidate DDS included: $($selected.Count)"
            "Missing candidate DDS: $($missing.Count)"
            'This is a USER FEEDBACK build, NOT a final approved graphics distribution.'
            'Prior C3 queue status does NOT establish current evidence approval.'
            'Every included DDS current-byte SHA256 is pinned in USER_REVIEW_UNAPPROVED_GRAPHICS.csv.'
            'Known visual defects may remain; report queue_index and original-size screenshots.'
            'Install in a separate copy of the game, NEVER over earlier test builds.'
            'Runtime files are bundled from the SAME source commit.'
            'Actual game validation: UNTESTED; user acceptance NOT YET GRANTED.'
            'Attach screenshots and OutRun2006Tweaks.log for issues.'
          ) | Set-Content build/user-review/READ_ME_FIRST_USER_REVIEW.txt -Encoding UTF8
          @(
            "source_sha=$env:GITHUB_SHA"
            'mode=USER_REVIEW_NOT_APPROVED'
            "graphics_selected=$($selected.Count)"
            "graphics_missing=$($missing.Count)"
            'production_approval=NO'
            'runtime_validation=UNTESTED'
          ) | Set-Content build/user-review/USER_REVIEW_SCOPE.txt -Encoding UTF8
          $actual = @(Get-ChildItem build/user-review/textures/load -Recurse -Filter *.dds -ErrorAction SilentlyContinue).Count
          if ($actual -ne $selected.Count) {
            throw "User-review DDS manifest/file-count mismatch: expected $($selected.Count) actual $actual"
          }
          "count=$($selected.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "USER REVIEW: $($selected.Count) historical C3 DDS, $($missing.Count) missing, zero new approvals."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Separate **USER_REVIEW_NOT_APPROVED** preview: **$($selected.Count) historical C3 DDS**. NOT production-approved."

      - name: Upload UNAPPROVED user graphics review build
        if: steps.user_review.outputs.count != '' && steps.user_review.outputs.count != '0'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OutRun2-Korean-USER_REVIEW_NOT_APPROVED-${{ github.sha }}
          path: build/user-review/
          compression-level: 9
          retention-days: 30

      - name: Upload Korean test build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OutRun2-Korean-${{ steps.graphics.outputs.mode }}-${{ github.sha }}
          path: build/bin/
          compression-level: 9
          retention-days: 30
