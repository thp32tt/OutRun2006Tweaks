name: PSD Layer Source Pilot
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths: [.github/workflows/psd-layer-source-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-source-psd:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PSD compositor
        run: python -m pip install 'psd-tools[composite]' Pillow
      - name: Fetch only SHA-pinned PSDs matching canonical DDS hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, urllib.parse, urllib.request
          catalog = json.loads(Path('localization/graphics/plate_library/PSD_UPSTREAM_SOURCES.json').read_text())
          target = Path('_psd_source_pilot')
          target.mkdir(exist_ok=True)
          for q in (135, 49):
              entry = next(x for x in catalog['sources'] if x['queue_index'] == q)
              url = ('https://raw.githubusercontent.com/' + catalog['upstream_repo'] + '/' +
                     catalog['pinned_upstream_commit'] + '/' +
                     urllib.parse.quote(entry['psd_path'], safe='/'))
              dest = target / ('q' + str(q) + '.psd')
              urllib.request.urlretrieve(url, dest)
              actual = subprocess.check_output(['git', 'hash-object', str(dest)], text=True).strip()
              if actual != entry['git_blob_sha'] or dest.stat().st_size != entry['bytes']:
                  raise ValueError(f'Upstream PSD mismatch q{q}: {actual}')
              print(f'VERIFIED PSD q{q}: {dest.stat().st_size} bytes blob {actual}')
          PY
      - name: Separate actual original English and individual layers
        run: |
          python tools/localization/psd_layer_workbase.py separate \
            --psd _psd_source_pilot/q135.psd \
            --upstream-commit 3ce344e7ed6b1b535f5e4d34c1192071ff7afbe6 \
            --output _psd_source_pilot/q135_layers
          python tools/localization/psd_layer_workbase.py inventory \
            --psd _psd_source_pilot/q49.psd \
            --upstream-commit 3ce344e7ed6b1b535f5e4d34c1192071ff7afbe6 \
            --output _psd_source_pilot/q49_inventory
      - name: Verify extracted manifests and summarize layer structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('_psd_source_pilot/q135_layers/psd_layer_separated.json')
          q = Path('_psd_source_pilot/q49_inventory/psd_layer_inventory.json')
          for name, path in [('q135', p), ('q49', q)]:
              j = json.loads(path.read_text())
              print(name, j['size'], 'layer_count', len(j['layers']))
              print('first layers:', [(x['path'], x['name'], x['kind']) for x in j['layers'][:30]])
              if not j['layers']:
                  raise ValueError('No PSD layers found: ' + name)
          info = json.loads(p.read_text())
          assert info['layer_split_status'] == 'EXTRACTED_UNCLASSIFIED'
          assert info['C2_PLATE_PASS'] is False
          assert len(info['output_sha256']) >= 2
          print('PASS: actual PSD layers separated; CLEAN approval remains FALSE')
          PY
      - name: Upload temporary source inspection package
        uses: actions/upload-artifact@v4
        with:
          name: psd-layer-source-pilot
          path: |
            _psd_source_pilot/q135_layers/
            _psd_source_pilot/q49_inventory/
          retention-days: 3
