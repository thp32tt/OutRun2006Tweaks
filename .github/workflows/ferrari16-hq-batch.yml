name: Ferrari16 External HQ Batch Converter CI

on:
  push:
    branches:
      - 'feature/ferrari16-external-hq-batch-*'
    paths:
      - '.github/workflows/ferrari16-hq-batch.yml'
      - 'tools/car_importer/ferrari16_hq_batch/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-converter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact converter dependencies and pytest
        shell: pwsh
        run: |
          python -m pip install -r tools/car_importer/ferrari16_hq_batch/requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }

      - name: GLB to OVC3 integrity and fail-closed tests
        shell: pwsh
        run: |
          python -m pytest -q tools/car_importer/ferrari16_hq_batch/tests/test_converter.py
          if ($LASTEXITCODE -ne 0) { throw 'Converter tests failed' }

      - name: Verify 16-car source inventory is non-fabricated
        shell: pwsh
        run: |
          $root='tools/car_importer/ferrari16_hq_batch'
          python "$root/tools/ferrari_batch_converter.py" audit --workspace "$root"
          if ($LASTEXITCODE -ne 0) { throw 'Source inventory failed' }
          python -c "import json,pathlib; r=json.loads(pathlib.Path('tools/car_importer/ferrari16_hq_batch/registry.json').read_text(encoding='utf-8')); assert len(r['cars'])==16; assert len({c['id'] for c in r['cars']})==16"
          if ($LASTEXITCODE -ne 0) { throw 'Registry count mismatch' }
