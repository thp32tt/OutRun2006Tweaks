name: Localization C269 Oneoff
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths: ['.github/workflows/localization-c269-oneoff.yml']
permissions:
  contents: write
jobs:
  run-c269:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Run C269 evidence
        env:
          OUTRUN_CPU_WORKER: github-actions
          OUTRUN_CPU_ROLE: C
        run: python tools/localization/cpu_jobs/C.py
      - name: Commit C269 evidence
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(localization/graphics/role_C/20261008-C269-C2-Q154-Q172-Q214-EVIDENCE/|localization/graphics/worker_results/C269_C2_Q154_Q172_Q214.json)' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          git add -A localization/graphics/role_C/20261008-C269-C2-Q154-Q172-Q214-EVIDENCE localization/graphics/worker_results/C269_C2_Q154_Q172_Q214.json
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "localization(cpu): C269 C2 exact evidence"
          git fetch origin korean-localization-recovery-20260928
          git rebase origin/korean-localization-recovery-20260928
          git push origin HEAD:korean-localization-recovery-20260928
