name: Daytona v5 editable GLB PBR regression
on:
  push:
    branches:
      - feature/daytona365-editable-pbr-v5-20261107
  workflow_dispatch:
jobs:
  glb-pbr-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/test_daytona365_editable_v5.py
