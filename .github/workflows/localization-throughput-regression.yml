name: Localization Throughput Regression
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths:
      - 'tools/localization/imagegen_b_pipeline.py'
      - 'tools/localization/test_imagegen_b_pipeline.py'
      - 'tools/localization/summarize_qa_state.py'
      - 'tools/localization/test_summarize_qa_state.py'
      - 'tools/localization/qa_evidence_gate.py'
      - 'tools/localization/test_qa_evidence_gate.py'
      - '.github/workflows/localization-throughput-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-production-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install Pillow numpy
      - name: ImageGen source, aspect-ratio and saved DDS guards
        run: python -m unittest discover -s tools/localization -p 'test_imagegen_b_pipeline.py' -v
      - name: Scoped status versus whole-file QA accounting
        run: python -m unittest discover -s tools/localization -p 'test_summarize_qa_state.py' -v
      - name: Open actual-game failure approval veto
        run: python -m unittest discover -s tools/localization -p 'test_qa_evidence_gate.py' -v
      - name: Build read-only queue summary
        run: python tools/localization/summarize_qa_state.py > /tmp/localization-throughput.json
      - name: Archive QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-throughput-summary
          path: /tmp/localization-throughput.json
          if-no-files-found: ignore
