name: Localization A00221 DDF0392A V2 Candidate

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00221.dispatch.json'

permissions:
  contents: write

concurrency:
  group: localization-a00221-ddf0392a
  cancel-in-progress: false

jobs:
  produce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0

      - name: Refresh branch before production
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin korean-localization-clean

      - name: Install deterministic image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-cjk unzip
          python -m pip install --disable-pip-version-check 'pillow==12.3.0' 'numpy==2.3.5'

      - name: Acquire exact pinned v0.25.10a source member
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5             -o /tmp/OR2-HD-GUI-v0.25.10a.zip             https://github.com/envido32/OR2006Sprites/releases/download/v0.25.10a/OR2-HD-GUI-v0.25.10a.zip
          echo '76f85ed2ca27344a4292ac7e010a786579b4eebb1a370c0aa126fcb2b231d958  /tmp/OR2-HD-GUI-v0.25.10a.zip' | sha256sum -c -
          unzip -p /tmp/OR2-HD-GUI-v0.25.10a.zip             textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds             > /tmp/DDF0392A_256x512.dds
          echo 'bcfad5a1a71ab66c841134b0f3f3aa8fa5571b806bd3945dabeca3722d18fb72  /tmp/DDF0392A_256x512.dds' | sha256sum -c -

      - name: Reconstruct deterministic producer and generate index222
        shell: bash
        run: |
          set -euo pipefail
          cat             localization/graphics/role_A/20260930-A00221-P00117/generate_index222.part1.py             localization/graphics/role_A/20260930-A00221-P00117/generate_index222.part2.py             localization/graphics/role_A/20260930-A00221-P00117/generate_index222.part3.py             > /tmp/generate_index222.py
          REPO_ROOT="$GITHUB_WORKSPACE" SOURCE_DDS=/tmp/DDF0392A_256x512.dds python /tmp/generate_index222.py
          echo 'c2938974e9dbde92b05eab319f85e9dd226b7f89b037d24b67b463b312a92878  localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds' | sha256sum -c -

      - name: Commit atomic lane-local A00221 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00221.json             localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/DDF0392A_256x512.dds             localization/graphics/role_A/20260930-A00221-P00117/A00221_P00117_INDEX222_V2_PRODUCTION.json             localization/graphics/KOREAN_PNG_REVIEW/DDF0392A
          git commit -m "localization(A): persist index222 v2 candidate [AUTO:LOCALIZATION-LOCALIZATION_A-00221]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
