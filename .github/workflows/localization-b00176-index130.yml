name: Localization B00176 Index130 Producer

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00176.dispatch.json'

permissions:
  contents: write

concurrency:
  group: localization-b00176-index130
  cancel-in-progress: false

jobs:
  produce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0
      - name: Refresh branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin korean-localization-clean
      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-cjk-extra
          python -m pip install --disable-pip-version-check pillow numpy
      - name: Produce index130 candidate
        run: python tools/localization/b00176_index130.py
      - name: Commit result and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/localization-b00176-index130.yml
          git rm tools/localization/b00176_index130.py
          git rm docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00176.dispatch.json
          git add docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00176.json
          git add localization/graphics/role_B/20260930-B00176-P00088
          git add localization/graphics/KOREAN_PNG_REVIEW/1762489B
          git add localization/graphics/hd_candidates/textures/load/spr_sprani_sumo_fe_cvt_Exst/1762489B_512x128.dds
          git commit -m "localization(B): complete index130 RGBA32 Korean candidate [AUTO:LOCALIZATION-LOCALIZATION_B-00176]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
