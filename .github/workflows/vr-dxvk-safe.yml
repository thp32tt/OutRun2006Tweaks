name: DXVK SAFE Candidate

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'vr-d3d9ex-candidate/**'
      - vr-d3d9ex-focus
    paths:
      - 'docs/VR_DXVK_PROVIDER.json'
      - 'tools/Prepare-OutRunVRDXVKSafe.ps1'
      - 'tools/Select-OutRunVRBackend.ps1'
      - 'tools/Test-VRDXVKBackendContract.ps1'
      - '.github/workflows/vr-dxvk-safe.yml'

concurrency:
  group: vr-dxvk-safe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify VR runtime-test policy
        shell: pwsh
        run: ./tools/Test-OutRunVRTestPolicy.ps1
      - name: Verify DXVK selector identity contract
        shell: pwsh
        run: ./tools/Test-VRDXVKBackendContract.ps1

  provider:
    needs: policy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned official x86 DXVK provider
        shell: pwsh
        run: ./tools/Prepare-OutRunVRDXVKSafe.ps1 -OutputDirectory stage-provider
      - name: Validate staged provider identity
        shell: pwsh
        run: |
          $identity = Get-Content stage-provider/DXVK_PROVIDER.json -Raw | ConvertFrom-Json
          if ($identity.ReleaseTag -ne 'v3.1.1') { throw 'unexpected DXVK release tag' }
          if ($identity.AssetSha256 -ne '40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608') { throw 'unexpected DXVK archive digest' }
          if ($identity.PeMachine -ne '0x014C') { throw 'DXVK provider is not x86' }
          if (-not (Test-Path stage-provider/d3d9.dll)) { throw 'DXVK x86 d3d9.dll missing' }
          if (-not (Test-Path stage-provider/DXVK_LICENSE.txt)) { throw 'DXVK license missing' }
          if (Test-Path stage-provider/multiviewpatcher.dll) { throw 'SAFE provider contains multiview patcher' }
          $dllSha = (Get-FileHash stage-provider/d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($dllSha -ne $identity.D3D9Sha256) { throw 'DXVK provider d3d9 hash mismatch' }
          Write-Host "DXVK_D3D9_SHA256=$dllSha"
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-safe-provider
          path: stage-provider/
          if-no-files-found: error

  host:
    needs: policy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build x64 D3D11 OpenXR host
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host
          if (-not (Test-Path build-host/bin/outrun-vr-host.exe)) { throw 'OpenXR host missing' }
          New-Item -ItemType Directory -Force stage-host | Out-Null
          Copy-Item build-host/bin/outrun-vr-host.exe stage-host/outrun-vr-host.exe
          Set-Content stage-host/SOURCE_SHA.txt $env:GITHUB_SHA -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-safe-host
          path: stage-host/
          if-no-files-found: error

  game:
    needs: policy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Win32 game payload
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_R26_HUD_COMPARE=ON -DOUTRUN_VR_C1_COMPARE=OFF -DOUTRUN_VR_C2_COMPARE=OFF
      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ''
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      - name: Build Win32 game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks
      - name: Stage game DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage-game | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw 'dinput8.dll missing' }
          Copy-Item $dll.FullName stage-game/dinput8.dll
          Set-Content stage-game/SOURCE_SHA.txt $env:GITHUB_SHA -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-safe-game
          path: stage-game/
          if-no-files-found: error

  package:
    needs: [provider, host, game]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dxvk-safe-provider
          path: payload/provider
      - uses: actions/download-artifact@v4
        with:
          name: dxvk-safe-host
          path: payload/host
      - uses: actions/download-artifact@v4
        with:
          name: dxvk-safe-game
          path: payload/game
      - name: Assemble E_DXVK_SAFE package
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,12)
          $matrixId = "DXVK-SAFE-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))-$short"
          $dir = 'package'
          $d3d9Backend = Join-Path $dir 'backends/d3d9'
          $dxvkBackend = Join-Path $dir 'backends/dxvk'
          New-Item -ItemType Directory -Force $d3d9Backend,$dxvkBackend | Out-Null

          Copy-Item payload/game/dinput8.dll (Join-Path $d3d9Backend 'dinput8.dll')
          Copy-Item payload/host/outrun-vr-host.exe (Join-Path $d3d9Backend 'outrun-vr-host.exe')
          Set-Content (Join-Path $d3d9Backend 'SOURCE_SHA.txt') $env:GITHUB_SHA -Encoding ascii

          Copy-Item payload/provider/d3d9.dll (Join-Path $dxvkBackend 'd3d9.dll')
          Copy-Item payload/provider/DXVK_PROVIDER.json (Join-Path $dxvkBackend 'DXVK_PROVIDER.json')
          Copy-Item payload/provider/DXVK_LICENSE.txt (Join-Path $dxvkBackend 'DXVK_LICENSE.txt')

          Copy-Item OutRun2006Tweaks.ini (Join-Path $dir 'OutRun2006Tweaks.ini')
          Copy-Item OutRun2006Tweaks.lods.ini (Join-Path $dir 'OutRun2006Tweaks.lods.ini')
          foreach ($file in @('OutRunVR-TestProfiles.ps1','Select-OutRunVRBackend.ps1','Run-OutRunVRTest.ps1','Run-OutRunVRTest.cmd','Collect-OutRunVRLogs.ps1','Collect-OutRunVRLogs.cmd','Analyze-OutRunVRSession.ps1','OutRunVR-Backend-Selector.ps1','OutRunVR-Backend-Selector.cmd','OutRunVR-Slot-Selector.ps1','OutRunVR-Slot-Selector.cmd')) {
            Copy-Item (Join-Path 'tools' $file) (Join-Path $dir $file)
          }
          Copy-Item docs/VR_TEST_STRATEGY.md (Join-Path $dir 'VR_TEST_STRATEGY.md')
          Copy-Item docs/VR_DXVK_PROVIDER.json (Join-Path $dir 'VR_DXVK_PROVIDER_SOURCE.json')

          Set-Content (Join-Path $dir 'BUILD_MATRIX_ID.txt') $matrixId -Encoding ascii
          $provider = Get-Content (Join-Path $dxvkBackend 'DXVK_PROVIDER.json') -Raw | ConvertFrom-Json
          $buildInputs = [ordered]@{
            SchemaVersion = 2
            BuildMatrixId = $matrixId
            IntegrationSha = $env:GITHUB_SHA
            VariantId = 'E_DXVK_SAFE'
            Backend = 'dxvk-safe'
            DefaultTestProfile = 'CORRECTNESS'
            Profiles = @('CORRECTNESS','PERFORMANCE')
            DxvkReleaseTag = $provider.ReleaseTag
            DxvkArchiveSha256 = $provider.AssetSha256
            DxvkD3D9Sha256 = $provider.D3D9Sha256
            MultiviewPatcherIncluded = $false
            UserRuntimeVerified = $false
          }
          $buildInputs | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $dir 'BUILD_INPUTS.json') -Encoding UTF8

          Get-ChildItem $dir -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path.Substring((Resolve-Path $dir).Path.Length + 1))"
          } | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii

          $zip = "OutRun2_VR_DXVK_SAFE_$short.zip"
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Validate E_DXVK_SAFE package and selector
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter 'OutRun2_VR_DXVK_SAFE_*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'DXVK SAFE package missing' }
          Expand-Archive $zip.FullName verify
          foreach ($file in @('dinput8.dll','outrun-vr-host.exe','SOURCE_SHA.txt')) {
            if (-not (Test-Path (Join-Path 'verify/backends/d3d9' $file))) { throw "D3D9 backend payload missing $file" }
          }
          foreach ($file in @('d3d9.dll','DXVK_PROVIDER.json','DXVK_LICENSE.txt')) {
            if (-not (Test-Path (Join-Path 'verify/backends/dxvk' $file))) { throw "DXVK backend payload missing $file" }
          }
          if (Test-Path 'verify/backends/dxvk/multiviewpatcher.dll') { throw 'SAFE package must not contain multiviewpatcher.dll' }

          $provider = Get-Content 'verify/backends/dxvk/DXVK_PROVIDER.json' -Raw | ConvertFrom-Json
          $providerSha = (Get-FileHash 'verify/backends/dxvk/d3d9.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($providerSha -ne $provider.D3D9Sha256) { throw 'packaged DXVK provider hash mismatch' }

          Push-Location verify
          try {
            ./Select-OutRunVRBackend.ps1 -Backend dxvk-safe -TestProfile CORRECTNESS -VariantId E_DXVK_SAFE
            $active = Get-Content ACTIVE_VR_BACKEND.txt
            if ($active -notcontains 'backend=dxvk-safe') { throw 'selector did not activate dxvk-safe' }
            if ($active -notcontains 'provider=DXVK_X86_SAFE') { throw 'selector provider identity mismatch' }
            if ($active -notcontains ("dxvkD3D9Sha256=" + $provider.D3D9Sha256)) { throw 'selector DXVK hash identity mismatch' }
            $rootSha = (Get-FileHash d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($rootSha -ne $provider.D3D9Sha256) { throw 'selector installed unexpected DXVK d3d9.dll' }
            if (Test-Path multiviewpatcher.dll) { throw 'selector installed multiview patcher in SAFE mode' }
          } finally {
            Pop-Location
          }

          Write-Host "E_DXVK_SAFE_PACKAGE_VALIDATION=PASS"
          Write-Host "DXVK_D3D9_SHA256=$($provider.D3D9Sha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-DXVK-SAFE-${{ github.sha }}
          path: OutRun2_VR_DXVK_SAFE_*.zip
          if-no-files-found: error
