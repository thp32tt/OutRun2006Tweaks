name: Recovery Localization Controller

on:
  push:
    branches:
      - recovery/localization-no-e
      - chat-controller-downloads
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact pre-E controller files
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=42e3410d9582b85d74a51435188905c5bbd27feb
          git cat-file -e "$BASELINE^{commit}"
          git diff --exit-code "$BASELINE" --             tools/chat-controller/v0.4/src/controller.py.part00             tools/chat-controller/v0.4/src/controller.py.part01             tools/chat-controller/v0.4/src/controller.py.part02             tools/chat-controller/v0.4/src/controller.py.part03             tools/chat-controller/v0.4/localization_A.md             tools/chat-controller/v0.4/localization_B.md             tools/chat-controller/v0.4/localization_C.md             tools/chat-controller/v0.4/Dockerfile.portainer             tools/chat-controller/v0.4/entrypoint.direct.sh             tools/chat-controller/v0.4/requirements.direct.txt             tools/chat-controller/v0.4/docker-compose.portainer-localization.yml
          test ! -e tools/chat-controller/v0.4/localization_E.md

      - name: Validate exact pre-E prompt contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          a=Path('tools/chat-controller/v0.4/localization_A.md').read_text(encoding='utf-8')
          b=Path('tools/chat-controller/v0.4/localization_B.md').read_text(encoding='utf-8')
          c=Path('tools/chat-controller/v0.4/localization_C.md').read_text(encoding='utf-8')
          assert '홀수 index primary shard' in a
          assert '짝수 shard를 작업하거나 work-steal하지 마' in a
          assert '짝수 index primary shard' in b
          assert '홀수 shard를 작업하거나 work-steal하지 마' in b
          assert '독립적으로 계속 동작하는 배치 QA consumer' in c
          assert 'C가 검수하는 동안 A/B 생산은 계속된다' in c
          assert 'asset_queue_v2.csv' not in a+b+c
          assert 'LOCALIZATION_E' not in a+b+c
          PY

      - name: Assemble and compile controller
        shell: bash
        run: |
          set -euo pipefail
          cat tools/chat-controller/v0.4/src/controller.py.part* > /tmp/controller.py
          python -m py_compile /tmp/controller.py

      - name: Validate compose
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f tools/chat-controller/v0.4/docker-compose.portainer-localization.yml config >/tmp/compose.yml

      - name: Build localization controller
        shell: bash
        run: |
          set -euo pipefail
          docker build -t outrun-localization-pre-e:test             -f tools/chat-controller/v0.4/Dockerfile.portainer             tools/chat-controller/v0.4

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name outrun-localization-pre-e-smoke             -e CONTROLLER_MODE=localization             -e AUTO_SEND=false             -e QUEUE_MODE=true             -e LOCALIZATION_PARALLEL=true             -e CHAT_SLOTS=3             -e REQUIRE_PROJECT_URL=false             -e GITHUB_REPO=thp32tt/OutRun2006Tweaks             -e GITHUB_TOKEN=             -e CHATGPT_PROJECT_URL=             outrun-localization-pre-e:test
          cleanup() { docker rm -f outrun-localization-pre-e-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 30); do
            if docker exec outrun-localization-pre-e-smoke curl -fsS http://127.0.0.1:8787/status >/tmp/status.html 2>/dev/null; then
              ok=1
              break
            fi
            sleep 3
          done
          docker logs outrun-localization-pre-e-smoke || true
          test "$ok" = "1"
          grep -q "Controller mode:</b> localization" /tmp/status.html
          grep -q "Runtime" /tmp/status.html


      - name: Validate standalone localization source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=tools/chat-controller/localization
          cat "$ROOT"/src/controller.py.part* > /tmp/localization-only-controller.py
          python -m py_compile /tmp/localization-only-controller.py
          grep -q 'LOCALIZATION_ONLY = True' "$ROOT/src/controller.py.part00"
          grep -q 'CHAT_SLOTS = 3' "$ROOT/src/controller.py.part00"
          grep -q 'GENERIC_RETRY_MAX_CLICKS' "$ROOT/src/controller.py.part00"
          grep -q 'WAIT_CHAT_STUCK_SECONDS' "$ROOT/src/controller.py.part00"
          grep -q 'COMPOSER_HEALTH_ROLLOVER' "$ROOT/src/controller.py.part03"
          grep -q 'FRESH_CHAT_ROLLOVER' "$ROOT/src/controller.py.part03"
          test ! -e "$ROOT/vr_A.md"
          test ! -e "$ROOT/conversion_dx11.md"
          ! grep -q 'COPY vr_' "$ROOT/Dockerfile.portainer"
          ! grep -q 'COPY conversion_' "$ROOT/Dockerfile.portainer"

      - name: Validate standalone localization compose
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f tools/chat-controller/localization/docker-compose.portainer.yml config >/tmp/localization-only-compose.yml
          grep -q 'outrun_localization_network' /tmp/localization-only-compose.yml

      - name: Build standalone localization image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t outrun-localization-only:test tools/chat-controller/localization
          docker run --rm --entrypoint sh outrun-localization-only:test -c 'test -f /opt/outrun/prompts/localization_A.md && test -f /opt/outrun/prompts/localization_B.md && test -f /opt/outrun/prompts/localization_C.md && test ! -e /opt/outrun/prompts/vr_A.md && test ! -e /opt/outrun/prompts/conversion_dx11.md'

      - name: Smoke standalone localization runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name outrun-localization-only-smoke -e AUTO_SEND=false -e REQUIRE_PROJECT_URL=false -e CHAT_SLOTS=3 outrun-localization-only:test
          cleanup2() { docker rm -f outrun-localization-only-smoke >/dev/null 2>&1 || true; }
          trap cleanup2 EXIT
          ok=0
          for i in $(seq 1 30); do
            if docker exec outrun-localization-only-smoke curl -fsS http://127.0.0.1:8787/status >/tmp/localization-only-status.html 2>/dev/null; then
              ok=1
              break
            fi
            sleep 3
          done
          docker logs outrun-localization-only-smoke || true
          test "$ok" = "1"
          grep -q 'Controller mode:</b> localization' /tmp/localization-only-status.html
          grep -q '&quot;localization_only&quot;: true' /tmp/localization-only-status.html
