name: Fix v0.1 Verifier Docs

on:
  push:
    branches: [ wheel-ffb-v0.2-dev ]
    paths:
      - '.github/workflows/fix-v01-verifier-docs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wheel-ffb-v0.2-dev
          fetch-depth: 0
      - run: python3 tools/fix_v01_verifier_docs.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify_wheel_ffb_current.py
          git commit -m 'verify: align v0.1 docs with universal FFB [skip ci]'
          git push origin HEAD:wheel-ffb-v0.2-dev
