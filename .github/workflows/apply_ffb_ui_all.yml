# one-shot source application workflow
name: Apply FFB and setup UX review

on:
  push:
    branches: [ wheel-ffb ]
    paths:
      - '.github/apply_ffb_ui_all.py'
      - '.github/fix_ffb_ui_verifier.py'
      - '.github/workflows/apply_ffb_ui_all.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout wheel-ffb
        uses: actions/checkout@v7.0.1
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Apply reviewed FFB/UI changes
        run: python .github/apply_ffb_ui_all.py

      - name: Align legacy verifier with reversal release
        run: python .github/fix_ffb_ui_verifier.py

      - name: Verify current source invariants
        run: python tools/verify_wheel_ffb_current.py

      - name: Compile production-header math tests
        run: python tools/verify_wheel_ffb_math.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve wheel setup and FFB diagnostics [skip ci]"
          git push origin HEAD:wheel-ffb
