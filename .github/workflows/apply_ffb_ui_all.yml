name: Apply FFB and setup UX review

on:
  push:
    branches: [ wheel-ffb ]
    paths:
      - '.github/workflows/apply_ffb_ui_all.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: wheel-ffb
          fetch-depth: 0
      - name: Remove temporary review harness
        run: |
          rm -f .github/apply_ffb_ui_all.py
          rm -f .github/fix_ffb_ui_verifier.py
          rm -f .github/fix_ffb_ui_verifier2.py
          rm -f .github/postreview_ffb_ui_fix.py
          rm -f .github/workflows/apply_ffb_ui_all.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary FFB UI review harness"
          git push origin HEAD:wheel-ffb
