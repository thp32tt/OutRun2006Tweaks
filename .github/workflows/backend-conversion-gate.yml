name: Backend Conversion Gate

on:
  push:
    branches:
      - vr-dx11-native-r71
      - vr-dxvk-r71-disasm
  workflow_dispatch:

concurrency:
  group: backend-conversion-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Verify queue automation contract
        shell: pwsh
        run: python tools/verify_queue_controller_contract.py

      - name: Verify HMD-proven baseline
        shell: pwsh
        run: python tools/verify_vr_proven_baseline.py

      - name: Verify one-click structure contract
        shell: pwsh
        run: ./tools/Test-VROneClickContract.ps1

      - name: Test DX11 XR source-resolution A/B policy
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: python tools/test_dx11_xr_source_resolution_policy.py

      - name: Verify backend disassembly contract
        shell: pwsh
        run: python tools/verify_vr_backend_disasm_contract.py

      - name: Test VR session auto-analysis regressions
        shell: pwsh
        run: ./tools/Test-Analyze-OutRunVRSession.ps1

      - name: Verify DX11 native transport lifetime contract
        shell: pwsh
        run: python tools/verify_dx11_native_transport_contract.py

      - name: Verify DX11 dual-source blend contract
        shell: pwsh
        run: python tools/verify_dx11_dual_source_contract.py

      - name: Test DX11 static surface contract analyzer
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: python tools/test_dx11_static_surface_contract.py

      - name: Verify DX11 static surface contract
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: python tools/dx11_native_static_surface_contract_check.py src/vr/d3d11/resource_translation.cpp src/vr/d3d11/surface_mirror.cpp

      - name: Verify DX11 source hygiene
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: |
          $matches = git grep -n -F -- '[executed on device:' -- src/vr/d3d11 tools/verify_dx11_source_graph.py tools/verify_dx11_activation_boundary.py tools/dx11_constant_buffer_probe.cpp
          if ($LASTEXITCODE -eq 0) {
            $matches | Write-Host
            throw "DX11 source contains a remote execution transcript marker"
          }
          if ($LASTEXITCODE -ne 1) {
            throw "git grep failed while checking DX11 source hygiene (exit $LASTEXITCODE)"
          }
          exit 0

      - name: Verify exclusive DX11 pair staging R180
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: python tools/test_dx11_surface_pair_readback_r180.py

      - name: Verify DX11 triangle-fan actual GPU DrawIndexed R181
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: python tools/test_dx11_triangle_fan_gpu_draw_r181.py

      - name: Verify DX11 resource format role isolation R179
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: python tools/test_dx11_resource_role_format_r179.py

      - name: Verify DX11 transactional native resize R177
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: python tools/test_dx11_native_target_resize.py

      - name: Verify DX11 source graph
        shell: pwsh
        run: python tools/verify_dx11_source_graph.py

      - name: Verify DX11 dormant activation boundary
        shell: pwsh
        run: python tools/verify_dx11_activation_boundary.py

      - name: Test DX11 census analyzer
        shell: pwsh
        run: python tools/test_analyze_dx11_census.py

      - name: Configure Win32
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-auto -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_R26_HUD_COMPARE=ON -DOUTRUN_VR_C1_COMPARE=OFF -DOUTRUN_VR_C2_COMPARE=OFF

      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-auto/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-auto/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-auto/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-auto/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-auto/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-auto/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-auto/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-auto/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-auto/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build Win32
        run: cmake --build build-auto --config Release --target outrun2006tweaks

      - name: Verify binary exists
        shell: pwsh
        run: |
          $dll = Get-ChildItem build-auto -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw "dinput8.dll missing" }
          if ($dll.Length -lt 1000000) { throw "dinput8.dll unexpectedly small" }
          Write-Host "AUTOMATION_VALIDATION candidate built from $env:GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-autovalidated-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build-auto/bin/dinput8.dll
          if-no-files-found: error

  dx11-smoke:
    name: DX11 readiness smoke probes
    if: github.ref_name == 'vr-dx11-native-r71'
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Configure Win32
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-auto -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_R26_HUD_COMPARE=ON -DOUTRUN_VR_C1_COMPARE=OFF -DOUTRUN_VR_C2_COMPARE=OFF

      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-auto/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-auto/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-auto/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-auto/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-auto/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-auto/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-auto/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-auto/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-auto/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build DX11 fixed-function shader semantic smoke
        run: cmake --build build-auto --config Release --target dx11_fixed_function_shader_semantics

      - name: Run DX11 fixed-function shader semantic smoke
        shell: pwsh
        run: |
          $smoke = Get-ChildItem build-auto -Recurse -Filter dx11_fixed_function_shader_semantics.exe | Select-Object -First 1
          if (-not $smoke) { throw "DX11 fixed-function shader semantic smoke executable missing" }
          & $smoke.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 fixed-function shader semantic smoke failed with exit code $LASTEXITCODE" }

      - name: Build DX11 input-layout semantic smoke
        run: cmake --build build-auto --config Release --target dx11_input_layout_semantics

      - name: Run DX11 input-layout semantic smoke
        shell: pwsh
        run: |
          $smoke = Get-ChildItem build-auto -Recurse -Filter dx11_input_layout_semantics.exe | Select-Object -First 1
          if (-not $smoke) { throw "DX11 input-layout semantic smoke executable missing" }
          & $smoke.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 input-layout semantic smoke failed with exit code $LASTEXITCODE" }

      - name: Build DX11 input-signature semantic smoke
        run: cmake --build build-auto --config Release --target dx11_input_signature_semantics

      - name: Run DX11 input-signature semantic smoke
        shell: pwsh
        run: |
          $smoke = Get-ChildItem build-auto -Recurse -Filter dx11_input_signature_semantics.exe | Select-Object -First 1
          if (-not $smoke) { throw "DX11 input-signature semantic smoke executable missing" }
          & $smoke.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 input-signature semantic smoke failed with exit code $LASTEXITCODE" }

      - name: Build DX11 input-layout object probe
        run: cmake --build build-auto --config Release --target dx11_input_layout_object_probe

      - name: Run DX11 input-layout object probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_input_layout_object_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "DX11 input-layout object probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 input-layout object probe failed with exit code $LASTEXITCODE" }

      - name: Build DX11 shader object probe
        run: cmake --build build-auto --config Release --target dx11_shader_object_probe

      - name: Run DX11 shader object probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_shader_object_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "DX11 shader object probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 shader object probe failed with exit code $LASTEXITCODE" }

      - name: Build DX11 shader linkage probe
        run: cmake --build build-auto --config Release --target dx11_shader_linkage_probe

      - name: Run DX11 shader linkage probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_shader_linkage_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "DX11 shader linkage probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 shader linkage probe failed with exit code $LASTEXITCODE" }

      - name: Build DX11 native target resize R177 WARP probe
        run: cmake --build build-auto --config Release --target dx11_native_target_resize_probe

      - name: Run DX11 native target resize R177 WARP probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_native_target_resize_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "DX11 native target resize R177 probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 native target resize R177 WARP probe failed with exit code $LASTEXITCODE" }

      # R179 runs the native resource-format/mirror WARP proof before
      # the independently owned R175 varying probe can block later steps.
      - name: Build DX11 surface mirror probe
        run: cmake --build build-auto --config Release --target dx11_surface_mirror_probe

      - name: Run DX11 surface mirror probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_surface_mirror_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "DX11 surface mirror probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 surface mirror probe failed with exit code $LASTEXITCODE" }


      # R182 native guarded dispatch contract is verified once per changed source.
      - name: Verify R182 guarded native DrawIndexed
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: python tools/test_dx11_dormant_fan_draw_r182.py

      # R181 independently verifies real WARP DrawIndexed before inherited R175.
      - name: Build DX11 triangle-fan generated index-buffer probe
        run: cmake --build build-auto --config Release --target dx11_triangle_fan_index_buffer_probe

      - name: Run DX11 triangle-fan generated index-buffer probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_triangle_fan_index_buffer_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "DX11 triangle-fan generated index-buffer probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 triangle-fan generated index-buffer probe failed with exit code $LASTEXITCODE" }

      # R183: source delta once + real WARP VB/IB-owned indexed GPU pixels.
      - name: Verify DX11 native linear VB/IB R183 source contract
        if: github.ref_name == 'vr-dx11-native-r71'
        run: python tools/test_dx11_linear_buffer_owner_r183.py

      # R184: source-accurate, conservative DrawIndexed VB/IB bounds fence.
      - name: Verify DX11 native VB/IB R184 indexed bounds contract
        if: github.ref_name == 'vr-dx11-native-r71'
        run: python tools/test_dx11_linear_buffer_range_r184.py

      # R185: new native Draw entrypoint is dormant but genuinely GPU-exercised.
      - name: Verify DX11 native Draw R185 source contract
        if: github.ref_name == 'vr-dx11-native-r71'
        run: python tools/test_dx11_native_linear_draw_r185.py

      - name: Build DX11 linear VB/IB mirror R183 WARP probe
        if: github.ref_name == 'vr-dx11-native-r71'
        run: cmake --build build-auto --config Release --target dx11_linear_buffer_mirror_probe

      - name: Run DX11 linear VB/IB mirror R183 WARP probe
        if: github.ref_name == 'vr-dx11-native-r71'
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_linear_buffer_mirror_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "R183 WARP VB/IB probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "R183 WARP probe failed with code $LASTEXITCODE" }

      - name: Build DX11 constant buffer probe
        run: cmake --build build-auto --config Release --target dx11_constant_buffer_probe

      - name: Run DX11 constant buffer probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_constant_buffer_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "DX11 constant buffer probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 constant buffer probe failed with exit code $LASTEXITCODE" }

      - name: Build DX11 native transport probe
        run: cmake --build build-auto --config Release --target dx11_native_transport_probe

      - name: Run DX11 native transport probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_native_transport_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "DX11 native transport probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 native transport probe failed with exit code $LASTEXITCODE" }

      - name: Build DX11 fixed-function pipeline handoff probe
        run: cmake --build build-auto --config Release --target dx11_fixed_function_pipeline_probe

      - name: Run DX11 fixed-function pipeline handoff probe
        shell: pwsh
        run: |
          $probe = Get-ChildItem build-auto -Recurse -Filter dx11_fixed_function_pipeline_probe.exe | Select-Object -First 1
          if (-not $probe) { throw "DX11 fixed-function pipeline handoff probe executable missing" }
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw "DX11 fixed-function pipeline handoff probe failed with exit code $LASTEXITCODE" }