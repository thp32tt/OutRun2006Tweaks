name: R60 kind0 sprite deep reverse
on:
  push:
    branches:
      - vr-nightly-r59-final-hud-rank-20260927
    paths:
      - 'tools/reverse/r60_kind0_disasm.py'
      - '.github/workflows/vr-r60-kind0-reverse.yml'
permissions:
  contents: read
jobs:
  disasm:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - shell: pwsh
        run: Invoke-WebRequest -Uri 'https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE' -OutFile OR2006C2C.EXE
      - shell: pwsh
        run: |
          $h=(Get-FileHash OR2006C2C.EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne '68ceb386829066f8455b9d027320af962584321f3e2e8a79c72841495a6134c3'){throw $h}
          python tools/reverse/r60_kind0_disasm.py --exe OR2006C2C.EXE --out analysis/R60_KIND0_DISASM.md
      - uses: actions/upload-artifact@v4
        with:
          name: R60-kind0-disasm
          path: analysis/R60_KIND0_DISASM.md
