name: VR PC General Test Build

on:
  push:
    branches: [ vr-d3d9ex-focus ]
    paths:
      - '.github/workflows/vr-pc-general-build.yml'

concurrency:
  group: outrun-pc-general-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, outrun-pc]
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          clean: true
          fetch-depth: 1

      - name: Verify exact SHA
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "checkout drift: $actual" }
          Write-Host "Exact source: $actual"

      - name: Configure clean R26 HUD Win32 game
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          if (Test-Path out/pc-general) { Remove-Item out/pc-general -Recurse -Force }
          $flags=@(
            '-DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF',
            '-DOUTRUN_VR_R26_HUD_COMPARE=ON',
            '-DOUTRUN_VR_C1_COMPARE=OFF',
            '-DOUTRUN_VR_C2_COMPARE=OFF',
            '-DOUTRUN_VR_REFACTOR_SPLIT_R33_R32=OFF',
            '-DOUTRUN_VR_REFACTOR_SPLIT_R32_R31=OFF',
            '-DOUTRUN_VR_REFACTOR_SPLIT_R31_R30=OFF',
            '-DOUTRUN_VR_REFACTOR_SPLIT_R30_R29=OFF'
          )
          cmake -S . -B out/pc-general/game -G "Visual Studio 17 2022" -A Win32 @flags
          if ($LASTEXITCODE -ne 0) { throw 'game configure failed' }
          foreach($p in @(
            'out/pc-general/game/_deps/safetyhook-build/src/safetyhook.vcxproj',
            'out/pc-general/game/_deps/zydis-build/Zydis.vcxproj',
            'out/pc-general/game/_deps/zydis-build/zycore/Zycore.vcxproj')) {
            if(!(Test-Path $p)){throw "missing dependency project $p"}
            (Get-Content $p -Raw) -replace 'ZYCORE_STATIC_BUILD','_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content $p
          }
          $sdl=@(
            'out/pc-general/game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.cpp',
            'out/pc-general/game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if(!$sdl){throw 'SDL GameInput source missing'}
          Set-Content $sdl ''
          $cfg='out/pc-general/game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h'
          (Get-Content $cfg -Raw) -replace '#define SDL_JOYSTICK_GAMEINPUT 1','/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content $cfg

      - name: Build Win32 game DLL
        shell: pwsh
        run: |
          cmake --build out/pc-general/game --config Release --target outrun2006tweaks --parallel $([Environment]::ProcessorCount)
          if ($LASTEXITCODE -ne 0) { throw 'game build failed' }

      - name: Configure and build x64 OpenXR host
        shell: pwsh
        run: |
          cmake -S vrhost -B out/pc-general/host -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'host configure failed' }
          cmake --build out/pc-general/host --config Release --target outrun-vr-host --parallel $([Environment]::ProcessorCount)
          if ($LASTEXITCODE -ne 0) { throw 'host build failed' }

      - name: Verify and package
        shell: pwsh
        run: |
          $root='out/pc-general'
          $pkg=Join-Path $root 'package'
          $backend=Join-Path $pkg 'backends/d3d9'
          New-Item -ItemType Directory -Force $backend | Out-Null
          $dlls=@(Get-ChildItem "$root/game" -Recurse -File -Filter dinput8.dll | Where-Object {$_.FullName -match '\\bin\\'})
          if($dlls.Count -ne 1){throw "expected one dinput8.dll, found $($dlls.Count)"}
          $dll=$dlls[0]
          $bytes=[IO.File]::ReadAllBytes($dll.FullName)
          if($bytes.Length -lt 1000000 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a){throw 'invalid game DLL'}
          $ascii=[Text.Encoding]::ASCII.GetString($bytes)
          if(!$ascii.Contains('VR R26+HUD SAFE TEST:')){throw 'R26+HUD marker missing'}
          if($ascii.Contains('VR R33 DISPATCH: final Reset/Present/DirectGPU/draw physical ownership READY')){throw 'R84 marker present'}
          $host=Join-Path $root 'host/bin/outrun-vr-host.exe'
          if(!(Test-Path $host)){throw 'OpenXR host missing'}
          Copy-Item $dll.FullName (Join-Path $backend 'dinput8.dll')
          Copy-Item $host (Join-Path $backend 'outrun-vr-host.exe')
          Copy-Item OutRun2006Tweaks.ini $pkg
          Copy-Item OutRun2006Tweaks.lods.ini $pkg
          foreach($f in @(
            'OutRunVR-TestProfiles.ps1','Select-OutRunVRBackend.ps1',
            'Run-OutRunVRTest.ps1','Run-OutRunVRTest.cmd',
            'Collect-OutRunVRLogs.ps1','Collect-OutRunVRLogs.cmd',
            'Analyze-OutRunVRSession.ps1',
            'OutRunVR-Backend-Selector.ps1','OutRunVR-Backend-Selector.cmd',
            'OutRunVR-Slot-Selector.ps1','OutRunVR-Slot-Selector.cmd',
            'analyze_outrun_assets.py')) {
            if(!(Test-Path "tools/$f")){throw "runtime file missing $f"}
            Copy-Item "tools/$f" $pkg
          }
          $env:GITHUB_SHA | Set-Content (Join-Path $backend 'SOURCE_SHA.txt') -Encoding ascii
          'ACTIVE_R26_R43_R44' | Set-Content (Join-Path $backend 'VARIANT_ID.txt') -Encoding ascii
          'PC_GENERAL_CLEAN_BUILD' | Set-Content (Join-Path $pkg 'BUILD_CLASS.txt') -Encoding ascii
          $dllHash=(Get-FileHash (Join-Path $backend 'dinput8.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $hostHash=(Get-FileHash (Join-Path $backend 'outrun-vr-host.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "SourceSha=$env:GITHUB_SHA",
            "Renderer=R26+HUD",
            "BuildClass=PC_GENERAL_CLEAN_BUILD",
            "GameDllSha256=$dllHash",
            "HostSha256=$hostHash"
          ) | Set-Content (Join-Path $pkg 'PC_GENERAL_BUILD_INFO.txt') -Encoding utf8
          $zip=Join-Path $root ("OutRun2_VR_PC_GENERAL_" + $env:GITHUB_SHA + ".zip")
          Compress-Archive -Path "$pkg/*" -DestinationPath $zip -Force
          "OUTRUN_GENERAL_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "GENERAL BUILD READY: $zip"
          $dropRoot=if($env:OUTRUN_TEST_DROP_ROOT){$env:OUTRUN_TEST_DROP_ROOT}elseif(Test-Path 'L:\'){'L:\OutRunTestBuilds'}else{Join-Path ([Environment]::GetFolderPath('Desktop')) 'OutRunTestBuilds'}
          New-Item -ItemType Directory -Force $dropRoot | Out-Null
          Copy-Item $zip (Join-Path $dropRoot (Split-Path $zip -Leaf)) -Force
          $latest=Join-Path $dropRoot 'LATEST_GENERAL'
          if(Test-Path $latest){Remove-Item $latest -Recurse -Force}
          Copy-Item $pkg $latest -Recurse

      - name: Upload general PC build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OutRun2-VR-PC-GENERAL
          path: out/pc-general/OutRun2_VR_PC_GENERAL_*.zip
          if-no-files-found: error
          retention-days: 7
