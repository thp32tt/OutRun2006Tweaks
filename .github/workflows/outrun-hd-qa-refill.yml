name: OutRun HD QA Queue Auto Refill (GitHub no Docker)
on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/outrun-hd-qa-refill.yml"]
permissions:
  contents: write
concurrency:
  group: outrun-hd-qa-refill
  cancel-in-progress: true
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/localization/github_ab_imagegen_atlas_batch.py
            tools/localization/hd_strict_qa.py
            tools/localization/hd_rework_queue.py
            tools/localization/hd_qa_queue_refill.py
            tools/localization/publish_hd_rework_queue.py
            localization/automation_inputs/candidate_outputs
            localization/automation_inputs/hd_original_png_source_plan.json
            localization/test_packages/ab_preparation_20261102/ab_roi_crosswalk.csv
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-qa-queue-20261104
          path: hd-qa-queue-state
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            localization/automation_runs/hd_rework_queue/state
            localization/automation_runs/hd_rework_queue/latest.json
            localization/automation_runs/hd_rework_queue/last_report.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Refill at most eight new verified HD ImageGen tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/localization/hd_qa_queue_refill.py \
            --source . \
            --queue-root hd-qa-queue-state/localization/automation_runs/hd_rework_queue \
            --out "$RUNNER_TEMP/hd-refill"
