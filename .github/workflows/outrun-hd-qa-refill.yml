name: OutRun HD QA Reuse-Only Queue Audit (GitHub)

# Existing Korean A/B PNGs only. Never mint ImageGen tickets in this lane.
on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/outrun-hd-qa-refill.yml"

permissions:
  contents: read

concurrency:
  group: outrun-hd-qa-reuse-only-audit
  cancel-in-progress: true

jobs:
  audit-reuse-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current read-only GitHub QA status (no PNG/DDS or N100)
        uses: actions/checkout@v4
        with:
          ref: korean-localization-qa-queue-20261104
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            localization/automation_runs/hd_rework_queue/latest.json
            localization/automation_runs/hd_rework_queue/last_report.json

      - name: Verify no new ImageGen tickets and exact ROI accounting
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path("localization/automation_runs/hd_rework_queue")
          queue = json.loads((base / "latest.json").read_text(encoding="utf-8"))
          report = json.loads((base / "last_report.json").read_text(encoding="utf-8"))
          assert queue["schema"] == "outrun-hd-qa-chat-workqueue-v1"
          assert report["schema"] == "outrun.ab-imagegen-hd-strict.v2"
          assert queue.get("new_imagegen_disabled") is True, "NEW_IMAGEGEN_NOT_DISABLED"
          assert queue.get("tasks") == [], "UNEXPECTED_IMAGEGEN_TASKS"
          assert "NO_NEW_IMAGEGEN" in queue.get("selection_policy", "")
          assert report.get("salvage_policy") == "EXISTING_AB_PNG_RESIZE_REFLOW_ONLY_NO_NEW_IMAGEGEN_V2"
          assert report.get("release_approved") is False
          assert queue.get("release_approved") is False
          assert report.get("runtime_validation") == "UNTESTED"
          assert queue.get("runtime_validation") == "UNTESTED"

          active = report["active_roi_total"]
          painted = report["translated_roi_generated"]
          holds = sum(report["hold_roi_reason_counts"].values())
          assert active == queue["source_roi_count"] == 954
          assert painted + holds == active, "ROI_COVERAGE_MISMATCH"
          assert queue["hold_count"] == holds, "QUEUE_HOLD_COUNT_STALE"
          assert queue["source_asset_sha256"] == report["zip_sha256"], "QUEUE_REPORT_SHA_MISMATCH"
          assert queue["old_painted_count_invalid_for_release"] == painted
          assert sum(queue["hold_categories"].values()) == holds
          print(json.dumps({
              "status": "REUSE_ONLY_QUEUE_AUDIT_PASS",
              "total_roi": active,
              "existing_png_test_only_painted": painted,
              "held_roi": holds,
              "new_imagegen_tasks": 0,
              "release_approved": False,
          }, sort_keys=True))
          PY
