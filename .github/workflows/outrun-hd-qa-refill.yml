name: OutRun HD QA Queue Auto Refill (GitHub no Docker)
on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/outrun-hd-qa-refill.yml"]
permissions:
  contents: write
concurrency:
  group: outrun-hd-qa-refill
  cancel-in-progress: true
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/localization/github_ab_imagegen_atlas_batch.py
            tools/localization/hd_strict_qa.py
            tools/localization/hd_rework_queue.py
            tools/localization/hd_qa_queue_refill.py
            tools/localization/publish_hd_rework_queue.py
            localization/automation_inputs/candidate_outputs
            localization/automation_inputs/hd_original_png_source_plan.json
            localization/test_packages/ab_preparation_20261102/ab_roi_crosswalk.csv
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-qa-queue-20261104
          path: hd-qa-queue-state
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            localization/automation_runs/hd_rework_queue/state
            localization/automation_runs/hd_rework_queue/latest.json
            localization/automation_runs/hd_rework_queue/last_report.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Recover already-verified strict QA report from failed queue-publishing run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report="hd-qa-queue-state/localization/automation_runs/hd_rework_queue/last_report.json"
          if [[ -s "$report" ]]; then
            echo "EXISTING_SHA_BOUND_REPORT_REUSE"
            exit 0
          fi
          # The DDS itself passed twice and matched SHA; only the ticket
          # materializer crashed after completion. Reuse its exact report.
          run_id=41778858739
          expected_sha="60ef6f26fbd97d2132141b47e2251a5b8af1b405"
          actual_sha="$(gh api "repos/thp32tt/OutRun2006Tweaks/actions/runs/$run_id" --jq '.head_sha')"
          test "$actual_sha" = "$expected_sha"
          gh run download "$run_id" --repo thp32tt/OutRun2006Tweaks \
            --name "outrun-ab-multi-atlas-$run_id" --dir "$RUNNER_TEMP/seed-qa"
          source_report="$RUNNER_TEMP/seed-qa/qa_report.json"
          test -s "$source_report"
          python - "$source_report" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j.get("schema")=="outrun.ab-imagegen-hd-strict.v2"
          assert j.get("active_roi_total")==954
          assert j.get("translated_roi_generated")==4
          assert j.get("release_approved") is False
          assert j.get("runtime_validation")=="UNTESTED"
          assert j.get("zip_sha256")=="726270942f5ab4bfce103e8b05df9ed379ddba20ef60aec64e14a5262350c3e4"
          print("RECOVERED_STRICT_HD_REPORT_SHA_VERIFIED")
          PY
          mkdir -p "$(dirname "$report")"
          cp "$source_report" "$report"

      - name: Refill at most eight new verified HD ImageGen tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/localization/hd_qa_queue_refill.py \
            --source . \
            --queue-root hd-qa-queue-state/localization/automation_runs/hd_rework_queue \
            --out "$RUNNER_TEMP/hd-refill"
