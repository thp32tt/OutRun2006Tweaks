name: One-shot v0.3 hardware compatibility fixes

on:
  push:
    branches: [ wheel-ffb-v0.3-compat ]
    paths:
      - '.github/workflows/one-shot-v03-compat.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Apply compatibility fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          profiles = Path('src/wheel_profile_store.hpp')
          text = profiles.read_text(encoding='utf-8')
          old = '''        std::filesystem::rename(staged, finalPath, ec);
        if (ec)
        {
            const std::string replaceError = ec.message();
            if (finalExists)
            {
                std::error_code restoreEc;
                std::filesystem::rename(backup, finalPath, restoreEc);
                if (restoreEc)
                {
                    if (error) *error = "Could not install the new profile (" + replaceError +
                        ") and could not restore the backup (" + restoreEc.message() + ").";
                    return false;
                }
            }
            if (error) *error = "Could not install the completed profile: " + replaceError;
            return false;
        }

        if (finalExists)
        {
            std::error_code ignored;
            std::filesystem::remove(backup, ignored);
        }
        return true;
'''
          new = '''        bool installedByCopyFallback = false;
        std::filesystem::rename(staged, finalPath, ec);
        if (ec)
        {
            const std::string renameError = ec.message();
            std::error_code copyEc;
            std::filesystem::copy_file(
                staged, finalPath, std::filesystem::copy_options::overwrite_existing, copyEc);
            if (copyEc)
            {
                if (finalExists)
                {
                    std::error_code restoreEc;
                    std::filesystem::rename(backup, finalPath, restoreEc);
                    if (restoreEc)
                    {
                        if (error) *error = "Could not install the new profile (rename: " + renameError +
                            "; copy fallback: " + copyEc.message() + ") and could not restore the backup (" +
                            restoreEc.message() + "). Destination: " + finalPath.string();
                        return false;
                    }
                }
                if (error) *error = "Could not install the completed profile (rename: " + renameError +
                    "; copy fallback: " + copyEc.message() + "). Destination: " + finalPath.string();
                return false;
            }
            installedByCopyFallback = true;
        }

        std::error_code verifyEc;
        const bool installed = std::filesystem::is_regular_file(finalPath, verifyEc) && !verifyEc;
        if (!installed)
        {
            std::error_code ignored;
            std::filesystem::remove(finalPath, ignored);
            if (finalExists)
            {
                std::error_code restoreEc;
                std::filesystem::rename(backup, finalPath, restoreEc);
                if (restoreEc)
                {
                    if (error) *error = "Profile installation could not be verified and the previous profile could not be restored: " +
                        restoreEc.message() + ". Destination: " + finalPath.string();
                    return false;
                }
            }
            if (error) *error = "Profile installation could not be verified. Destination: " + finalPath.string();
            return false;
        }

        if (installedByCopyFallback)
        {
            std::error_code ignored;
            std::filesystem::remove(staged, ignored);
        }
        if (finalExists)
        {
            std::error_code ignored;
            std::filesystem::remove(backup, ignored);
        }
        return true;
'''
          if old not in text:
              raise SystemExit('profile commit block not found')
          profiles.write_text(text.replace(old, new, 1), encoding='utf-8')

          ui = Path('src/overlay/wheel_setup_ui.cpp')
          text = ui.read_text(encoding='utf-8')

          old = '''                const auto readiness = [](const char* label, bool ok)
                {
                    ImGui::TextColored(ok ? ImVec4(0.35f, 0.90f, 0.45f, 1.0f) : ImVec4(1.0f, 0.70f, 0.20f, 1.0f),
                        "%s %s", ok ? "[OK]" : "[!]", label);
                };
                readiness("Steering", steeringReady);
                ImGui::SameLine(); readiness("Pedals", accelReady && brakeReady);
                ImGui::SameLine(); readiness("Shifters", driveButtonsReady);
                readiness("Menu controls", menuReady);
                const bool ffbReady = !Settings::WheelFFBEnable || ffbStatus.initialized;
                ImGui::SameLine(); readiness(Settings::WheelFFBEnable ? "FFB device" : "FFB disabled", ffbReady);
                ImGui::SameLine(); readiness("Direction test", !Settings::WheelFFBEnable || ffbStatus.directionTested);

                ImGui::SeparatorText("FFB Runtime Status");
'''
          new = '''                const auto readiness = [](const char* label, bool ok)
                {
                    ImGui::TextColored(ok ? ImVec4(0.35f, 0.90f, 0.45f, 1.0f) : ImVec4(1.0f, 0.45f, 0.25f, 1.0f),
                        "%s %s", ok ? "[OK]" : "[!]", label);
                };
                const auto pending = [](const char* label)
                {
                    ImGui::TextColored(ImVec4(0.85f, 0.78f, 0.35f, 1.0f), "[..] %s", label);
                };
                readiness("Steering", steeringReady);
                ImGui::SameLine(); readiness("Pedals", accelReady && brakeReady);
                ImGui::SameLine(); readiness("Shifters", driveButtonsReady);
                readiness("Menu controls", menuReady);
                const bool gameplayFfbWindow = Game::is_in_game();
                ImGui::SameLine();
                if (!Settings::WheelFFBEnable)
                    readiness("FFB disabled", true);
                else if (ffbStatus.initialized)
                    readiness("FFB device", true);
                else if (!gameplayFfbWindow)
                    pending("FFB device (starts in gameplay)");
                else
                    readiness("FFB device", false);
                ImGui::SameLine();
                if (!Settings::WheelFFBEnable || ffbStatus.directionTested)
                    readiness("Direction test", true);
                else
                    pending("Direction test (not run)");

                ImGui::SeparatorText("FFB Runtime Status");
'''
          if old not in text:
              raise SystemExit('readiness block not found')
          text = text.replace(old, new, 1)

          old = '''                ImGui::Text("Engine: %s   Device: %s   Output owner: %s",
                    ffbStatus.initialized ? "ready" : "waiting",
                    ffbStatus.acquired ? "acquired" : "released",
                    ffbStatus.outputOwner ? "active" : "inactive");
                ImGui::Text("Effects: Constant %s | Spring %s | Damper %s | Periodic %s",
'''
          new = '''                ImGui::Text("Engine: %s   Device: %s   Output owner: %s",
                    ffbStatus.initialized ? "ready" : "waiting",
                    ffbStatus.acquired ? "acquired" : "released",
                    ffbStatus.outputOwner ? "active" : "inactive");
                if (Settings::WheelFFBEnable && !ffbStatus.initialized && !gameplayFfbWindow)
                    ImGui::TextDisabled("Waiting / released / inactive is normal outside gameplay. The saved FFB GUID is acquired when driving starts.");
                if (Settings::WheelFFBEnable && !ffbStatus.directionTested)
                    ImGui::TextDisabled("Direction test is a setup confirmation, not a hardware error. Run Test Left/Right after the FFB engine is ready.");
                ImGui::Text("Effects: Constant %s | Spring %s | Damper %s | Periodic %s",
'''
          if old not in text:
              raise SystemExit('runtime status block not found')
          text = text.replace(old, new, 1)

          old = '''                    if (WheelProfileStore::save_ffb_profile(requested, &error))
                    {
                        const bool currentSaved = Settings::write(Module::UserIniPath);
                        ffbDirty_ = !currentSaved;
                        if (currentSaved)
                            capture_saved_ffb();
                        status_ = currentSaved
                            ? "FFB profile saved: " + requested
                            : "FFB profile saved, but current user.ini settings could not be persisted.";
                        confirmingFfbOverwrite_ = false;
                        refresh_ffb_profiles(requested);
                    }
                    else
                        status_ = error;
'''
          new = '''                    if (WheelProfileStore::save_ffb_profile(requested, &error))
                    {
                        const bool currentSaved = Settings::write(Module::UserIniPath);
                        ffbDirty_ = !currentSaved;
                        if (currentSaved)
                            capture_saved_ffb();
                        std::string pathError;
                        const auto savedPath = WheelProfileStore::profile_path(
                            WheelProfileStore::Kind::ForceFeedback, requested, &pathError);
                        const std::string savedWhere = savedPath ? savedPath->string() : requested;
                        status_ = currentSaved
                            ? "FFB profile saved: " + savedWhere
                            : "FFB profile saved to " + savedWhere + ", but current user.ini settings could not be persisted.";
                        confirmingFfbOverwrite_ = false;
                        refresh_ffb_profiles(requested);
                    }
                    else
                    {
                        status_ = "FFB profile save failed: " + error + " Folder: " +
                            WheelProfileStore::directory(WheelProfileStore::Kind::ForceFeedback).string();
                        spdlog::error("{}", status_);
                    }
'''
          if old not in text:
              raise SystemExit('profile save UI block not found')
          text = text.replace(old, new, 1)

          old = '            ImGui::TextDisabled("Profile folder: OutRun2006Tweaks.profiles\\\\FFB");\n'
          new = '''            const std::string ffbProfileFolder =
                WheelProfileStore::directory(WheelProfileStore::Kind::ForceFeedback).string();
            ImGui::TextDisabled("Profile folder: %s", ffbProfileFolder.c_str());
'''
          if old not in text:
              raise SystemExit('profile folder label not found')
          text = text.replace(old, new, 1)
          ui.write_text(text, encoding='utf-8')

          verifier = Path('tools/verify_wheel_ffb_current.py')
          v = verifier.read_text(encoding='utf-8')
          old_guard = "req(wheel_ui, 'const bool ffbReady = !Settings::WheelFFBEnable || ffbStatus.initialized;', 'Ready checklist does not treat a disconnected saved GUID as ready')"
          new_guard = "req(wheel_ui, 'pending(\"FFB device (starts in gameplay)\");', 'Ready checklist treats menu-time FFB runtime as pending, not failed')"
          if old_guard not in v:
              raise SystemExit('old readiness verifier guard not found')
          v = v.replace(old_guard, new_guard, 1)
          old_path_guard = "req(wheel_ui, 'OutRun2006Tweaks.profiles\\\\\\\\FFB', 'FFB profile folder path escapes backslash')"
          new_path_guard = "req(wheel_ui, 'WheelProfileStore::directory(WheelProfileStore::Kind::ForceFeedback).string()', 'FFB page shows the actual runtime profile folder')"
          if old_path_guard not in v:
              raise SystemExit('old profile path verifier guard not found')
          v = v.replace(old_path_guard, new_path_guard, 1)
          extra = '''\n# v0.3 hardware compatibility regression guards\nreq(profiles, 'std::filesystem::copy_file(', 'named profile save has rename-to-copy fallback for Windows driver/filter edge cases')\nreq(profiles, 'Profile installation could not be verified.', 'named profile save verifies the final file exists')\nreq(wheel_ui, 'Direction test (not run)', 'direction-test checklist distinguishes pending from failure')\nreq(wheel_ui, 'Waiting / released / inactive is normal outside gameplay.', 'runtime status explains menu-time idle state')\nreq(wheel_ui, 'FFB profile save failed:', 'profile persistence failures are explicit')\nreq(wheel_ui, 'spdlog::error("{}", status_);', 'profile persistence failure is logged for remote testers')\n'''
          if '# v0.3 hardware compatibility regression guards' not in v:
              v += extra
          verifier.write_text(v, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 apply_compat.py
          python apply_compat.py
          Remove-Item apply_compat.py

      - name: Verify consolidated wheel FFB source
        shell: pwsh
        run: python tools/verify_wheel_ffb_current.py

      - name: Test production wheel FFB math
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat" || exit /b 1
          python tools/verify_wheel_ffb_math.py

      - name: Configure
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A Win32 ..

      - name: Add older VC2022 redist workaround to safetyhook
        shell: pwsh
        run: |
          (Get-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/zycore/Zycore.vcxproj

      - name: Zero out SDL_gameinputjoystick.c
        shell: pwsh
        run: |
          Set-Content -Path build/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build
        run: cmake --build build --config Release

      - name: Verify compatibility markers in DLL
        shell: pwsh
        run: |
          $dllPath = 'build/bin/dinput8.dll'
          if (-not (Test-Path $dllPath)) { throw 'dinput8.dll was not produced' }
          $bytes = [System.IO.File]::ReadAllBytes($dllPath)
          if ($bytes.Length -lt 1000000) { throw 'dinput8.dll is unexpectedly small' }
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            'Waiting / released / inactive is normal outside gameplay.',
            'Direction test is a setup confirmation, not a hardware error.',
            'FFB profile save failed:'
          )) {
            if (-not $ascii.Contains($marker)) { throw "missing compatibility marker: $marker" }
          }
          Get-FileHash $dllPath -Algorithm SHA256

      - name: Commit tested compatibility fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wheel_profile_store.hpp src/overlay/wheel_setup_ui.cpp tools/verify_wheel_ffb_current.py
          git commit -m 'fix: harden multi-wheel FFB setup and profile persistence [v03-compat]'
          git push origin HEAD:wheel-ffb-v0.3-compat
