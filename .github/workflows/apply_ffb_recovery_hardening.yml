name: Apply FFB recovery hardening

on:
  push:
    branches:
      - wheel-ffb-v0.2-dev

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage FFB recovery hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staging parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "a8059c5c1bda07c292847e9cbc4a830181456ce0"

      - name: Apply reviewed recovery fixes
        shell: python
        run: |
          from pathlib import Path

          source = Path('src/hooks_wheel_ffb.cpp')
          text = source.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)
              print(f'patched: {label}')

          replace_once(
          '''                if (!ready)
                {
                    retryAfter_ = GetTickCount() + FFB_DEVICE_FAILED_BACKOFF_MS;
                    return;
                }''',
          '''                if (!ready)
                {
                    // initialize() can request the short retry interval for
                    // transient startup/focus conditions. Do not overwrite that
                    // with the rejected-interface backoff.
                    const DWORD retryNow = GetTickCount();
                    if (!tick_before(retryNow, retryAfter_))
                        retryAfter_ = retryNow + FFB_DEVICE_FAILED_BACKOFF_MS;
                    return;
                }''',
          'preserve transient short retry')

          replace_once(
          '''            const bool hadInitializedOutput = initialized_;
            if (initialized_)
            {
                if (device_ && deviceAcquired_)
                    zero_all_forces();
                teardown_for_reinitialize("live disable");
                initialized_ = false;
                deviceReinitPending_ = false;
                deviceFailureSince_ = 0;
                deviceReinitAfter_ = 0;
                retryAfter_ = 0;
                failedInterfaces_.clear();
                preferredVidPid_ = 0;
            }

            enabledLastTick_ = false;''',
          '''            const bool hadInitializedOutput = initialized_;
            if (initialized_)
            {
                if (device_ && deviceAcquired_)
                    zero_all_forces();
                teardown_for_reinitialize("live disable");
                initialized_ = false;
            }

            // Disabling FFB is a hard recovery boundary even if initialization
            // never completed. A previous rejected-interface quarantine must not
            // survive a deliberate off/on cycle or a fresh device selection.
            deviceReinitPending_ = false;
            deviceFailureSince_ = 0;
            deviceReinitAfter_ = 0;
            retryAfter_ = 0;
            failedInterfaces_.clear();
            preferredVidPid_ = 0;

            enabledLastTick_ = false;''',
          'hard reset failed-interface state on disable')

          replace_once(
          '''            gameHwnd_ = Game::GameHwnd();
            if (!gameHwnd_)
            {
                spdlog::error("WheelFFB: game window not available yet");
                release_device();
                release_directinput();
                return false;
            }''',
          '''            gameHwnd_ = Game::GameHwnd();
            if (!gameHwnd_)
            {
                spdlog::warn("WheelFFB: game window not available yet; retrying shortly");
                release_device();
                release_directinput();
                retryAfter_ = GetTickCount() + FFB_DEVICE_RETRY_MS;
                return false;
            }''',
          'short retry while game window is unavailable')

          replace_once(
          '''            if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
            {
                if (reacquire_after_input_loss("GUID_Spring", hr))
                    hr = springEffect_->SetParameters(
                        &params, DIEP_TYPESPECIFICPARAMS | DIEP_START);
            }''',
          '''            if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
            {
                if (!reacquire_after_input_loss("GUID_Spring", hr))
                    return;
                hr = springEffect_->SetParameters(
                    &params, DIEP_TYPESPECIFICPARAMS | DIEP_START);
                if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
                {
                    note_device_failure("GUID_Spring retry", hr);
                    return;
                }
            }''',
          'preserve Spring transient-loss grace')

          replace_once(
          '''            if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
            {
                if (reacquire_after_input_loss("GUID_Damper", hr))
                    hr = damperEffect_->SetParameters(
                        &params, DIEP_TYPESPECIFICPARAMS | DIEP_START);
            }''',
          '''            if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
            {
                if (!reacquire_after_input_loss("GUID_Damper", hr))
                    return;
                hr = damperEffect_->SetParameters(
                    &params, DIEP_TYPESPECIFICPARAMS | DIEP_START);
                if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
                {
                    note_device_failure("GUID_Damper retry", hr);
                    return;
                }
            }''',
          'preserve Damper transient-loss grace')

          replace_once(
          '''            if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
            {
                if (reacquire_after_input_loss("GUID_Sine periodic", hr))
                    hr = effect->SetParameters(
                        &params, DIEP_TYPESPECIFICPARAMS | DIEP_START);
            }''',
          '''            if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
            {
                if (!reacquire_after_input_loss("GUID_Sine periodic", hr))
                    return;
                hr = effect->SetParameters(
                    &params, DIEP_TYPESPECIFICPARAMS | DIEP_START);
                if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
                {
                    note_device_failure("GUID_Sine periodic retry", hr);
                    return;
                }
            }''',
          'preserve Periodic transient-loss grace')

          replace_once(
          '''            if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
            {
                if (reacquire_after_input_loss("ConstantForce", hr) && constantEffect_)
                    hr = constantEffect_->SetParameters(&params, flags);
            }''',
          '''            if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
            {
                // Input loss is a transient ownership/focus condition, not proof
                // that this physical DirectInput interface is the wrong FFB port.
                // Preserve the grace window before any device reinitialization.
                if (!reacquire_after_input_loss("ConstantForce", hr) || !constantEffect_)
                    return;
                hr = constantEffect_->SetParameters(&params, flags);
                if (hr == DIERR_INPUTLOST || hr == DIERR_NOTACQUIRED)
                {
                    note_device_failure("ConstantForce retry", hr);
                    return;
                }
            }''',
          'do not quarantine transient ConstantForce input loss')

          source.write_text(text, encoding='utf-8', newline='')

          verifier = Path('tools/verify_wheel_ffb_current.py')
          verify_text = verifier.read_text(encoding='utf-8')
          anchor = '''req(ffb, 'mark_selected_interface_failed("ConstantForce live SetParameters", hr)', 'runtime ConstantForce failure quarantines the bad interface before reinit')\n'''
          extra = anchor + '''req(ffb, 'if (!tick_before(retryNow, retryAfter_))', 'transient short retry is not overwritten by rejected-interface backoff')\nreq(ffb, 'previous rejected-interface quarantine must not', 'FFB disable hard-resets failed-interface recovery state')\nreq(ffb, 'if (!reacquire_after_input_loss("ConstantForce", hr) || !constantEffect_)', 'ConstantForce transient input loss keeps the recovery grace window')\nreq(ffb, 'if (!reacquire_after_input_loss("GUID_Spring", hr))', 'Spring transient input loss keeps the recovery grace window')\nreq(ffb, 'if (!reacquire_after_input_loss("GUID_Damper", hr))', 'Damper transient input loss keeps the recovery grace window')\nreq(ffb, 'if (!reacquire_after_input_loss("GUID_Sine periodic", hr))', 'Periodic transient input loss keeps the recovery grace window')\nreq(ffb, 'game window not available yet; retrying shortly', 'missing game window uses the short device retry')\n'''
          if verify_text.count(anchor) != 1:
              raise SystemExit('verifier anchor mismatch')
          verifier.write_text(verify_text.replace(anchor, extra, 1), encoding='utf-8', newline='')

      - name: Verify current source
        run: python tools/verify_wheel_ffb_current.py

      - name: Verify FFB math
        run: python tools/verify_wheel_ffb_math.py

      - name: Commit integrated source and remove staging workflow
        shell: bash
        run: |
          git config user.name "thp32tt"
          git config user.email "129367814+thp32tt@users.noreply.github.com"
          git add src/hooks_wheel_ffb.cpp tools/verify_wheel_ffb_current.py
          git rm .github/workflows/apply_ffb_recovery_hardening.yml
          git diff --cached --check
          git commit -m "fix: harden transient FFB device recovery"
          git push origin HEAD:wheel-ffb-v0.2-dev
