name: Apply FFB recovery hardening

on:
  push:
    branches:
      - wheel-ffb-v0.2-dev

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staging ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor a8059c5c1bda07c292847e9cbc4a830181456ce0 HEAD
          git diff --name-only a8059c5c1bda07c292847e9cbc4a830181456ce0..HEAD | sort > /tmp/ffb-stage-files.txt
          test "$(wc -l < /tmp/ffb-stage-files.txt)" -eq 2
          grep -qx '.github/workflows/apply_ffb_recovery_hardening.yml' /tmp/ffb-stage-files.txt
          grep -qx 'tools/apply_ffb_recovery_hardening.py' /tmp/ffb-stage-files.txt

      - name: Apply reviewed source changes
        shell: bash
        run: python tools/apply_ffb_recovery_hardening.py

      - name: Verify current source
        shell: bash
        run: python tools/verify_wheel_ffb_current.py

      - name: Verify FFB math
        shell: bash
        run: python tools/verify_wheel_ffb_math.py

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "thp32tt"
          git config user.email "129367814+thp32tt@users.noreply.github.com"
          git add src/hooks_wheel_ffb.cpp tools/verify_wheel_ffb_current.py
          git rm .github/workflows/apply_ffb_recovery_hardening.yml tools/apply_ffb_recovery_hardening.py
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m "fix: harden transient FFB device recovery"
          git push origin HEAD:wheel-ffb-v0.2-dev
