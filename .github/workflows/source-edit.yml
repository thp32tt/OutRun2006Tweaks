name: Source-only wheel FFB edits

on:
  push:
    branches:
      - wheel-ffb
    paths:
      - '.github/workflows/source-edit.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Apply reviewed source changes
        run: |
          python3 .github/source_edit_fix.py
          python3 .github/source_edit.py
          rm -f .github/source_edit_fix.py

      - name: Commit source-only changes
        run: |
          git config user.name "thp32tt"
          git config user.email "129367814+thp32tt@users.noreply.github.com"
          git add -A
          git commit -m "refactor: separate wheel input and FFB ownership [skip ci]"
          git push origin HEAD:wheel-ffb

