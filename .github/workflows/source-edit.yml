name: Source-only wheel FFB edits

on:
  push:
    branches:
      - wheel-ffb
    paths:
      - '.github/workflows/source-edit.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Apply five-pass review fixes
        run: python3 .github/source_edit.py

      - name: Commit source-only changes
        run: |
          rm -f .github/source_edit.py .github/workflows/source-edit.yml
          git config user.name "thp32tt"
          git config user.email "129367814+thp32tt@users.noreply.github.com"
          git add -A
          git commit -m "refactor: apply five-pass wheel FFB review fixes [skip ci]"
          git push origin HEAD:wheel-ffb
