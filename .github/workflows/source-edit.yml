name: Source-only wheel FFB edits

on:
  push:
    branches: [ wheel-ffb ]
    paths:
      - '.github/workflows/source-edit.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Apply reviewed source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(path, old, new):
              s = text(path)
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, got {count}: {old[:120]!r}')
              write(path, s.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              s = text(path)
              out, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, got {count}: {pattern[:120]!r}')
              write(path, out)

          # 1) Install mutually exclusive high-level input modes instead of relying
          # on inactive hook chains at the same game entry points.
          replace_once(
              'src/overlay/wheel_setup_ui.cpp',
              '        bool validate() override { return Settings::WheelInputCompatibility; }',
              '        bool validate() override { return Settings::WheelInputCompatibility && !Settings::UseNewInput && Settings::WheelUniversalSetupEnable; }')

          replace_once(
              'src/hooks_wheel_input_compat_v2.hpp',
              '    extern Setting<bool> WheelMenuDirectionFilter; // hooks_input.cpp\n',
              '    extern Setting<bool> WheelMenuDirectionFilter; // hooks_input.cpp\n'
              '    extern Setting<bool> UseNewInput;\n'
              '    extern Setting<bool> WheelInputCompatibility;\n'
              '    extern Setting<bool> WheelUniversalSetupEnable;\n')
          replace_once(
              'src/hooks_wheel_input_compat_v2.hpp',
              '            return Settings::WheelInputCompatibility;\n',
              '            return Settings::WheelInputCompatibility &&\n'
              '                !Settings::UseNewInput &&\n'
              '                !Settings::WheelUniversalSetupEnable;\n')

          replace_once(
              'src/hooks_wheel_r3_menu_dpad.hpp',
              '            return Settings::WheelInputCompatibility;\n',
              '            return Settings::WheelInputCompatibility &&\n'
              '                !Settings::UseNewInput &&\n'
              '                !Settings::WheelUniversalSetupEnable &&\n'
              '                Settings::WheelMenuR3DirectDPad;\n')
          replace_once(
              'src/hooks_wheel_r3_menu_ab.hpp',
              '            return Settings::WheelInputCompatibility;\n',
              '            return Settings::WheelInputCompatibility &&\n'
              '                !Settings::UseNewInput &&\n'
              '                !Settings::WheelUniversalSetupEnable &&\n'
              '                Settings::WheelMenuR3DirectAB;\n')

          # 2) Separate legacy input identity from DirectInput FFB output identity.
          old_select = '''        void select_device(const DeviceInfo& info)
        {
            Settings::WheelUniversalDeviceName = info.name;
            Settings::WheelUniversalDeviceGuid = info.guidKey;
            Settings::WheelFFBDeviceName = info.name;
            Settings::WheelFFBDeviceGuid = info.guidKey;
            if (!Settings::UseNewInput)
                gReader.select_by_identity(info.guidKey, info.name);
            Settings::write(Module::UserIniPath);
            if (Settings::UseNewInput)
                status_ = "Selected FFB wheel and saved its exact DirectInput GUID. Restart the game after changing physical wheel.";
            else
                status_ = UniversalWheelProfile::regular_device_count() > 1
                    ? "Selected wheel/FFB device. Confirm the OutRun legacy input slot below when multiple controllers are present."
                    : "Selected wheel; FFB device follows this product name.";
        }
'''
          new_select = '''        void select_device(const DeviceInfo& info, bool ffbOutput)
        {
            if (ffbOutput)
            {
                if (!info.ffb)
                {
                    status_ = "That DirectInput interface does not advertise force feedback.";
                    return;
                }
                Settings::WheelFFBDeviceName = info.name;
                Settings::WheelFFBDeviceGuid = info.guidKey;
                Settings::write(Module::UserIniPath);
                status_ = "Selected FFB output and saved its exact DirectInput GUID. Restart after changing the physical wheel base.";
                return;
            }

            Settings::WheelUniversalDeviceName = info.name;
            Settings::WheelUniversalDeviceGuid = info.guidKey;
            gReader.select_by_identity(info.guidKey, info.name);
            Settings::write(Module::UserIniPath);
            status_ = UniversalWheelProfile::regular_device_count() > 1
                ? "Selected legacy input device. Confirm the OutRun legacy input slot below when multiple controllers are present."
                : "Selected legacy input device. FFB output is configured separately below.";
        }
'''
          replace_once('src/overlay/wheel_setup_ui.cpp', old_select, new_select)

          render_pattern = r'''            const auto& devices = gReader\.devices\(\);\n            if \(ImGui::Button\("Refresh Devices"\)\).*?            if \(!Settings::UseNewInput\)\n            \{'''
          render_replacement = '''            const auto& devices = gReader.devices();
            if (ImGui::Button("Refresh Devices"))
                gReader.refresh_devices();

            auto first_device_name = [&](bool ffbOnly) -> std::string
            {
                for (const auto& dev : devices)
                    if (!ffbOnly || dev.ffb)
                        return dev.name;
                return ffbOnly ? "No force-feedback DirectInput device" : "No DirectInput device";
            };

            auto draw_device_combo = [&](const char* label, bool ffbOnly,
                const std::string& configuredGuidValue, const std::string& configuredNameValue,
                bool ffbOutput)
            {
                std::string preview = configuredNameValue;
                if (preview.empty())
                    preview = first_device_name(ffbOnly);
                const std::string configuredGuid = lower_identity(configuredGuidValue);
                auto isSelectedDevice = [&](const DeviceInfo& dev)
                {
                    if (ffbOnly && !dev.ffb)
                        return false;
                    return !configuredGuid.empty()
                        ? dev.guidKey == configuredGuid
                        : dev.name == configuredNameValue;
                };

                if (ImGui::BeginCombo(label, preview.c_str()))
                {
                    for (const auto& dev : devices)
                    {
                        if (ffbOnly && !dev.ffb)
                            continue;
                        const bool selected = isSelectedDevice(dev);
                        const std::string item = dev.name + "##" + label + dev.guidKey;
                        if (ImGui::Selectable(item.c_str(), selected))
                            select_device(dev, ffbOutput);
                        if (selected)
                            ImGui::SetItemDefaultFocus();
                    }
                    ImGui::EndCombo();
                }

                for (const auto& dev : devices)
                    if (isSelectedDevice(dev))
                        ImGui::TextDisabled("%lu axes / %lu buttons / %lu POV / FFB %s / GUID %s",
                            dev.axes, dev.buttons, dev.povs, dev.ffb ? "yes" : "no", dev.guidKey.c_str());
            };

            if (Settings::UseNewInput)
            {
                ImGui::SameLine();
                draw_device_combo("FFB Output", true,
                    Settings::WheelFFBDeviceGuid.get(), Settings::WheelFFBDeviceName.get(), true);
            }
            else
            {
                ImGui::SameLine();
                draw_device_combo("Legacy Input Wheel", false,
                    Settings::WheelUniversalDeviceGuid.get(), Settings::WheelUniversalDeviceName.get(), false);
                draw_device_combo("FFB Output", true,
                    Settings::WheelFFBDeviceGuid.get(), Settings::WheelFFBDeviceName.get(), true);
            }

            if (!Settings::UseNewInput)
            {'''
          regex_once('src/overlay/wheel_setup_ui.cpp', render_pattern, render_replacement)
          replace_once(
              'src/overlay/wheel_setup_ui.cpp',
              '                    : "Legacy compatibility input and FFB are configured on this page. Restart after switching to a different physical wheel.");',
              '                    : "Legacy input and DirectInput FFB output are selected separately on this page. Restart after switching physical devices.");')
          replace_once(
              'src/overlay/wheel_setup_ui.cpp',
              '                "Settings > WheelFFB is hidden; changes on this page apply live. SDL gamepad rumble is suppressed while wheel FFB is enabled.");',
              '                "Settings > WheelFFB is hidden; changes on this page apply live. SDL gamepad rumble is suppressed only while DirectInput FFB owns an output device.");')

          # 3) Binding identity: a transient USB path must not be a hard identity.
          old_match = '''\tstatic bool deviceMatchesBinding(const InputDevice& device, const InputBinding& binding)
\t{
\t\tconst bool usbIdentityMatches = (!binding.deviceVendor || device.vendor == binding.deviceVendor) &&
\t\t\t(!binding.deviceProduct || device.product == binding.deviceProduct);
\t\tif (!binding.deviceSerial.empty())
\t\t\treturn usbIdentityMatches && device.serial == binding.deviceSerial;
\t\tif (!binding.devicePath.empty())
\t\t\treturn usbIdentityMatches && device.path == binding.devicePath;
\t\treturn device.guid == binding.deviceGuid && device.occurrence == binding.deviceOccurrence;
\t}
'''
          new_match = '''\tstatic bool deviceMatchesBinding(const InputDevice& device, const InputBinding& binding)
\t{
\t\tconst bool usbIdentityMatches = (!binding.deviceVendor || device.vendor == binding.deviceVendor) &&
\t\t\t(!binding.deviceProduct || device.product == binding.deviceProduct);
\t\tif (!usbIdentityMatches)
\t\t\treturn false;

\t\t// A real serial is the strongest stable identity. USB paths are not: they
\t\t// can change when the same wheel/pedal set is moved to another port or hub.
\t\tif (!binding.deviceSerial.empty())
\t\t\treturn device.serial == binding.deviceSerial;

\t\tif (!binding.deviceGuid.empty() && device.guid != binding.deviceGuid)
\t\t\treturn false;
\t\tif (device.occurrence == binding.deviceOccurrence)
\t\t\treturn true;

\t\t// Path is only a duplicate-device tie-breaker/fallback, never a mandatory
\t\t// identity for otherwise matching VID/PID/GUID hardware.
\t\treturn !binding.devicePath.empty() && device.path == binding.devicePath;
\t}
'''
          replace_once('src/input_manager.hpp', old_match, new_match)

          # 4) Suppress SDL/XInput rumble only when the DirectInput FFB engine
          # actually owns a device. If FFB init fails, gamepad rumble remains alive.
          replace_once(
              'src/hooks_forcefeedback.cpp',
              '    extern Setting<bool> WheelFFBEnable;\n',
              '')
          replace_once(
              'src/hooks_forcefeedback.cpp',
              'void SetVibration(int userId, float leftMotor, float rightMotor)\n',
              'bool WheelFFB_IsOutputOwnerActive();\n\nvoid SetVibration(int userId, float leftMotor, float rightMotor)\n')
          replace_once(
              'src/hooks_forcefeedback.cpp',
              '    if (Settings::WheelFFBEnable)\n',
              '    if (WheelFFB_IsOutputOwnerActive())\n')
          replace_once(
              'src/hooks_forcefeedback.cpp',
              '    // With SDL multi-device input, wheel FFB is owned exclusively by the\n    // DirectInput COM WheelFFBEngine. Do not let the independent gamepad-rumble\n    // path reach a wheel/gamepad interface at the same time.\n',
              '    // Suppress the independent gamepad-rumble path only after the\n    // DirectInput WheelFFBEngine has actually initialized an output device.\n    // A configured-but-missing/failed wheel must not disable controller rumble.\n')

          replace_once(
              'src/hooks_wheel_ffb.cpp',
              '        void request_direction_test(int direction)\n',
              '        bool output_owner_active() const\n'
              '        {\n'
              '            return Settings::WheelFFBEnable && initialized_ && device_ && !panicStopped_;\n'
              '        }\n\n'
              '        void request_direction_test(int direction)\n')
          replace_once(
              'src/hooks_wheel_ffb.cpp',
              'void WheelFFB_RequestDirectionTest(int direction)\n{\n    gWheelFFB.request_direction_test(direction);\n}\n',
              'bool WheelFFB_IsOutputOwnerActive()\n{\n    return gWheelFFB.output_owner_active();\n}\n\n'
              'void WheelFFB_RequestDirectionTest(int direction)\n{\n    gWheelFFB.request_direction_test(direction);\n}\n')

          # 5) Keep the structural verifier aligned with the architecture rather
          # than checking the old setting-only rumble suppression behavior.
          replace_once(
              'tools/verify_wheel_ffb_current.py',
              "input_cpp = read('src/input_manager.cpp')\n",
              "input_cpp = read('src/input_manager.cpp')\ninput_hpp = read('src/input_manager.hpp')\n")
          replace_once(
              'tools/verify_wheel_ffb_current.py',
              "req(vib, 'if (Settings::WheelFFBEnable)', 'SDL rumble suppressed under wheel FFB')\n",
              "req(vib, 'if (WheelFFB_IsOutputOwnerActive())', 'rumble suppression follows actual FFB ownership')\n"
              "req(ffb, 'bool WheelFFB_IsOutputOwnerActive()', 'FFB ownership query exported')\n")
          insert_after = "req(wheel_ui, 'Legacy Wheel Setup', 'legacy input kept behind compatibility mode')\n"
          extra = (
              "req(wheel_ui, 'draw_device_combo(\"FFB Output\", true', 'FFB selector filters to FFB-capable interfaces')\n"
              "req(wheel_ui, 'draw_device_combo(\"Legacy Input Wheel\", false', 'legacy input identity selected separately')\n"
              "req(input_hpp, 'Path is only a duplicate-device tie-breaker/fallback', 'USB path is not hard binding identity')\n"
              "req(read('src/hooks_wheel_input_compat_v2.hpp'), '!Settings::UseNewInput', 'legacy compatibility hook excluded from new input')\n"
              "req(wheel_ui, '!Settings::UseNewInput && Settings::WheelUniversalSetupEnable', 'universal legacy hook has exclusive install gate')\n"
          )
          replace_once('tools/verify_wheel_ffb_current.py', insert_after, insert_after + extra)

          # Source-only verification. Do not invoke compiler or build system.
          import subprocess
          subprocess.run(['python3', 'tools/verify_wheel_ffb_current.py'], check=True)

          # This workflow is intentionally one-shot and removes itself in the edit commit.
          Path('.github/workflows/source-edit.yml').unlink()

      - name: Commit source-only changes
        shell: bash
        run: |
          git config user.name "thp32tt"
          git config user.email "129367814+thp32tt@users.noreply.github.com"
          git add -A
          git commit -m "refactor: separate wheel input and FFB ownership [skip ci]"
          git push origin HEAD:wheel-ffb
