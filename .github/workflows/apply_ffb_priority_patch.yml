name: Apply priority FFB hardening

on:
  push:
    branches:
      - wheel-ffb-v0.2-dev
    paths:
      - tools/apply_ffb_priority_patch.py
      - tools/ffb_priority_trigger.txt

permissions:
  contents: write

jobs:
  apply-priority-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: wheel-ffb-v0.2-dev
          fetch-depth: 0

      - name: Apply reviewed FFB priority patch
        run: python tools/apply_ffb_priority_patch.py

      - name: Verify consolidated wheel FFB source
        run: python tools/verify_wheel_ffb_current.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN cannot update workflow files in this repository. Keep the
          # reviewed build.yml edit for the owner-side connector commit below.
          git checkout -- .github/workflows/build.yml
          git rm tools/apply_ffb_priority_patch.py tools/ffb_priority_trigger.txt
          git add src/hooks_wheel_ffb.cpp tools/verify_wheel_ffb_current.py
          git commit -m "fix: harden Fanatec FFB interface recovery [skip ci]"
          git push origin HEAD:wheel-ffb-v0.2-dev
