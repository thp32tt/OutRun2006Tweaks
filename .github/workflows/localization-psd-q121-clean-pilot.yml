name: Localization PSD q121 English CLEAN Pilot
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths: [.github/workflows/localization-psd-q121-clean-pilot.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  q121-psd-source-layer-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PSD compositor
        run: pip install 'psd-tools[composite]' Pillow
      - name: Exact pinned local original PSD lookup
        run: python tools/localization/psd_source_lookup.py --index 121
      - name: Split actual original Gas Pedal type layer from imported PSD
        run: |
          python tools/localization/psd_layer_workbase.py export \
            --psd localization/graphics/source_psd_upstream/FD90AA9/68e32365_FD90AA9_1024x1024.psd \
            --english-layers 1/1/0/2/22 \
            --upstream-commit 3ce344e7ed6b1b535f5e4d34c1192071ff7afbe6 \
            --output localization/graphics/plate_library/psd_workbases/q121_gas_pedal_candidate
      - name: Verify real PNGs and bind source-only candidate proof
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image,ImageChops
          p=Path('localization/graphics/plate_library/psd_workbases/q121_gas_pedal_candidate')
          meta=json.loads((p/'psd_layer_export.json').read_text())
          assert meta['english_layer_paths']==['1/1/0/2/22']
          item=next(z for z in meta['layers'] if z['path']=='1/1/0/2/22')
          assert item['kind']=='type' and item['name']=='Gas Pedal:'
          assert meta['C2_PLATE_PASS'] is False
          names=['english_original_full.png','clean_plate_candidate.png','english_letter_layers.png']
          images={n:Image.open(p/n).convert('RGBA') for n in names}
          assert all(im.size==(4096,4096) for im in images.values())
          assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==meta['output_sha256'][n] for n in names)
          difference=ImageChops.difference(images[names[0]],images[names[1]])
          delta_bbox=difference.getbbox()
          english_bbox=images['english_letter_layers.png'].getbbox()
          assert delta_bbox is not None, 'PSD layer removal did not change the source'
          assert english_bbox is not None, 'PSD English layer lacks visible pixels'
          print('PSD_Q121_TYPE_LAYER',item)
          print('PSD_Q121_SOURCE_CLEAN_CHANGED_BBOX',delta_bbox)
          print('PSD_Q121_ENGLISH_LAYER_BBOX',english_bbox)
          final={
            'queue_index':121,'region_id':'Gas Pedal:','source_layer_path':'1/1/0/2/22',
            'source_text_layer_kind':'type',
            'input_psd_sha256':meta['psd_sha256'],
            'psd_source':'Sonic-TV/OR2006Sprites@3ce344e7ed6b1b535f5e4d34c1192071ff7afbe6',
            'english_source_png':meta['output_sha256'][names[0]],
            'clean_candidate_png':meta['output_sha256'][names[1]],
            'english_letter_png':meta['output_sha256'][names[2]],
            'psd_source_vs_clean_delta_bbox':delta_bbox,
            'isolated_english_layer_bbox':english_bbox,
            'status':'EXTRACTED_UNVERIFIED',
            'exact_canonical_dds_equality':'NOT_TESTED',
            'C2_PLATE_PASS':False,'C3_PASS':False,'RUNTIME_VALIDATION':'UNTESTED'
          }
          (p/'candidate_manifest.json').write_text(json.dumps(final,indent=2)+'\n')
          PY
      - name: Publish real PSD-derived CLEAN candidate and English original PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f localization/graphics/plate_library/psd_workbases/q121_gas_pedal_candidate/
          git commit -m "assets(localization): preserve real q121 PSD-derived English text and CLEAN pilot"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if [ "${i}" = 5 ]; then exit 1; fi
          done
          git fetch origin "${GITHUB_REF_NAME}"
          for name in english_original_full.png clean_plate_candidate.png english_letter_layers.png candidate_manifest.json; do
            spec="origin/${GITHUB_REF_NAME}:localization/graphics/plate_library/psd_workbases/q121_gas_pedal_candidate/${name}"
            git rev-parse "${spec}" >/dev/null
          done
          echo 'PSD_Q121_CANDIDATE_REMOTE_VERIFIED_UNAPPROVED'
      - name: Retain extracted source evidence
        uses: actions/upload-artifact@v4
        with:
          name: psd-q121-gas-pedal-clean-candidate
          path: localization/graphics/plate_library/psd_workbases/q121_gas_pedal_candidate/
          retention-days: 5
