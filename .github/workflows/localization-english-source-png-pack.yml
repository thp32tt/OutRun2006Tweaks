name: OutRun English source PNG pack

on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths:
      - '.github/workflows/localization-english-source-png-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          sparse-checkout: |
            localization/graphics/asset_queue.csv
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Convert verified HD English source DDS to PNG
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, io, json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          
          root=Path("localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load")
          out=Path("english_originals")
          (out/"RAW").mkdir(parents=True,exist_ok=True)
          (out/"VIEW_FLIPY").mkdir(parents=True,exist_ok=True)
          with open("localization/graphics/asset_queue.csv",encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          lookup={Path(row["path"]).name:row for row in rows if row.get("action")=="localize_text"}
          found=[]
          thumbs=[]
          for p in sorted(root.rglob("*.dds")):
              if p.name not in lookup:
                  continue
              r=lookup[p.name]
              idx=int(r["index"].lstrip("\ufeff"))
              key=p.name.split("_")[0]
              label=f"q{idx:03d}_{key}"
              raw=p.read_bytes()
              h=hashlib.sha256(raw).hexdigest()
              try:
                  with Image.open(io.BytesIO(raw)) as im:
                      im.load()
                      rgba=im.convert("RGBA")
              except Exception as ex:
                  raise RuntimeError(f"Exact-source DDS decode failed: {p}: {ex}")
              rawname=out/"RAW"/f"{label}_EN_RAW.png"
              viewname=out/"VIEW_FLIPY"/f"{label}_EN_VIEW_FLIPY.png"
              rgba.save(rawname,format="PNG",compress_level=1)
              rgba.transpose(Image.Transpose.FLIP_TOP_BOTTOM).save(viewname,format="PNG",compress_level=1)
              found.append({"queue_index":idx,"asset":r["path"],"status":r["artwork_status"],"source_dds_sha256":h,"source_width":rgba.width,"source_height":rgba.height,"raw_png":str(rawname.relative_to(out)),"raw_png_sha256":hashlib.sha256(rawname.read_bytes()).hexdigest(),"view_flipy_png":str(viewname.relative_to(out)),"view_flipy_sha256":hashlib.sha256(viewname.read_bytes()).hexdigest()})
              t=rgba.transpose(Image.Transpose.FLIP_TOP_BOTTOM)
              t.thumbnail((550,330))
              thumbs.append((label,t))
          assert len(found)==17,(len(found),[x["queue_index"] for x in found])
          with open(out/"MANIFEST.csv","w",encoding="utf-8-sig",newline="") as f:
              w=csv.DictWriter(f,fieldnames=list(found[0]))
              w.writeheader();w.writerows(found)
          (out/"MANIFEST.json").write_text(json.dumps(found,ensure_ascii=False,indent=2),encoding="utf-8")
          readme="""OutRun 2006 영문 HD 원본 DDS -> PNG 변환 묶음 (2026-10-11)
          SOURCE: thp32tt/OutRun2006Tweaks, korean-localization-recovery-20260928
          범위: 저장소에 실재하는 HD SOURCE 중 asset_queue.csv action=localize_text인 17개.
          같은 브랜치에 없는 나머지 대상은 포함하지 않습니다.
          RAW: 원본 DDS의 픽셀 배치와 크기를 그대로 디코딩한 RGBA PNG. 게임 UV용 개별 스프라이트 반전 방향이 섞일 수 있음.
          VIEW_FLIPY: 전체 상하반전 참고. 모든 요소의 실제 화면 방향을 보장하는 것은 아닙니다. 제작 기준은 RAW와 원본별 UV 규칙.
          두 폴더의 PNG는 모두 영문 원본이며 한국어 후보/승인 결과물이 아닙니다.
          한국어 이미지 생성 시 원본 디자인/색상/크기/기울임 참고용으로 사용. 주변 비텍스트 그래픽, 브랜드/차량명/노래 제목은 보존.
          영문 제거용 CLEAN과 합성 및 1px 경계 검증은 별도. 제작·실게임 QA 상태는 이 번들로 변경되지 않음.
          """
          (out/"README_KO.txt").write_text(readme,encoding="utf-8")
          tilew,tileh=600,375
          sheet=Image.new("RGB",(tilew*3,tileh*((len(thumbs)+2)//3)),"#20242a")
          draw=ImageDraw.Draw(sheet)
          for n,(label,t) in enumerate(thumbs):
              x=(n%3)*tilew;y=(n//3)*tileh
              draw.text((x+14,y+11),label,fill="white")
              canvas=Image.new("RGBA",t.size,(35,37,43,255))
              canvas.alpha_composite(t)
              sheet.paste(canvas.convert("RGB"),(x+20,y+35))
          sheet.save(out/"CONTACT_SHEET.jpg",quality=84,subsampling=0)
          print("EXPORTED:",len(found),"English HD DDS source sets")
          print(json.dumps([{"index":v["queue_index"],"dimensions":f'{v["source_width"]}x{v["source_height"]}'} for v in found]))
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outrun-english-hd-source-png-17
          path: english_originals/
          if-no-files-found: error
          retention-days: 30