name: VR Test Policy

on:
  workflow_dispatch:
  push:
    branches: [ vr-d3d9ex-focus ]
    paths:
      - 'tools/OutRunVR-TestProfiles.ps1'
      - 'tools/Select-OutRunVRBackend.ps1'
      - 'tools/Run-OutRunVRTest.ps1'
      - 'tools/Collect-OutRunVRLogs.ps1'
      - 'tools/OutRunVR-Backend-Selector.ps1'
      - 'tools/Test-OutRunVRTestPolicy.ps1'
      - 'docs/VR_TEST_STRATEGY.md'
      - 'docs/VR_AUTODEV_STATE.json'
      - '.github/workflows/vr-test-policy.yml'
  pull_request:
    branches: [ vr-d3d9ex-focus ]
    paths:
      - 'tools/OutRunVR-TestProfiles.ps1'
      - 'tools/Select-OutRunVRBackend.ps1'
      - 'tools/Run-OutRunVRTest.ps1'
      - 'tools/Collect-OutRunVRLogs.ps1'
      - 'tools/OutRunVR-Backend-Selector.ps1'
      - 'tools/Test-OutRunVRTestPolicy.ps1'
      - 'docs/VR_TEST_STRATEGY.md'
      - 'docs/VR_AUTODEV_STATE.json'
      - '.github/workflows/vr-test-policy.yml'

concurrency:
  group: vr-test-policy
  cancel-in-progress: true

jobs:
  policy:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime-test minimization policy
        shell: pwsh
        run: ./tools/Test-OutRunVRTestPolicy.ps1
