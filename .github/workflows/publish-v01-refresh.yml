name: Refresh v0.1 Release

on:
  push:
    branches: [ wheel-ffb-v0.2-dev ]
    paths:
      - '.github/workflows/publish-v01-refresh.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable release branch
        uses: actions/checkout@v4
        with:
          ref: wheel-ffb
          fetch-depth: 0
          fetch-tags: true

      - name: Download validated final binary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 34699219467 \
            --repo thp32tt/OutRun2006Tweaks \
            -n outrun2006tweaks-f7fbfd5ac7f5e7adc4a9ccb84ed4fbf0d1b96546 \
            -D release-bin

      - name: Build clean v0.1 package
        shell: bash
        run: |
          set -euo pipefail
          rm -f release-bin/dinput8.pdb
          cp README.md release-bin/README.md
          for f in dinput8.dll OutRun2006Tweaks.ini OutRun2006Tweaks.lods.ini OR2006C2C.exe README.md LICENSES.txt; do
            test -f "release-bin/$f"
          done
          cd release-bin
          zip -9 ../OutRun2006Tweaks-Wheel-FFB-v0.1.zip \
            dinput8.dll \
            OutRun2006Tweaks.ini \
            OutRun2006Tweaks.lods.ini \
            OR2006C2C.exe \
            README.md \
            LICENSES.txt
          cd ..
          unzip -l OutRun2006Tweaks-Wheel-FFB-v0.1.zip

      - name: Move v0.1 tag to validated stable commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v0.1 f7fbfd5ac7f5e7adc4a9ccb84ed4fbf0d1b96546
          git push --force origin refs/tags/v0.1

      - name: Update existing v0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v0.1 \
            --repo thp32tt/OutRun2006Tweaks \
            --title 'OutRun2006Tweaks Wheel FFB v0.1' \
            --notes-file RELEASE_NOTES_v0.1.md \
            --target wheel-ffb || \
          gh release edit v0.1 \
            --repo thp32tt/OutRun2006Tweaks \
            --title 'OutRun2006Tweaks Wheel FFB v0.1' \
            --notes-file RELEASE_NOTES_v0.1.md
          gh release upload v0.1 \
            OutRun2006Tweaks-Wheel-FFB-v0.1.zip \
            --repo thp32tt/OutRun2006Tweaks \
            --clobber

      - name: Upload exact public release package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: v0.1-release-package
          path: OutRun2006Tweaks-Wheel-FFB-v0.1.zip
          if-no-files-found: error
