# Triggered final post-review safeguard pass.
name: Final FFB UI Postfix

on:
  push:
    branches: [ wheel-ffb ]
    paths:
      - '.github/final_ffb_ui_postfix.py'
      - '.github/workflows/final-ffb-ui-postfix.yml'

permissions:
  contents: write

jobs:
  postfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply final post-review safeguards
        run: python .github/final_ffb_ui_postfix.py

      - name: Run current source verifier
        run: python tools/verify_wheel_ffb_current.py

      - name: Compile and run production-header numeric tests
        run: |
          g++ -std=c++20 -Isrc tools/test_wheel_ffb_current.cpp -o /tmp/wheel_ffb_current_test
          /tmp/wheel_ffb_current_test

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified product changes
        run: |
          git add src/hooks_wheel_ffb.cpp \
                  src/overlay/input_bindings_ui.cpp \
                  src/overlay/wheel_setup_ui.cpp \
                  src/wheel_ffb_runtime.hpp \
                  tools/verify_wheel_ffb_current.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize wheel setup safeguards [skip ci]"
            git push origin HEAD:wheel-ffb
          fi

      - name: Remove temporary postfix harness
        run: |
          git pull --rebase origin wheel-ffb
          git rm .github/final_ffb_ui_postfix.py .github/workflows/final-ffb-ui-postfix.yml
          git commit -m "chore: remove temporary final FFB UI postfix harness"
          git push origin HEAD:wheel-ffb
