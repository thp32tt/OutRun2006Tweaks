name: x86 OpenXR Direct POC

on:
  workflow_dispatch:
  push:
    branches:
      - vr-x86-openxr-direct-poc
    paths:
      - 'vrx86/**'
      - '.github/workflows/vr-x86-openxr-poc.yml'

concurrency:
  group: vr-x86-openxr-poc-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32 OpenXR POC
        shell: pwsh
        run: cmake -S vrx86 -B build-vrx86 -G "Visual Studio 17 2022" -A Win32
      - name: Build Win32 OpenXR POC
        shell: pwsh
        run: |
          cmake --build build-vrx86 --config Release --target outrun-vr-x86-openxr-probe
          if (-not (Test-Path build-vrx86/bin/outrun-vr-x86-openxr-probe.exe)) {
            throw 'x86 OpenXR POC executable missing'
          }
      - name: Stage x86 POC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build-vrx86/bin/outrun-vr-x86-openxr-probe.exe stage/
          Copy-Item vrx86/Run-x86-openxr-probe.cmd stage/
          Copy-Item vrx86/README_TEST_KO.md stage/
          # OpenXR-SDK's loader target is linked into this POC; no adjacent
          # openxr_loader.dll is required for the staged executable.
          Set-Content stage/SOURCE_SHA.txt $env:GITHUB_SHA -Encoding ascii
          foreach ($required in @(
            'stage/outrun-vr-x86-openxr-probe.exe',
            'stage/Run-x86-openxr-probe.cmd',
            'stage/README_TEST_KO.md',
            'stage/SOURCE_SHA.txt'
          )) {
            if (-not (Test-Path $required)) { throw "Missing staged x86 POC file: $required" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-x86-OpenXR-POC-${{ github.sha }}
          path: stage/
          if-no-files-found: error
