name: Localization C1 Adhoc QA
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths:
      - 'tools/localization/cpu_jobs/C1_adhoc.py'
      - '.github/workflows/localization-c1-adhoc.yml'
permissions:
  contents: write
concurrency:
  group: localization-c1-adhoc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  c1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python tools/localization/cpu_jobs/C1_adhoc.py
      - name: Enforce C1 output boundary
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | while read -r p; do
            [ -z "$p" ] && continue
            case "$p" in localization/graphics/role_C/20261007-C247-C1-BATCH-Q043-Q047-Q053/*|localization/graphics/role_C/PRE_INGAME_JPG_REVIEW/*) ;; *) echo "::error::forbidden write $p"; bad=1 ;; esac
          done
      - name: Commit C1 evidence
        shell: bash
        run: |
          set -euo pipefail
          git add localization/graphics/role_C/20261007-C247-C1-BATCH-Q043-Q047-Q053 localization/graphics/role_C/PRE_INGAME_JPG_REVIEW
          if git diff --cached --quiet; then echo "No C1 output changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "localization(cpu): C247 C1 PRE_INGAME refresh"
          git fetch origin korean-localization-recovery-20260928
          git rebase origin/korean-localization-recovery-20260928
          git push origin HEAD:korean-localization-recovery-20260928
