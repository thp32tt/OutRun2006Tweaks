name: OutRun A/B ImageGen Native DDS (GitHub CPU)

on:
  workflow_dispatch:
  push:
    branches:
      - korean-localization-recovery-20260928
    paths:
      - ".github/workflows/outrun-ab-imagegen-native.yml"
      - "tools/localization/github_ab_imagegen_native_production.py"
      - "tools/localization/test_github_ab_imagegen_native_production.py"
      - "localization/automation_inputs/ab_imagegen_registry.json"
      - "localization/automation_inputs/candidate_outputs/**"
      - "localization/graphics/hd_source/**"
      - "localization/test_packages/ab_preparation_20261102/ab_roi_crosswalk.csv"

permissions:
  contents: read

concurrency:
  group: outrun-ab-imagegen-native
  cancel-in-progress: false

jobs:
  compose-ab-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout GitHub A/B ImageGen originals and source DDS (no N100)
        uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/localization/github_ab_imagegen_native_production.py
            tools/localization/test_github_ab_imagegen_native_production.py
            localization/automation_inputs
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load/spr_etc_xst/D6DC1380_256x64.dds
            localization/test_packages/ab_preparation_20261102/ab_roi_crosswalk.csv

      - name: Setup native GitHub Python (NO Docker)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow only (no font rendering)
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Unit tests - original A/B pixels, SHA, mask and native DDS
        run: python -m unittest discover -s tools/localization -p test_github_ab_imagegen_native_production.py -v

      - name: Produce high-quality A/B ImageGen native DDS twice deterministically
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization/github_ab_imagegen_native_production.py \
            --repo-root . --out "$RUNNER_TEMP/ab-native-one"
          python tools/localization/github_ab_imagegen_native_production.py \
            --repo-root . --out "$RUNNER_TEMP/ab-native-two"
          cmp "$RUNNER_TEMP/ab-native-one/OUTRUN_AB_IMAGEGEN_NATIVE_TEST_ONLY.zip" \
              "$RUNNER_TEMP/ab-native-two/OUTRUN_AB_IMAGEGEN_NATIVE_TEST_ONLY.zip"
          cmp "$RUNNER_TEMP/ab-native-one/qa_report.json" \
              "$RUNNER_TEMP/ab-native-two/qa_report.json"
          sha256sum "$RUNNER_TEMP/ab-native-one/OUTRUN_AB_IMAGEGEN_NATIVE_TEST_ONLY.zip"

      - name: Publish TEST_ONLY DDS, readable PNG and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outrun-ab-original-imagegen-${{ github.run_id }}
          path: ${{ runner.temp }}/ab-native-one/
          if-no-files-found: warn
          retention-days: 21
