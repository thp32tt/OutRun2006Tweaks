name: Source-only selective ten-pass FFB review

on:
  push:
    branches: [ wheel-ffb ]
    paths:
      - '.github/workflows/source-ffb-review10-selective.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wheel-ffb
        uses: actions/checkout@v7.0.1
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Configure review commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply only justified source fixes
        run: python3 .github/source_ffb_review10_selective.py

      - name: Push reviewed source commits
        run: git push origin HEAD:wheel-ffb
