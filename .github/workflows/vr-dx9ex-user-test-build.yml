name: DX9Ex R26 User Test Build

permissions:
  contents: read

on:
  push:
    branches:
      - vr-d3d9ex-focus
    paths:
      - '.github/workflows/vr-dx9ex-user-test-build.yml'
      - 'tools/Run-DX9ExFocusTest.ps1'
      - 'tools/verify_vr_r26_stage_fixedfn.py'
      - 'tools/verify_vr_desktop_source_coordinates.py'
      - 'tools/verify_vr_unified_menu_source.py'
      - 'tools/verify_vr_f11_font_density.py'
      - 'tools/verify_vr_r26_landscape_visual_recovery.py'
      - 'tools/tests/r26_stage_fixedfn_harness.cpp'
      - 'src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp'
      - 'src/vr/d3d9/ex_device_upgrade.cpp'
      - 'src/hooks_uiscaling.cpp'
      - 'src/overlay/hooks_overlay.cpp'
      - 'src/overlay/overlay.cpp'
      - 'src/hooks_misc.cpp'
      - 'src/hooks_graphics.cpp'
      - 'src/vr/settings.cpp'
      - 'OutRun2006Tweaks.ini'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify XR render target and independent UI contracts
        shell: pwsh
        run: |
          python tools/verify_vr_desktop_source_coordinates.py
          if ($LASTEXITCODE -ne 0) { throw 'XR physical target/logical UI split failed' }
          python tools/verify_vr_unified_menu_source.py
          if ($LASTEXITCODE -ne 0) { throw 'VR UI reference split failed' }
          python tools/verify_vr_f11_font_density.py
          if ($LASTEXITCODE -ne 0) { throw 'F11 VR density/layout contract failed' }
          python tools/verify_vr_r26_landscape_visual_recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'R26 visual recovery bundle contract failed' }
          python tools/verify_vr_r26_stage_fixedfn.py
          if ($LASTEXITCODE -ne 0) { throw '+TIME four-API source regression failed' }

      - name: Configure Win32 R26+HUD
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32
          $cache = Get-Content build-game/CMakeCache.txt
          if ($cache -notcontains 'OUTRUN_VR_R26_HUD_COMPARE:BOOL=ON') {
            throw 'R26+HUD default renderer is not active'
          }

      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ''
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build Win32 game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks

      - name: Build x64 OpenXR host
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host

      - name: Assemble user test package
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,12)
          $dir = "OutRun2_VR_R26_XR_UI_SPLIT_VISUAL_RECOVERY_TEST_$short"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw 'dinput8.dll missing' }
          $vrHostExe = Get-ChildItem build-host -Recurse -Filter outrun-vr-host.exe | Select-Object -First 1
          if (-not $vrHostExe) { throw 'outrun-vr-host.exe missing' }
          Copy-Item $dll.FullName "$dir/dinput8.dll"
          Copy-Item $vrHostExe.FullName "$dir/outrun-vr-host.exe"
          Copy-Item OutRun2006Tweaks.ini "$dir/OutRun2006Tweaks.ini"
          $env:R26_USER_TEST_INI = (Resolve-Path "$dir/OutRun2006Tweaks.ini").Path
          python -c 'import configparser,os; p=configparser.ConfigParser(strict=True,interpolation=None); p.read(os.environ["R26_USER_TEST_INI"],encoding="utf-8"); assert p.getboolean("VR","RivalDx11NativeRoute") is False; assert p.getboolean("VR","DriverSeatCarSpaceBasis") is False'
          if ($LASTEXITCODE -ne 0) { throw 'User test package INI is duplicated or does not select the restored rival route' }
          Copy-Item OutRun2006Tweaks.lods.ini "$dir/OutRun2006Tweaks.lods.ini"
          Copy-Item tools/RUN_DX9EX_TEST.cmd "$dir/RUN_DX9EX_TEST.cmd"
          Copy-Item tools/Run-DX9ExFocusTest.ps1 "$dir/Run-DX9ExFocusTest.ps1"
          Set-Content "$dir/DX9EX_VARIANT.txt" 'variant=R26_XR_UI_SPLIT_VISUAL_RECOVERY_TEST' -Encoding ascii
          Set-Content "$dir/SOURCE_SHA.txt" $env:GITHUB_SHA -Encoding ascii
          @(
            'DX9Ex R26 + HUD user test build'
            'Targets: OpenXR/VDXR physical render target + independent 4:3 menu / 1920x1080 HUD / F11 / rival / +TIME / GOAL final graph / lens flare'
            'Renderer: R26+HUD default'
            'VR physical target: OpenXR/VDXR recommended eye extent (desktop-independent)'
            'Gameplay HUD reference: 1920x1080 widescreen, HudScale=0.55'
            'Title/main menu: independent 4:3 composition; F11: independent VR shell'
            'Baseline AA: VR AntiAliasing=0 for performance/correctness isolation'
            'Runner: GitHub-hosted windows-2022'
            'RUNTIME_VALIDATION=UNTESTED'
            ''
            'EXECUTION / 실행 방법'
            '1. Extract ALL files directly into the folder containing OR2006C2C.EXE.'
            '2. Double-click RUN_DX9EX_TEST.cmd.'
            '3. Do NOT run outrun-vr-host.exe directly. It is a VR helper process and a white helper window is not the game.'
            '4. Confirm VR render quality does NOT follow desktop resolution; test title/F11, in-race F11, HUD edge positions, rival, +TIME, GOAL/final graph and lens flare; then exit normally.'
            '5. Upload DX9EX_LOGS/DX9EX_LOG_R26_XR_UI_SPLIT_VISUAL_RECOVERY_TEST_*.zip if a defect remains.'
          ) | Set-Content "$dir/START_HERE.txt" -Encoding UTF8
          @(
            'DX9Ex R26 + HUD user test build'
            'Targets: XR render target + independent UI/F11/HUD/rival/+TIME/GOAL/lens recovery'
            'Renderer: R26+HUD default'
            'Runner: GitHub-hosted windows-2022'
            'Launcher: RUN_DX9EX_TEST.cmd'
            'RUNTIME_VALIDATION=UNTESTED'
          ) | Set-Content "$dir/TEST_SCOPE.txt" -Encoding UTF8
          foreach ($required in @(
            'dinput8.dll','outrun-vr-host.exe','RUN_DX9EX_TEST.cmd',
            'Run-DX9ExFocusTest.ps1','DX9EX_VARIANT.txt','START_HERE.txt')) {
            if (-not (Test-Path (Join-Path $dir $required))) {
              throw "user test package missing $required"
            }
          }
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-R26-XR-UI-SPLIT-VISUAL-RECOVERY-TEST-${{ github.sha }}
          path: OutRun2_VR_R26_XR_UI_SPLIT_VISUAL_RECOVERY_TEST_*.zip
          if-no-files-found: error
