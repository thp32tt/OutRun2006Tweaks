name: Source-only detailed 30-pass profile review

# One-time source review trigger; removed after verification.
on:
  push:
    branches: [ wheel-ffb ]
    paths:
      - '.github/workflows/source-review30-profiles.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wheel-ffb
        uses: actions/checkout@v7.0.1
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Configure review commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate and normalize review driver
        shell: bash
        run: |
          python3 -m py_compile .github/source_review30_profiles.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/source_review30_profiles.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(r"ffbProfileName_[0] = '\\0';", r"ffbProfileName_[0] = '\0';")
          s = s.replace(r'OutRun2006Tweaks.profiles\\\\FFB', r'OutRun2006Tweaks.profiles\\FFB')
          s = s.replace(
              '    if count != 1:\n',
              '    if count < 1 or (count != 1 and "Settings::VibrationMode = 0;" not in old):\n',
              1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile .github/source_review30_profiles.py

      - name: Apply justified profile and FFB improvements
        run: python3 .github/source_review30_profiles.py

      - name: Push reviewed source commits
        run: git push origin wheel-ffb
