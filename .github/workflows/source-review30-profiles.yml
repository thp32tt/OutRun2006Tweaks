name: Source-only detailed 30-pass profile review

# One-time source review trigger; removed after verification.
on:
  push:
    branches: [ wheel-ffb ]
    paths:
      - '.github/workflows/source-review30-profiles.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wheel-ffb
        uses: actions/checkout@v7.0.1
        with:
          ref: wheel-ffb
          fetch-depth: 0

      - name: Configure review commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate final review driver
        run: python3 -m py_compile .github/profile_final_review_fix.py

      - name: Apply final overwrite-safety correction
        run: python3 .github/profile_final_review_fix.py

      - name: Push reviewed source commits
        run: git push origin wheel-ffb
