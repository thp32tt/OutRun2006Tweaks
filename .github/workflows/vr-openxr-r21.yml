name: OpenXR VR R23 hardening build

on:
  push:
    branches: [ vr-openxr ]
    paths:
      - 'vrhost/**'
      - '.github/workflows/vr-openxr-r21.yml'
  workflow_dispatch:

jobs:
  host-x64-r23:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify R23 source invariants
        shell: pwsh
        run: |
          $r21 = Get-Content vrhost/src/runtime/r21_runtime_hardening.hpp -Raw
          $r22 = Get-Content vrhost/src/runtime/r22_runtime_hardening.hpp -Raw
          $r23 = Get-Content vrhost/src/runtime/r23_runtime_hardening.hpp -Raw
          $bundle = Get-Content vrhost/src/runtime/r23_verified_bundle.hpp -Raw
          $main = Get-Content vrhost/src/main_r23.cpp -Raw
          if (-not $r21.Contains('R21-readonly-ipc-vs-cbuffer-20260916')) { throw 'R21 build marker missing' }
          if (-not $r21.Contains('ReadDirectHostStateReadonly')) { throw 'readonly direct-state reader missing' }
          if (-not $r21.Contains('HostShouldRenderReadonly')) { throw 'shouldRender readonly gate missing' }
          if ($r21 -match 'InterlockedCompareExchange\s*\(') { throw 'write-capable CAS call leaked into R21 final owner' }
          if (-not $r22.Contains('R22-verified-frame-bundle-20260916')) { throw 'R22 validation marker missing' }
          if (-not $r22.Contains('RenderExactDirect')) { throw 'exact direct-frame renderer missing' }
          if (-not $r23.Contains('R23-atomic-verified-source-bundle-20260916')) { throw 'R23 final authority marker missing' }
          if (-not $r23.Contains('RenderExactDirect')) { throw 'R23 direct path does not use exact-frame authority' }
          if (-not $bundle.Contains('sourceCaptureQpc')) { throw 'verified source capture identity missing' }
          if (-not $main.Contains('R23FrameUnchanged')) { throw 'candidate metadata revalidation missing' }
          if (-not $main.Contains('R23CommitClassicAfterValidation')) { throw 'classic post-validation commit missing' }
          if (-not $main.Contains('R23CommitDirectAfterValidation')) { throw 'direct post-validation commit missing' }
          if (-not $main.Contains('D3D11_MAP_FLAG_DO_NOT_WAIT')) { throw 'non-blocking pixel diagnostic missing' }
          $shader = Get-Content vrhost/src/stereo_shader.hpp -Raw
          if (-not $shader.Contains('const float2 sampleUv = input.uv * UvScale + UvOffset')) { throw 'core PS UV transform missing' }
          if ($shader.Contains('o.uv = uv * UvScale + UvOffset')) { throw 'core VS still depends on unbound BlitParams' }
          $cmake = Get-Content vrhost/CMakeLists.txt -Raw
          if (-not $cmake.Contains('main_r23.cpp')) { throw 'R23 host entry point not selected' }
          if (-not $cmake.Contains('r23_runtime_hardening.hpp')) { throw 'R23 final owner not forced into host' }

      - name: Verify architecture boundaries
        run: python tools/verify_vr_architecture.py

      - name: Configure x64 host
        run: cmake -S vrhost -B build-r23-host -G "Visual Studio 17 2022" -A x64

      - name: Build x64 host and tests
        run: cmake --build build-r23-host --config RelWithDebInfo

      - name: Run host smoke tests
        shell: pwsh
        run: |
          foreach ($test in @(
            'outrun-vr-shader-smoke.exe',
            'outrun-vr-protocol-v3-smoke.exe',
            'outrun-vr-host-state-v3-channel-smoke.exe',
            'outrun-vr-v2-v3-shadow-conversion-smoke.exe',
            'outrun-vr-host-pose-v3-validation-smoke.exe',
            'outrun-vr-core-math-smoke.exe'
          )) {
            $path = Join-Path 'build-r23-host/bin' $test
            if (-not (Test-Path $path)) { throw "missing smoke executable: $test" }
            & $path
            if ($LASTEXITCODE -ne 0) { throw "smoke failed: $test code=$LASTEXITCODE" }
          }

      - name: Verify R23 host binary and symbols
        shell: pwsh
        run: |
          $hostPath = 'build-r23-host/bin/outrun-vr-host.exe'
          $pdbPath = 'build-r23-host/bin/outrun-vr-host.pdb'
          if (-not (Test-Path $hostPath)) { throw 'outrun-vr-host.exe was not produced' }
          if (-not (Test-Path $pdbPath)) { throw 'outrun-vr-host.pdb was not produced' }
          $bytes = [IO.File]::ReadAllBytes($hostPath)
          if ($bytes.Length -lt 10000) { throw 'outrun-vr-host.exe unexpectedly small' }
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            'R21-readonly-ipc-vs-cbuffer-20260916',
            'R22-verified-frame-bundle-20260916',
            'R23-atomic-verified-source-bundle-20260916',
            '[R23] final presentation authority ACTIVE',
            '[R23 pixel]',
            'write-capable CAS removed from final presentation path',
            'R20-production-host-20260916',
            'R19-production-capture-reuse-20260916',
            'R22-crash-dump-20260916'
          )) {
            if (-not $ascii.Contains($marker)) { throw "R23 host marker missing: $marker" }
          }
          $pe = [BitConverter]::ToInt32($bytes,0x3C)
          if ([BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x8664) { throw 'expected x64 host' }

      - uses: actions/upload-artifact@v4
        with:
          name: outrun-vr-r23-host-x64-symbols
          path: |
            build-r23-host/bin/outrun-vr-host.exe
            build-r23-host/bin/outrun-vr-host.pdb
          if-no-files-found: error
