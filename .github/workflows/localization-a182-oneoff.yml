name: Localization A182 Oneoff
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths: ['.github/workflows/localization-a182-oneoff.yml']
permissions:
  contents: write
jobs:
  run-a182:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Run A182
        env:
          OUTRUN_CPU_WORKER: github-actions
          OUTRUN_CPU_ROLE: A
        run: python tools/localization/cpu_jobs/A.py
      - name: Commit A182 outputs
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(localization/graphics/hd_candidates/|localization/graphics/role_A/|localization/graphics/worker_results/)' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          git add -A localization/graphics/hd_candidates localization/graphics/role_A localization/graphics/worker_results
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "localization(cpu): worker output [A182]"
          git fetch origin korean-localization-recovery-20260928
          git rebase origin/korean-localization-recovery-20260928
          git push origin HEAD:korean-localization-recovery-20260928

# retry: A182 persisted decode fix
