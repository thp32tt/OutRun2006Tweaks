name: Apply VR pass policy once

on:
  push:
    branches: [vr-openxr]
    paths:
      - 'tools/apply_vr_pass_policy_once.py'
      - '.github/workflows/apply-vr-pass-policy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-openxr
          fetch-depth: 0
      - name: Apply exact source patch
        run: python3 tools/apply_vr_pass_policy_once.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vr/d3d9/stereo_renderer_r13.cpp src/vr/game/outrun_renderer_r13.cpp
          git diff --cached --check
          git commit -m "vr: centralize R13 render-pass classification"
          git push origin HEAD:vr-openxr
