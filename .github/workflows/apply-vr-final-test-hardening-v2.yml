name: Apply VR final test hardening v2

on:
  push:
    branches: [vr-openxr]
    paths:
      - 'tools/apply_vr_final_test_hardening_v2.py'
      - '.github/workflows/apply-vr-final-test-hardening-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-openxr
          fetch-depth: 0
      - name: Apply final true-stereo hardening
        run: python3 tools/apply_vr_final_test_hardening_v2.py
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+thp32tt@users.noreply.github.com'
          git add src/vr_shared.hpp src/vr_renderer_probe.cpp src/vr_stereo.cpp
          if git diff --cached --quiet; then
            echo 'No source changes.'
            exit 0
          fi
          git commit -m 'vr: finalize present-latched true stereo and diagnostics'
          git push origin HEAD:vr-openxr
