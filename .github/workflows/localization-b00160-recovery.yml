name: Localization B00160 Recovery Render
on:
  push:
    branches: [korean-localization-clean]
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00160.dispatch.json'
      - '.github/workflows/localization-b00160-recovery.yml'
permissions:
  contents: write
concurrency:
  group: localization-b00160-recovery
  cancel-in-progress: false
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0
      - name: Refresh current SSOT
        run: git pull --rebase origin korean-localization-clean
      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Render index112 candidate and static QA
        run: python tools/localization/b00160_recovery_render.py
      - name: Commit durable producer result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             localization/graphics/hd_candidates/textures/load/spr_sprani_selector_cvt_Exst/D41D0B1_512x64.dds             KOREAN_PNG_REVIEW/D41D0B1             localization/graphics/role_B             docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00160.json
          git rm             .github/workflows/localization-b00160-recovery.yml             tools/localization/b00160_recovery_render.py             docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00160.dispatch.json
          git commit -m "localization(B): render index112 D41D0B1 candidate [AUTO:LOCALIZATION-LOCALIZATION_B-00160]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
