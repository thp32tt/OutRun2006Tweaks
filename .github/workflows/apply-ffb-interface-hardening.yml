name: Apply FFB interface hardening

on:
  push:
    branches: [wheel-ffb-v0.2-dev]
    paths:
      - .github/workflows/apply-ffb-interface-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wheel-ffb-v0.2-dev
          fetch-depth: 0

      - name: Apply FFB interface hardening
        run: python tools/apply_ffb_interface_hardening.py

      - name: Verify consolidated wheel FFB source
        run: python tools/verify_wheel_ffb_current.py

      - name: Test production wheel FFB math
        run: python tools/verify_wheel_ffb_math.py

      - name: Commit clean source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ffb-interface-hardening.yml
          git rm tools/apply_ffb_interface_hardening.py
          git add src/hooks_wheel_ffb.cpp tools/verify_wheel_ffb_current.py
          git commit -m "fix: harden multi-interface wheel FFB negotiation"
          git push origin HEAD:wheel-ffb-v0.2-dev
