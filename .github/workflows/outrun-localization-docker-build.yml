name: OutRun localization Docker build
on:
  push:
    branches:
      - localization-controller-recovery-20260928
    paths:
      - 'tools/chat-controller/localization-recovery-v1/**'
      - '.github/workflows/outrun-localization-docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build localization controller
        run: |
          docker build --progress=plain \
            -t outrun-localization:test \
            tools/chat-controller/localization-recovery-v1
