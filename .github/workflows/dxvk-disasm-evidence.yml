name: DXVK Canonical Disassembly Evidence

on:
  push:
    branches:
      - vr-dxvk-r71-disasm
    paths:
      - 'tools/analyze_outrun_exe.py'
      - 'tools/verify_vr_backend_disasm_contract.py'
      - '.github/workflows/dxvk-disasm-evidence.yml'
  workflow_dispatch:

concurrency:
  group: dxvk-disasm-evidence-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canonical-exe-evidence:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CANONICAL_EXE_SHA256: 68ceb386829066f8455b9d027320af962584321f3e2e8a79c72841495a6134c3
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify static disassembly contract
        shell: pwsh
        run: python tools/verify_vr_backend_disasm_contract.py

      - name: Download canonical OutRun executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force analysis-input | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE' `
            -OutFile analysis-input/OR2006C2C.EXE

      - name: Verify canonical executable identity
        shell: pwsh
        run: |
          $actualHash = (Get-FileHash analysis-input/OR2006C2C.EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = $env:CANONICAL_EXE_SHA256.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Canonical OutRun executable SHA256 mismatch: expected=$expectedHash actual=$actualHash"
          }
          Write-Host "CANONICAL_EXE_SHA256=$actualHash"

      - name: Analyze canonical executable
        shell: pwsh
        run: |
          python tools/analyze_outrun_exe.py `
            --exe analysis-input/OR2006C2C.EXE `
            --out-dir analysis-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record exact evidence identity
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash analysis-input/OR2006C2C.EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          "SOURCE_SHA=${{ github.sha }}" | Set-Content analysis-output/DXVK_DISASM_EVIDENCE_IDENTITY.txt
          "CANONICAL_EXE_SHA256=$exeHash" | Add-Content analysis-output/DXVK_DISASM_EVIDENCE_IDENTITY.txt
          Get-Content analysis-output/DXVK_DISASM_EVIDENCE_IDENTITY.txt

      - name: Upload exact-SHA disassembly evidence
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-disasm-evidence-${{ github.sha }}
          path: analysis-output/
          if-no-files-found: error
          retention-days: 14
