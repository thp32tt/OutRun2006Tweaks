name: Korean crash diagnostic graphics payload

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - .github/workflows/localization-crash-diagnostic-packages.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout localization branch snapshot
        uses: actions/checkout@v4

      - name: Verify and stage current HD candidates
        shell: bash
        run: |
          set -euo pipefail
          SRC="localization/graphics/hd_candidates/textures"
          COUNT="$(find "$SRC" -type f -name '*.dds' | wc -l)"
          test "$COUNT" -eq 16
          mkdir -p dist
          cp -a "$SRC" dist/textures
          (
            cd dist
            find textures -type f -name '*.dds' -print0 | sort -z | xargs -0 sha256sum > DDS_SHA256SUMS.txt
          )
          printf 'head_sha=%s\ndds_count=%s\nRUNTIME_VALIDATION=UNTESTED\n' "$GITHUB_SHA" "$COUNT" > dist/PAYLOAD_INFO.txt

      - name: Upload current HD candidate payload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: korean-current-hd-candidates-${{ github.sha }}
          path: dist/
