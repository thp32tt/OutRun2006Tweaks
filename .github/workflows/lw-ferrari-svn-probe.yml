name: LoneWolfie Ferrari SVN Probe

on:
  push:
    branches:
      - vr-quest-cockpit-v2-external-dino-actions-20261116
    paths:
      - '.github/workflows/lw-ferrari-svn-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: List official LoneWolfie SVN Ferrari paths
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion
          svn ls -R https://svn.code.sf.net/p/lwcarssvn/code/ > "${RUNNER_TEMP}/lw_svn_paths.txt"
          grep -Ei 'ferrari|365gts|daytona' "${RUNNER_TEMP}/lw_svn_paths.txt" | head -n 1000
