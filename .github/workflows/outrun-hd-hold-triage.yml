name: OutRun HD Strict HOLD Root Cause Tickets (GitHub CPU)
on:
  workflow_dispatch:
  push:
    branches: [korean-localization-recovery-20260928]
    paths:
      - ".github/workflows/outrun-hd-hold-triage.yml"
      - "tools/localization/hd_hold_triage.py"
      - "tools/localization/test_hd_hold_triage.py"
      - "tools/localization/hd_rework_queue.py"

permissions:
  contents: read

concurrency:
  group: outrun-hd-hold-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-bound-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only source QA tools and pinned ROI CSV (NO DDS, Docker or N100)
        uses: actions/checkout@v4
        with:
          ref: korean-localization-recovery-20260928
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/localization/github_ab_imagegen_atlas_batch.py
            tools/localization/hd_hold_triage.py
            tools/localization/test_hd_hold_triage.py
            tools/localization/hd_rework_queue.py
            tools/localization/hd_bc3_index_patch.py
            tools/localization/hd_bc3_native_codec.py
            tools/localization/hd_existing_candidate_salvage.py
            tools/localization/hd_overlap_ownership.py
            tools/localization/hd_strict_qa.py
            tools/localization/hd_manual_user_import.py
            localization/test_packages/ab_preparation_20261102/ab_roi_crosswalk.csv

      - name: Read last strict SHA-bound QA report from isolated queue branch
        uses: actions/checkout@v4
        with:
          ref: korean-localization-qa-queue-20261104
          path: qa-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            localization/automation_runs/hd_rework_queue/last_report.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Pillow dependency (no generation or downloads)
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Verify fail-closed source and geometric HOLD counting
        run: python -m unittest discover -s tools/localization -p test_hd_hold_triage.py -v

      - name: Emit actionable per-ROI HOLD receipts and alpha-owner review clusters
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization/hd_hold_triage.py --repo-root . \
            --qa-report qa-source/localization/automation_runs/hd_rework_queue/last_report.json \
            --out "$RUNNER_TEMP/hold-triage"
          python - "$RUNNER_TEMP/hold-triage/hold_triage.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["hold_total"]+j["painted_test_only"]==954
          assert j["release_approved"] is False
          with open(sys.argv[2],"a",encoding="utf-8") as f:
              f.write("# Strict HD HOLD triage (NOT approved)\n\n")
              f.write(f'ROI {j["source_roi_total"]}, TEST_ONLY painted {j["painted_test_only"]}, HOLD {j["hold_total"]}\n\n')
              for k,v in sorted(j["hold_reasons"].items()):
                  f.write(f"- {k}: {v}\n")
              f.write("\nAll per-ROI source masks/coordinates remain unapproved until independent QA. \n")
          PY

      - name: Upload full HOLD tickets, exact source references and neighbors
        uses: actions/upload-artifact@v4
        with:
          name: outrun-hd-hold-triage-${{ github.run_id }}
          path: ${{ runner.temp }}/hold-triage/
          retention-days: 30
          if-no-files-found: error
