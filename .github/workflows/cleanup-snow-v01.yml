name: Cleanup Snow v0.1 Staging

on:
  push:
    branches: [ wheel-ffb-v0.2-dev ]
    paths:
      - '.github/workflows/cleanup-snow-v01.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wheel-ffb-v0.2-dev
          fetch-depth: 0
      - name: Remove staging files and trigger clean build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-snow-latch-v01.yml
          git rm tools/_patch_snow_latch_v01.py
          git rm .github/workflows/cleanup-snow-v01.yml
          git commit -m 'release: verify snow latch route-fork fix for v0.1'
          git push origin HEAD:wheel-ffb-v0.2-dev
