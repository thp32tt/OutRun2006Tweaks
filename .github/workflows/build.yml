name: Consolidate Wheel FFB Source

on:
  push:
    branches: [ wheel-ffb ]

permissions:
  contents: write

jobs:
  consolidate:
    if: "${{ github.event.head_commit.message == 'chore: materialize consolidated wheel ffb' }}"
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Make wheel sources permanent in CMake
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'src/hooks_wheel_ffb_build\.cpp') {
            $needle = "`t`"src/hooks_forcefeedback.cpp`""
            $insert = "$needle`r`n`t`"src/hooks_wheel_ffb_build.cpp`""
            $cmake = $cmake.Replace($needle, $insert)
          }
          if ($cmake -notmatch 'src/overlay/wheel_setup_ui\.cpp') {
            $needle = "`t`"src/overlay/input_bindings_ui.cpp`""
            $insert = "$needle`r`n`t`"src/overlay/wheel_setup_ui.cpp`""
            $cmake = $cmake.Replace($needle, $insert)
          }
          Set-Content -Path CMakeLists.txt -Value $cmake -NoNewline

      - name: Materialize current effective wheel source
        shell: pwsh
        run: |
          python tools/patch_wheel_ffb_r3_behavior.py
          python tools/patch_wheel_ffb_r3_spring_direction.py
          python tools/patch_wheel_ffb_simulation.py
          python tools/patch_wheel_ffb_menu_handoff.py
          python tools/patch_wheel_setup_ui_compile.py
          python tools/patch_wheel_setup_ffb_panel.py
          python tools/patch_wheel_debug_hardening.py
          python tools/patch_wheel_device_selection.py
          python tools/patch_wheel_ffb_live_controls.py
          python tools/patch_wheel_setup_reader_hardening.py
          python tools/patch_wheel_round2_core.py
          python tools/patch_wheel_ffb_recovery.py
          python tools/patch_wheel_round2_ui.py
          python tools/patch_wheel_round3_10pass.py
          python tools/patch_wheel_ffb_device_guid.py
          python tools/patch_wheel_setup_device_guid.py
          python tools/patch_multi_device_hybrid.py
          python tools/patch_wheel_ffb_community.py
          python tools/patch_wheel_final_cleanup.py

      - name: Verify materialized source before archive
        shell: pwsh
        run: |
          python tools/verify_wheel_effective_build.py
          python tools/verify_wheel_ffb_math.py
          python tools/verify_wheel_round3_10pass.py
          python tools/verify_multi_device_hybrid.py
          python tools/verify_wheel_final_cleanup.py
          python tools/verify_wheel_ffb_current.py

      - name: Archive round patch history
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/archive/rounds | Out-Null
          Get-ChildItem tools/patch_wheel_round*.py | Move-Item -Destination tools/archive/rounds/
          Get-ChildItem tools/verify_wheel_round*.py | Move-Item -Destination tools/archive/rounds/
          @'
          # Archived wheel FFB round patches

          These scripts record the incremental Round 2-17 development history.
          They are no longer part of the build or verification path.

          The effective result was materialized into the normal src/ tree on the
          wheel-ffb branch. New development must edit the C++ sources directly.

          Current source-level verification lives at:

          tools/verify_wheel_ffb_current.py
          '@ | Set-Content tools/archive/rounds/README.md

      - name: Verify consolidated source after archive
        shell: pwsh
        run: python tools/verify_wheel_ffb_current.py

      - name: Commit consolidated baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt OutRun2006Tweaks.ini src tools
          if (git diff --cached --quiet) {
            throw 'Consolidation produced no changes'
          }
          git commit -m "refactor: materialize consolidated wheel FFB baseline [skip ci]"
          git push origin HEAD:wheel-ffb
