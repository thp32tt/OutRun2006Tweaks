name: A recovery03 apply
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/korean-localization-recovery-20260928'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zlib,hashlib
          p=Path('localization/graphics/hd_candidates/textures/load/spr_sprani_game_cvt_Exst/39229D64_1024x1024.dds')
          z=b''.join(Path(f'.a392/chunk_{i}').read_bytes() for i in range(4))
          d=zlib.decompress(z); old=p.read_bytes(); assert len(d)==len(old)
          new=bytes(a^b for a,b in zip(old,d))
          assert hashlib.sha256(new).hexdigest()=='a63dcfea0642c9bcb4cb5b41d168923404157d9b65409a3affcf72662343d2b6'
          p.write_bytes(new)
          PY
          rm -rf .a392
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "localization(A): rework 39229D64 bbox failures"
          git push origin "HEAD:$GITHUB_REF_NAME"
