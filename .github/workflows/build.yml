on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [ Win32 ]
        build_type: [ Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Include experimental wheel sources
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw

          if (Test-Path "src/hooks_wheel_ffb_build.cpp") {
            if ($cmake -notmatch 'src/hooks_wheel_ffb_build\.cpp') {
              $needle = "`t`"src/hooks_forcefeedback.cpp`""
              $insert = "$needle`r`n`t`"src/hooks_wheel_ffb_build.cpp`""
              $cmake = $cmake.Replace($needle, $insert)
            }
          }

          if (Test-Path "src/overlay/wheel_setup_ui.cpp") {
            if ($cmake -notmatch 'src/overlay/wheel_setup_ui\.cpp') {
              $needle = "`t`"src/overlay/input_bindings_ui.cpp`""
              $insert = "$needle`r`n`t`"src/overlay/wheel_setup_ui.cpp`""
              $cmake = $cmake.Replace($needle, $insert)
            }
          }

          Set-Content -Path CMakeLists.txt -Value $cmake -NoNewline

          if (-not (Select-String -Path CMakeLists.txt -Pattern 'src/hooks_wheel_ffb_build\.cpp' -Quiet)) {
            throw "Failed to add hooks_wheel_ffb_build.cpp to generated CMake source list"
          }
          if (-not (Select-String -Path CMakeLists.txt -Pattern 'src/overlay/wheel_setup_ui\.cpp' -Quiet)) {
            throw "Failed to add wheel_setup_ui.cpp to generated CMake source list"
          }

      - name: Apply R3 FFB behavior patch
        shell: pwsh
        run: python tools/patch_wheel_ffb_r3_behavior.py

      - name: Apply R3 spring direction patch
        shell: pwsh
        run: python tools/patch_wheel_ffb_r3_spring_direction.py

      - name: Apply simulation FFB patch
        shell: pwsh
        run: python tools/patch_wheel_ffb_simulation.py

      - name: Apply menu/gameplay FFB handoff patch
        shell: pwsh
        run: python tools/patch_wheel_ffb_menu_handoff.py

      - name: Finalize universal wheel setup UI
        shell: pwsh
        run: python tools/patch_wheel_setup_ui_compile.py

      - name: Add combined simulation FFB panel
        shell: pwsh
        run: python tools/patch_wheel_setup_ffb_panel.py

      - name: Apply wheel runtime hardening
        shell: pwsh
        run: python tools/patch_wheel_debug_hardening.py

      - name: Apply wheel device-selection hardening
        shell: pwsh
        run: python tools/patch_wheel_device_selection.py

      - name: Apply live FFB controls hardening
        shell: pwsh
        run: python tools/patch_wheel_ffb_live_controls.py

      - name: Apply universal wheel reader hardening
        shell: pwsh
        run: python tools/patch_wheel_setup_reader_hardening.py

      - name: Apply round2 FFB lifecycle safety
        shell: pwsh
        run: python tools/patch_wheel_round2_core.py

      - name: Apply DirectInput device-loss recovery
        shell: pwsh
        run: python tools/patch_wheel_ffb_recovery.py

      - name: Apply round2 universal input semantics
        shell: pwsh
        run: python tools/patch_wheel_round2_ui.py

      - name: Apply round3 ten-pass correctness hardening
        shell: pwsh
        run: python tools/patch_wheel_round3_10pass.py

      - name: Verify effective wheel build
        shell: pwsh
        run: python tools/verify_wheel_effective_build.py

      - name: Verify FFB numeric invariants
        shell: pwsh
        run: python tools/verify_wheel_ffb_math.py

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A ${{matrix.arch}} ..

      - name: Add older VC2022 redist workaround to safetyhook
        shell: pwsh
        run: |
          (Get-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/safetyhook-build/safetyhook.vcxproj
          (Get-Content build/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/zycore/Zycore.vcxproj

      - name: Zero out SDL_gameinputjoystick.c (https://github.com/libsdl-org/SDL/issues/11487 / https://github.com/actions/runner-images/issues/10980)
        shell: pwsh
        run: |
          Set-Content -Path build/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build
        run: cmake --build build --config ${{matrix.build_type}}

      - name: Copy settings
        shell: pwsh
        run: |
          cp OutRun2006Tweaks.ini build/bin/OutRun2006Tweaks.ini
          cp OutRun2006Tweaks.lods.ini build/bin/OutRun2006Tweaks.lods.ini

      - name: Verify built wheel payload
        shell: pwsh
        run: |
          $dllPath = "build/bin/dinput8.dll"
          if (-not (Test-Path $dllPath)) { throw "dinput8.dll was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($dllPath)
          if ($bytes.Length -lt 1000000) { throw "dinput8.dll is unexpectedly small" }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "dinput8.dll has no MZ header" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or ($peOffset + 6) -ge $bytes.Length) { throw "invalid PE offset" }
          $signature = [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)
          if ($signature -ne "PE`0`0") { throw "invalid PE signature" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014C) { throw ("expected Win32 x86 DLL, machine=0x{0:X4}" -f $machine) }
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $markers = @(
            "WheelFFB: GUID_Damper created",
            "WheelFFB: live GlobalStrength applied to active effects",
            "WheelFFB: no literal MOZA DirectInput name",
            "WheelFFB: scheduling DirectInput device reinitialization",
            "WheelFFB: hardware spring disabled live; using software centering",
            "Reverse ConstantForce",
            "WheelUniversalSetup: F11 universal DirectInput profile support installed"
          )
          foreach ($marker in $markers) {
            if (-not $ascii.Contains($marker)) { throw "missing compiled marker: $marker" }
          }
          $ini = Get-Content "build/bin/OutRun2006Tweaks.ini" -Raw
          if ($ini -notmatch '(?m)^SteeringDeadZone\s*=\s*0\.0\s*$') { throw "shipped deadzone is not 0.0" }
          if ($ini -notmatch '(?m)^WheelAccelerationInvert\s*=\s*false\s*$') { throw "shipped accelerator invert is not false" }
          Write-Host ("Verified dinput8.dll: {0} bytes, PE32 x86, required wheel markers present" -f $bytes.Length)
          Get-FileHash $dllPath -Algorithm SHA256

      - name: Download EXE
        shell: pwsh
        run: Invoke-WebRequest -Uri https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE -OutFile build/bin/OR2006C2C.exe

      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: outrun2006tweaks-${{ github.sha }}
          path: build/bin/

      - name: Upload effective wheel sources
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheel-effective-source-${{ github.sha }}
          path: |
            src/hooks_wheel_ffb.cpp
            src/hooks_wheel_input_compat_v2.hpp
            src/hooks_wheel_r3_menu_dpad.hpp
            src/hooks_wheel_r3_menu_ab.hpp
            src/hooks_wheel_r3_device_autoselect.hpp
            src/overlay/wheel_setup_ui.cpp
            OutRun2006Tweaks.ini
