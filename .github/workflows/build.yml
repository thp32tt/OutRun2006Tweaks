name: Build reviewed wheel FFB patch

on:
  push:
    branches:
      - wheel-ffb

permissions:
  contents: write

env:
  REVIEW_BASE: 7a37c9dc9a37d13d0bf993102f62c8a2b2a35022

jobs:
  build-and-apply:
    runs-on: windows-2022

    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Reconstruct and apply reviewed patch
        shell: pwsh
        run: |
          git checkout $env:REVIEW_BASE -- .github/workflows/build.yml
          cmd /c copy /b "tools\bootstrap\review.patch.part-00+tools\bootstrap\review.patch.part-01+tools\bootstrap\review.patch.part-02+tools\bootstrap\review.patch.part-03" "tools\bootstrap\review.patch"
          git apply --check tools/bootstrap/review.patch
          git apply tools/bootstrap/review.patch
          Remove-Item tools/bootstrap/review.patch
          Write-Host "Reviewed patch applied to $env:REVIEW_BASE"

      - name: Verify consolidated wheel FFB source
        shell: pwsh
        run: python tools/verify_wheel_ffb_current.py

      - name: Test production wheel FFB math
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat" || exit /b 1
          python tools/verify_wheel_ffb_math.py

      - name: Configure Win32 Release
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Add older VC2022 redist workaround to safetyhook
        shell: pwsh
        run: |
          (Get-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/zycore/Zycore.vcxproj

      - name: Zero out SDL GameInput source
        shell: pwsh
        run: |
          Set-Content -Path build/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build Win32 Release DLL
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify DLL
        shell: pwsh
        run: |
          $dllPath = "build/bin/dinput8.dll"
          if (-not (Test-Path $dllPath)) { throw "dinput8.dll was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($dllPath)
          if ($bytes.Length -lt 1000000) { throw "dinput8.dll is unexpectedly small" }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "dinput8.dll has no MZ header" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $signature = [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)
          if ($signature -ne "PE`0`0") { throw "invalid PE signature" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014C) { throw ("expected Win32 x86 DLL, machine=0x{0:X4}" -f $machine) }
          Write-Host ("Verified dinput8.dll: {0} bytes, PE32 x86" -f $bytes.Length)
          Get-FileHash $dllPath -Algorithm SHA256

      - name: Commit reviewed source to wheel-ffb
        shell: pwsh
        run: |
          Remove-Item tools/bootstrap/review.patch.part-* -Force
          if (Test-Path tools/bootstrap) {
            if (-not (Get-ChildItem tools/bootstrap -Force)) { Remove-Item tools/bootstrap -Force }
          }
          # GitHub Actions tokens cannot push workflow-file changes. Keep the
          # temporary workflow unchanged here; the reviewed permanent workflow
          # is applied separately after this source commit succeeds.
          git checkout origin/wheel-ffb -- .github/workflows/build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: apply reviewed wheel FFB safety and SAT fixes"
          git push origin HEAD:wheel-ffb

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reviewed-wheel-ffb-${{ github.run_id }}
          path: build/bin/dinput8.dll
