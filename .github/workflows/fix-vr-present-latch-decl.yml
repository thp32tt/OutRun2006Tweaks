name: Fix VR present latch declaration

on:
  push:
    branches: [vr-openxr]
    paths:
      - 'tools/fix_vr_present_latch_decl.py'
      - '.github/workflows/fix-vr-present-latch-decl.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-openxr
          fetch-depth: 0
      - run: python3 tools/fix_vr_present_latch_decl.py
      - run: git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+thp32tt@users.noreply.github.com'
          git add src/vr_renderer_probe.cpp
          git commit -m 'vr: fix present pose helper declaration order'
          git push origin HEAD:vr-openxr
