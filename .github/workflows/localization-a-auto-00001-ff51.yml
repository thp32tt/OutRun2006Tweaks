name: Localization A AUTO 00001 FF51 Partial Rework
on:
  push:
    branches: [korean-localization-clean]
    paths: ['docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00001-ff51.dispatch.json']
permissions:
  contents: write
concurrency:
  group: localization-a-auto-00001-ff51
  cancel-in-progress: false
jobs:
  rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: korean-localization-clean, fetch-depth: 0}
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/localization/a_auto_00001_rework_ff51.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/graphics/hd_candidates/textures/load/spr_sprani_etc_cvt_Exst/FF2462BB_1024x512.dds localization/graphics/role_A/20260928-AUTO-A00001-FF51 localization/graphics/asset_queue.csv localization/progress/progress.json localization/resume_state.json localization/progress/STATUS.md localization/WORKLOG.md
          git commit -m "localization: A partial rework FF2462BB [AUTO:LOCALIZATION-LOCALIZATION_A-00001]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
