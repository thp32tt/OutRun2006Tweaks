name: Apply Engine Vibration Source Patch

on:
  push:
    branches: [ wheel-ffb-v0.2-dev ]
    paths:
      - '.github/workflows/apply-engine-vibration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: wheel-ffb-v0.2-dev
          fetch-depth: 0

      - name: Apply source patch
        run: python tools/apply_engine_vibration_patch.py

      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks_wheel_ffb.cpp src/wheel_ffb_math.hpp src/overlay/wheel_setup_ui.cpp src/hooks_wheel_ffb_build.cpp OutRun2006Tweaks.ini tools/test_wheel_ffb_current.cpp tools/verify_wheel_ffb_current.py
          git diff --cached --check
          git commit -m "ffb v0.2: add universal engine vibration haptics [skip ci]"
          git push origin HEAD:wheel-ffb-v0.2-dev
