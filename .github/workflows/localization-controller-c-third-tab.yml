name: Existing localization controller C third-tab check
on:
  push:
    branches:
      - localization-controller-recovery-20260928
    paths:
      - 'tools/chat-controller/localization-recovery-v1/patch_controller_c_slot.py'
      - 'tools/chat-controller/localization-recovery-v1/patch_controller_png_upload.py'
      - 'tools/chat-controller/localization-recovery-v1/Dockerfile'
      - 'tools/chat-controller/localization-recovery-v1/docker-compose.yml'
      - 'tools/chat-controller/localization-recovery-v1/prompts/localization_C.md'
      - 'tools/chat-controller/localization-recovery-v1/tests/test_controller_c_third_tab.py'
      - '.github/workflows/localization-controller-c-third-tab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-build-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Three slots and pinned A/B/C build-time patch (no ChatGPT)
        run: python tools/chat-controller/localization-recovery-v1/tests/test_controller_c_third_tab.py
      - name: Current Compose keeps historical three-tab patch retired
        run: |
          python -m pip install PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('tools/chat-controller/localization-recovery-v1/docker-compose.yml')
          c=yaml.safe_load(p.read_text())
          services=c['services']
          assert set(services)=={
              'outrun-chat-controller-localization-recovery',
              'outrun-chat-qa-rework',
          }
          gitops=services['outrun-chat-controller-localization-recovery']
          qa=services['outrun-chat-qa-rework']
          assert gitops['build']['dockerfile']=='Dockerfile.gitops'
          assert 'CHAT_SLOTS' not in gitops['environment']
          assert qa['build']['dockerfile']=='Dockerfile.chat-rework'
          assert 'hd_imagegen_fallback' in qa['environment']['OUTRUN_REWORK_QUEUE_NAME']
          assert 'OUTRUN_REWORK_REUSE_ONLY' in qa['environment']
          assert 'outrun-c-salvage-offline' not in services
          print('PASS: historical C third-tab patch remains regression-only; active HOLD worker owns browser QA')
          PY
