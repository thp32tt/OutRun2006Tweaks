          python tools/test_dx11_native_eye_color_chronology_00989.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_eye_clear_recovery_00990.cpp -o /tmp/dx11_eye_clear_recovery_00990 && /tmp/dx11_eye_clear_recovery_00990
          python tools/test_dx11_native_eye_clear_recovery_00990.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_eye_partial_clear_frame_00991.cpp -o /tmp/dx11_eye_mosaic_00991 && /tmp/dx11_eye_mosaic_00991
