name: DX11 Fast Structural Checks

on:
  push:
    branches:
      - vr-dx11-native-r71
    paths:
      - 'src/vr/d3d11/**'
      - 'tools/dx11_autodev_policy.py'
      - 'tools/test_dx11_*.py'
      - 'docs/automation/DX11_AUTODEV_EXECUTION_POLICY.json'
      - 'docs/automation/runs/CONVERSION-DX11-*.json'
      - '.github/workflows/dx11-fast-structural.yml'
  workflow_dispatch:

concurrency:
  group: dx11-fast-structural-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate DX11 development work allocation
        run: |
          python tools/test_dx11_autodev_policy.py
          python tools/dx11_autodev_policy.py --check-latest
      - name: Run focused DX11 source-only regression checks
        run: |
          python tools/test_dx11_linear_predication_r230.py
          python tools/test_dx11_linear_stream_output_r232.py
          python tools/test_dx11_linear_buffer_owner_r183.py
          python tools/test_dx11_stage0_pm_factor_00619.py
          python tools/test_dx11_stage0_pm_modulate_00620.py
          python tools/test_dx11_stage0_pm_add_00621.py
          python tools/test_dx11_stage0_pm_subtract_00622.py
          python tools/test_dx11_stage0_pm_dual_00623.py
          python tools/test_dx11_stage0_pm_modulate4x_00624.py
          python tools/test_dx11_stage0_pm_addsigned_00625.py
          python tools/test_dx11_stage0_pm_addsigned2x_00626.py
          python tools/test_dx11_stage0_pm_blendtexturealpha_00627.py
          python tools/test_dx11_stage0_pm_blenddiffusealpha_00628.py
          python tools/test_dx11_stage0_pm_blendfactoralpha_00629.py
          python tools/test_dx11_stage0_pm_factor_arg2_00630.py
          python tools/test_dx11_stage0_pm_diffuse_arg1_00631.py
          python tools/test_dx11_stage0_pm_inverse_texture_alpha_00632.py
          python tools/test_dx11_stage0_pm_inverse_arg2_00633.py
          python tools/test_dx11_stage0_pm_inverse_diffuse_00634.py
          python tools/test_dx11_stage0_pm_inverse_factor_00635.py
          python tools/test_dx11_stage0_pm_modulate_factor_00636.py
          python tools/test_dx11_stage0_pm_inverse_modulate_factor_00637.py
          python tools/test_dx11_stage0_pm_scaled_factor_00638.py
          python tools/test_dx11_stage0_pm_signed_factor_00639.py
          python tools/test_dx11_stage0_pm_add_factor_00640.py
          python tools/test_dx11_stage0_pm_current_factor_00641.py
          python tools/test_dx11_stage0_pm_current_diffuse_00642.py
          python tools/test_dx11_stage0_pm_current_dispatch_00643.py
          python tools/test_dx11_live_line_draw_00644.py
          python tools/test_dx11_live_point_draw_00645.py
          python tools/test_dx11_sparse_index_draw_00646.py
          python tools/test_dx11_fragmented_vb_shadow_00647.py
          python tools/test_dx11_race_depth_draw_00648.py
          python tools/test_dx11_game_cull_draw_00649.py
          python tools/test_dx11_readonly_depth_draw_00650.py
          python tools/test_dx11_depth_state_binding_00651.py
          python tools/test_dx11_depth_always_draw_00652.py
          python tools/test_dx11_depth_equality_draw_00653.py
          python tools/test_dx11_depth_ordering_draw_00654.py
          python tools/test_dx11_native_anisotropic_sampler_00655.py
          python tools/test_dx11_native_anisotropic_mag_00656.py
          python tools/test_dx11_native_srgb_texture_00657.py
          python tools/test_dx11_native_luminance_texture_00658.py
          python tools/test_dx11_native_rgb24_texture_00659.py
          python tools/test_dx11_native_rgba_texture_00660.py
          python tools/test_dx11_native_xrgb16_texture_00661.py
          python tools/test_dx11_native_10bit_texture_00662.py
          python tools/test_dx11_native_extended_luminance_00663.py
          python tools/test_dx11_native_rg16_00664.py
          python tools/test_dx11_native_a8p8_00665.py
          python tools/test_dx11_native_rgb332_00667.py
          python tools/test_dx11_native_p8_00668.py
          python tools/test_dx11_native_rgba16_00669.py
          python tools/test_dx11_native_float_rgba_00670.py
          python tools/test_dx11_native_frame_batch_00671.py
          python tools/test_dx11_game_scene_readback_00680.py
          python tools/test_dx11_game_device_handoff_00681.py
          python tools/test_dx11_game_output_transition_00682.py
          python tools/test_dx11_game_backbuffer_admission_00683.py
          python tools/test_dx11_same_mode_swapchain_transition_00684.py
          python tools/test_dx11_object_clip_draw_00685.py
          python tools/test_dx11_untextured_draw_00686.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_untextured_game_probe_00686.cpp -o /tmp/dx11_00686 && /tmp/dx11_00686
          python tools/test_dx11_stage1_factor_00673.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_stage1_factor_probe.cpp -o /tmp/dx11_stage1_00673 && /tmp/dx11_stage1_00673
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_rgb332_probe.cpp -o /tmp/dx11_rgb332_00667 && /tmp/dx11_rgb332_00667
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_p8_probe.cpp -o /tmp/dx11_p8_00668 && /tmp/dx11_p8_00668
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_rgba16_probe.cpp -o /tmp/dx11_rgba16_00669 && /tmp/dx11_rgba16_00669
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_float_rgba_probe.cpp -o /tmp/dx11_float_rgba_00670 && /tmp/dx11_float_rgba_00670
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_a8p8_probe.cpp -o /tmp/dx11_a8p8_00665 && /tmp/dx11_a8p8_00665
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_rg16_probe.cpp -o /tmp/dx11_rg16_00664 && /tmp/dx11_rg16_00664
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_extended_luminance_probe.cpp -o /tmp/dx11_luma_00663 && /tmp/dx11_luma_00663
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_10bit_probe.cpp -o /tmp/dx11_10bit_00662 && /tmp/dx11_10bit_00662
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_xrgb16_probe.cpp -o /tmp/dx11_xrgb16_00661 && /tmp/dx11_xrgb16_00661
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_rgba_probe.cpp -o /tmp/dx11_rgba_00660 && /tmp/dx11_rgba_00660
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_rgb24_probe.cpp -o /tmp/dx11_rgb24_00659 && /tmp/dx11_rgb24_00659
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_game_luminance_probe.cpp -o /tmp/dx11_luminance_00658 && /tmp/dx11_luminance_00658
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic tools/dx11_game_cull_probe.cpp -o /tmp/dx11_cull_00649 && /tmp/dx11_cull_00649
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic tools/dx11_game_depth_probe.cpp -o /tmp/dx11_depth_00648 && /tmp/dx11_depth_00648
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic tools/dx11_game_primitive_span_probe.cpp -o /tmp/dx11_primitive_00644 && /tmp/dx11_primitive_00644
      - name: Verify source graph and dormant runtime activation
        run: |
          python tools/verify_dx11_source_graph.py
          python tools/verify_dx11_activation_boundary.py
