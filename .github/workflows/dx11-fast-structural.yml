name: DX11 Fast Structural Checks

on:
  push:
    branches:
      - vr-dx11-native-r71
      - feature/dx11-01045-first-full-colorfill-game-frame
      - feature/dx11-01037-offscreen-postpass-overflow
      - feature/dx11-01013-visible-game-frame
      - feature/dx11-01034-live-predraw-fill-overdraw
      - feature/dx11-00952-live-sm3-device-bool
      - feature/dx11-00966-live-game-frame
      - feature/dx11-00970-live-game-rt-frame
      - feature/dx11-00973-live-cube-rt-game-frame
      - feature/dx11-00974-live-cube-color-frame
      - feature/dx11-00975-live-sm3-volume-frame
    paths:
      - 'src/vr/d3d11/**'
      - 'src/vr/d3d9/stereo_renderer_r30.cpp'
      # Both host compositor entry paths use the same native L/R -> XR copy.
      - 'vrhost/src/main.cpp'
      - 'vrhost/src/main_r23.cpp'
      - 'vrhost/src/runtime/native_direct_stereo_pair.hpp'
      - 'vrhost/tests/native_direct_eye_pair_smoke.cpp'
      - 'tools/dx11_autodev_policy.py'
      # The isolated native stereo game producer is linked from the cmkr
      # manifest, not the generated CMakeLists.txt checked into the tree.
      - 'cmake.toml'
      # Native stereo producer contract repairs must trigger a fresh exact-SHA Fast Gate.
      - 'tools/verify_dx11_native_transport_contract.py'
      - 'tools/test_dx11_*.py'
      # Genuine SM3 shader-control C++ regressions must run Fast at their own exact SHA.
      - 'tools/dx11_sm3_*_probe.cpp'
      - 'tools/dx11_sm3_*_probe_*.cpp'
      - 'tools/dx11_pre_draw_*_probe_*.cpp'
      - 'tools/dx11_native_frame_batch_probe.cpp'
      # The real desktop GPU output restoration probe must trigger exact-SHA Fast.
      - 'tools/dx11_native_desktop_gpu_output_probe.cpp'
      - '.github/workflows/dx11-native-transport-isolated.yml'
      # Source-graph activation verifier revisions also need fresh same-SHA Fast checks.
      - 'tools/verify_dx11_first_game_frame_boundary.py'
      # Native eye Draw activation checker and its source-graph entrypoint
      # must be verified at the exact source+contract repair commit as well.
      - 'tools/verify_dx11_activation_boundary.py'
      - 'tools/verify_dx11_source_graph.py'
      # Stage-1 portable C++ probe changes must re-run the fast exact-SHA gate,
      # not leave the preceding shader result as the last tested revision.
      - 'tools/dx11_game_stage1_*probe*.cpp'
      - 'tools/dx11_live_sm3_packed_model_probe.cpp'
      - 'tools/dx11_live_sm3_multistream_probe.cpp'
      - 'src/vr/d3d11/live_game_sm3_stream_assembly.hpp'
      - 'docs/automation/DX11_AUTODEV_EXECUTION_POLICY.json'
      # Native desktop launch+packaging changes must re-enter exact-SHA Fast gate.
      - 'tools/package_dx11_first_game_frame.py'
      - 'tools/test_package_dx11_first_game_frame.py'
      - 'docs/automation/runs/CONVERSION-DX11-*.json'
      # Backend workflow edits must trigger all exact-SHA validation gates.
      - '.github/workflows/backend-conversion-gate.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/vr-openxr.yml'
      - '.github/workflows/outrun-exe-hud-inspector.yml'
      - '.github/workflows/dx11-fast-structural.yml'
  workflow_dispatch:

concurrency:
  group: dx11-fast-structural-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate DX11 development work allocation
        run: |
          python tools/test_dx11_autodev_policy.py
          python tools/dx11_autodev_policy.py --check-latest
      - name: Run focused DX11 source-only regression checks
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_eye_postpass_coverage_00987.cpp -o /tmp/dx11_eye_coverage_00987 && /tmp/dx11_eye_coverage_00987
          # Source-authored ColorFill -> native stereo GPU fill regression.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_eye_color_fill_01043.cpp -o /tmp/dx11_eye_color_fill_01043 && /tmp/dx11_eye_color_fill_01043
          python tools/test_dx11_live_full_colorfill_seed_01045.py
          # 01046 post-Draw full game ColorFill -> new contiguous native color epoch.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_full_colorfill_resume_01046.cpp -o /tmp/dx11_full_colorfill_resume_01046 && /tmp/dx11_full_colorfill_resume_01046
          python tools/test_dx11_full_colorfill_resume_01046.py
          # 01049 real game pre-Draw source copy feeds SM3/FVF native pixels.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_pre_draw_copy_01049.cpp -o /tmp/dx11_pre_draw_copy_01049 && /tmp/dx11_pre_draw_copy_01049
          # 01050 original LockRect/GetDC before first native Draw and safe completion.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_predraw_cpu_surface_01050.cpp -o /tmp/dx11_predraw_cpu_01050 && /tmp/dx11_predraw_cpu_01050
          # 01051 canonical color continuity through foreign game camera fills.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_predraw_colorfill_01051.cpp -o /tmp/dx11_predraw_colorfill_01051 && /tmp/dx11_predraw_colorfill_01051
          python tools/test_dx11_predraw_colorfill_01051.py
          # 01052 canonical D3D9 pre-Draw CPU/GDI surface on cold start / Reset.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_cold_predraw_01052.cpp -o /tmp/dx11_cold_predraw_01052 && /tmp/dx11_cold_predraw_01052
          python tools/test_dx11_cold_predraw_01052.py
          # 01053 bounded REAL full-backbuffer transfer budget for multiple menu/car/race CPU/GDI copies.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_burst_surface_copy_01053.cpp -o /tmp/dx11_burst_surface_01053 && /tmp/dx11_burst_surface_01053
          python tools/test_dx11_burst_surface_copy_01053.py
          # 01056 actual D3D9 GPU tile-source budget + full fallback safety.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_tile_budget_01056.cpp -o /tmp/dx11_tile_budget_01056 && /tmp/dx11_tile_budget_01056
          python tools/test_dx11_tile_budget_01056.py
          # 01057 partial original LockRect -> cropped GPU tile, GetDC full fallback.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_cpu_tile_admission_01057.cpp -o /tmp/dx11_cpu_tile_01057 && /tmp/dx11_cpu_tile_01057
          python tools/test_dx11_cpu_tile_admission_01057.py
          # 01055: actual source partial post-Draw D3D9 GPU tile readback and whole-frame fallback.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_surface_tile_readback_01055.cpp -o /tmp/dx11_tile_01055 && /tmp/dx11_tile_01055
          python tools/test_dx11_surface_tile_readback_01055.py
          # 01048 authentic color overwrite -> full main Z Clear -> native race Draw.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_depth_epoch_recovery_01048.cpp -o /tmp/dx11_depth_epoch_01048 && /tmp/dx11_depth_epoch_01048
          # 01047 repeated REAL full ColorFill cycles with game Draw/no-op chronology.
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/dx11_native_chained_colorfill_epochs_01047.cpp -o /tmp/dx11_chained_colorfill_01047 && /tmp/dx11_chained_colorfill_01047
          # 01045 original full D3D9 ColorFill -> real game native Draw seed.
