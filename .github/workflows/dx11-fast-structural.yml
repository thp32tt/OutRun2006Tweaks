name: DX11 Fast Structural Checks

on:
  push:
    branches:
      - vr-dx11-native-r71
    paths:
      - 'src/vr/d3d11/**'
      - 'src/vr/d3d9/stereo_renderer_r30.cpp'
      - 'tools/dx11_autodev_policy.py'
      # Native stereo producer contract repairs must trigger a fresh exact-SHA Fast Gate.
      - 'tools/verify_dx11_native_transport_contract.py'
      - 'tools/test_dx11_*.py'
      # Source-graph activation verifier revisions also need fresh same-SHA Fast checks.
      - 'tools/verify_dx11_first_game_frame_boundary.py'
      # Stage-1 portable C++ probe changes must re-run the fast exact-SHA gate,
      # not leave the preceding shader result as the last tested revision.
      - 'tools/dx11_game_stage1_*probe*.cpp'
      - 'docs/automation/DX11_AUTODEV_EXECUTION_POLICY.json'
      - 'docs/automation/runs/CONVERSION-DX11-*.json'
      - '.github/workflows/dx11-fast-structural.yml'
  workflow_dispatch:

concurrency:
  group: dx11-fast-structural-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate DX11 development work allocation
        run: |
          python tools/test_dx11_autodev_policy.py
          python tools/dx11_autodev_policy.py --check-latest
      - name: Run focused DX11 source-only regression checks
        run: |
          python tools/test_dx11_linear_predication_r230.py
          python tools/test_dx11_linear_stream_output_r232.py
          python tools/test_dx11_linear_buffer_owner_r183.py
