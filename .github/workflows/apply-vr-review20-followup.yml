name: Apply VR review20 follow-up

on:
  push:
    branches: [vr-openxr]
    paths:
      - 'tools/apply_vr_review20_followup.py'
      - '.github/workflows/apply-vr-review20-followup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-openxr
          fetch-depth: 0
      - name: Apply follow-up source patch
        run: python3 tools/apply_vr_review20_followup.py
      - name: Validate text changes
        run: |
          git diff --check
          git diff -- src/vr_renderer_probe.cpp src/vr_stereo.cpp
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vr_renderer_probe.cpp src/vr_stereo.cpp
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'vr: refine marker lifetime and lazy depth stencil sync'
            git push origin HEAD:vr-openxr
          fi
