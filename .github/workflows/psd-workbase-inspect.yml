name: Inspect Copied English PSD Workbases
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths:
      - 'localization/graphics/plate_library/upstream_psd/**'
      - '.github/workflows/psd-workbase-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-psd-workbase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psd-tools[composite]' Pillow
      - name: Inspect actual upstream PSD layer trees without approving a plate
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          catalog = json.loads(Path('localization/graphics/plate_library/upstream_psd/UPSTREAM_IMPORT_MANIFEST.json').read_text())
          targets = {'A064FDFC','BF3EE5C6','FD90AA9','BA0147DA','2B0863D6','8C259C68','E95DA5'}
          output = Path('_psd_verified_workbases'); output.mkdir(exist_ok=True)
          for entry in catalog['files']:
              if entry['texture_hash'] not in targets:
                  continue
              path=Path(entry['file'])
              digest=hashlib.file_digest(path.open('rb'),'sha256').hexdigest()
              blob=subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
              if digest != entry['sha256'] or blob != entry['source_blob_sha']:
                  raise ValueError('Pinned PSD failed validation: '+str(path))
              folder=output/entry['texture_hash']
              cmd=['python','tools/localization/psd_layer_workbase.py','inventory',
                   '--psd',str(path),'--psd-sha256',digest,
                   '--upstream-commit',catalog['source_commit'],
                   '--output',str(folder)]
              subprocess.run(cmd,check=True)
              report=json.loads((folder/'psd_layer_inventory.json').read_text())
              assert not report['C2_PLATE_PASS']
              print('VERIFIED_WORKBASE',entry['texture_hash'],'layers',len(report['layers']))
              for layer in report['layers']:
                  nm=layer['name'].lower()
                  if any(k in nm for k in ['text','font','english','title','clean','background','glow','shadow','gold']):
                      print('CANDIDATE_LAYER',entry['texture_hash'],layer['path'],layer['name'],layer['kind'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: psd-verified-layer-inventories
          path: _psd_verified_workbases/
          retention-days: 7
