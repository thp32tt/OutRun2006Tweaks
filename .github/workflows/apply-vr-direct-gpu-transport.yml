name: Apply VR direct GPU transport

on:
  push:
    branches: [vr-openxr]
    paths:
      - 'tools/apply_vr_direct_gpu_transport.py'
      - '.github/workflows/apply-vr-direct-gpu-transport.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-openxr
          fetch-depth: 0
      - run: python3 tools/apply_vr_direct_gpu_transport.py
      - run: git diff --check
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+thp32tt@users.noreply.github.com'
          git add src/vr_shared.hpp src/vr_stereo.cpp vrhost/main_stereo.cpp
          git commit -m 'vr: add direct gpu eye transport'
          git push origin HEAD:vr-openxr
