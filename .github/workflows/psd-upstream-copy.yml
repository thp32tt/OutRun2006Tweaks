name: Import Pinned Upstream PSD Workbases
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths:
      - '.github/workflows/psd-upstream-copy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: psd-source-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  copy-pinned-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve upstream PSD binaries and verify original git SHA
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, urllib.parse, urllib.request
          base = pathlib.Path('localization/graphics/plate_library')
          catalog_path = base / 'PSD_UPSTREAM_FULL_INDEX.json'
          data = json.loads(catalog_path.read_text())
          priority = {
              'A064FDFC', # P0 game banner q060: missing original PSD previously
              'BF3EE5C6', # P0 stage rank q049
              'FD90AA9',  # P0 car selection q121
              'BA0147DA', # Main menu title q212
              '2B0863D6', # Actual 35-layer source q135
              '8C259C68', # Text & help q188
              'E95DA5',   # Showroom choices q230
          }
          selected = []
          for h in sorted(priority):
              choices = [f for f in data['files'] if f['texture_hash'] == h]
              if not choices: raise ValueError('No upstream PSD found for ' + h)
              # Choose a reproducible small source from variants; v01 is still preserved
              # as an actual independent source, not automatically canonical DDS.
              selected.append(sorted(choices, key=lambda f:f['size_bytes'])[0])
          output = []
          for f in selected:
              rel = f['source_path']
              url = ('https://raw.githubusercontent.com/' + data['upstream_repo'] + '/' +
                     data['upstream_commit'] + '/' + urllib.parse.quote(rel, safe='/'))
              target = base / 'upstream_psd' / f['texture_hash'] / pathlib.PurePosixPath(rel).name
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  if subprocess.check_output(['git','hash-object',str(target)],text=True).strip() != f['git_blob_sha']:
                      raise ValueError('Existing PSD diverges, refuse overwrite ' + str(target))
              else:
                  with urllib.request.urlopen(url, timeout=90) as src, target.open('wb') as dst:
                      while True:
                          b=src.read(1024*1024)
                          if not b:break
                          dst.write(b)
              blob_sha = subprocess.check_output(['git','hash-object',str(target)],text=True).strip()
              if blob_sha != f['git_blob_sha'] or target.stat().st_size != f['size_bytes']:
                  raise ValueError('PSD source integrity failure: ' + rel)
              sha = hashlib.file_digest(target.open('rb'),'sha256').hexdigest()
              output.append({'texture_hash':f['texture_hash'],
                             'queue_indexes':f['queue_indexes'],
                             'file':target.as_posix(),
                             'source_path':rel,
                             'source_blob_sha':f['git_blob_sha'],
                             'sha256':sha,
                             'size_bytes':f['size_bytes'],
                             'source':data['upstream_repo'],
                             'source_commit':data['upstream_commit'],
                             'review_state':'EXTERNAL_PSD_UNQUALIFIED',
                             'canonical_dds_match':'NOT_TESTED',
                             'C2_PLATE_PASS':False})
              print('COPIED_AND_GIT_SHA_VERIFIED',f['texture_hash'], f['size_bytes'],sha,target)
          manifest = {
            'schema':'outrun-pinned-psd-import-v1',
            'origin':'Sonic-TV/OR2006Sprites',
            'source_commit':data['upstream_commit'],
            'rights':'No repository-wide LICENSE observed upstream; preserve attribution, review external redistribution terms',
            'files':output,
            'qa_state':'SOURCES_ONLY_NOT_CLEAN_OR_DDS_APPROVAL'
          }
          m=base/'upstream_psd'/'UPSTREAM_IMPORT_MANIFEST.json'
          m.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print('IMPORTED_PSD_COUNT',len(output))
          PY
      - name: Commit source assets on the same branch with optimistic retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/graphics/plate_library/upstream_psd
          if git diff --cached --quiet; then
            echo "Already imported: no duplicate commit"; exit 0
          fi
          git commit -m "assets(localization): vendor seven pinned PSD English workbase sources"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:korean-localization-recovery-20260928; then
              echo "SOURCE_IMPORT_PUSH_VERIFIED attempt=$attempt"
              exit 0
            fi
            git fetch origin korean-localization-recovery-20260928
            git rebase origin/korean-localization-recovery-20260928
            sleep "$attempt"
          done
          echo "Failed to push source PSDs; do not claim remote import success" >&2
          exit 1
