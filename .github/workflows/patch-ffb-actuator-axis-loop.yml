name: Patch FFB actuator axis loop

on:
  push:
    branches: [wheel-ffb-v0.2-dev]
    paths:
      - .github/workflows/patch-ffb-actuator-axis-loop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wheel-ffb-v0.2-dev
          fetch-depth: 0

      - name: Apply review fix
        run: python tools/patch_ffb_all_actuator_axes.py

      - name: Verify source
        run: python tools/verify_wheel_ffb_current.py

      - name: Test FFB math
        run: python tools/verify_wheel_ffb_math.py

      - name: Commit clean source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-ffb-actuator-axis-loop.yml
          git rm tools/patch_ffb_all_actuator_axes.py
          git add src/hooks_wheel_ffb.cpp tools/verify_wheel_ffb_current.py
          git commit -m "fix: probe every reported FFB actuator axis"
          git push origin HEAD:wheel-ffb-v0.2-dev
