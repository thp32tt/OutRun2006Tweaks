name: DX9Ex Small Alpha Matrix12

on:
  workflow_dispatch:
  push:
    branches: [ vr-d3d9ex-small-alpha-matrix12 ]
    paths:
      - 'src/vr/d3d9/**'
      - 'src/vr/game/**'
      - 'vrhost/**'
      - 'cmake.toml'
      - 'tools/Run-DX9Ex-Small12-Test.ps1'
      - 'tools/RUN_DX9EX_SMALL12_TEST.cmd'
      - '.github/workflows/dx9ex-small-alpha-matrix12.yml'

concurrency:
  group: dx9ex-small-alpha-matrix12
  cancel-in-progress: true

jobs:
  host:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build OpenXR host
        shell: pwsh
        run: |
          cmake -S vrhost -B build-host -G "Visual Studio 17 2022" -A x64
          cmake --build build-host --config Release --target outrun-vr-host
          if (-not (Test-Path build-host/bin/outrun-vr-host.exe)) { throw "host missing" }
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build-host/bin/outrun-vr-host.exe stage/outrun-vr-host.exe
          Set-Content stage/HOST_SHA.txt $env:GITHUB_SHA -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: dx9ex-s12-host
          path: stage/
          if-no-files-found: error

  game:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: S0_BASE_STABLE
            l2: OFF
            l4: OFF
            l8: OFF
            l16: OFF
            l32: OFF
            hud: OFF
            common: OFF
            anyz: OFF
            commonEye: OFF
            purpose: "Stable M0 renderer + persistent last-good projection host"
          - variant: S1_ZOFF_HUD_2
            l2: ON
            l4: OFF
            l8: OFF
            l16: OFF
            l32: OFF
            hud: ON
            common: OFF
            anyz: OFF
            commonEye: OFF
            purpose: "Depth-off alpha triangle draw <=2 primitives promoted to PerspectiveHud"
          - variant: S2_ZOFF_HUD_4
            l2: OFF
            l4: ON
            l8: OFF
            l16: OFF
            l32: OFF
            hud: ON
            common: OFF
            anyz: OFF
            commonEye: OFF
            purpose: "Depth-off alpha triangle draw <=4 primitives promoted to PerspectiveHud"
          - variant: S3_ZOFF_HUD_8
            l2: OFF
            l4: OFF
            l8: ON
            l16: OFF
            l32: OFF
            hud: ON
            common: OFF
            anyz: OFF
            commonEye: OFF
            purpose: "Depth-off alpha triangle draw <=8 primitives promoted to PerspectiveHud"
          - variant: S4_ZOFF_HUD_16
            l2: OFF
            l4: OFF
            l8: OFF
            l16: ON
            l32: OFF
            hud: ON
            common: OFF
            anyz: OFF
            commonEye: OFF
            purpose: "Depth-off alpha triangle draw <=16 primitives promoted to PerspectiveHud"
          - variant: S5_ZOFF_HUD_32
            l2: OFF
            l4: OFF
            l8: OFF
            l16: OFF
            l32: ON
            hud: ON
            common: OFF
            anyz: OFF
            commonEye: OFF
            purpose: "Depth-off alpha triangle draw <=32 primitives promoted to PerspectiveHud"
          - variant: S6_ANYZ_MATRIX_4
            l2: OFF
            l4: ON
            l8: OFF
            l16: OFF
            l32: OFF
            hud: OFF
            common: OFF
            anyz: ON
            commonEye: OFF
            purpose: "Alpha <=4 primitives promoted only when live WVP decomposes as flat HUD"
          - variant: S7_ANYZ_MATRIX_8
            l2: OFF
            l4: OFF
            l8: ON
            l16: OFF
            l32: OFF
            hud: OFF
            common: OFF
            anyz: ON
            commonEye: OFF
            purpose: "Alpha <=8 primitives promoted only when live WVP decomposes as flat HUD"
          - variant: S8_ANYZ_MATRIX_16
            l2: OFF
            l4: OFF
            l8: OFF
            l16: ON
            l32: OFF
            hud: OFF
            common: OFF
            anyz: ON
            commonEye: OFF
            purpose: "Alpha <=16 primitives promoted only when live WVP decomposes as flat HUD"
          - variant: S9_ZOFF_COMMON_4
            l2: OFF
            l4: ON
            l8: OFF
            l16: OFF
            l32: OFF
            hud: OFF
            common: ON
            anyz: OFF
            commonEye: ON
            purpose: "Depth-off alpha <=4 primitives routed to common-eye FlatEffectHud for white overlays"
          - variant: S10_ZOFF_COMMON_8
            l2: OFF
            l4: OFF
            l8: ON
            l16: OFF
            l32: OFF
            hud: OFF
            common: ON
            anyz: OFF
            commonEye: ON
            purpose: "Depth-off alpha <=8 primitives routed to common-eye FlatEffectHud for white overlays"
          - variant: S11_ZOFF_COMMON_16
            l2: OFF
            l4: OFF
            l8: OFF
            l16: ON
            l32: OFF
            hud: OFF
            common: ON
            anyz: OFF
            commonEye: ON
            purpose: "Depth-off alpha <=16 primitives routed to common-eye FlatEffectHud for white overlays"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure ${{ matrix.variant }}
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32 `
            -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF `
            -DOUTRUN_VR_R26_HUD_COMPARE=ON `
            -DOUTRUN_VR_OVERLAY_OWNER_FIRST=OFF `
            -DOUTRUN_VR_OVERLAY_LIVE_FIRST=OFF `
            -DOUTRUN_VR_OVERLAY_WINDOW_32=OFF `
            -DOUTRUN_VR_OVERLAY_SPATIAL_DEPTH_4=OFF `
            -DOUTRUN_VR_OVERLAY_SPATIAL_DEPTH_8=OFF `
            -DOUTRUN_VR_R13_FLAT_PREEMPT=OFF `
            -DOUTRUN_VR_R13_FLAT_PREEMPT_BROAD=OFF `
            -DOUTRUN_VR_R13_FLAT_COMMON=${{ matrix.commonEye }} `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_2=${{ matrix.l2 }} `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_4=${{ matrix.l4 }} `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_8=${{ matrix.l8 }} `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_16=${{ matrix.l16 }} `
            -DOUTRUN_VR_SMALL_ALPHA_LIMIT_32=${{ matrix.l32 }} `
            -DOUTRUN_VR_SMALL_ALPHA_HUD=${{ matrix.hud }} `
            -DOUTRUN_VR_SMALL_ALPHA_COMMON=${{ matrix.common }} `
            -DOUTRUN_VR_SMALL_ALPHA_ANYZ_MATRIX=${{ matrix.anyz }}
      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      - name: Build game DLL
        run: cmake --build build-game --config Release --target outrun2006tweaks
      - name: Stage game DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $dll) { throw "dinput8.dll missing" }
          Copy-Item $dll.FullName stage/dinput8.dll
          @(
            "variant=${{ matrix.variant }}"
            "sourceSha=$env:GITHUB_SHA"
            "purpose=${{ matrix.purpose }}"
            "limit2=${{ matrix.l2 }}"
            "limit4=${{ matrix.l4 }}"
            "limit8=${{ matrix.l8 }}"
            "limit16=${{ matrix.l16 }}"
            "limit32=${{ matrix.l32 }}"
            "hud=${{ matrix.hud }}"
            "common=${{ matrix.common }}"
            "anyzMatrix=${{ matrix.anyz }}"
          ) | Set-Content stage/SMALL12_VARIANT.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: dx9ex-s12-${{ matrix.variant }}
          path: stage/
          if-no-files-found: error

  package:
    runs-on: windows-2022
    needs: [host, game]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dx9ex-s12-host
          path: payload/host
      - uses: actions/download-artifact@v4
        with:
          pattern: dx9ex-s12-S*
          path: payload/games
          merge-multiple: false
      - name: Assemble twelve tester ZIPs
        shell: pwsh
        run: |
          $variants = @(
            'S0_BASE_STABLE',
            'S1_ZOFF_HUD_2',
            'S2_ZOFF_HUD_4',
            'S3_ZOFF_HUD_8',
            'S4_ZOFF_HUD_16',
            'S5_ZOFF_HUD_32',
            'S6_ANYZ_MATRIX_4',
            'S7_ANYZ_MATRIX_8',
            'S8_ANYZ_MATRIX_16',
            'S9_ZOFF_COMMON_4',
            'S10_ZOFF_COMMON_8',
            'S11_ZOFF_COMMON_16'
          )
          New-Item -ItemType Directory -Force output | Out-Null
          foreach ($variant in $variants) {
            $dir = Join-Path package $variant
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "payload/games/dx9ex-s12-$variant/dinput8.dll" (Join-Path $dir 'dinput8.dll')
            Copy-Item "payload/games/dx9ex-s12-$variant/SMALL12_VARIANT.txt" (Join-Path $dir 'SMALL12_VARIANT.txt')
            Copy-Item payload/host/outrun-vr-host.exe (Join-Path $dir 'outrun-vr-host.exe')
            Copy-Item tools/Run-DX9Ex-Small12-Test.ps1 (Join-Path $dir 'Run-DX9Ex-Small12-Test.ps1')
            Copy-Item tools/RUN_DX9EX_SMALL12_TEST.cmd (Join-Path $dir 'RUN_DX9EX_SMALL12_TEST.cmd')
            foreach($f in @('d3d9.dll','multiviewpatcher.dll','outrun-vr-host-dx12.exe')){
              if(Test-Path (Join-Path $dir $f)){ throw "Forbidden non-DX9Ex file $f" }
            }
            Get-ChildItem $dir -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
              "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
            } | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
            Compress-Archive -Path (Join-Path $dir '*') -DestinationPath (Join-Path output ("OutRun2_VR_DX9EX_S12_{0}.zip" -f $variant)) -Force
          }
          if((Get-ChildItem output -Filter '*.zip').Count -ne 12){ throw "Expected 12 zips" }
      - uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-DX9EX-SMALL12-${{ github.sha }}
          path: output/*.zip
          if-no-files-found: error
