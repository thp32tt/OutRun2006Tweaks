name: Localization A AUTO 00001 392 Exact BBox Rework
on:
  push:
    branches: [korean-localization-clean]
    paths: ['docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00001.json']
permissions:
  contents: write
concurrency:
  group: localization-a-auto-00001
  cancel-in-progress: false
jobs:
  rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: korean-localization-clean, fetch-depth: 0}
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/localization/a_auto_00001_rework_392.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/graphics/hd_candidates/textures/load/spr_sprani_game_cvt_Exst/39229D64_1024x1024.dds localization/graphics/role_A/20260928-AUTO-A00001 localization/graphics/asset_queue.csv localization/progress/progress.json localization/resume_state.json localization/progress/STATUS.md localization/WORKLOG.md
          git commit -m "localization: A rework 39229D64 [AUTO:LOCALIZATION-LOCALIZATION_A-00001]"
          PROD_SHA="$(git rev-parse HEAD)"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
          python - "$PROD_SHA" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path("docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00001.json"); j=json.loads(p.read_text("utf-8"))
          j["production_commit_sha"]=sys.argv[1]; j["automation_validation"]="PASS"; j["runtime_validation"]="UNTESTED"
          j["summary"]="A index 57 39229D64 automated exact-bbox QA PASS; independent C and isolated DDS_ONLY in-game remain required."
          j["evidence"].append("localization/graphics/role_A/20260928-AUTO-A00001/A_AUTO_00001_39229D64_REPORT.json")
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+"\n","utf-8")
          PY
          git add docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00001.json
          git commit -m "automation: record A result [AUTO:LOCALIZATION-LOCALIZATION_A-00001]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
