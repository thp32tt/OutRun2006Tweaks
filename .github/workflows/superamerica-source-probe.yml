name: Ferrari 575 Superamerica Source Probe

on:
  push:
    branches:
      - vr-quest-cockpit-v2-external-dino-actions-20261116
    paths:
      - '.github/workflows/superamerica-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect current public download pages
        shell: python
        run: |
          import html, re, urllib.request
          pages=[
            'https://assettocorsamods.io/cars/gt/ferrari_superamerica/',
            'https://modslab.net/en/assetto_corsa/mods/4e5D2yBtif/',
          ]
          for url in pages:
              print('\nPAGE',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  body=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
                  print('BYTES',len(body))
                  title=re.search(r'<title>(.*?)</title>',body,re.I|re.S)
                  print('TITLE',re.sub(r'\s+',' ',title.group(1)).strip() if title else '')
                  links=[]
                  for x in re.findall(r'(?:href|action|data-url|data-href)=["\']([^"\']+)["\']',body,re.I):
                      x=html.unescape(x)
                      if any(k in x.lower() for k in ('download','.zip','.rar','.7z','sharemods','modsfire','storage','cdn')):
                          if x not in links: links.append(x)
                  print('LINKS',links[:150])
              except Exception as exc:
                  print('ERROR',repr(exc))
