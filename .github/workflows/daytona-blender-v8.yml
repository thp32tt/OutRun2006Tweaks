name: Daytona v8 Blender source contract
on:
  push:
    branches:
      - feature/daytona365-blender-v8-20261108
  workflow_dispatch:
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Legacy v8.4 source contract
        run: python tools/test_daytona365_v8_source_contract.py
      - name: V8.5 real-model source provenance and geometry contract
        run: python tools/test_daytona365_v8_5_source_contract.py
      - name: V8.6 source geometry, UV and PBR contract (not a Blender render)
        run: python tools/test_daytona365_v8_6_source_contract.py
      - name: V8.7 seat reach, geodesic UV, original source controls and footwell contract
        run: python tools/test_daytona365_v8_7_source_contract.py
      - name: V8.8 PMT console UV and source PBR shader contract (not a render)
        run: python tools/test_daytona365_v8_8_source_contract.py
      - name: V8.9 genuine PMT silhouette headrest, seat pleat, charcoal PBR source contract (not a render)
        run: python tools/test_daytona365_v8_9_source_contract.py
      - name: V8.10 source doors, wheel and packed normal/ORM contract (not a render)
        run: python tools/test_daytona365_v8_10_source_contract.py
      - name: V8.11 PMT-bounded source headrest, conformal piping and packed PBR contract (not a render)
        run: python tools/test_daytona365_v8_11_source_contract.py
      - name: V8.12 original V5 back shell and PMT-bound PBR source contract (not a render)
        run: python tools/test_daytona365_v8_12_source_contract.py
      - name: V8.13 real source cushion pleat geometry, packed tangent normal and UV contract (not a render)
        run: python tools/test_daytona365_v8_13_source_contract.py
      - name: V8.14 genuine PMT-bounded physical H-gate underdeck, packed PBR and metric tangent UV source contract (not a render)
        run: python tools/test_daytona365_v8_14_source_contract.py
      - name: V8.15 PMT017 physical side bolster and rolled front apron, geodesic tangent UV and packed source PBR contract (not a render)
        run: python tools/test_daytona365_v8_15_source_contract.py
      - name: V8.16 PMT017 backrest wing/lumbar physical contours, source PBR and packed tangent normal contract (not a render)
        run: python tools/test_daytona365_v8_16_source_contract.py

      - name: V8.17 physical instrument cowl, packed source dark dash/tangent normals contract (not a render)
        run: python tools/test_daytona365_v8_17_source_contract.py
      - name: V8.18 native source switchbank physically molded side and sill surround, packed PBR tangent normal contract (not a Blender render)
        run: python tools/test_daytona365_v8_18_source_contract.py
