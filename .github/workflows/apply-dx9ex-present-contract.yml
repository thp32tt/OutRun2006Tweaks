name: Apply legacy D3D9 Present contract patch

on:
  push:
    branches: [ vr-openxr ]
    paths:
      - tools/apply_dx9ex_present_contract.py
      - .github/workflows/apply-dx9ex-present-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-openxr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Present contract patch
        shell: pwsh
        run: python tools/apply_dx9ex_present_contract.py
      - name: Remove staging helpers
        shell: pwsh
        run: |
          Remove-Item tools/apply_dx9ex_present_contract.py
          Remove-Item .github/workflows/apply-dx9ex-present-contract.yml
      - name: Commit source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix(vr): emulate legacy D3D9 Present recovery"
          git push origin HEAD:vr-openxr
