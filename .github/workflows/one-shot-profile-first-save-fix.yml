name: One-shot first-save profile fix

on:
  push:
    branches: [ wheel-ffb-v0.3-compat ]
    paths:
      - '.github/workflows/one-shot-profile-first-save-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Apply first-save fix
        shell: pwsh
        run: python tools/apply_profile_missing_fix.py

      - name: Verify consolidated wheel FFB source
        shell: pwsh
        run: python tools/verify_wheel_ffb_current.py

      - name: Test Windows missing-file semantics
        shell: pwsh
        run: |
          @'
          #include <filesystem>
          #include <system_error>
          #include <iostream>
          int main() {
              namespace fs = std::filesystem;
              auto root = fs::temp_directory_path() / "outrun_ffb_first_save_test";
              std::error_code ec;
              fs::remove_all(root, ec);
              fs::create_directories(root, ec);
              if (ec) return 10;
              auto path = root / "new-profile.ini";
              bool exists = fs::is_regular_file(path, ec);
              if (ec == std::errc::no_such_file_or_directory) {
                  ec.clear();
                  exists = false;
              }
              if (ec || exists) {
                  std::cerr << "missing destination was not accepted as normal first-save state\n";
                  return 11;
              }
              auto backup = path;
              backup += ".bak";
              bool backupExists = fs::is_regular_file(backup, ec);
              if (ec == std::errc::no_such_file_or_directory) {
                  ec.clear();
                  backupExists = false;
              }
              if (ec || backupExists) {
                  std::cerr << "missing backup was not accepted as normal first-save state\n";
                  return 12;
              }
              fs::remove_all(root, ec);
              return 0;
          }
          '@ | Set-Content -Encoding utf8 first_save_fs_test.cpp
          cmd /c 'call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat" && cl /nologo /EHsc /std:c++17 first_save_fs_test.cpp /Fe:first_save_fs_test.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\first_save_fs_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test production wheel FFB math
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat" || exit /b 1
          python tools/verify_wheel_ffb_math.py

      - name: Configure
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A Win32 ..

      - name: Add older VC2022 redist workaround to safetyhook
        shell: pwsh
        run: |
          (Get-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/zycore/Zycore.vcxproj

      - name: Zero out SDL_gameinputjoystick.c
        shell: pwsh
        run: |
          Set-Content -Path build/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build
        run: cmake --build build --config Release

      - name: Verify built DLL
        shell: pwsh
        run: |
          $dllPath = 'build/bin/dinput8.dll'
          if (-not (Test-Path $dllPath)) { throw 'dinput8.dll was not produced' }
          $bytes = [System.IO.File]::ReadAllBytes($dllPath)
          if ($bytes.Length -lt 1000000) { throw 'dinput8.dll is unexpectedly small' }
          Get-FileHash $dllPath -Algorithm SHA256

      - name: Commit tested fix and remove helpers
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wheel_profile_store.hpp tools/verify_wheel_ffb_current.py
          git rm tools/apply_profile_missing_fix.py .github/workflows/one-shot-profile-first-save-fix.yml
          git commit -m 'fix: allow first-time FFB profile creation on Windows [v03-compat]'
          git push origin HEAD:wheel-ffb-v0.3-compat
