name: OutRun HD Cleanplate-First Repair and GPT Atlas Queue
run-name: HD cleanplate ${{ inputs.asset_sha || 'scheduled' }}
on:
  workflow_dispatch:
    inputs:
      asset_sha:
        description: Exact source asset commit (optional)
        required: false
        type: string
  push:
    branches: [master]
    paths: [".github/workflows/outrun-hd-cleanplate-repair.yml"]
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
  actions: read
concurrency:
  group: outrun-hd-cleanplate-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current HD originals, candidate art and repair code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.asset_sha || 'korean-localization-recovery-20260928' }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/localization
            localization/automation_inputs/candidate_outputs
            localization/automation_inputs/qa_rework/approved
            localization/automation_inputs/native_source_owner_canary
            localization/automation_inputs/hd_original_png_source_plan.json
            localization/graphics/hd_source/OR2-HD-GUI-v0.25.10a/textures/load
            localization/test_packages/ab_preparation_20261102/ab_roi_crosswalk.csv
      - id: asset
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deduplicate source generation or consume completed GPT feedback
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/localization/hd_cleanplate_repair_control.py prepare --asset-sha "${{ steps.asset.outputs.sha }}" --out "$RUNNER_TEMP/feedback.json"
      - name: Install Pillow and verify native ink size / transparent candidate gates
        if: steps.preflight.outputs.action == 'build'
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python -m unittest discover -s tools/localization -p test_hd_cleanplate_repair.py -v
      - name: Independently restore and compose all 104 source atlases; never wipe broad ROI
        if: steps.preflight.outputs.action == 'build'
        run: |
          python tools/localization/hd_cleanplate_repair.py --repo-root . --out "$RUNNER_TEMP/cleanplate" --asset-sha "${{ steps.asset.outputs.sha }}" --feedback "$RUNNER_TEMP/feedback.json"
      - name: Upload repaired DDS partial test patch and full per-ROI repair ledger
        if: steps.preflight.outputs.action == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: outrun-hd-cleanplate-repair-dds-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanplate/build/
          retention-days: 21
          if-no-files-found: error
      - name: Upload only compact original / CLEAN / final PNG evidence for Docker GPT
        if: steps.preflight.outputs.action == 'build'
        id: vision
        uses: actions/upload-artifact@v4
        with:
          name: outrun-hd-cleanplate-vision-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanplate/vision/
          retention-days: 21
          if-no-files-found: error
      - name: Publish exact manifest SHA and visual artifact pointer to existing QA branch
        if: steps.preflight.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/localization/hd_cleanplate_repair_control.py publish --asset-sha "${{ steps.asset.outputs.sha }}" --run-id "${{ github.run_id }}" --artifact-id "${{ steps.vision.outputs.artifact-id }}" --generation "${{ steps.preflight.outputs.generation }}" --manifest "$RUNNER_TEMP/cleanplate/vision/manifest.json"
