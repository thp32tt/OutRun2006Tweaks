name: VR Refactor Build Gate

on:
  pull_request:
    branches: [ vr-d3d9ex-focus ]
  workflow_dispatch:

jobs:
  r34-r33-split:
    if: github.head_ref == 'vr-refactor-r84-2000c-20261001' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Verify refactor contracts
        shell: pwsh
        run: python tools/verify_vr_refactor_contract.py

      - name: Configure R34/R33 split
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          mkdir build-refactor
          cd build-refactor
          cmake -G "Visual Studio 17 2022" -A Win32 -DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF -DOUTRUN_VR_R26_HUD_COMPARE=OFF -DOUTRUN_VR_C1_COMPARE=OFF -DOUTRUN_VR_C2_COMPARE=OFF -DOUTRUN_VR_REFACTOR_SPLIT_R34_R33=ON ..

      - name: Build split graph
        run: cmake --build build-refactor --config Release
