name: ShareMods Enzo Download Probe

on:
  push:
    branches:
      - vr-quest-cockpit-v2-external-dino-actions-20261116
    paths:
      - '.github/workflows/sharemods-enzo-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe public ShareMods flow without downloading payload
        shell: python
        run: |
          import html, re, urllib.request
          from urllib.parse import urljoin
          url='https://sharemods.com/hda9x41jamwi/bg_ferrari_enzo.rar.html'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          body=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          print('PAGE_BYTES',len(body))
          print('TITLE',re.search(r'<title>(.*?)</title>',body,re.I|re.S).group(1).strip())
          for m in re.finditer(r'<form\b[^>]*>.*?</form>',body,re.I|re.S):
              form=m.group(0)
              print('FORM',re.sub(r'\s+',' ',form)[:4000])
          for pat in [r'href=["\']([^"\']+)["\']',r'action=["\']([^"\']+)["\']',r'url\s*[:=]\s*["\']([^"\']+)["\']']:
              vals=[]
              for x in re.findall(pat,body,re.I):
                  x=html.unescape(x)
                  if any(k in x.lower() for k in ('download','dl/','file','storage','cdn','modsfire')):
                      if x not in vals: vals.append(x)
              print('LINKS',vals[:100])
