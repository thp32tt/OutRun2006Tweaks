name: VR GitHub General Test Build

on:
  push:
    branches: [ vr-d3d9ex-focus, vr-quest-cockpit-v2, 'vr-quest-cockpit-v2-*' ]
    paths:
      - '.github/workflows/vr-github-general-build.yml'
      - 'src/hooks_graphics.cpp'
      - 'src/vr/game/quest_cockpit_v2_runtime.hpp'
      - 'src/vr/game/quest_cockpit_v2_native_frame.hpp'
      - 'src/vr/game/quest_cockpit_v2_glass_hook.hpp'
      - 'tools/tests/quest_cockpit_v2_glass_hook_smoke.cpp'
      - 'src/vr/game/quest_cockpit_v2_seat.hpp'
      - 'src/vr/game/quest_cockpit_v2_apk_xr_pose.hpp'
      - 'src/vr/game/quest_cockpit_v2_occupant.hpp'
      - 'src/vr/game/quest_cockpit_v2_visibility.hpp'
      - 'RUN-QUEST-COCKPIT-V2-LOD0.cmd'
      - 'RUN-QUEST-COCKPIT-V2-DIAG.cmd'
      - 'RUN-QUEST-COCKPIT-V2-SKY-DIAG.cmd'
      - 'RUN-QUEST-COCKPIT-V2-INTERP-OFF.cmd'
      - 'src/vr/d3d9/stereo_renderer_r7.inc'
      - 'src/vr/d3d9/direct_gpu_hold_policy.hpp'
      - 'tools/tests/direct_gpu_hold_smoke.cpp'
      - 'src/vr/d3d9/ex_device_upgrade.cpp'
      - 'Run-QuestCockpitV2-CrashDiag.ps1'
      - 'tools/tests/quest_cockpit_v2_occupant_smoke.cpp'
      - 'tools/tests/quest_cockpit_v2_seat_smoke.cpp'
      - 'RUN-QUEST-COCKPIT-V2.cmd'
      - 'RUN-QUEST-APK-COCKPIT.cmd'
      - 'RUN-QUEST-APK-SKY-DIAG.cmd'
      - 'RUN-QUEST-APK-TURN-DIAG.cmd'
      - 'RUN-QUEST-APK-INTERP-OFF.cmd'
      - 'RESTORE-QUEST-APK-COCKPIT.cmd'
      - 'QuestCockpit-CopyRun.ps1'
      - 'QuestCockpit-CopyRestore.ps1'
      - 'QUEST-APK-COPYRUN-README.txt'
      - 'QUEST-COCKPIT-V2-START-HERE.txt'
      - 'RUN-QUEST-COCKPIT-V2-F0.cmd'
      - 'tools/tests/quest_cockpit_v2_native_frame_smoke.cpp'
      - 'tools/tests/quest_cockpit_v2_runtime_smoke.cpp'
      - 'src/hooks_uiscaling.cpp'
      - 'src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp'
      - 'src/vr/d3d9/stereo_renderer_r33.cpp'
      - 'src/vr/game/outrun_renderer.cpp'
      - 'src/vr/game/render_semantics.hpp'
      - 'src/vr/game/sprite_queue_tail_proof.hpp'
      - 'src/vr/game/rank_marker_physical_source.hpp'
      - 'src/vr/settings.cpp'
      - 'OutRun2006Tweaks.ini'
      - 'tools/quest_cockpit_glass.py'
      - 'tools/tests/test_quest_cockpit_glass.py'
      - 'QuestCockpitV2-GlassControl.ps1'
      - 'RUN-QUEST-COCKPIT-V2-GLASS.cmd'
      - 'tools/Run-FocusOfficialTest.ps1'
      - 'tools/Run-OutRunVRTest.ps1'
      - 'tools/OutRunVR-TestProfiles.ps1'
      - 'tools/Select-OutRunVRBackend.ps1'
      - 'tools/Collect-OutRunVRLogs.ps1'
      - 'tools/Collect-OutRunVRLogs.cmd'
      - 'tools/Analyze-OutRunVRSession.ps1'
      - 'tools/analyze_outrun_assets.py'
      - 'tools/verify_vr_rival_known_good_restore.py'
      - 'tools/verify_vr_r26_result_hud_pose.py'
      - 'vrhost/**'
      - 'CMakeLists.txt'
      - 'cmake.toml'

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Mark build pending
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body=@{
            state='pending'
            context='vr-github-general-build'
            description='GitHub-hosted clean R26+HUD build running'
            target_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers @{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          } -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Body $body -ContentType 'application/json'

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          fetch-depth: 1

      - name: Validate cockpit diagnostics PowerShell syntax
        if: ${{ github.ref_name == 'vr-quest-cockpit-v2' || startsWith(github.ref_name, 'vr-quest-cockpit-v2-') }}
        shell: pwsh
        run: |
          foreach($file in @(
            'tools/Run-OutRunVRTest.ps1',
            'tools/Select-OutRunVRBackend.ps1',
            'tools/OutRunVR-TestProfiles.ps1',
            'tools/Collect-OutRunVRLogs.ps1',
            'tools/Analyze-OutRunVRSession.ps1',
            'Run-QuestCockpitV2-CrashDiag.ps1',
            'QuestCockpitV2-GlassControl.ps1',
            'QuestCockpit-CopyRun.ps1',
            'QuestCockpit-CopyRestore.ps1')) {
            $tokens=$null
            $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $file),[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count -gt 0) {
              throw "$file parse failure: $(($parseErrors | ForEach-Object Message) -join '; ')"
            }
          }
          Write-Host 'Cockpit test script syntax PASS'

      - name: Validate packaged helpers with Windows PowerShell 5.1
        if: ${{ github.ref_name == 'vr-quest-cockpit-v2' || startsWith(github.ref_name, 'vr-quest-cockpit-v2-') }}
        shell: pwsh
        run: |
          $validator=Join-Path $env:RUNNER_TEMP 'validate-copyrun-ps51.ps1'
          @'
          param([Parameter(Mandatory=$true)][string]$Target)
          $tokens=$null
          $parseErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $Target,[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count -gt 0){
            throw (([IO.Path]::GetFileName($Target))+': '+(($parseErrors|ForEach-Object Message)-join '; '))
          }
          '@ | Set-Content -LiteralPath $validator -Encoding ascii
          $windowsPs=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          foreach($file in @(
            'tools/Run-OutRunVRTest.ps1',
            'tools/Select-OutRunVRBackend.ps1',
            'tools/OutRunVR-TestProfiles.ps1',
            'tools/Collect-OutRunVRLogs.ps1',
            'tools/Analyze-OutRunVRSession.ps1',
            'Run-QuestCockpitV2-CrashDiag.ps1',
            'QuestCockpit-CopyRun.ps1',
            'QuestCockpit-CopyRestore.ps1')){
            $target=(Resolve-Path -LiteralPath $file).Path
            & $windowsPs -NoProfile -ExecutionPolicy Bypass -File $validator -Target $target
            if($LASTEXITCODE -ne 0){throw "Windows PowerShell 5.1 parse failed: $file"}
          }
          python -m py_compile tools/analyze_outrun_assets.py
          if($LASTEXITCODE -ne 0){throw 'analyze_outrun_assets.py syntax failed'}
          Write-Host 'Packaged helper Windows PowerShell 5.1/Python syntax PASS'

      - name: Validate copy-run CMD control flow
        if: ${{ github.ref_name == 'vr-quest-cockpit-v2' || startsWith(github.ref_name, 'vr-quest-cockpit-v2-') }}
        shell: pwsh
        run: |
          $expected=[ordered]@{
            'RUN-QUEST-APK-COCKPIT.cmd'='NORMAL'
            'RUN-QUEST-APK-SKY-DIAG.cmd'='SKY'
            'RUN-QUEST-APK-TURN-DIAG.cmd'='TURN'
            'RUN-QUEST-APK-INTERP-OFF.cmd'='INTERP'
          }
          foreach($pair in $expected.GetEnumerator()){
            $text=Get-Content -LiteralPath $pair.Key -Raw
            if($text -notmatch 'setlocal EnableExtensions DisableDelayedExpansion'){throw "$($pair.Key): delayed expansion guard missing"}
            $labels=@([regex]::Matches($text,'(?m)^:([A-Za-z0-9_]+)')|ForEach-Object{$_.Groups[1].Value.ToLowerInvariant()})
            $targets=@([regex]::Matches($text,'(?i)\bgoto\s+:([A-Za-z0-9_]+)')|ForEach-Object{$_.Groups[1].Value.ToLowerInvariant()})
            foreach($target in $targets){if($target -notin $labels){throw "$($pair.Key): goto target missing: $target"}}
            foreach($required in @('verify','bad_root','no_powershell','missing_launcher','missing_payload','missing_restore','missing_game')){
              if($required -notin $labels){throw "$($pair.Key): required label missing: $required"}
            }
            if($text -notmatch ('-Mode\s+'+[regex]::Escape($pair.Value))){throw "$($pair.Key): expected mode $($pair.Value) missing"}
            if($text -notmatch 'exit /b 96'){throw "$($pair.Key): missing restore exit 96 guard"}
          }
          $restore=Get-Content -LiteralPath 'RESTORE-QUEST-APK-COCKPIT.cmd' -Raw
          $restoreLabels=@([regex]::Matches($restore,'(?m)^:([A-Za-z0-9_]+)')|ForEach-Object{$_.Groups[1].Value.ToLowerInvariant()})
          $restoreTargets=@([regex]::Matches($restore,'(?i)\bgoto\s+:([A-Za-z0-9_]+)')|ForEach-Object{$_.Groups[1].Value.ToLowerInvariant()})
          foreach($target in $restoreTargets){if($target -notin $restoreLabels){throw "RESTORE CMD goto target missing: $target"}}
          Write-Host 'COPY-RUN CMD control-flow static PASS'

      - name: Verify cockpit glass brightness regression
        if: ${{ github.ref_name == 'vr-quest-cockpit-v2' || startsWith(github.ref_name, 'vr-quest-cockpit-v2-') }}
        shell: pwsh
        run: |
          python -m unittest discover -s tools/tests -p test_quest_cockpit_glass.py -v
          if($LASTEXITCODE -ne 0){throw 'cockpit glass brightness test failed'}
      - name: Verify rival known-good source contract
        shell: pwsh
        run: |
          python tools/verify_vr_rival_known_good_restore.py
          if($LASTEXITCODE -ne 0){throw 'rival known-good verifier failed'}

      - name: Configure clean R26+HUD Win32 game
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          $flags=@(
            '-DOUTRUN_VR_SAFE_DRAW_COMPARE=OFF',
            '-DOUTRUN_VR_R26_HUD_COMPARE=ON',
            '-DOUTRUN_VR_C1_COMPARE=OFF',
            '-DOUTRUN_VR_C2_COMPARE=OFF',
            '-DOUTRUN_VR_REFACTOR_SPLIT_R33_R32=OFF',
            '-DOUTRUN_VR_REFACTOR_SPLIT_R32_R31=OFF',
            '-DOUTRUN_VR_REFACTOR_SPLIT_R31_R30=OFF',
            '-DOUTRUN_VR_REFACTOR_SPLIT_R30_R29=OFF'
          )
          cmake -S . -B build-general/game -G "Visual Studio 17 2022" -A Win32 @flags
          if($LASTEXITCODE -ne 0){throw 'game configure failed'}
          foreach($p in @(
            'build-general/game/_deps/safetyhook-build/src/safetyhook.vcxproj',
            'build-general/game/_deps/zydis-build/Zydis.vcxproj',
            'build-general/game/_deps/zydis-build/zycore/Zycore.vcxproj')) {
            if(!(Test-Path $p)){throw "missing dependency project $p"}
            $t=Get-Content $p -Raw
            if($t -notmatch '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR'){
              $t=$t -replace 'ZYCORE_STATIC_BUILD','_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD'
              Set-Content $p $t
            }
          }
          $sdl=@(
            'build-general/game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.cpp',
            'build-general/game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c'
          ) | Where-Object {Test-Path $_} | Select-Object -First 1
          if(!$sdl){throw 'SDL GameInput source missing'}
          Set-Content $sdl ''
          $cfg='build-general/game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h'
          (Get-Content $cfg -Raw) -replace '#define SDL_JOYSTICK_GAMEINPUT 1','/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content $cfg

      - name: Build Win32 game DLL
        shell: pwsh
        run: |
          cmake --build build-general/game --config Release --target outrun2006tweaks --parallel 4
          if($LASTEXITCODE -ne 0){throw 'game build failed'}

      - name: Configure and build x64 OpenXR host
        shell: pwsh
        run: |
          cmake -S vrhost -B build-general/host -G "Visual Studio 17 2022" -A x64
          if($LASTEXITCODE -ne 0){throw 'host configure failed'}
          cmake --build build-general/host --config Release --target outrun-vr-host --parallel 4
          if($LASTEXITCODE -ne 0){throw 'host build failed'}

      - name: Package test ZIP
        shell: pwsh
        run: |
          $pkg='build-general/package'
          $backend=Join-Path $pkg 'backends/d3d9'
          New-Item -ItemType Directory -Force $backend | Out-Null
          $dlls=@(Get-ChildItem build-general/game -Recurse -File -Filter dinput8.dll | Where-Object {$_.FullName -match '\\bin\\'})
          if($dlls.Count -ne 1){throw "expected one dinput8.dll, found $($dlls.Count)"}
          $dll=$dlls[0]
          $bytes=[IO.File]::ReadAllBytes($dll.FullName)
          if($bytes.Length -lt 1000000 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a){throw 'invalid game DLL'}
          $ascii=[Text.Encoding]::ASCII.GetString($bytes)
          if(!$ascii.Contains('VR R26+HUD SAFE TEST:')){throw 'R26+HUD marker missing'}
          $hostExe='build-general/host/bin/outrun-vr-host.exe'
          if(!(Test-Path $hostExe)){throw 'OpenXR host missing'}
          Copy-Item $dll.FullName (Join-Path $backend 'dinput8.dll')
          Copy-Item $hostExe (Join-Path $backend 'outrun-vr-host.exe')
          Copy-Item OutRun2006Tweaks.ini $pkg
          Copy-Item OutRun2006Tweaks.lods.ini $pkg
          foreach($f in @(
            'OutRunVR-TestProfiles.ps1','Select-OutRunVRBackend.ps1',
            'Run-OutRunVRTest.ps1','Run-OutRunVRTest.cmd',
            'Collect-OutRunVRLogs.ps1','Collect-OutRunVRLogs.cmd',
            'Analyze-OutRunVRSession.ps1',
            'OutRunVR-Backend-Selector.ps1','OutRunVR-Backend-Selector.cmd',
            'OutRunVR-Slot-Selector.ps1','OutRunVR-Slot-Selector.cmd',
            'analyze_outrun_assets.py')) {
            if(Test-Path "tools/$f"){Copy-Item "tools/$f" $pkg}
          }
          if($env:GITHUB_REF_NAME -eq 'vr-quest-cockpit-v2' -or $env:GITHUB_REF_NAME -like 'vr-quest-cockpit-v2-*') {
            foreach($item in @('RUN-QUEST-COCKPIT-V2.cmd','RUN-QUEST-COCKPIT-V2-F0.cmd','RUN-QUEST-COCKPIT-V2-LOD0.cmd','RUN-QUEST-COCKPIT-V2-DIAG.cmd','RUN-QUEST-COCKPIT-V2-SKY-DIAG.cmd','RUN-QUEST-COCKPIT-V2-INTERP-OFF.cmd','Run-QuestCockpitV2-CrashDiag.ps1','QUEST-COCKPIT-V2-START-HERE.txt')) {
              if(!(Test-Path $item)){throw "missing Quest cockpit launcher: $item"}
              Copy-Item $item $pkg
            }
            foreach($item in @(
              'RUN-QUEST-APK-COCKPIT.cmd',
              'RUN-QUEST-APK-SKY-DIAG.cmd',
              'RUN-QUEST-APK-TURN-DIAG.cmd',
              'RUN-QUEST-APK-INTERP-OFF.cmd',
              'RESTORE-QUEST-APK-COCKPIT.cmd',
              'QuestCockpit-CopyRun.ps1',
              'QuestCockpit-CopyRestore.ps1',
              'QUEST-APK-COPYRUN-README.txt')) {
              if(!(Test-Path $item)){throw "missing copy-run entrypoint: $item"}
              Copy-Item $item $pkg
            }
            # The superseded PMT file editor stays source-only. Packaged
            # cockpit glass controls are now F11 live hooks, never disk edits.
          }
          $env:GITHUB_SHA | Set-Content (Join-Path $backend 'SOURCE_SHA.txt') -Encoding ascii
          'ACTIVE_R26_R43_R44' | Set-Content (Join-Path $backend 'VARIANT_ID.txt') -Encoding ascii
          if($env:GITHUB_REF_NAME -eq 'vr-quest-cockpit-v2' -or $env:GITHUB_REF_NAME -like 'vr-quest-cockpit-v2-*') {
            # Self-contained copy-run payload: extraction touches NONE of the
            # user's existing root DLL/host/INI/renderer files. The launcher
            # validates hashes and backs originals up before selection.
            $copy=Join-Path $pkg 'QUEST_APK_COPYRUN_PAYLOAD'
            $copyBackend=Join-Path $copy 'backend'
            $copyScripts=Join-Path $copy 'scripts'
            $copyDefaults=Join-Path $copy 'defaults'
            foreach($dir in @($copyBackend,$copyScripts,$copyDefaults)) {
              New-Item -ItemType Directory -Force $dir|Out-Null
            }
            foreach($name in @('dinput8.dll','outrun-vr-host.exe',
                                'SOURCE_SHA.txt','VARIANT_ID.txt')) {
              Copy-Item (Join-Path $backend $name) $copyBackend -Force
            }
            $env:GITHUB_SHA | Set-Content (Join-Path $copyBackend 'HOST_BUILD_SOURCE_SHA.txt') -Encoding ascii
            foreach($name in @('OutRun2006Tweaks.ini','OutRun2006Tweaks.lods.ini')){
              Copy-Item (Join-Path $pkg $name) $copyDefaults -Force
            }
            foreach($name in @('Run-OutRunVRTest.ps1','Select-OutRunVRBackend.ps1',
                                'OutRunVR-TestProfiles.ps1','Collect-OutRunVRLogs.ps1',
                                'Collect-OutRunVRLogs.cmd','Analyze-OutRunVRSession.ps1',
                                'Run-QuestCockpitV2-CrashDiag.ps1','analyze_outrun_assets.py')){
              $input=Join-Path $pkg $name
              if(!(Test-Path $input)){throw "missing copy-run helper $name"}
              Copy-Item $input $copyScripts -Force
            }
            $manifest=[ordered]@{
              SourceSha=$env:GITHUB_SHA
              VariantId='ACTIVE_R26_R43_R44'
              GameDllSha256=(Get-FileHash (Join-Path $copyBackend 'dinput8.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
              HostExeSha256=(Get-FileHash (Join-Path $copyBackend 'outrun-vr-host.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            $manifest|ConvertTo-Json|Set-Content (Join-Path $copy 'IDENTITY.json') -Encoding ascii
            & (Join-Path (Resolve-Path $pkg) 'QuestCockpit-CopyRun.ps1') -VerifyOnly
            if(-not $?){throw 'copy-run payload integrity verification failed'}

            # Exercise the actual user-facing CMD entrypoints under cmd.exe.
            # VERIFY never needs OR2006C2C.EXE and never changes game files.
            # This catches quoting, %~dp0 path resolution, -File routing,
            # payload discovery and accidental positional-argument regressions.
            Push-Location $pkg
            try {
              foreach($cmd in @(
                'RUN-QUEST-APK-COCKPIT.cmd',
                'RUN-QUEST-APK-SKY-DIAG.cmd',
                'RUN-QUEST-APK-TURN-DIAG.cmd',
                'RUN-QUEST-APK-INTERP-OFF.cmd',
                'RESTORE-QUEST-APK-COCKPIT.cmd')) {
                & $env:ComSpec /d /v:on /c ('"' + $cmd + '" VERIFY')
                if($LASTEXITCODE -ne 0){
                  throw "copy-run CMD verification failed: $cmd exit=$LASTEXITCODE"
                }
              }
            } finally { Pop-Location }
          }
          'GITHUB_HOSTED_GENERAL_CLEAN' | Set-Content (Join-Path $pkg 'BUILD_CLASS.txt') -Encoding ascii
          $zip="build-general/OutRun2_VR_GITHUB_GENERAL_$env:GITHUB_SHA.zip"
          Compress-Archive -Path "$pkg/*" -DestinationPath $zip -Force
          "GENERAL_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          if($env:GITHUB_REF_NAME -eq 'vr-quest-cockpit-v2' -or $env:GITHUB_REF_NAME -like 'vr-quest-cockpit-v2-*') {
            # This is the ONLY zip intended for "copy into existing game
            # folder and double-click". The general build above includes
            # top-level INI/helpers; never call that a no-overwrite install.
            $thin='build-general/cockpit-copyrun'
            New-Item -ItemType Directory -Force $thin | Out-Null
            $entrypoints=@(
              'RUN-QUEST-APK-COCKPIT.cmd',
              'RUN-QUEST-APK-SKY-DIAG.cmd',
              'RUN-QUEST-APK-INTERP-OFF.cmd',
              'RESTORE-QUEST-APK-COCKPIT.cmd',
              'QuestCockpit-CopyRun.ps1',
              'QuestCockpit-CopyRestore.ps1',
              'QUEST-APK-COPYRUN-README.txt'
            )
            foreach($entry in $entrypoints) {
              Copy-Item -LiteralPath (Join-Path $pkg $entry) -Destination $thin -Force
            }
            Copy-Item -LiteralPath (Join-Path $pkg 'QUEST_APK_COPYRUN_PAYLOAD') -Destination $thin -Recurse
            $allow=@($entrypoints) + @('QUEST_APK_COPYRUN_PAYLOAD')
            $actual=@(Get-ChildItem -LiteralPath $thin | ForEach-Object {$_.Name})
            if(@(Compare-Object -ReferenceObject $allow -DifferenceObject $actual).Count -ne 0){
              throw 'Unexpected file in copy-run ZIP staging root'
            }
            # Copy-run must not replace existing root DLLs, DXVK, config,
            # user.ini, game EXE or art merely by ZIP extraction.
            foreach($unsafe in @('dinput8.dll','d3d9.dll','outrun-vr-host.exe',
                'OutRun2006Tweaks.ini','OutRun2006Tweaks.user.ini',
                'OutRun2006Tweaks.lods.ini','OR2006C2C.EXE',
                'Start-OutRun.cmd','ACTIVE_VR_BACKEND.txt')) {
              if(Test-Path -LiteralPath (Join-Path $thin $unsafe)){
                throw "Unsafe root file in cockpit-only ZIP: $unsafe"
              }
            }
            $copyRunZip="build-general/OutRun2_QuestCockpitV2_COPY_RUN_$env:GITHUB_SHA.zip"
            Compress-Archive -Path "$thin/*" -DestinationPath $copyRunZip -Force
            Add-Type -AssemblyName System.IO.Compression
            $archive=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $copyRunZip).Path)
            try {
              $names=@($archive.Entries | ForEach-Object {$_.FullName.Replace('\','/')})
              foreach($entry in $entrypoints) {
                if($entry -notin $names){throw "Copy-run ZIP missing entrypoint: $entry"}
              }
              if('QUEST_APK_COPYRUN_PAYLOAD/IDENTITY.json' -notin $names){
                throw 'Copy-run ZIP missing payload identity'
              }
              foreach($name in $names) {
                if($name -match '(^|/)\.\.(/|$)' -or $name.StartsWith('/')){
                  throw "Unsafe archive path: $name"
                }
              }
            } finally { $archive.Dispose() }

            # Verify the exact thin staging directory that upload-artifact
            # publishes. Duplicate it into a path containing spaces so
            # %~dp0 and quoted -File paths match real user installs.
            $thinFull=(Resolve-Path $thin).Path
            $cmdProbe=Join-Path (Resolve-Path 'build-general').Path 'copy run CMD probe ! & (spaces)'
            if(Test-Path -LiteralPath $cmdProbe){Remove-Item -LiteralPath $cmdProbe -Recurse -Force}
            New-Item -ItemType Directory -Force -Path $cmdProbe | Out-Null
            Copy-Item -Path (Join-Path $thinFull '*') -Destination $cmdProbe -Recurse -Force
            Push-Location $cmdProbe
            try {
              foreach($cmd in @(
                'RUN-QUEST-APK-COCKPIT.cmd',
                'RUN-QUEST-APK-SKY-DIAG.cmd',
                'RUN-QUEST-APK-TURN-DIAG.cmd',
                'RUN-QUEST-APK-INTERP-OFF.cmd',
                'RESTORE-QUEST-APK-COCKPIT.cmd')) {
                & $env:ComSpec /d /v:on /c ('"' + $cmd + '" VERIFY')
                if($LASTEXITCODE -ne 0){throw "thin COPY-RUN CMD verification failed: $cmd exit=$LASTEXITCODE"}
              }

              # Fault injection: missing top-level launcher/payload files must
              # fail with the explicit CMD guards, not an opaque PowerShell
              # '-File does not exist' error.
              Remove-Item -LiteralPath 'QuestCockpit-CopyRun.ps1' -Force
              & $env:ComSpec /d /v:on /c '"RUN-QUEST-APK-COCKPIT.cmd" VERIFY'
              $probeExit=$LASTEXITCODE
              if($probeExit -ne 92){throw "missing-launcher guard returned $probeExit instead of 92"}
              $global:LASTEXITCODE=0
              Copy-Item -LiteralPath (Join-Path $thinFull 'QuestCockpit-CopyRun.ps1') -Destination . -Force

              Remove-Item -LiteralPath 'QUEST_APK_COPYRUN_PAYLOAD\IDENTITY.json' -Force
              & $env:ComSpec /d /v:on /c '"RUN-QUEST-APK-COCKPIT.cmd" VERIFY'
              $probeExit=$LASTEXITCODE
              if($probeExit -ne 93){throw "missing-payload guard returned $probeExit instead of 93"}
              $global:LASTEXITCODE=0
              Copy-Item -LiteralPath (Join-Path $thinFull 'QUEST_APK_COPYRUN_PAYLOAD\IDENTITY.json') -Destination 'QUEST_APK_COPYRUN_PAYLOAD\IDENTITY.json' -Force

              # Missing nested runner must be rejected by the PowerShell
              # payload verifier before any game-folder mutation.
              Remove-Item -LiteralPath 'QUEST_APK_COPYRUN_PAYLOAD\scripts\Run-OutRunVRTest.ps1' -Force
              & $env:ComSpec /d /v:on /c '"RUN-QUEST-APK-COCKPIT.cmd" VERIFY'
              $probeExit=$LASTEXITCODE
              if($probeExit -eq 0){throw 'missing Run-OutRunVRTest.ps1 helper was not rejected'}
              $global:LASTEXITCODE=0
              Copy-Item -LiteralPath (Join-Path $thinFull 'QUEST_APK_COPYRUN_PAYLOAD\scripts\Run-OutRunVRTest.ps1') -Destination 'QUEST_APK_COPYRUN_PAYLOAD\scripts\Run-OutRunVRTest.ps1' -Force

              Remove-Item -LiteralPath 'QuestCockpit-CopyRestore.ps1' -Force
              & $env:ComSpec /d /v:on /c '"RUN-QUEST-APK-COCKPIT.cmd" VERIFY'
              $probeExit=$LASTEXITCODE
              if($probeExit -ne 96){throw "missing-restore guard returned $probeExit instead of 96"}
              $global:LASTEXITCODE=0
              Copy-Item -LiteralPath (Join-Path $thinFull 'QuestCockpit-CopyRestore.ps1') -Destination . -Force

              # A wrong but valid x86 PE named OR2006C2C.EXE must be rejected
              # before any original-backup directory or backend mutation exists.
              Copy-Item -LiteralPath 'QUEST_APK_COPYRUN_PAYLOAD\backend\dinput8.dll' -Destination 'OR2006C2C.EXE' -Force
              $windowsPs=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
              & $windowsPs -NoProfile -ExecutionPolicy Bypass -File '.\QuestCockpit-CopyRun.ps1' -Mode NORMAL
              $probeExit=$LASTEXITCODE
              if($probeExit -eq 0){throw 'wrong-game-EXE preflight was not rejected'}
              if(Test-Path -LiteralPath 'QUEST_APK_COPYRUN_ORIGINAL_BACKUP'){
                throw 'wrong-game-EXE preflight modified backup state before rejection'
              }
              Remove-Item -LiteralPath 'OR2006C2C.EXE' -Force
              $global:LASTEXITCODE=0

              # Corrupted prior backup must make VERIFY fail before any launch.
              $activeBackup=Join-Path $cmdProbe 'QUEST_APK_COPYRUN_ORIGINAL_BACKUP'
              New-Item -ItemType Directory -Force -Path (Join-Path $activeBackup 'root') | Out-Null
              $badManifest=[ordered]@{
                SchemaVersion=1
                SourceSha=$env:GITHUB_SHA
                Entries=@([ordered]@{Scope='root';Name='dinput8.dll';Existed=$true;Sha256=('0'*64)})
              }
              $badManifest|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $activeBackup 'original_files.json') -Encoding UTF8
              & $env:ComSpec /d /v:on /c '"RUN-QUEST-APK-COCKPIT.cmd" VERIFY'
              $probeExit=$LASTEXITCODE
              if($probeExit -eq 0){throw 'corrupted original backup was not rejected by VERIFY'}
              Remove-Item -LiteralPath $activeBackup -Recurse -Force
              $global:LASTEXITCODE=0

              # A valid backup with an interrupted-restore marker must block
              # a new COPY-RUN cycle until RESTORE is retried.
              New-Item -ItemType Directory -Force -Path $activeBackup | Out-Null
              $restoreManifest=[ordered]@{
                SchemaVersion=1
                SourceSha=$env:GITHUB_SHA
                Entries=@([ordered]@{Scope='root';Name='COPYRUN_SYNTHETIC_PROBE.tmp';Existed=$false;Sha256=''})
              }
              $restoreManifest|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $activeBackup 'original_files.json') -Encoding UTF8
              'probe'|Set-Content -LiteralPath (Join-Path $activeBackup 'RESTORE_IN_PROGRESS.txt') -Encoding ascii
              & $env:ComSpec /d /v:on /c '"RUN-QUEST-APK-COCKPIT.cmd" VERIFY'
              $probeExit=$LASTEXITCODE
              if($probeExit -eq 0){throw 'interrupted restore marker did not block COPY-RUN VERIFY'}
              Remove-Item -LiteralPath (Join-Path $activeBackup 'RESTORE_IN_PROGRESS.txt') -Force
              $global:LASTEXITCODE=0

              # A successful synthetic restore must archive the active baseline
              # so the next test cycle cannot reuse a stale pre-restore snapshot.
              $restoreManifest=[ordered]@{
                SchemaVersion=1
                SourceSha=$env:GITHUB_SHA
                Entries=@([ordered]@{Scope='root';Name='COPYRUN_SYNTHETIC_PROBE.tmp';Existed=$false;Sha256=''})
              }
              $restoreManifest|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $activeBackup 'original_files.json') -Encoding UTF8
              & $windowsPs -NoProfile -ExecutionPolicy Bypass -File '.\QuestCockpit-CopyRestore.ps1'
              $probeExit=$LASTEXITCODE
              if($probeExit -ne 0){throw "synthetic restore/archive probe failed exit=$probeExit"}
              if(Test-Path -LiteralPath $activeBackup){throw 'successful restore left stale active backup directory'}
              $history=Join-Path $cmdProbe 'QUEST_APK_COPYRUN_BACKUP_HISTORY'
              if(!(Test-Path -LiteralPath $history -PathType Container) -or
                 @(Get-ChildItem -LiteralPath $history -Directory).Count -ne 1){
                throw 'successful restore did not archive exactly one completed baseline'
              }
              $global:LASTEXITCODE=0
            } finally {
              Pop-Location
              Remove-Item -LiteralPath $cmdProbe -Recurse -Force -ErrorAction SilentlyContinue
            }
            "COCKPIT_COPYRUN_ZIP=$copyRunZip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Upload cockpit copy-run ZIP
        if: github.ref_name == 'vr-quest-cockpit-v2' || startsWith(github.ref_name, 'vr-quest-cockpit-v2-')
        uses: actions/upload-artifact@v4
        with:
          name: OutRun2-QuestCockpitV2-COPY-RUN-${{ github.sha }}
          # upload-artifact creates the single ZIP downloaded by users.
          # Upload the staging DIRECTORY, not the verified nested .zip,
          # so extraction directly produces the launchers and payload.
          path: build-general/cockpit-copyrun/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OutRun2-VR-GITHUB-GENERAL-${{ github.sha }}
          path: ${{ env.GENERAL_ZIP }}
          if-no-files-found: error
          retention-days: 7

      - name: Mark build result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state=if($env:JOB_STATUS -eq 'success'){'success'}else{'failure'}
          $desc=if($state -eq 'success'){'GitHub-hosted clean R26+HUD build succeeded'}else{'GitHub-hosted clean R26+HUD build failed'}
          $body=@{
            state=$state
            context='vr-github-general-build'
            description=$desc
            target_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers @{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          } -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Body $body -ContentType 'application/json'
