name: Localization A00004 411 Preview
on:
  push:
    branches: [korean-localization-clean]
    paths: ['docs/automation/runs/LOCALIZATION-LOCALIZATION_A-00004.preview.dispatch.json']
permissions:
  contents: write
concurrency:
  group: localization-a00004-411-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: korean-localization-clean, fetch-depth: 0}
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/localization/a00004_preview_411.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/graphics/role_A/20260928-A00004
          git commit -m "localization: A00004 411 visual preview [AUTO:LOCALIZATION-LOCALIZATION_A-00004]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
