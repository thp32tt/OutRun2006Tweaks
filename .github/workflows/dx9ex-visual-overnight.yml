name: DX9Ex overnight 5min visual audit
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dx9ex-visual-overnight.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: dx9ex-overnight-visual-review-single-writer
  cancel-in-progress: false
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vr-d3d9ex-focus
          fetch-depth: 1
      - name: Rotate evidence-specific lenses and persist GitHub log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          session_start=$(date +%s)
          deadline_epoch=$(date -u -d '2026-10-10 23:00:00 UTC' +%s)
          # The 5-minute GitHub cron has skipped events. Keep one runner
          # active and persist a real source observation every 300 seconds.
          # This is contract checking, not independent unattended AI coding.
          while :; do
          tick_start=$(date +%s)
          python3 - <<'PY'
          import datetime as dt, hashlib, json, os, pathlib, subprocess, tempfile
          now = dt.datetime.now(dt.timezone.utc)
          until = dt.datetime(2026, 10, 10, 23, 0, tzinfo=dt.timezone.utc)
          if now >= until:
              subprocess.run(['gh','api','-X','PUT',
                  f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/dx9ex-visual-overnight.yml/disable"],check=True)
              print('END 2026-10-11 08:00 KST; schedule disabled')
              raise SystemExit(0)
          if now < dt.datetime(2026,10,9,17,12,tzinfo=dt.timezone.utc):
              raise SystemExit(0)
          ROOT=pathlib.Path.cwd()
          logref='automation/dx9ex-visual-audit-20261010'
          logpath='docs/automation/reviews/DX9EX_VISUAL_OVERNIGHT_20261010_11.md'
          statepath='docs/automation/reviews/DX9EX_VISUAL_OVERNIGHT_STATE.json'
          # Refresh the live DX9Ex branch every tick (do not pin a 5h run).
          subprocess.run(['git','fetch','--no-tags','origin',
              'refs/heads/vr-d3d9ex-focus'],check=True,capture_output=True,text=True)
          subprocess.run(['git','reset','--hard','FETCH_HEAD'],check=True,capture_output=True,text=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          def run(*xs,cwd=None):
              return subprocess.run(xs,cwd=cwd,check=True,text=True,capture_output=True)
          def require(path,*tokens):
              src=(ROOT/path).read_text(encoding='utf-8')
              bad=[t for t in tokens if t not in src]
              if bad: raise AssertionError(f'{path}: missing {bad}')
              return f'{path}: {len(tokens)} source contracts present'
          reviews=[
              ('RB01 repo and DX9Ex isolation',lambda: require('AGENTS.md','vr-d3d9ex-focus','RUNTIME_VALIDATION=UNTESTED')),
              ('RB02 progressive GOAL text',lambda: require('src/hooks_uiscaling.cpp','ResultTextB9200Calls[]','0x973AF','0x97E6D','ResultTextEnter','ResultTextLeave','GoalTimeHelperCallA','GoalTimeHelperCallB')),
              ('RB03 +TIME six source edges',lambda: require('src/hooks_uiscaling.cpp','StageExtensionSpraniCalls[]','StageExtensionPrintCalls[]','0x989AD','0x98A10','0x98A89','StageExtensionEnter','StageExtensionLeave')),
              ('RB04 central lens and outer halos',lambda: require('src/hooks_graphics.cpp','LensCentreEnter','LensCentreLeave','0xD3A5','0xD3AA','WorldBillboard','0xCABE','LensCentreSavedScope')),
              ('RB05 car-relative rank owner',lambda: require('src/hooks_uiscaling.cpp','RankMarkerSubActiveDepth','Calc3D2D_dest','RankMarkerProjectedInfo','RivalMarkerProjectedInfo')),
              ('RB06 shader / FVF routes',lambda: require('src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp','R30BuildScreenSpaceEyeConstants','ScreenOverlay2D','ProjectedWorldMarker2D','0x142')),
              ('RB07 frame budget / SkyGlow',lambda: require('docs/automation/reviews/DX9EX_DEEPRESEARCH_P0_20261010.md','29.917','25.875','SkyGlowFactor=4')),
              ('RB08 device lifetime / SceneEffect',lambda: require('src/hooks_graphics.cpp','Clr_SceneEffect_dest','perspective_znear_BC','0.05f')),
              ('RB09 known-good HMD regression',lambda: require('docs/VR_HUD_KNOWN_GOOD_RESTORE_RUNBOOK.md','93%','6th/6','F11','0xBEA5A','0xBEA5F')),
              ('RB10 negative/failure-path contract',lambda: require('tools/verify_vr_visual_composition_p0.py','ResultTextB9200','StageExtension','LensCentre')),
          ]
          deps=[
              ['AGENTS.md'],['src/hooks_uiscaling.cpp'],['src/hooks_uiscaling.cpp','tools/analyze_outrun_exe.py'],
              ['src/hooks_graphics.cpp'],['src/hooks_uiscaling.cpp'],
              ['src/vr/d3d9/stereo_renderer_r30_r26_safe.cpp'],
              ['docs/automation/reviews/DX9EX_DEEPRESEARCH_P0_20261010.md'],
              ['src/hooks_graphics.cpp'],['docs/VR_HUD_KNOWN_GOOD_RESTORE_RUNBOOK.md'],
              ['tools/verify_vr_visual_composition_p0.py']]
          sigs=[hashlib.sha256(''.join((ROOT/p).read_text(encoding='utf-8') for p in paths).encode()).hexdigest() for paths in deps]
          verifier_sig=hashlib.sha256(''.join(sigs[i] for i in (1,2,3,4,5,7,9)).encode()).hexdigest()
          run('git','fetch','--no-tags','origin',f'refs/heads/{logref}')
          with tempfile.TemporaryDirectory() as folder:
              work=pathlib.Path(folder)/'audit'
              run('git','worktree','add','--detach',str(work),'FETCH_HEAD')
              statefile=work/statepath
              state=json.loads(statefile.read_text()) if statefile.exists() else {}
              if not state:
                  state={'source_sha':sha,'completed':{},'issues':[],'RUNTIME_VALIDATION':'UNTESTED'}
              if 'completed' not in state:
                  state['completed']={str(i):sigs[i] for i in state.get('reviewed',[]) if state.get('source_sha')==sha}
              state['source_sha']=sha
              if state.get('verifier_sig')!=verifier_sig:
                  # Exactly ONE bounded adversarial source verifier per changed input set.
                  try:
                      v=subprocess.run(['python3','tools/verify_vr_visual_composition_p0.py'],cwd=ROOT,
                                       text=True,capture_output=True,timeout=95)
                      state['initial_contract']='PASS' if v.returncode==0 else 'FAIL: '+(v.stderr+v.stdout)[-400:]
                  except Exception as e: state['initial_contract']='ERROR: '+str(e)[:200]
                  state['verifier_sig']=verifier_sig
              todo=[i for i in range(len(reviews)) if state['completed'].get(str(i))!=sigs[i]]
              label='HEAD-only monitor'; status='NO_SOURCE_CHANGE'; evidence='Ten different review lenses already completed; no duplicated static loops'
              if todo:
                  idx=todo[0]; label=reviews[idx][0]
                  try: evidence=reviews[idx][1](); status='SOURCE_CONTRACT_OK'
                  except Exception as e:
                      status='REVIEW_FINDING'; evidence=str(e)[:500].replace('|','/').replace('\n',' ')
                      state['issues'].append({'batch':idx,'reason':evidence})
                  state['completed'][str(idx)]=sigs[idx]
              kst=now.astimezone(dt.timezone(dt.timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')
              state['last_tick']=kst; state['last_status']=status
              state['reviewed']=[i for i in range(len(reviews)) if state['completed'].get(str(i))==sigs[i]]
              statefile.parent.mkdir(parents=True,exist_ok=True)
              statefile.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              logfile=work/logpath
              if not logfile.exists():
                  logfile.write_text('# DX9Ex five-minute GitHub review ledger\n\n'
                      'Schedule is best-effort, not guaranteed exact. Fixed run deadline: **2026-10-11 08:00 KST**. '
                      'Static source checks and GitHub commits are NOT independent AI reasoning, actual fixes, '
                      'or Quest 3 optical tests. Each source SHA receives up to 10 distinct lenses; '
                      'after that only changes in HEAD are watched. **RUNTIME_VALIDATION=UNTESTED**.\n\n'
                      '| Actual time | Source SHA | Lens | Result | Evidence |\n|---|---|---|---|---|\n',encoding='utf-8')
              with logfile.open('a',encoding='utf-8') as f:
                  f.write(f'| {kst} | {sha[:12]} | {label} | {status} | {evidence} |\n')
              run('git','config','user.name','github-actions[bot]',cwd=work)
              run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com',cwd=work)
              run('git','add',logpath,statepath,cwd=work)
              run('git','commit','-m',f'audit(dx9ex): {kst} {status} ({sha[:12]})',cwd=work)
              run('git','push','origin',f'HEAD:refs/heads/{logref}',cwd=work)
          summary=f'### {kst}\n\n- DX9Ex SHA: {sha}\n- Lens: {label}\n- Status: **{status}**\n- Evidence: {evidence}\n- GitHub ledger: {logref}/{logpath}\n- HMD: **UNTESTED**\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(summary)
          PY
          tick_end=$(date +%s)
          if (( tick_end >= deadline_epoch )); then
            gh api -X PUT "/repos/$GITHUB_REPOSITORY/actions/workflows/dx9ex-visual-overnight.yml/disable"
            echo "DX9Ex audit completed at 2026-10-11 08:00 KST deadline."
            break
          fi
          # Chain below GitHub Actions' 6-hour job limit.
          if (( tick_end - session_start >= 18900 )); then
            gh workflow run dx9ex-visual-overnight.yml --ref master
            echo "Chained next DX9Ex 5-minute audit runner"
            break
          fi
          elapsed=$((tick_end - tick_start))
          sleep_for=$((300 - elapsed))
          if (( sleep_for > 0 )); then sleep "$sleep_for"; fi
          done