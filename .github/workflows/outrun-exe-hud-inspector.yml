permissions:
  contents: read

jobs:
  static-exe-analysis:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $failed=$false
          foreach($script in @(
            'tools/Collect-OutRunVRLogs.ps1',
            'tools/Run-OutRunVRTest.ps1',
            'tools/OutRunVR-TestProfiles.ps1',
            'tools/Select-OutRunVRBackend.ps1',
            'tools/Analyze-OutRunVRSession.ps1',
            'tools/OutRunVR-Slot-Selector.ps1',
            'tools/Test-OutRunVRAnalysisContract.ps1'
          )){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if($errors.Count -gt 0){
              $failed=$true
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
            }
          }
          if($failed){ throw 'PowerShell syntax validation failed' }

      - name: Verify real-session rank/DLL analysis behavior
        shell: pwsh
        run: ./tools/Test-OutRunVRAnalysisContract.ps1

      - name: Audit first-party source-wide result and extension-time risk
        shell: pwsh
        run: python tools/audit_vr_result_full_source.py

      - name: Asset semantic parser self-test
        shell: pwsh
        run: python tools/analyze_outrun_assets.py --self-test

      - name: Reject corrupted HUD producer mutations
        shell: pwsh
        run: python tools/verify_vr_hud_exact_callsite_contract.py --self-test

      - name: Verify DDS cached-buffer ownership against concurrent evictions
        shell: pwsh
        run: python tools/verify_vr_texture_cache_lifetime.py --self-test

      - name: Verify scene texture Ex API side effects and native fallback
        shell: pwsh
        run: python tools/verify_vr_texture_scene_contract.py --self-test

      - name: Verify fail-closed DDS fast texture upload and corruption probes
        shell: pwsh
        run: python tools/verify_vr_hud_dds_loader.py --self-test

      - name: Verify Sumo mask-child replay ownership and targeted fault injections
        shell: pwsh
        run: python tools/verify_vr_sumo_replay_semantics.py

      - name: Verify P0 visual composition contract
        shell: pwsh
        run: python tools/verify_vr_visual_composition_p0.py

      - name: Download upstream replacement EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force analysis-input | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE' `
            -OutFile analysis-input/OR2006C2C.EXE

      - name: Analyze EXE HUD/render anchors
        run: >
          python tools/analyze_outrun_exe.py
          --exe analysis-input/OR2006C2C.EXE
          --out-dir analysis-output

      - name: Disassemble exact goal-progress, stage-time and lens windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check capstone==5.0.6
          if ($LASTEXITCODE -ne 0) { throw 'Capstone setup failed' }
          python tools/disasm_outrun_goal_flare_p0.py --exe analysis-input/OR2006C2C.EXE --out-dir analysis-output
          if ($LASTEXITCODE -ne 0) { throw 'P0 disassembly failed' }

      - name: Show analysis summary
        shell: pwsh
        run: Get-Content analysis-output/OR2006C2C_EXE_ANALYSIS.md -TotalCount 120

      - uses: actions/upload-artifact@v4
        with:
          name: OR2006C2C-EXE-HUD-analysis-${{ github.sha }}
          path: analysis-output/
          if-no-files-found: error

  build-hud-inspector:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Win32 R84 MAIN HUD Inspector DLL
        shell: pwsh
        run: |
          Remove-Item Env:CI -ErrorAction SilentlyContinue
          cmake -S . -B build-game -G "Visual Studio 17 2022" -A Win32
          $cache = Get-Content build-game/CMakeCache.txt
          foreach ($entry in @(
            'OUTRUN_VR_SAFE_DRAW_COMPARE:BOOL=OFF',
            'OUTRUN_VR_R26_HUD_COMPARE:BOOL=OFF',
            'OUTRUN_VR_REFACTOR_SPLIT_R33_R32:BOOL=ON',
            'OUTRUN_VR_REFACTOR_SPLIT_R32_R31:BOOL=ON',
            'OUTRUN_VR_REFACTOR_SPLIT_R31_R30:BOOL=ON',
            'OUTRUN_VR_REFACTOR_SPLIT_R30_R29:BOOL=ON')) {
            if ($cache -notcontains $entry) { throw "R84 HUD Inspector owner mismatch: $entry" }
          }

      - name: Apply VC2022 dependency workarounds
        shell: pwsh
        run: |
          (Get-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/safetyhook-build/src/safetyhook.vcxproj
          (Get-Content build-game/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build-game/_deps/zydis-build/zycore/Zycore.vcxproj
          Set-Content -Path build-game/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build-game/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h

      - name: Build
        run: cmake --build build-game --config Release --target outrun2006tweaks

      - name: Stage inspector payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $dll = Get-ChildItem build-game -Recurse -Filter dinput8.dll |
            Where-Object { $_.FullName -match '\\bin\\' } |
            Select-Object -First 1
          if (-not $dll) { throw 'dinput8.dll missing' }
          Copy-Item $dll.FullName stage/dinput8.dll
          Copy-Item tools/Collect-OutRunVRLogs.ps1 stage/
          Copy-Item tools/Run-OutRunVRTest.ps1 stage/
          Copy-Item tools/OutRunVR-TestProfiles.ps1 stage/
          Copy-Item tools/Select-OutRunVRBackend.ps1 stage/
          Copy-Item tools/analyze_outrun_assets.py stage/
          git rev-parse HEAD | Set-Content stage/SOURCE_SHA.txt
          Set-Content stage/VARIANT_ID.txt 'R84_SPLIT_R33_R32_R31_R30_R29' -Encoding ascii
          Set-Content stage/BUILD_MODE.txt 'R84_MAINLINE_DEFAULT' -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: HUD-inspector-game-${{ github.sha }}
          path: stage/
          if-no-files-found: error