name: Localization PSD Source Mirror
on:
  push:
    branches: [korean-localization-recovery-20260928]
    paths:
      - '.github/workflows/localization-psd-mirror.yml'
      - 'localization/graphics/plate_library/PSD_IMPORT_CATALOG.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: localization-psd-mirror-priority-01
  cancel-in-progress: false
jobs:
  mirror-priority-psd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned source PSDs, verify Git blob identities and sizes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import urllib.parse
          import urllib.request
          source = Path('localization/graphics/plate_library/PSD_IMPORT_CATALOG.json')
          manifest = json.loads(source.read_text())
          batch = [e for e in manifest['entries'] if e['batch'] == 'priority_01']
          assert len(batch) == manifest['selected_batch_01']['count'] == 10
          assert sum(e['bytes'] for e in batch) == manifest['selected_batch_01']['total_bytes']
          assert sum(e['bytes'] for e in batch) < 150_000_000
          for item in batch:
              dest = Path(item['local_path'])
              assert dest.is_relative_to(Path('localization/graphics/source_psd_upstream'))
              url = ('https://raw.githubusercontent.com/' +
                     manifest['upstream_repo'] + '/' + manifest['upstream_commit'] +
                     '/' + urllib.parse.quote(item['upstream_path'], safe='/'))
              if not dest.exists():
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  request = urllib.request.Request(url, headers={'User-Agent':'OutRun2006Tweaks-PSD-source-mirror'})
                  with urllib.request.urlopen(request, timeout=150) as response, dest.open('wb') as stream:
                      while block := response.read(1024 * 1024):
                          stream.write(block)
              assert dest.read_bytes()[:4] == b'8BPS', f'Not PSD: {dest}'
              assert dest.stat().st_size == item['bytes'], f'Size mismatch: {dest}'
              blob = subprocess.check_output(['git', 'hash-object', str(dest)], text=True).strip()
              assert blob == item['github_blob_sha'], f'Git blob mismatch: {dest}'
              print(f'PSD_MIRROR_VERIFIED index={item["queue_indices"]} bytes={dest.stat().st_size} blob={blob} local={dest}')
          print(f'PSD_BATCH_VERIFIED count={len(batch)} bytes={sum(x["bytes"] for x in batch)}')
          PY
      - name: Commit real PSD binary source files to the localization branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path('localization/graphics/plate_library/PSD_IMPORT_CATALOG.json').read_text())
          for x in m['entries']:
              if x['batch']=='priority_01':
                  subprocess.run(['git','add','-f','--',x['local_path']],check=True)
          PY
          if git diff --cached --quiet; then
            echo 'No new PSD binaries to commit'
          else
            git commit -m "assets(localization): mirror SHA-verified upstream PSD workbases for priority queue"
            for i in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo 'PSD_REMOTE_PUSH_SUCCESS'
                break
              fi
              echo "PSD push concurrency retry ${i}"
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if [ "${i}" = 5 ]; then
                echo "PSD_REMOTE_PUSH_FAILED"
                exit 1
              fi
            done
          fi
      - name: Verify copied PSD files at GitHub remote HEAD
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          m=json.loads(Path('localization/graphics/plate_library/PSD_IMPORT_CATALOG.json').read_text())
          b=[e for e in m['entries'] if e['batch']=='priority_01']
          for item in b:
              spec='origin/'+subprocess.check_output(['git','branch','--show-current'],text=True).strip()+':'+item['local_path']
              remote=subprocess.check_output(['git','rev-parse',spec],text=True).strip()
              assert remote==item['github_blob_sha'], f'GitHub remote mismatch: {item["local_path"]}'
          print('PSD_REMOTE_HEAD_VERIFIED',len(b),'objects')
          PY
