# v0.2 release trigger
name: Release wheel v0.2

on:
  push:
    branches:
      - ffb-r13-drift-physics-20261006

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: "${{ github.event.head_commit.message == 'release: v0.2 modern DD wheel FFB' }}"
    runs-on: windows-2022

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7.0.1

      - name: Wait for successful Win32 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = $null
          for ($i = 0; $i -lt 90; $i++) {
            $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow build.yml --commit $env:GITHUB_SHA --limit 10 --json databaseId,status,conclusion | ConvertFrom-Json
            $candidate = $runs | Where-Object { $_.status -eq 'completed' } | Select-Object -First 1
            if ($candidate) {
              if ($candidate.conclusion -ne 'success') {
                throw "Wheel build completed with conclusion '$($candidate.conclusion)'"
              }
              $runId = $candidate.databaseId
              break
            }
            Start-Sleep -Seconds 10
          }
          if (-not $runId) { throw 'Timed out waiting for the v0.2 wheel build artifact.' }
          "BUILD_RUN_ID=$runId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download tested build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifact-bin | Out-Null
          gh run download $env:BUILD_RUN_ID --repo $env:GITHUB_REPOSITORY -n "outrun2006tweaks-$env:GITHUB_SHA" -D artifact-bin
          foreach ($required in @('dinput8.dll','OutRun2006Tweaks.ini','OutRun2006Tweaks.lods.ini','OR2006C2C.exe','LICENSES.txt')) {
            if (-not (Test-Path (Join-Path 'artifact-bin' $required))) { throw "$required missing from tested build artifact" }
          }

      - name: Package v0.2 release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-bin | Out-Null
          foreach ($file in @('dinput8.dll','OutRun2006Tweaks.ini','OutRun2006Tweaks.lods.ini','OR2006C2C.exe','LICENSES.txt')) {
            Copy-Item (Join-Path 'artifact-bin' $file) (Join-Path 'release-bin' $file)
          }
          Copy-Item RELEASE_NOTES_v0.2.md release-bin/README.md
          Copy-Item RELEASE_NOTES_v0.2.md release-bin/RELEASE_NOTES_v0.2.md

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path release-bin/* -DestinationPath release/OutRun2006Tweaks-Wheel-FFB-v0.2.zip -Force
          Get-FileHash release/OutRun2006Tweaks-Wheel-FFB-v0.2.zip -Algorithm SHA256

      - name: Publish GitHub release v0.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2 release/OutRun2006Tweaks-Wheel-FFB-v0.2.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'OutRun2006Tweaks Wheel FFB v0.2' `
            --notes-file RELEASE_NOTES_v0.2.md `
            --latest
