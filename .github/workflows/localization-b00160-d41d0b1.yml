name: Localization B00160 D41D0B1 Producer

on:
  push:
    branches:
      - korean-localization-clean
    paths:
      - 'docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00160.dispatch.json'

permissions:
  contents: write

concurrency:
  group: localization-b00160-d41d0b1
  cancel-in-progress: false

jobs:
  produce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization-clean
          fetch-depth: 0

      - name: Install deterministic image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-cjk-extra
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Produce index112 candidate and decoded-final QA
        run: python tools/localization/b00160_rework_d41d0b1.py

      - name: Commit lane-local B00160 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/automation/runs/LOCALIZATION-LOCALIZATION_B-00160.json             localization/graphics/hd_candidates/textures/load/spr_sprani_selector_cvt_Exst/D41D0B1_512x64.dds             localization/graphics/role_B/20260929-B00160-rollover3             localization/graphics/KOREAN_PNG_REVIEW/D41D0B1
          git commit -m "localization(B): render index112 D41D0B1 candidate [AUTO:LOCALIZATION-LOCALIZATION_B-00160]"
          git pull --rebase origin korean-localization-clean
          git push origin HEAD:korean-localization-clean
