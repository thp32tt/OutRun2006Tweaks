name: OpenXR capture-chain diagnostic

on:
  push:
    branches: [ vr-openxr ]
    paths:
      - 'vrhost/src/runtime/capture_chain_diagnostic.hpp'
      - 'vrhost/capture-diagnostic/**'
      - '.github/workflows/vr-capture-diagnostic.yml'
  workflow_dispatch:

jobs:
  capture-diagnostic-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure x64 capture diagnostic
        run: cmake -S vrhost/capture-diagnostic -B build-vr-capture-diag -G "Visual Studio 17 2022" -A x64

      - name: Build capture diagnostic
        run: cmake --build build-vr-capture-diag --config Release --target outrun-vr-capture-diagnostic

      - name: Verify diagnostic binary
        shell: pwsh
        run: |
          $exe = 'build-vr-capture-diag/bin/outrun-vr-capture-diagnostic.exe'
          if (-not (Test-Path $exe)) { throw 'capture diagnostic executable was not produced' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 10000) { throw 'capture diagnostic executable is unexpectedly small' }
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @(
            'R17-capture-chain-diagnostic-20260915',
            'INTERNAL-BLIT',
            'DESKTOP-WHOLE',
            'GAME-CROP',
            'GAME-SBS-EYE',
            'EXACT-PROJECTION',
            'capture probe source=',
            'nonBlackGrid='
          )) {
            if (-not $ascii.Contains($marker)) { throw "R17 marker missing: $marker" }
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'expected x64 diagnostic executable'
          }

      - name: Prepare test package
        shell: pwsh
        run: |
          $out = 'build-vr-capture-diag/package'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'build-vr-capture-diag/bin/outrun-vr-capture-diagnostic.exe' $out
          @'
          @echo off
          set OUTRUN_VR_DIRECT_TRANSPORT=0
          set OUTRUN_VR_TEST_PATTERN=0
          echo R17 capture-chain diagnostic
          echo 1. Keep Virtual Desktop connected with VDXR active.
          echo 2. This program waits for OR2006C2C.EXE.
          echo 3. Start OutRun normally after this window appears.
          echo 4. Enter gameplay and keep the HMD on for at least 35 seconds.
          echo 5. Press Ctrl+C to exit, then send outrun-vr-capture-diagnostic.log.
          echo.
          outrun-vr-capture-diagnostic.exe
          pause
          '@ | Set-Content -Encoding ASCII "$out/RUN_CAPTURE_DIAGNOSTIC.bat"

          @'
          OutRun VR R17 capture-chain diagnostic
          =======================================
          Build: R17-capture-chain-diagnostic-20260915

          This is not the normal VR host. It uses the normal host main loop and shared-pose writer,
          but replaces only final OpenXR submission with a five-phase capture-chain diagnostic.

          Test:
          1. Connect Quest 3 with Virtual Desktop / VDXR.
          2. Do NOT run the normal outrun-vr-host.exe at the same time.
          3. Run RUN_CAPTURE_DIAGNOSTIC.bat.
          4. Launch OutRun 2006 and enter gameplay.
          5. Observe at least one full 25-second phase cycle; 35-40 seconds is better.
          6. Exit with Ctrl+C.
          7. Send outrun-vr-capture-diagnostic.log and describe what was visible in each phase.

          Phases:
          1 INTERNAL-BLIT  : synthetic red/green through the production R10 blit shader.
          2 DESKTOP-WHOLE : full duplicated monitor, identical in both eyes.
          3 GAME-CROP     : cropped OutRun client, identical in both eyes.
          4 GAME-SBS-EYE  : cropped OutRun split into left/right eye-specific images.
          5 EXACT-PROJECTION: the production R10 capture + crop + SBS + projection path.

          The log also reads captured pixels back to the CPU and records:
          source format, center RGB values, game UV, and a 45-point non-black grid.
          '@ | Set-Content -Encoding UTF8 "$out/README_R17.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: outrun-vr-r17-capture-chain-diagnostic
          path: build-vr-capture-diag/package/*
          if-no-files-found: error
